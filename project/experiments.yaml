- id: exp-082
  title: Does the analogue comparison survive being made two-sided, and do a date-constrained and a contemporary
    encoder rank the same episodes?
  one_breath: 'Gives past episodes their own extracted conditions, so a claim about mechanism has a field
    to cite and an encoder pair to check it.

    '
  status: complete
  registered_at: 2026-09-03 14:00:00+00:00
  registered_commit: '5037450'
  hypothesis: 'The analogue panel''s record is one-sided and this is visible in the committed artifact.
    The query side carries nine extracted conditions with verbatim spans; every retrieved neighbour carries
    only a date, a distance, a block closeness and a forward return. When the adjudicator ruled the 2009
    match not apt because "every retrieved state is a credit-crisis recovery", it was comparing the query''s
    RECORD against the model''s MEMORY of 2009, and section 3.8 already concedes the general form of this:
    the dissent cited real fields while making claims about fiscal stimulus and circuit breakers that
    reached past them into world knowledge. The field gate could not catch it because the cited field
    was real. The repair is to give each candidate episode its own condition record. 3,625 filings have
    already been read across 28 formation dates and 419 records carry a grounded verbatim span, so the
    corpus exists and is pre-verified by the quote gate. With conditions on both sides a mechanism claim
    has a field to cite, and a mechanism claim about an episode with no record has none, so the existing
    gate drops it by the rule it already applies. Reading that corpus needs an encoder, and an encoder
    is where lookahead enters. A frontier encoder trained after 2020 knows what followed the conditions
    it is reading; this project has already measured that stripping dates does not hide the date, a model
    placing the exact year in 40 of 40 anonymised cases. So the corpus is read TWICE: once by a chronologically
    consistent checkpoint whose training cutoff precedes the query date, and once by a contemporary sentence
    encoder that has seen everything. Their rank agreement is the measurement the register has been carrying
    as row 09, unrun.

    '
  prediction: 'Two arms, two predictions, both written before either runs. ARM A, the gate. With conditions
    on both sides, mechanism claims about pre-2018 analogues have no field to cite and must be dropped.
    The corpus begins 2018-09-30, so at the flagship query date the 2009, 2008 and 2000 neighbours carry
    NO RECORD and every claim about what they were priced on should fall. I predict the adjudicator reaches
    the same not-apt verdict it reached before, by a different and checkable route: not "2009 was a credit
    crisis" from memory, but "no condition record exists for 2009, so mechanism cannot be ruled on". That
    is a weaker-sounding output and a stronger one. The positive control is planted: six mechanism claims,
    three citing a condition field that exists for a covered episode and three citing one for an uncovered
    episode, and the gate must keep exactly the first three. ARM B, register row 09. Spearman rank agreement
    between the two encoders over the candidate pool, per query date, with the registered pass at 0.80
    and read TWO-SIDED. Below 0.80 the contemporary encoder is ranking on something the constrained one
    cannot have, which is measured lookahead, and the feature is restricted to the constrained encoder
    with the size of the gap printed. Above roughly 0.98 the constrained reader adds nothing beyond the
    cheap one and the seat is idle under the twin rule, which retires it. Between them the agreement bounds
    how much of the ranking is recognition rather than reading, both are reported, and the constrained
    encoder is the one whose ranking reaches the page. I expect the middle branch and would not be surprised
    by the third, because condition texts are short noun phrases and a verbatim span rather than the long-form
    narrative where an encoder''s world knowledge has room to express itself.

    '
  data:
  - source: src-edgar-8k
    slice: 419 grounded condition records across 28 formation dates, 2018-09-30 to 2026-04-30
    tier: DESIGN
    vintage: 2026-09
    coverage_note: 'Every record already passed the extractor''s quote gate, so the corpus is pre-verified:
      a span that could not be found in its source was dropped before storage. The corpus begins 2018-09-30
      because that is where the 8-K body archive begins, which is why the pre-2018 neighbours are the
      arm-A control rather than a gap to apologise for.

      '
  method:
    statistic: 'Arm A: the count of planted mechanism claims kept and dropped, against the six planted.
      Arm B: Spearman rank correlation between the two encoders'' orderings of the candidate pool, per
      query date, reported as the distribution across query dates and not only its median.

      '
    unit: arm A, the claim; arm B, the query date
    grid: 'Candidate pool per query date: every formation date with a grounded condition record whose
      outcome window closed at least one year before the query, which is the embargo the analogue engine
      already applies to states. Texts embedded are the condition and its verbatim span concatenated.
      The constrained encoder is the chrono-bert checkpoint whose cutoff most recently precedes the QUERY
      date, one checkpoint for the whole cross-section, and the contemporary encoder is all-mpnet-base-v2.
      Vectors are centred on the candidate pool, which is point-in-time here because the embargo makes
      every candidate strictly past; centring over a pool containing future documents would be the fault
      the encoder module warns about and is not what happens here. Episode vectors are the mean of their
      records'' centred vectors; records stay addressable so the panel can cite one.

      '
    null_model: 'Arm A needs none: it is a positive control with a known answer. Arm B''s null is zero
      rank agreement, but the informative comparison is against the registered 0.80 rather than against
      zero, since two encoders reading the same short texts will agree on something.

      '
    correction: 'Two arms, two pre-stated statistics, reported separately and not combined into a single
      verdict.

      '
  power_statement: 'Arm A is a positive control with six planted claims and a known correct answer; it
    can fail outright and cannot be underpowered. Arm B is the constrained one. Twenty-eight formation
    dates carry records, of which thirteen coincide with an inventory episode, and the candidate pool
    at any one query date is smaller still after the one-year embargo. A Spearman correlation over roughly
    twenty candidates has a standard error near 0.22 at rho = 0.8, so a single query date cannot separate
    0.80 from 0.65, and no such separation will be claimed. What the design CAN do is distinguish broad
    agreement from near-independence, and it can report the distribution across query dates rather than
    one number. If the median lands inside the band with a spread that crosses 0.80, that is reported
    as the interval crossing the threshold and row 09 stays open, not as a pass.

    '
  verdict: supported
  reproduce: uv run python scripts/analogue_rag.py --all
  result:
    headline: 'ARM A PASSES and the gate fired on a live run for the first time. With conditions on both
      sides, six planted mechanism claims were put through the sharpened gate: three about episodes that
      carry a condition record, each with a span lifted verbatim from it, and three about episodes that
      do not. It kept exactly three, and exactly the right three. On the live panel at 2020-10-31 the
      dissent then attempted a mechanism claim about 2018-12-31 with no grounded span and the gate dropped
      it -- the first time this gate has fired outside a planted test, where the previous run had 8 of
      8 claims pass and demonstrated nothing. The predicted verdict is the one that came back, by the
      predicted route. The registration said the adjudicator would reach the same not-apt conclusion "not
      because 2009 was a credit crisis from memory, but because no condition record exists for 2009, so
      mechanism cannot be ruled on". It returned state_match_is_apt false, mechanism_is_rulable false,
      failing on condition_record_status, and its reasoning cites that field. All five state-space neighbours
      of the flagship date are pre-2018 and carry NO RECORD, so the panel now says what it cannot know
      instead of asserting what it remembers. ARM B, register row 09, DOES NOT CLOSE, and the registration
      said in advance that this is how it would be reported. Across 22 query dates the median Spearman
      agreement between the date-constrained checkpoint and the contemporary encoder is 0.846 with a bootstrap
      interval of [0.771, 0.900]. That interval CROSSES the registered 0.80, and the power statement committed
      to reporting a crossing interval as the row staying open rather than as a pass. 68.2 percent of
      dates clear the threshold. The structure inside that number is the finding. Agreement falls sharply
      as the candidate pool grows: the rank correlation between pool size and agreement is -0.629 at p
      = 0.0017. On the eight small pools of four to eight candidates the median agreement is 0.900 and
      every date clears 0.80; on the fourteen pools of twelve or more it is 0.778 and only half clear.
      Small pools admit few orderings, so the early agreement is partly mechanical, and the honest reading
      is that at realistic pool sizes the two readings come apart. And the number that matters most for
      a system whose output is a nearest analogue is worse than the median suggests. The two encoders
      agree on WHICH episode is nearest on only 31.8 percent of dates overall -- 62 percent at small pools
      and 14 percent at pools of twelve or more. At realistic sizes the constrained and contemporary readers
      disagree about the nearest episode roughly six times in seven, and the nearest episode is the one
      that reaches the page.

      '
    numbers:
    - label: planted-claim control
      value: 3 kept of 6, exactly the right 3
      comparison: arm A positive control; deterministic, no model call
    - label: the gate fired live
      value: 1 mechanism claim dropped
      comparison: against 8 of 8 passing on the previous run, where it demonstrated nothing
    - label: adjudicator verdict
      value: not apt, mechanism not rulable, fails on condition_record_status
      comparison: the route the registration predicted
    - label: condition corpus
      value: 419 grounded records over 28 formation dates
      comparison: 2018-09-30 to 2026-04-30, each span already passed the extractor's quote gate
    - label: row 09 median agreement
      value: 0.846, bootstrap CI [0.771, 0.900]
      comparison: the interval crosses the registered 0.80, so the row stays open
    - label: dates clearing 0.80
      value: 68.2 percent of 22
      comparison: 9.1 percent above 0.98, where the constrained seat would retire
    - label: agreement against pool size
      value: rho = -0.629, p = 0.0017
      comparison: median 0.900 at pools under 12, 0.778 at 12 or more
    - label: agreement on the NEAREST episode
      value: 31.8 percent overall
      comparison: 62 percent at small pools, 14 percent at pools of 12 or more
    figures: []
  reasoning: 'Run because the committed panel artifact showed the asymmetry in its own fields: nine conditions
    with spans on the query side, a date and a distance on every neighbour. A gate that checks whether
    a cited field exists somewhere in a record cannot catch a claim that cites a real field and reasons
    past it, which section 3.8 already conceded. Giving the candidates their own records turns the concession
    into a mechanism, and the encoder pair that reads them is the leakage control the register has carried
    unrun.

    '
  caveats: 'The largest caveat is that arm B cannot attribute the disagreement. The two encoders differ
    in architecture, training corpus and tokeniser as well as in cutoff, so two readings coming apart
    is consistent with measured lookahead AND with them simply being different models. Separating those
    needs the same architecture at two cutoffs, which is the next registration and is not claimed here.
    Three smaller ones. condition_similarity is a RANK and not a level: vectors are centred on the embargoed
    pool, so at these pool sizes the mean similarity is negative by construction and the absolute value
    carries nothing. The corpus begins 2018-09-30, so every state-space neighbour of the flagship date
    is uncovered and arm A''s control is run against a set with no covered neighbours at all -- the covered
    arm of the control is drawn from the condition matches instead, which is the right pool but not the
    same pool. And a panel gate that requires a verbatim span still checks presence rather than entailment,
    which is the bound section 3.8 states and this experiment narrows without removing.

    '
  history:
  - date: 2026-09-03
    note: Registered before the condition index or the two-encoder comparison existed. Arm B is register
      row 09, which the memo prices as unrun at two developer-days.
- id: exp-084
  title: Does dividing by trailing volatility, and then conditioning on the bear state, improve a ten-day
    5 percent quantile forecast of the momentum factor?
  one_breath: 'Tests the design''s tail model against the two baselines it has to beat, on the published
    factor, out of sample.

    '
  status: complete
  registered_at: 2026-09-04 09:00:00+00:00
  registered_commit: 269b5140e
  hypothesis: 'The design specifies a tail model with no fitted parameters: the 5 percent quantile of
    past ten-day returns, each divided by the volatility at the time, taken over past starts in the same
    state as today and multiplied by today''s volatility. Two published results motivate the two ingredients.
    Barroso and Santa-Clara show that scaling momentum by trailing realised volatility roughly doubles
    its Sharpe ratio and removes most of its negative skew, which says the conditional scale is forecastable.
    Daniel and Moskowitz show the worst losses cluster in high-volatility rebounds after bear markets,
    which says the conditional shape depends on a state beyond scale. If both hold for the LEFT TAIL specifically,
    then scaling should beat an unconditional quantile and conditioning on the bear state should add something
    on top. Neither is guaranteed. Scaling is established for the second moment and for the Sharpe ratio,
    not for a 5 percent quantile, and a quantile is a different functional that need not inherit it. The
    bear state splits an already small tail sample in two, so it can cost more in estimation error than
    it gains in conditioning. This experiment is registered because the design puts the scaled, state-conditioned
    number on the page and nothing here has tested it.

    '
