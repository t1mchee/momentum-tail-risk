      slice: daily cross-sections, point-in-time sector labels, index weights 2016-2026
      tier: DESIGN
      vintage: 2026-08-27
    - source: src-gdelt
      slice: full-universe clean v2 co-mention pairs, frozen parameters
      tier: DESIGN
      vintage: 2026-08-27
  method:
    uses: [mth-permutation, mth-cluster-boot]
    statistic: >
      Newey-West-corrected monthly increment differences between the text arm and the
      correlation-cluster arm; the per-partition placebo exceedance fraction; the
      era-permutation rank; the disjoint-book cosine; episode-clustered intervals.
    unit: month (A, B); episode (C)
    grid: none -- every arm parameter is stated in the prediction and the null's
      per-month resolution selection is part of the null, not the claim
  result:
    headline: >
      THE ADVERSARIAL HYPOTHESIS IS CONFIRMED AND THE KILL RULE EXECUTES. Part A, primary:
      correlation-derived clusters do not merely tie the news themes -- they explain MORE
      THAN TWICE the incremental cross-sectional variance (mean monthly increment 2.73
