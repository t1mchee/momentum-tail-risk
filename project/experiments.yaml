- id: exp-085
  title: Does the language model read filings in a way a keyword rule does not, judged by something neither
    of them chose?
  one_breath: 'Scores a frozen keyword rule and the model on the same filings, by whether each separates
    episode dates from control dates.

    '
  status: complete
  registered_at: 2026-09-04 12:00:00+00:00
  registered_commit: 28e15a4
  hypothesis: 'The design''s central claim about where a language model earns its place is that it reads
    a risk statement out of a filing more faithfully than a keyword rule, and the memo asserts this while
    the proof of concept demonstrates it nowhere. It cannot be settled by comparing the two readers against
    each other, because the model''s labels are not ground truth: agreement would show only that a rule
    can imitate the model, and disagreement would say nothing about which is right. Precision and recall
    need hand labels, which are reserved and unlabelled. There is an objective criterion available that
    neither reader chose and neither can see. Each reader produces one number per formation date, the
    share of loser-leg filings stating an external survival condition. The crash inventory, registered
    and run long before this, says which formation dates precede a reversal episode. So the question becomes:
    does either reader''s rate separate the dates that preceded an episode from the dates that did not?
    That is a property of the world, not of either reader''s opinion, and it is the comparison that tells
    a portfolio manager whether the model is buying anything.

    '
  prediction: 'I expect the model to separate the two groups and the keyword rule not to, because the
    rule fires on boilerplate. Forward-looking risk language appears in nearly every filing regardless
    of what the filer is actually worried about, so a rule keyed on it should return a high and roughly
    constant rate across both groups, while the model''s mandatory decline path fires on 82 percent of
    filings and is what makes its rate move. The honest alternative, and it is quite possible, is that
    the keyword rule ALSO separates the groups. Distressed companies write more conditional language when
    they are in trouble, and a rule that counts that would move with the same thing the model moves with.
    If both separate, the model adds nothing measurable to this task and the design''s extraction step
    should run on the rule; that is the fail sentence and it publishes. A third outcome is that neither
    separates, which would say the earlier design-tier result does not survive being recomputed on the
    inventory''s own date classification rather than the registry troughs it originally used, and would
    be reported as such. The registered comparison is a one-sided rank test per reader on 12 episode dates
    against 16 control dates, with the direction fixed here: episode dates higher.

    '
  data:
  - source: src-edgar-8k
    slice: 3,625 loser-leg filings already read across 28 formation dates, 2018-09-30 to 2026-04-30
    tier: DESIGN
    vintage: 2026-09
    coverage_note: 'Both readers run on exactly the same documents, so coverage, acceptance-time gating
      and the universe are held fixed and the only thing that varies is the reader. Dates are classified
      by the crash inventory''s own formation_at field, which is deterministic and was registered before
      this experiment existed. That classification differs from the one the earlier text experiment used,
      which took registry troughs, so the two are not directly comparable and no comparison between them
      is claimed.

      '
  method:
    statistic: 'one-sided Mann-Whitney rank test of the per-date rate, episode dates against control dates,
      computed separately for each reader; reported with both medians and the rate difference

      '
    unit: formation date
    grid: 'THE KEYWORD RULE IS FROZEN HERE AND IS DERIVED FROM THE EXTRACTOR''S OWN INSTRUCTIONS, not
      from any inspection of its output. A filing states a condition if its text contains at least one
      DEPENDENCE marker and at least one EXTERNAL-CONDITION term. Dependence markers: "depends on", "dependent
      on", "dependent upon", "contingent on", "contingent upon", "conditioned on", "subject to", "unless",
      "until such time", "provided that", "ability to continue", "going concern", "substantial doubt".
      External-condition terms: "demand", "recovery", "recover", "resumption", "resume", "reopen", "vaccine",
      "treatment", "approval", "regulatory", "ruling", "tariff", "commodity price", "oil price", "natural
      gas price", "interest rate", "rate environment", "funding", "financing", "liquidity", "covenant",
      "waiver", "supply chain", "pandemic". Matching is case-insensitive over the same 18,000-character
      excerpt the model was given. No tuning of this list is permitted after the rates are computed.

      '
    null_model: 'each reader is scored against the same date classification, so the comparison between
      readers is paired on dates and needs no external null

      '
    correction: 'Two pre-stated tests, one per reader, reported side by side. The difference between the
      two p-values is not itself a test and no significance is claimed for it.

      '
  power_statement: '12 episode dates against 16 control dates. A one-sided Mann-Whitney at this sample
    reaches p below 0.05 at roughly U = 137 of a possible 192, which corresponds to the episode group
    sitting above the control group about 71 percent of the time. The design can therefore detect only
    a large and consistent separation, and a reader that separates the groups modestly will return a null
    here. That cuts both ways and is the reason the fail sentence is written as "adds nothing MEASURABLE
    at this sample" rather than as "adds nothing": if neither reader clears, the correct statement is
    that this comparison could not tell them apart, not that they are the same. Hand labels remain the
    only route to precision and recall and are not substituted for here.

    '
  verdict: inconclusive
  reproduce: uv run python scripts/poc_e2_keyword_vs_model.py
  result:
    headline: 'NEITHER READER SEPARATES, which is the third outcome the registration wrote down and the
      one I thought least likely. Across 3,625 loser-leg filings on 28 formation dates, 12 preceding an
      episode and 16 not, the model''s stated-condition rate has a median of 0.106 at episode dates against
      0.094 at controls, a gap of +0.013 at a one-sided rank test of p = 0.2083. The keyword rule gives
      0.438 against 0.426, p = 0.5278. Neither clears. Under the registered power statement the correct
      sentence is that this comparison COULD NOT TELL THE TWO READERS APART, not that they are the same,
      and the verdict is inconclusive rather than a finding about either reader. The registration also
      said what a null here would mean for the earlier text result, and it means it: the design-tier elevation
      does not survive being recomputed on the crash inventory''s own date classification rather than
      the registry troughs it originally used. The two classifications are not the same object. The inventory
      admits every episode at the 5th percentile, so the twelve episode dates here precede reversals with
      a median depth of -6.1 percent and only five of thirteen deeper than -8, where the earlier experiment
      selected larger registered events. That is an explanation of why the two disagree and it is NOT
      a defence of the earlier number; both are reported. WHAT THE COMPARISON DID ESTABLISH is the mechanism
      the registration predicted, quantified. The keyword rule fires on 43.2 percent of filings against
      the model''s 12.1, three point seven times as often. Of the 1,565 filings the rule flags, the model
      declines 1,224 and keeps 21.8 percent. The two agree on 63.6 percent of filings, and almost all
      the disagreement is in one direction. That is the boilerplate the registration said a rule keyed
      on conditional language would fire on, and it is measured rather than asserted. It is not precision:
      the model is not ground truth, and which of those 1,224 declines are right needs the hand labels,
      which are reserved and unlabelled and are not substituted for here. AND ONE DIFFERENCE IS NOT A
      SCORE AT ALL. The rule flags a document. It cannot say what the filer is priced on. The condition
      text and the verbatim span that reach the page -- United Airlines naming a vaccine as the condition
      on 2020-09-09 -- have no keyword equivalent, and no rank test measures that.

      '
    numbers:
    - label: model
      episode against control: null
      value: 0.106 against 0.094
      comparison: gap +0.013, one-sided p = 0.2083; does not separate
    - label: keyword rule
      episode against control: null
      value: 0.438 against 0.426
      comparison: gap +0.012, one-sided p = 0.5278; does not separate
    - label: how often each fires
      value: keyword 3.7x the model
      comparison: 43.2 percent of filings against 12.1
    - label: of what the rule flags the model keeps
      value: 21.8 percent
      comparison: 1,224 of 1,565 declined; the asymmetry the registration predicted
    - label: agreement
      value: 63.6 percent of 3,625 filings
      comparison: both 341, model only 96, keyword only 1,224, neither 1,964
    - label: what no rank test measures
      value: the rule cannot name the condition
      comparison: the condition text and the verbatim span on the page have no keyword equivalent
    figures: []
  reasoning: 'Run because the memo asserts the language model reads a filing more faithfully than a rule
    and the proof of concept demonstrated it nowhere, and because the two readers cannot be compared against
    each other when one of them is not ground truth. The criterion used instead was chosen by neither
    reader and was registered long before either was scored. The answer is that at this sample the criterion
    cannot tell them apart, which is a weaker result than either branch I expected and is the one that
    is true.

    '
  caveats: 'The date classification is the crash inventory''s formation_at, which is deterministic and
    registered, and which is a much more permissive definition of an episode than the earlier text experiment
    used. Twelve of twenty-eight dates qualify here against a base rate of eighteen percent across all
    month-ends in the era, because the extraction dates were themselves chosen partly as episode dates;
    the sample is a case-control design and not a random draw. Neither the model''s labels nor the rule''s
    are ground truth, so nothing here is precision or recall and none is claimed. The hand labels remain
    the only route to those and remain reserved. The rule is frozen in the registration and was derived
    from the extractor''s own instructions rather than from any inspection of its output, so it is a fair
    rule and not a straw man; it is also a first attempt, and a better rule may exist.

    '
  history:
  - date: 2026-09-04
    note: Registered with the keyword rule written out in full before it was implemented, so it could
      not be tuned to the answer.
- id: exp-086
  title: Is the volatility-scaling gain real, and did the design lose anything by dropping the fitted
    model?
  one_breath: 'A negative control on the only clean positive result, and the head-to-head the design''s
    simplification was never given.

    '
  status: complete
  registered_at: 2026-09-04 15:00:00+00:00
  registered_commit: 7588dfb
  hypothesis: 'Two gaps in the tail-model work, both of which a careful reader would find. ARM A. The
    result that volatility scaling cuts pinball loss by 14 percent has no negative control. Every refutation
    in this register carries a planted effect showing the instrument could see what it failed to find;
    the one clean POSITIVE result carries nothing equivalent, and that asymmetry is exactly what invites
    the question of whether the gain is conditioning information or an artifact of the scaling arithmetic.
    Dividing by a series and multiplying by its current value is a transformation that could improve a
    loss for reasons having nothing to do with the series carrying information about the tail. ARM B.
    The design specifies a tail model with no fitted parameters and dropped a fitted quantile regression
    on trailing volatility and the Daniel-Moskowitz bear-state terms. Nothing tested whether that was
    the right call, and the example page still prints the fitted model''s number while the validation
    now rests on the parameter-free one. The deliverable and its own validation currently disagree about
    which estimator is being defended.

    '
  prediction: 'ARM A. Shuffling the volatility series across time destroys its alignment with returns
    while preserving its distribution exactly, so a scaled forecast built on the shuffled series carries
    no conditioning information. The pinball ratio against the unconditional quantile should return to
    approximately one, with an interval containing it. If the shuffled series still delivers a materially
    better loss, the gain is arithmetic rather than informational and the primary result of the tail experiment
    is withdrawn. I expect the gain to vanish; I am registering this because I do not want to be the one
    who never checked. ARM B. I expect the two estimators to be close on pinball loss, because the fitted
    regression optimises exactly that loss and has more freedom, and I expect the parameter-free one to
    be better on breach-rate stability across volatility regimes, because fewer parameters means less
    to overfit and because the bear-state terms the fitted model carries have already been shown to degrade
    the forecast. The honest alternative is that the fitted model wins on both, in which case the design
    dropped something that worked and the spec should be told. Both branches publish.

    '
  data:
  - source: src-french
    slice: daily WML, 1926 to the design-tier seal at 2023-01-01, the same dates as the tail experiment
    tier: DESIGN
    vintage: 2026-08
    coverage_note: 'Held identical to the tail experiment so the two are directly comparable: the same
      formation dates, the same horizon, the same quantile, the same non-overlapping monthly sampling.
      Only the estimator and, in arm A, the alignment of the volatility series vary.

      '
  method:
    statistic: 'arm A, the pinball-loss ratio of a shuffled-volatility scaled forecast against the unconditional
      quantile, over 200 independent shuffles; arm B, the pinball-loss ratio of the fitted quantile regression
      against the parameter-free scaled quantile, with breach rates by volatility tercile reported for
      both

      '
    unit: formation month
    grid: 'Arm A shuffles the trailing-volatility series with a fixed seed, recomputes the scaled quantile
      exactly as the tail experiment does, and repeats 200 times; the distribution of ratios across shuffles
      is the null band. Arm B takes the fitted model from the expanding backtest already in the package,
      samples it at the same monthly formation dates, and scores it with the same pinball and coverage
      machinery.

      '
    null_model: 'arm A is itself the null: a scaled forecast whose scaling series carries no information
      about the date it scales. Arm B compares two estimators directly and each is the other''s control.

      '
    correction: Two pre-stated arms, reported separately.
  power_statement: 'The same 1,047 non-overlapping monthly formation dates as the tail experiment, where
    the pinball comparison resolved a 14 percent improvement and a 2.5 percent degradation but could NOT
    resolve a 0.4 percent improvement. That floor governs both arms. Arm A is well powered because the
    effect it looks for is the disappearance of a 14 percent gain, an order of magnitude above the floor.
    Arm B is not: if the two estimators differ by less than about two percent of pinball loss, this design
    will return an interval containing one, and the correct report is that they could not be told apart
    on loss. That is why breach-rate stability across volatility regimes is registered as a reported quantity
    for arm B rather than as a tiebreak invented afterwards. A third comparison is NOT run and its absence
    is registered here: neither estimator is tested on the reconstructed book, only on the published factor.
    No daily book return series exists in the package, and building one means reconstructing the book
    on every date rather than at month-ends. That seam stays open and disclosed.

    '
  verdict: supported
  reproduce: uv run python scripts/poc_e3_estimators.py
  result:
    headline: 'ARM A, PASSED EMPHATICALLY. The volatility-scaling gain is conditioning information and
      not arithmetic. The real scaled forecast scores a pinball ratio of 0.8561 against the unconditional
      quantile. Rebuilding it on a volatility series shuffled across time -- same distribution exactly,
      alignment with returns destroyed -- gives a median ratio of 1.2085 with a 5-to-95 band of [1.1473,
      1.2711], which is WORSE than the unconditional quantile it is compared against. None of the 200
      shuffles came near the real gain: 0.0% matched it. The transformation itself carries no benefit;
      what carries it is the volatility series knowing something about the date it scales. The one clean
      positive result in the tail work now has the negative control every refutation in this register
      already had. ARM B, THE TWO ESTIMATORS CANNOT BE TOLD APART ON LOSS. Over 1047 common formation
      dates the fitted quantile regression scores a pinball ratio of 1.0075 against the parameter-free
      scaled quantile, with a 90 percent interval of [0.9766, 1.0350] containing one. The registered floor
      from the tail experiment is about two percent of loss, and the observed difference is well inside
      it, so the correct sentence is that this design could not distinguish them rather than that they
      are equivalent. On the quantity registered as reported-not-tested, the parameter-free estimator
      is the more stable: breach rates across volatility terciles spread 3.44 points against the fitted
      model''s 4.30. Both still fail pooled coverage, at 7.16 and 7.07 percent against a nominal five.
      No interval is placed on the stability difference and none is claimed. WHAT THIS SETTLES FOR THE
      DESIGN. Dropping the fitted model costs nothing measurable, so the simplification is vindicated
      on parsimony rather than on performance, and that is a weaker and more accurate defence than the
      spec currently implies. WHAT IT UNSETTLES FOR THE PAGE, and this is the useful part. The two estimators
      are indistinguishable across a century and disagree by 4.2 percentage points on the single date
      the example page reports: the fitted model gives -9.47 percent and the parameter-free one -13.69
      percent, against a realised -9.56. The fitted line is breached by nine basis points; the parameter-free
      line is not breached at all. The page''s headline therefore rests on an estimator choice the aggregate
      evidence cannot resolve, and it now prints both.

      '
    numbers:
    - label: arm A
      the real scaling gain: null
      value: ratio 0.8561
      comparison: against the unconditional quantile, from the tail experiment
    - label: arm A
      shuffled volatility: null
      value: median 1.2085, band [1.1473, 1.2711]
      comparison: WORSE than unconditional; the transformation alone carries nothing
    - label: arm A
      shuffles matching the real gain: null
      value: 0.0% of 200
      comparison: the gain is informational
    - label: arm B
      fitted against parameter-free: null
      value: ratio 1.0075
      comparison: 90 percent CI [0.9766, 1.0350] contains one; below the design's two percent floor
    - label: arm B
      breach spread across volatility terciles: null
      value: parameter-free 3.44 points, fitted 4.30
      comparison: reported, not tested; no interval is placed on the difference
    - label: the two estimators on the page's own date
      value: -13.69 against -9.47 percent
      comparison: realised -9.56; one line is breached and the other is not, on a choice the evidence
        cannot resolve
    figures: []
  reasoning: 'Run because the positive result had no negative control while every refutation in the register
    had one, and because the example page printed an estimator the validation had just refuted. The first
    gap closes decisively. The second closes differently than expected: the estimator choice turns out
    not to matter across a century and to matter a great deal on one date, which is a limitation worth
    printing rather than a question worth resolving.

    '
  caveats: 'Neither estimator is tested on the reconstructed book, only on the published factor. No daily
    book return series exists in the package and building one means reconstructing the book on every date
    rather than at month-ends. That seam was registered as not run and stays open. The stability comparison
    in arm B carries no interval and is reported as descriptive, exactly as registered, so it cannot be
    used to break the tie the loss comparison leaves open. The shuffle in arm A permutes the whole volatility
    series once per replicate and reuses it for training and for the scaling of the current date, which
    is the right null for the question asked; a block shuffle preserving volatility clustering would be
    a stricter test and is not run here.

    '
  history:
  - date: 2026-09-04
    note: Registered after noticing the example page prints an estimator the validation had just refuted.
