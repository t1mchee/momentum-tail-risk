  reasoning: 'Run because this is the design''s central claim and nothing of the pipeline existed. It
    exists now and it does not work at the coverage available, which is a more useful result than either
    branch the registration anticipated: the machinery is built and its binding constraint is named and
    quantified, so what would have to change is specific rather than general.

    '
  caveats: 'Six instrument faults were found and fixed during the build, and two are logged as traps because
    they would have produced confident wrong numbers: market value computed from split-adjusted prices
    times unadjusted share counts, which gave one position a twentyfold weight and was the real cause
    of a weight norm a reviewer had flagged as thin-panel concentration; and a news corpus in which 60
    to 94 percent of each episode file postdates the formation date it was being read for, which is look-ahead
    inside the one input whose justification is that it is timestamped. The others were a singular shrunk
    covariance driven by a halted name with a frozen price, seeds that were not reproducible across processes,
    and names drawn into both legs of the same random book. The classifier over Item 1A was not trained;
    the keyword run alone produced every risk statement, which the brief permits and which is recorded.
    The equal-weighted-versus-value question does not arise here because this pipeline uses the spec''s
    within-leg normalisation throughout; that convention differs from the tail model''s joint normalisation
    and both are now stored per date. umap-learn was installed into the environment for the reduction,
    per the brief; the lock file is untouched.

    '
