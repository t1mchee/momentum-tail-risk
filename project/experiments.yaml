- id: exp-016
  title: Is downside protection more expensive on the crowded short positions?
  one_breath: >
    Compares the price of crash protection across the losing side of the book on a single
    day against how heavily each stock is shorted.
  status: abandoned
  superseded_by: exp-019
  registered_at: 2026-08-21T18:40:00Z
  registered_commit: 250dfca
  closes_question: q-07
  hypothesis: >
    Option prices on individual holdings reveal squeeze risk that market-wide measures
    cannot see, so within the losing side the most heavily shorted stocks will carry the
    most expensive upside protection.
  prediction: >
    A positive rank correlation between the skew of each stock's option prices and its
    short volume, surviving control for company size and volatility level. A correlation
    near zero, or one that vanishes under those controls, refutes the hypothesis.
  data:
    - source: src-cboe-chains
      slice: full option chains for the losing side of the book on a single snapshot date
      tier: SEALED
      vintage: 2026-08-21
      coverage_note: 95 losing-side names captured, across 24 expiry dates
    - source: src-finra
      slice: short volume for the same names on the same trading date
      tier: SEALED
      vintage: 2026-08-22
      coverage_note: >
        Not yet pulled. The short-volume file for a trading date publishes the following
        morning, so this slice does not exist at the moment of registration.
  method:
    statistic: Spearman rank correlation between option skew and short volume ratio, then partial correlation
    unit: company, within the losing side only, on one date
    grid: three skew definitions across expiry buckets
    null_model: no rank association, assessed by bootstrap clustered on sector rather than block bootstrap, since a single cross-section has no time dimension to block over
    correction: Benjamini-Hochberg across the three skew definitions
    power: 95 companies gives usable precision on a rank correlation, unlike the two dozen episodes that bound every time-series test here
    controls: [company size, at-the-money volatility level, sector]
  result:
    headline: null
    numbers: []
    figures: []
  verdict: not_yet
  reasoning: >
    Abandoned before running, not because the idea changed but because the method did.
    The liquidity gates were left unspecified here, and pinning them down afterwards
    would have been a change to a frozen field. Reopened in full with the gates fixed in
    advance. Nothing was computed from this entry.
  caveats:
    - >
      Expensive upside protection on a hard-to-borrow stock is mechanically linked to the
      cost of borrowing it, through the arbitrage relationship between puts, calls and the
      underlying. A positive result may therefore be pricing the borrow rather than
      anticipating a squeeze. This alternative reading is recorded before the test runs,
      not after, and separating the two would require borrow cost data that is not free.
    - >
      One date. A cross-sectional association on a single snapshot says nothing about
      whether the measure moves usefully through time, which is the question that needs
      years of history.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.features.skew --cross-section"
  history:
    - {date: 2026-08-21, note: "Design committed as 250dfca, then the hash written back here.", admin: true}
    - {date: 2026-08-21, note: "Registered before writing the skew interpolation, and before the short-volume file for the snapshot date exists."}
    - {date: 2026-08-21, note: "Design committed as 250dfca, then the hash written back here.", admin: true}
    - {date: 2026-08-21, note: "Abandoned in favour of a fuller registration. The method freeze is only worth having if it bites, and here it bit my own entry."}

