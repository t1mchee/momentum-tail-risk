  registered_at: null
  registered_commit: null
  closes_question: q-07
  hypothesis: >
    The regulatory list of stocks with persistent settlement failures is a usable free
    proxy for a stock being impossible to borrow, and therefore for squeeze risk.
  prediction: >
    The most heavily squeezed stocks will appear on the list during the squeeze week.
  data:
