      slice: quarterly reviews, 1996 to 2026
      tier: DESIGN
      vintage: 2026-08-18
    - source: src-gdelt
      slice: official-sector publications matching mechanism terms
      tier: DESIGN
      vintage: 2026-08-18
  method:
    statistic: mention frequency per issue for each mechanism-related term
    unit: publication issue
    grid: several term families crossed with several publication series
    null_model: mention frequency is unrelated to what happens next
    correction: not applicable
    power: full publication history
    controls: [document length, editorial section]
  result:
    power_statement: >
      Full publication history read, so the slice IS the population and detection is not
      sample-limited. The hypothesised shape is a warning about factor crowding appearing in
      official commentary before an episode; the smallest detectable instance is a single
      mention, since mentions were counted rather than modelled.
    planted_effect: >
      Natural positive control: the search DID recover a crowding warning where one exists,
      concerning Taiwanese consumer banking, which shows the vocabulary finds the language
      when it is present. Absence elsewhere is therefore about the reports, not about the
      search.
    headline: >
      No warning. The review published shortly before the 2007 crisis contains one mention
      of crowding, concerning Taiwanese consumer banking, and the highest-scoring issue in
      the whole sample is a feature article two years early.
    numbers:
      - {label: crowding mentions before the 2007 crisis, value: 1, comparison: "and it concerned consumer banking in Taiwan, not equity factors"}
      - {label: mentions before the 2019 event, value: 0, comparison: "across every mechanism term searched"}
      - {label: highest-scoring issue in the sample, value: "March 2005", comparison: "a hedge fund feature two years before the crisis it appears to anticipate"}
    figures: []
  verdict: refuted
  reasoning: >
    The measure tracks the editorial calendar rather than market conditions, and the 2005
    false positive demonstrates it cleanly. A term-frequency approach to scheduled
    publications will always find the issue where the topic happened to be commissioned.
  caveats:
    - >
      Term frequency is a crude reading of a document. A language model reading the same
      issues for substance rather than words might reach a different answer, and that was
      not tried.
  produced_claims: [clm-official-warning]
  changed_because_of_this: >
    Scheduled publications were dropped as a candidate early-warning source.
  reproduce: "uv run python -m unstructured_momentum.data.official --scan"
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now refuted. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-18, note: "Run across the full publication history."}
