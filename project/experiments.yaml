- id: exp-089
  title: The tail model as designed, on the reconstructed book rather than the published factor
  one_breath: 'Runs the four ablation lines on the object the page is about, with the calendar state the
    design specifies.

    '
  status: complete
  registered_at: 2026-09-04 20:00:00+00:00
  registered_commit: fef25f9a4
  hypothesis: 'The tail model has been tested on French''s published factor because no daily series for
    the reconstructed book existed. That series now exists, and the book is a different object: it runs
    at roughly 32 percent annualised against the published factor''s 13, because value-weighting inside
    a decile is extremely concentrated. A quantile estimator validated on a 13 percent series has not
    been validated on a 32 percent one, and the page is about the book. The design''s conditioning state
    is also different from the one tested. Bear state was used because it is computable on a century of
    published returns; the design specifies a calendar state built from FOMC decision days and earnings
    days on which reporting companies hold at least ten percent of gross book weight, which needs book
    weights and so needs this series.

    '
  prediction: 'Volatility scaling should still beat the unconditional quantile, because the scale channel
    is the one with published support and it survived a shuffled-volatility control on the published factor.
    I expect the margin to be similar or larger, since a more concentrated book has more time-varying
    volatility to exploit. The calendar state I expect to add little, on the same reasoning that sank
    the bear state: it splits an already small tail sample. I would not be surprised either way and both
    sentences are written now. The over-breach seen on the published factor -- the scaled line breaching
    at 7.2 percent against a nominal 5 -- I expect to persist, because it looked like a level offset rather
    than a conditioning failure. If it vanishes on the book, the offset was a property of the published
    series and not of the estimator.

    '
  data:
  - source: src-iwv
    slice: the reconstructed book's daily returns, 2014-02 to the design-tier seal
    tier: DESIGN
    vintage: 2026-09
    coverage_note: '2,997 daily returns across 144 formation months, correlating 0.880 daily and 0.834
      monthly with the published factor. Weights are market value from quantity times price, not the published
      weight column, which rounds to zero for the smallest sixty percent of the loser leg.

      '
  method:
    statistic: 'out-of-sample pinball loss and Kupiec coverage for four lines, with breach rates by calendar
      state and by volatility tercile, and an expected-shortfall line

      '
    unit: formation month
    grid: 'Four lines, each estimated only on starts whose ten-day target is realised: unconditional;
      volatility-scaled; scaled and conditioned on the calendar state; scaled and conditioned on the volatility
      tercile. Calendar state is on for a formation whose sessions t+1 to t+10 contain an FOMC decision
      day or an earnings day on which reporting companies hold at least ten percent of gross book weight.
      The probability line reports the share of past scaled returns in today''s state below the registered
      level. Block bootstrap in blocks of six months. Concentration is printed per date as the weight
      norm and the component exposure, per the design''s correction 17.

      '
    null_model: the unconditional quantile for the primary comparison; each further line is scored against
      the one below it
    correction: Pre-stated lines reported separately; no line is claimed from another's interval.
  power_statement: 'About 144 monthly formation dates against the 1,047 available on the published factor,
    so the design is roughly an eighth as sensitive. On the published factor the comparison resolved a
    14 percent improvement and could not resolve 0.4 percent; here the floor is nearer 5 percent, so only
    a large effect is detectable and anything smaller must be reported as not resolved. Coverage at 144
    months expects about seven breaches, which makes Kupiec informative about gross miscalibration only.

    '
  verdict: supported
  reproduce: uv run python scripts/poc_e5_book_tail.py
  result:
    headline: 'THE COVERAGE RESULT INVERTS ON THE BOOK, which is the outcome the registration named as
      possible and the one that matters. On the published factor the unconditional quantile passed Kupiec
      and the volatility-scaled line failed it at 7.2 percent. On the reconstructed book, over 81 formations
      from 2015-09-30 to 2022-12-31, the UNCONDITIONAL line fails at 11.11 percent with p = 0.028 and
      the SCALED line passes at 7.41 percent with p = 0.352. The over-breach was a property of the published
      series, not of the estimator, and on the object the page is actually about the scaled line is the
      calibrated one. Scaling also still wins on loss: a pinball ratio of 0.8900 against the unconditional
      quantile, an 11 percent reduction, on a book running at 32.8 percent annualised against the published
      factor''s 13. NEITHER CONDITIONING VARIABLE EARNS ITS PLACE. The calendar state scores 0.9962 against
      the scaled line with an interval of [0.9720, 1.0241], and the volatility tercile 1.0021 with [0.9606,
      1.0439]. Both contain one. That is the third conditioning variable in a row to add nothing measurable,
      after the bear state was refuted outright, and the pattern is now worth stating: on this data the
      scale channel carries the forecastable part and the state channels do not. THE CALENDAR STATE IS
      EFFECTIVELY FOMC-ONLY HERE and that is a coverage limit rather than a design choice. It was on at
      22 of 81 formations, of which 18 came from an FOMC decision day in the window and only 4 from earnings.
      The design''s threshold is reporting companies holding ten percent of gross book weight; the median
      window reaches 0.29 percent, because the 8-K corpus covers 1,579 tickers of about 2,900 and begins
      in 2018. The earnings half of the state has not really been tested.

      '
    numbers:
    - label: coverage
      unconditional: null
      value: 9 of 81, 11.11 percent
      comparison: Kupiec p = 0.028; FAILS, where it passed on the published factor
    - label: coverage
      volatility-scaled: null
      value: 6 of 81, 7.41 percent
      comparison: Kupiec p = 0.352; PASSES, where it failed on the published factor
    - label: scaling against unconditional
      value: pinball ratio 0.8900
      comparison: CI [0.7516, 1.0607], six-month blocks
    - label: calendar state against scaled
      value: '0.9962'
      comparison: CI [0.9720, 1.0241] contains one; adds nothing measurable
    - label: volatility tercile against scaled
      value: '1.0021'
      comparison: CI [0.9606, 1.0439] contains one
    - label: the calendar state is FOMC in practice
      value: 18 of 22 from FOMC, 4 from earnings
      comparison: median earnings weight in window 0.29 percent against a 10 percent threshold
    - label: book concentration
      value: median weight L2 norm 0.1963
      comparison: equal weighting over 470 names would give 0.0461; effective N about 26 for the whole
        book
    - label: expected shortfall and the probability line
      value: mean 10-day ES -14.75 percent; mean P(10d <= -432bp) 15.3 percent
      comparison: both printed per the design's page items
    figures: []
  reasoning: 'Run because every tail result was on the published factor while the page is about the book,
    and because a daily book series was believed not to exist. It does, and running on it flips the coverage
    verdict in the design''s favour while refuting a third conditioning variable.

    '
  caveats: '81 scored formations against 1,047 on the published factor, so this design is roughly an eighth
    as sensitive: it resolved an 11 percent loss improvement and cannot resolve the two to three percent
    differences the conditioning lines show. Kupiec at 81 months expects about four breaches, so the coverage
    comparison distinguishes gross miscalibration only, and the inversion should be read as "the sign
    of the miscalibration is different on this object", not as a precise calibration claim. The earnings
    half of the calendar state is untested for the coverage reason above. Three of the four lines fall
    back to the scaled quantile when a conditioning cell has fewer than 100 training observations; that
    fired on 6.2 percent of formations for the state line and 2.5 percent for the tercile line, so the
    comparisons are between genuinely different estimators and not between a line and itself.

    '
  history:
  - date: 2026-09-04
    note: Registered once the daily book series existed; the earlier tail work was on the published factor
      and said so.
- id: exp-090
  title: Is the book's index-concentration reading discovered, or is it a mechanical consequence of value-weighting
    inside a decile?
  one_breath: 'Tests whether the headline exposure survives when the weighting that could manufacture
    it is changed.

    '
  status: complete
  registered_at: 2026-09-04 20:00:00+00:00
  registered_commit: fef25f9a4
  hypothesis: 'The live reading is that the book is long index concentration at a z of 15.4, the highest
    of the eight reference series, and the memo is about to quote it. The book is value-weighted within
    each leg, which the design specifies, and at the latest formation date that gives the long leg an
    effective N of about 11 with a single name at a quarter of the leg. A book that IS a handful of the
    largest names by construction will load on a series defined as the largest names against the equal-weighted
    index, whether or not the momentum sort discovered anything. Two things are conflated in the current
    artifact and are separated here. The z is computed against random books matched on leg size and capitalisation,
    which should already absorb a mechanical concentration effect if the matching is doing its job --
    so the reading may be sound. But the placebo books are matched on capitalisation PROFILE rather than
    on realised weight concentration, and those are not the same constraint. A second discrepancy is measured
    at the same time: the leg membership used by the current-book script and the membership in the stored
    panel are built by different paths and disagree, and the top-ten holdings printed on the page come
    from one of them.

    '
  prediction: 'If the reading is discovered, the z should survive re-weighting the same names equally
    within each leg, because the exposure would then come from WHICH names the sort chose rather than
    from how much weight the largest one carries. I expect it to fall substantially and to remain clearly
    positive, which would mean the reading is real and overstated. If it collapses toward the placebo
    band under equal weighting, the reading is mechanical and the memo must not quote it as a discovered
    exposure. If it is unchanged, the placebo matching is already absorbing the effect and the concentration
    concern is answered. On the membership discrepancy I predict the two paths differ on a minority of
    names and that the printed top ten changes, because one path weights by a column that rounds small
    holdings to zero.

    '
  data:
  - source: src-iwv
    slice: the latest formation dates in the holdings panel
    tier: DESIGN
    vintage: 2026-09
    coverage_note: Same universe, same dates; only the weighting and the membership path vary.
  method:
    statistic: the conferred z on each reference series under value weighting and under equal weighting,
      side by side, with the placebo band; and the Jaccard overlap between the two membership paths
    unit: formation date
    grid: the same 500 matched random books, re-scored under each weighting; membership compared name
      by name
    null_model: the matched random books, unchanged
    correction: One comparison stated in advance.
  power_statement: 'This is a sensitivity analysis on a single reported number rather than a hypothesis
    test, and is reported as one. No p-value is claimed for the difference between weightings; the two
    z values and the placebo band are printed together and the reader draws the comparison.

    '
  verdict: refuted
  reproduce: uv run python scripts/poc_e6_concentration.py
  result:
    headline: 'THIS EXPERIMENT''S OWN HYPOTHESIS RESTS ON A FALSE PREMISE, and finding that out is the
      result. The registration says the book is value-weighted within each leg, because the design says
      so, the memo says so and the daily return series built the same day implements it that way. The
      measurement path does not. `current_book.py`, `gap01_family.py`, `build_reference_panel.py`, `same_rule_null.py`
      and `factor/placebo.py` all aggregate a leg with a plain mean, which is EQUAL weighting. The live
      z of 15.4 was already the equal-weighted number and reproduces to machine precision. The frozen
      hypothesis is left as written rather than amended, because a hypothesis that is edited after the
      run is not a hypothesis; what publishes is that it was wrong about the code it was describing. The
      mismatch between the stated construction and the measured one is in the trap register. WITH THAT
      CORRECTED, THE QUESTION STILL HAS AN ANSWER AND IT IS THE UNCOMFORTABLE ONE. Re-scoring the identical
      names value-weighted, as the design describes the book, moves the index-concentration z at the latest
      formation from 15.7 to 1.2 and its rank among the eight reference series from first to seventh;
      the dominant axis becomes the dollar. Across 24 month-ends the median z is 16.0 equal-weighted against
      2.9 value-weighted, concentration ranks first on 22 of 24 dates equal-weighted and 11 of 24 value-weighted,
      and the value-weighted z is under 3 on 13 of 24. Every other series loses roughly one and a half
      to two and a half times its z; concentration loses thirteen times. It is uniquely destroyed. THE
      MECHANISM IS NOT THE LOADING SHRINKING. The real spread RISES under value weighting, from 0.306
      to 0.532. What changes is the null: the placebo mean rises tenfold, from 0.028 to 0.280, because
      cap-matched random books, value-weighted, reproduce the concentration the real book has. Equal-weighted
      the real book sits at the 100th percentile of a placebo band of [0.004, 0.058]; value-weighted it
      sits at the 84th of [0.022, 0.698]. Dropping the five largest placebos moves the z from 1.18 to
      1.24, so it is not outlier-driven. AND THE MATCHING IS DOING ITS JOB, which was the specific worry.
      Cap-profile matching delivers matched realised concentration: the real value-weighted long leg has
      an effective N of 15.7 and the value-weighted placebo legs a median of 13.4, interval [3.0, 36.7].
      The placebos are not a looser constraint; they reproduce the concentration, and that is exactly
      why they reproduce the loading. SO THE READING IS NOT MECHANICAL IN ITS OWN TERMS -- an equal-weighted
      momentum book does load on concentration far beyond anything an equal-weighted cap-matched book
      does -- and it is entirely contingent on a weighting the design does not specify. The memo must
      not quote 15.4 as a discovered exposure without naming the weighting that produces it in the same
      sentence. MEMBERSHIP. The two paths disagree substantially: winners Jaccard median 0.675, losers
      0.695, with a median 46 and 43 names of 244 differing. The printed top ten is identical on 1 of
      24 dates for winners and 0 of 24 for losers. At the latest formation the page prints AMD, AMAT,
      LRCX, CAT, KLAC, MRVL, DELL, GLW, VRT, HPE while the stored leg''s top ten begins GOOGL, MU, AMD
      -- so GOOGL, the name this experiment''s concentration worry was built around, is absent from what
      the page actually shows. Decomposed, the cause is the momentum estimator itself: the stored panel
      compounds masked daily returns over 252 trading days after a 21-day skip, the live path takes an
      end-over-start price ratio across calendar months, and their Spearman correlation of 0.947 puts
      about 28 percent of each leg in disagreement at a decile cut. The decile rule and split correction
      account for almost none of it.

      '
    power_statement: 'Not applicable in the usual sense: this is a sensitivity analysis on a reported
      number and is reported as one, with no p-value claimed for the difference between weightings. What
      makes the conclusion robust is not a test but a margin and a replication: a thirteen-fold collapse
      in one series against one-and-a-half to two-and-a-half-fold in the other seven, reproduced on 24
      dates rather than asserted on one, with the outlier check and the secondary capitalisation grid
      both leaving it unchanged.

      '
    planted_effect: 'The refutation here is of the registration''s premise about the code, and the check
      is a reproduction rather than a planted signal: the equal-weighted path reproduces the committed
      `current_book.json` to machine precision, maximum absolute difference 2.2e-16 across all eight z
      values and spreads. That is what establishes the premise was false rather than the re-implementation
      being wrong.

      '
    numbers:
