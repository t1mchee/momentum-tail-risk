    - {date: 2026-08-28, note: "SUBSET CLAIM RETRACTED -- the central inference of this entry is FALSE and was measured to be so by an independent red-team audit, then reproduced by the author to four decimals. A strict-subset claim requires a NESTED test; this entry ran a MARGINAL horse race (sector+themes versus sector+correlation-clusters, in separate regressions) and inferred subsumption from A-ONE beating A-ZERO. Running the nested model on the same machinery: text adds +0.0132 over sector alone, correlation clusters add +0.0228, and text STILL adds +0.0119 when the correlation clusters are already in the model -- 89.9 percent of its marginal contribution survives. Net of the weight-matched placebo increment computed at the same conditioning step, text contributes +0.0051 conditionally against +0.0056 standalone: 91 percent retained, positive in 13 of 13 sampled months. The two bases are COMPLEMENTS, not substitutes. What this entry established remains true and is unchanged: a partition fitted to trailing returns explains more of the daily cross-section than a news-derived partition does. What it does not establish, and what the kill rule was executed on, is that the news partition carries no information of its own. Reproduce: scripts/verify_subset_058.py."}
