  reasoning: 'Run before the memo quoted the concentration reading as a discovered exposure. It should
    not quote it in those terms: the number is real against its own null and is entirely a property of
    an aggregation the design does not specify. The experiment also found that its own premise was false,
    which is a better outcome than confirming it would have been.

    '
  caveats: 'The hypothesis is left exactly as registered, wrong premise and all, because editing a frozen
    hypothesis after the run destroys the thing registration is for. Read it as the state of belief before
    the code was checked. A second defect was found and is logged separately in the trap register: the
    placebo''s capitalisation match is made on the published weight column, which is zero for a median
    52.7 percent of the universe, so the bottom five capitalisation buckets are ordered alphabetically
    by a tie-break rather than matched on size. The whole grid was run both ways and the conclusion is
    unchanged, but the null is not matched where it claims to be. Twenty-four month-ends from 2024-08
    to 2026-07, which is the recent panel rather than the full history, so the collapse is established
    on that window and not across the design tier.

