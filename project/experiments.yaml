- id: exp-091
  title: 'The theme pipeline: does a component''s companies concentrate on one risk theme that random
    books do not?'
  one_breath: 'The design''s central claim, built and run on the eleven registered dates and the memo
    date.

    '
  status: complete
  registered_at: 2026-09-04 20:00:00+00:00
  registered_commit: fef25f9a4
  hypothesis: 'The design''s claim is that on a formation date before an episode, the companies carrying
    a named component''s exposure state, in their filings, one shared risk theme that the same number
    of randomly chosen companies do not; and that on calm dates nothing rises above that placebo. Nothing
    of this pipeline exists. Every text result so far is from a different instrument -- a document-level
    extractor for survival conditions on the loser leg -- and none of it tests this claim.

    '
  prediction: 'On at least five of the eight episode formation dates a theme rises above the 95th percentile
    of the random books'' maximum excess weight, and on the three calm windows none does. The labels on
    the episode dates should be recognisable as the episode''s, and the expected labels are written down
    before the run: vaccine or treatment timing before 2020-11, tariffs before 2025-04, inflation and
    rates before 2022-11. The honest alternative is that themes rise above the placebo on calm windows
    as often as on episode windows, which would mean the pipeline detects clustering in filings generally
    rather than anything about reversals, and the fail sentence publishes. A third outcome, and the one
    I think most likely given how small the sample is, is that the result is neither clean: some episodes
    fire and some calm windows do too, at a count this design cannot separate from chance. Eight against
    three is a very small comparison and the power statement says so.

    '
  data:
  - source: src-gdelt
    slice: episode-window news titles for eight registered windows plus calm windows for 2016, 2017 and
      2018
    tier: DESIGN
    vintage: 2026-09
    coverage_note: 'News is not a daily archive here: it is headline sets for registered windows, so the
      pipeline runs on those windows and not on a monthly series. Holdings coverage in 2017 is thin, which
      may make one calm window unbuildable; if so it is reported rather than substituted.

      '
  - source: src-edgar
    slice: Item 1A sentences for component companies and random-set companies
    tier: DESIGN
    vintage: 2026-09
    coverage_note: Coverage is partial and skewed to larger names, as everywhere in this package.
  method:
    statistic: excess weight of the top theme in the component set against the 95th percentile of the
      random books' maximum, per date
    unit: formation date
    grid: '200 random books per date matched on decile-by-sector cell counts per leg; Ledoit-Wolf with
      a constant-correlation target on the market residual over 126 days; three components; the component
      sign fixed so the book''s exposure is positive; top-quartile sets by loading. One named public encoder;
      HDBSCAN at minimum cluster size 25 over episode-window news titles plus the Item 1A sentences of
      set and random-set companies; the member distance cut at the 90th percentile of member-to-centroid
      distance and the centroid cut at the 10th percentile of nearest-centroid distance. Assignment uses
      the leg-sign rule, one company one vote.

      '
    null_model: the 200 matched random books' maximum excess weight, per date
    correction: Eleven dates plus the memo date, reported individually and as a count.
  power_statement: 'Eight episode dates against three calm windows. Under a null where each date clears
    the 95th percentile with probability 0.05, five of eight is far beyond chance, so the arithmetic bar
    is easy and the binding uncertainty is elsewhere: three calm windows cannot distinguish a base rate
    of zero from one of a third, so the control side of the comparison is nearly uninformative. The design
    can show that themes rise on episode dates; it cannot show that they fail to rise on ordinary ones.
    That asymmetry is stated now and will be stated in the result whichever way the counts fall. The label-matching
    claim needs a rule fixed in advance: the expected label per episode is written into this registration,
    and a match is counted only where the theme''s terms overlap the expected label''s terms. No post-hoc
    judgement of recognisability is admitted.

    '
  verdict: instrument_limited
  reproduce: uv run python scripts/poc_e7_theme.py
  result:
    headline: 'THE COMPARISON THE REGISTRATION DESCRIBES COULD NOT BE MADE, and the reason is coverage
      rather than the placebo. The pipeline was built and ran end to end on all twelve dates: the book,
      200 cell-matched random books per date, Ledoit-Wolf on the market residual, three sign-fixed components,
      the bridge, the encoder, the clustering, the leg-sign assignment and the excess weight against the
      random books'' maximum. Nothing was skipped. THE EPISODE SIDE FALLS SHORT OF ITS OWN BAR. A theme
      rose above the 95th percentile of the random books'' maximum on 2 of 8 episode dates against a registered
      prediction of at least 5, and on 0 of them did the label match the expected label written into this
      registration before the run. THE CONTROL SIDE CARRIES NO INFORMATION AT ALL, which is the finding
      that decides the verdict. Of the three calm windows one is unbuildable -- the panel holds 22 observations
      in the 126-day window against a declared minimum of 100 -- and the two that build have essentially
      NO component-set company with a point-in-time Item 1A: the per-component counts are [0, 0, 0] at
      2016-08-31 and [0, 1, 0] at 2018-08-31. A component set with no covered company cannot produce a
      non-zero excess weight, so "no theme rose on the calm windows" is arithmetic, not evidence. The
      eight-against-three comparison has a control side that could not have gone the other way. COVERAGE
      IS THE BINDING LIMIT THROUGHOUT. Across twelve dates the book''s own component set holds between
      0 and 25 companies with a point-in-time Item 1A against set sizes of 116 to 137, so every excess
      weight rests on at most a fifth of the set''s absolute loading and usually on a few per cent. The
      two episode themes that did rise rest on 1 of 137 companies (2019-08-31, "patents", excess +0.0047
      against a threshold of +0.0046) and 11 of 132 (2020-12-31, "company, bank, incorporated"). Neither
      is its episode''s theme by the registered term rule, and the first clears its threshold by one part
      in ten thousand on a single company. AND THE CLUSTERER IS NOT STABLE. On 2020-10-31 the primary
      configuration returned 2 clusters with one holding 97.8 percent of 2,850 statements. The diagnosis
      was run before the result was recorded and exonerates the date: the reduction ran, the seed is fixed,
      the boilerplate rule fired. Three independent 64-company draws from that same date''s own filings,
      at identical parameters and seed, returned 2, 2 and 26 clusters, and a 2,200-sentence draw from
      the same corpus returned 24. No parameter was changed to obtain any of those. A declared degeneracy
      flag fires on that date and on no other, and the flagship date is the one it fires on. The registered
      configuration -- HDBSCAN at minimum cluster size 25 in raw 384 dimensions -- returns nothing at
      all on all twelve dates, noise share 1.000, which is the known high-dimension failure and is reported
      beside the reduced-space variant rather than replaced by it.

      '
    power_statement: 'The registration said the control side was the weak half and that three calm windows
      cannot distinguish a base rate of zero from one of a third. The outcome is worse than that anticipated:
      the control side is not weak, it is empty, because two of the three windows have no covered company
      and the third does not build. So the design cannot show that themes fail to rise on ordinary dates,
      and it cannot show that they rise on episode dates either, because 2 of 8 with 0 label matches is
      what an instrument with a few per cent coverage returns whether or not the effect exists. The correct
      reading is that this sample could not test the claim, not that the claim is false. What would move
      it is coverage: point-in-time Item 1A for the component set rather than for the fifth of it the
      free corpus reaches, and a news corpus dated to inform formation rather than to describe episodes.

      '
