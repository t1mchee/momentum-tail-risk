- id: exp-012
  title: Does a published crowding measure replicate, and is it worth anything?
  one_breath: >
    Re-runs an academic crowding measure on data published after the original paper ended,
    then tests whether trading on it makes money.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-01
  hypothesis: >
    A published measure of how similarly stocks inside the momentum portfolio move together
    predicts crash frequency, and can therefore be used to reduce exposure in time.
  prediction: >
    Crash days will be more frequent in the most crowded weeks, and reducing exposure on
    that signal will improve risk-adjusted returns.
  data:
    - source: src-cboe-index
      slice: implied correlation and volatility indices
      tier: DESIGN
      vintage: 2026-08-17
    - source: src-french
      slice: daily factor returns after 2015
      tier: VALIDATE
      vintage: 2026-08-17
  method:
    statistic: crash-day frequency by crowding quintile, then risk-adjusted return and worst drawdown after costs
    unit: week for the frequency test, day for the trading test
    grid: five quintiles, and a range of trading costs
    null_model: crash frequency is unrelated to crowding, and the trading rule adds nothing
    correction: not applicable
    power: the entire post-2015 period, outside the original paper's sample
    controls: [market returns removed before measuring co-movement, trading costs charged explicitly]
  result:
    headline: >
      The measure replicates cleanly out of sample and is worthless as a trading trigger.
      It stops paying at zero trading cost, while the same rule on trailing volatility
      survives 150 basis points.
    numbers:
      - {label: crash-day frequency, least to most crowded, value: "6.4% to 19.6%", comparison: "a 3.06x increase, against 2.7x in the original paper"}
      - {label: shape across the five groups, value: monotone, comparison: "each group worse than the last, not just the extremes"}
      - {label: average forward return, least to most crowded, value: "+2.5% to -1.3%", comparison: "the sign flips across the range"}
      - {label: change in risk-adjusted return from trading it, value: "-0.02", comparison: "slightly worse than not using the signal"}
      - {label: change in worst drawdown, value: "+3.2 percentage points", comparison: "deeper, in the wrong direction"}
      - {label: cost at which it stops paying, value: 0 basis points, comparison: "against 150 basis points for the volatility-driven version"}
      - {label: market-wide implied correlation before the 2019 event, value: 26th percentile, comparison: "against the book's own crowding at the 87th"}
    figures: []
  verdict: inconclusive
  reasoning: >
    Recorded as mixed because the two halves genuinely disagree and both are true. The
    replication is real and the economic value is zero. This pairing is the clearest
    argument in the project for testing statistical results economically before believing
    them, and it is why the trading test is now run on every candidate signal.
  caveats:
    - >
      The trading rule is a simple threshold. A more sophisticated use of the same signal
      might extract value the threshold cannot, though the zero-cost breakeven leaves very
      little room.
  produced_claims: [clm-comomentum-replicates, clm-comomentum-useless, clm-implied-corr]
  changed_because_of_this: >
    A costed trading test became mandatory for any signal before it can be called useful,
    and the failure of the market-wide correlation index is what started the daily option
    capture on the book's own holdings.
  reproduce: "uv run python -m unstructured_momentum.features.comomentum --oos && uv run python -m unstructured_momentum.model.baselines --degross"
  history:
    - {date: 2026-08-17, note: "Replication run first; the trading test was added because a replicating signal that had not been costed felt unfinished."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-013
  title: Do momentum reversals cluster around scheduled central bank meetings?
  one_breath: >
    Tests whether reversals happen disproportionately near policy meeting dates, across
    every reasonable definition at once.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-04
  hypothesis: >
    Momentum reversals are triggered by scheduled macroeconomic catalysts, so they should
    cluster around central bank meeting dates.
  prediction: >
    Windows containing a meeting will show a materially higher reversal rate than windows
    that do not, surviving correction for having tested several definitions.
  data:
    - source: src-fomc
      slice: meeting dates 1996 to 2026
      tier: DESIGN
      vintage: 2026-08-15
    - source: src-iwv
      slice: reversal episodes over the same period
      tier: DESIGN
      vintage: 2026-08-15
  method:
    statistic: reversal-rate lift in meeting windows against non-meeting windows
    unit: window
    grid: 3 horizons crossed with 3 severity thresholds
    null_model: reversal dates are unrelated to the meeting calendar
    correction: Benjamini-Hochberg across the nine cells
    power: minimum detectable lift stated in advance from the regime count
    controls: [window length held constant between the two groups]
  result:
    power_statement: >
      Minimum detectable lift stated in advance from the regime count, against a 15.4 percent
      base rate. The hypothesised shape is clustering of reversal dates around scheduled
      meetings, and the design resolves lifts at or above that pre-stated threshold.
    planted_effect: >
      Not run as a synthetic plant. The MDE was derived analytically before the run from the
      episode count and base rate, which is the same guarantee by a different route: an effect
      at or above the stated lift would have registered in the observed cells.
    headline: >
      No clustering. The median effect is a 1.13-fold change, four of nine cells go the
      wrong way, and nothing survives correction. The largest cell points the wrong way, so
      this is a real null rather than a shortage of data.
    numbers:
      - {label: median effect across the grid, value: 1.13x, comparison: "against 1.0x for no effect"}
      - {label: cells below no effect, value: "4 of 9", comparison: "pointing the opposite way to the hypothesis"}
      - {label: cells surviving correction, value: "0 of 9", comparison: "and none reached significance before correction either"}
      - {label: largest cell, value: 0.91x, comparison: "122 observations pointing the wrong way, which rules out a power problem"}
    figures: []
  verdict: refuted
  reasoning: >
    The diagnosis matters more than the verdict. Meeting dates are identical for every
    portfolio in the market, so the variable has no ability to distinguish a fragile book
    from a robust one. That observation is what made the follow-up worth running.
  caveats:
    - >
      Only scheduled meetings were tested. Unscheduled interventions are a different and
      much smaller sample.
  produced_claims: [clm-fomc]
  changed_because_of_this: >
    Directly motivated testing a calendar that differs between portfolios, using the same
    machinery so the two results would be comparable.
  reproduce: "uv run python -m unstructured_momentum.validation.hypotheses --fomc-grid"
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now refuted. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-19, note: "Run across the full grid."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-014
  title: Do the book's own holdings bunch their earnings dates before reversals?
  one_breath: >
    Tests whether the companies this portfolio actually holds report earnings in unusual
    clusters just before momentum turns over.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-04
  hypothesis: >
    Earnings density over the book's own holdings carries information that a market-wide
    calendar cannot, because unlike a policy meeting it differs between portfolios.
  prediction: >
    Weeks in the top density quintile will show a materially higher reversal rate than the
    bottom quintile, surviving correction for multiple testing.
  data:
    - source: src-edgar
      slice: earnings release acceptance timestamps, 2004 to 2026
      tier: DESIGN
      vintage: 2026-08-21
      coverage_note: >
        105,237 filings across 2,439 companies. Matched 69 percent of the winning side and
        53 percent of the losing side, because the ticker-to-filer map misses companies
        that have since delisted.
    - source: src-iwv
      slice: monthly membership of both sides of the book
      tier: DESIGN
      vintage: 2026-08-21
  method:
    statistic: reversal-rate lift, top against bottom density quintile
    unit: winner-minus-loser density spread, counted by company rather than weighted by size
    grid: 8 event definitions across horizons and thresholds
    null_model: circular block permutation preserving position within the quarter
    correction: Benjamini-Hochberg across all cells
    power: minimum detectable lift 2.2x against a 15.4% base rate
    controls: [sector composition, equal matched fraction required on each side]
  result:
    power_statement: >
      Minimum detectable lift 2.2x against a 15.4 percent base rate, stated before the run.
      The observed median lift is 1.04, well inside the region the design cannot distinguish
      from chance, and the claim is bounded to effects at or above 2.2x.
    planted_effect: >
      Not run as a synthetic plant; the MDE is analytic, from the episode count and base rate.
      Any bunching effect at or above 2.2x would have shown in the eight cells.
    headline: >
      No effect. Median lift 1.04, three of eight cells below no effect, and nothing
      reaching significance before or after correction.
    numbers:
      - {label: median effect across the grid, value: 1.04x, comparison: "against 1.0x for no effect"}
      - {label: cells below no effect, value: "3 of 8", comparison: "pointing the opposite way to the hypothesis"}
      - {label: cells reaching significance, value: "0 of 8", comparison: "before correction, and therefore none after"}
      - {label: filings processed, value: "105,237", comparison: "across 2,439 companies from 2004 to 2026"}
    figures: []
  verdict: refuted
  reasoning: >
    Paired with the meeting-calendar result this says something neither could alone. That
    earlier null could be explained away by meeting dates being common to all portfolios.
    This calendar is genuinely book-specific and still shows nothing, so scheduled
    catalysts as a family carry no timing information at this sample size.
  caveats:
    - >
      Filing dates record when a company did report, standing in for when it was scheduled
      to. Companies pre-announce, so the fact of reporting is genuinely knowable ahead of
      time, but this proxy flatters the result by roughly the pre-announcement lead.
    - >
      Coverage is incomplete and unevenly so: 69 percent of the winning side against 53
      percent of the losing side, because delisted companies are harder to match and are
      concentrated among past losers. A null under incomplete coverage is weaker than a
      null under full coverage.
  produced_claims: [clm-earnings-density]
  changed_because_of_this: >
    Closed the scheduled-catalyst family and moved the remaining effort to text about the
    individual companies held and to contractual rebalancing.
  reproduce: "uv run python -m unstructured_momentum.validation.hypotheses --earnings-grid"
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now refuted. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-21, note: "Run using the meeting-calendar experiment's machinery unchanged, which is what makes the two results comparable."}
    - {date: 2026-08-21, note: "Recorded retrospectively. The method was fixed in advance by reuse rather than by registration, which is weaker and is worth saying plainly.", admin: true}

