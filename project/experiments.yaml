    - {date: 2026-08-27, note: "NULL-STRENGTHENING AMENDMENT, logged before any A-ONE month was accepted: the frozen recipe (Leiden on the rho-above-0.2 graph, resolution grid to 4) is DEGENERATE -- the equity correlation graph at that threshold is near-complete and every grid resolution returns a single giant community (first computed month: one cluster against twenty-six real themes), and resolutions high enough to fragment it are computationally infeasible across the decade. Per the registered principle that tuning inside the null only ever strengthens the null, A-ONE is amended to average-linkage hierarchical clustering on correlation distance (one minus rho), cut to EXACTLY the real theme count each month, communities of five or more, truncated to the real total membership -- a strictly stronger null with complexity matched by construction. The degenerate months are discarded and recomputed; no text-arm number existed or changed under either recipe."}
