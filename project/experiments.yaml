      tier: VALIDATE
      vintage: 2026-08-16
  method:
    statistic: presence or absence of squeezed names on the list
    unit: security day
    grid: four consecutive trading days
    null_model: not applicable; a single decisive check
    correction: not applicable
    power: the test is decisive by construction, since the treatment names are known
    controls: [full market-wide list, not a sample]
  result:
    power_statement: >
      Decisive by construction rather than by sample size. The two treatment names are known
      in advance and the settlement-failure list is exhaustive for the date, so the design
      detects the hypothesised effect at any magnitude down to a single membership.
    planted_effect: >
      Planting is unnecessary where membership is observable: had either squeezed name
      appeared on the 34-to-35 security list, the check would have returned it. The variable
      is zero on the observations of interest, which is a data fact rather than a modelling
      one.
    headline: >
      The list contained 34 to 35 securities market-wide and neither of the two most
      squeezed names was among them. A variable that is zero on the observation being
      studied cannot explain it.
