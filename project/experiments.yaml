    planted_effect: >
      The positive control is internal and complete: every underlying measurement was checked
      and found correct, so the design demonstrably distinguishes a wrong summary from a wrong
      measurement. That is the discrimination the question needed.
    headline: >
      Both write-ups overstated their headline number, by six times and by two. Every
      underlying measurement was correct. Only the derived summaries were wrong, which is
      the dangerous pattern because the summary is what gets quoted.
    numbers:
      - {label: headline figures overstated, value: "2 of 2", comparison: "by factors of 6 and 2"}
      - {label: interest-rate sensitivity contribution as asserted, value: "+19.1 percentage points", comparison: "against +3.0 on reproduction"}
      - {label: macroeconomic explanatory power as asserted, value: 0.168, comparison: "against 0.324 on reproduction, understating rather than overstating this time"}
      - {label: underlying measurements checked, value: all correct, comparison: "the error is entirely in the aggregation step"}
    figures: []
  verdict: refuted
  reasoning: >
    The failure is specific and therefore actionable: models are good at generating and
    structuring hypotheses and unreliable at arithmetic performed across their own
    intermediate results. Requiring uncomputed claims to be labelled as hypotheses appeared
    to eliminate the problem in the second run, though two runs is a suggestion rather than
    a controlled comparison.
  caveats:
    - >
      Two write-ups is a pattern, not a rate. It does not support a claim about how often
      this happens, only that it happens and is worth guarding against.
  produced_claims: [clm-panel-arithmetic, clm-hypothesis-label, clm-ratebeta-asserted, clm-macro-pc1-asserted]
  changed_because_of_this: >
    Reproduction before publication became the project's prime directive, and the evidence
    record format was given no field for a probability so that models cannot produce the
    numbers deterministic code is responsible for.
  reproduce: null
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now refuted. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-15, note: "First overstatement caught by reproducing before quoting."}
    - {date: 2026-08-16, note: "Second one caught the same way. Two independent instances is a pattern."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-019
  title: Is downside protection more expensive on the crowded short positions?
  one_breath: >
    Compares the price of crash protection across the losing side of the book on one day
    against how heavily each stock is shorted.
  status: complete
  registered_at: 2026-08-21T19:30:00Z
  registered_commit: 98a7f7d
  supersedes_experiment: exp-016
  closes_question: q-07
  hypothesis: >
    Option prices on individual holdings reveal squeeze risk that market-wide measures
    cannot see. Within the losing side of the book, the most heavily shorted stocks should
    carry the most expensive protection against a sharp rise.
  prediction: >
    A positive rank correlation between each stock's option price skew and its short volume
    ratio, surviving control for company size and volatility level. A correlation near
    zero, or one that vanishes under those controls, refutes the hypothesis. The direction
    matters as much as the magnitude, because the competing explanation predicts the same
    sign.
  data:
    - source: src-cboe-chains
      slice: option chains for the losing side of the book, 2026-08-20 session
      tier: SEALED
      vintage: 2026-08-20
      coverage_note: >
        95 losing-side companies, 4 to 25 expiries each. The file was captured at 01:36 on
        the 21st and holds the 20th's closing session, which was not established until the
        audit that preceded computation. How many survive the liquidity gates is reported
        as a headline number rather than a footnote.
    - source: src-finra
      slice: short volume for the same companies, 2026-08-20 session
      tier: SEALED
      vintage: 2026-08-20
      coverage_note: >
        Corrected from the 22nd after the audit. Pairing the chains with the 21st's short
        volume would have joined two different trading days.
  method:
    statistic: >
      Primary and only corrected test: Spearman rank correlation between skew and short
      volume ratio across the losing side, then the same correlation with company size and
      at-the-money volatility held constant.
    unit: company, within the losing side only, on a single date
    grid: >
      One primary test, declared here. Everything else listed under secondary is
      exploratory and reported without correction and labelled as such.
    null_model: >
      No rank association. Assessed by bootstrap resampling clustered on sector rather than
      a block bootstrap, because a single cross-section has no time dimension to block over
      and the residual dependence that remains is sectoral.
    correction: >
      None applied, and none needed, because exactly one test is pre-declared. Secondary
      results carry no correction and no inferential weight.
    power: >
      Roughly 60 to 95 companies after gating, which gives usable precision on a rank
      correlation. This is the one place in the project where the sample is a cross-section
      rather than two dozen episodes, which is precisely why the test is worth running.
    controls: [company size, at-the-money volatility level, sector]
    gates: >
      Fixed before any measure is computed. A quote is discarded if either side of the
      market is zero or the ask is below the bid. Interpolation uses only contracts whose
      absolute delta falls between 0.10 and 0.45, so the 0.25 point is interpolated and
      never extrapolated. Expiries shorter than 21 days or longer than 90 days are
      excluded. A company must supply usable quotes on both the downside and the upside
      wing at the same expiry, or it is dropped entirely rather than measured on one side.
    secondary: >
      Uncorrected and exploratory: the same correlation against momentum loading; the same
      against company size alone as a confounder check; the shape of skew across expiry
      buckets, which is free because 24 expiries are already captured.
  result:
    headline: >
      No association at conventional significance, and the point estimate leans the
      opposite way to the prediction. The sign is the interesting part and one snapshot of
      86 names is not enough to call it a finding.
    numbers:
      - {label: rank correlation, skew against short volume, value: "-0.130", comparison: "against a predicted positive; p = 0.231, so not distinguishable from no association"}
      - {label: same, holding size and volatility constant, value: "-0.129", comparison: "p = 0.238; the controls change nothing, so this is not a size or volatility artefact"}
      - {label: sector-clustered 95% interval, value: "-0.253 to +0.020", comparison: "spans zero, and 95.2% of resamples fall below zero"}
      - {label: companies in the test, value: "86 of 95", comparison: "90.5% of the losing side survived the gates, better attrition than expected"}
      - {label: companies dropped, value: 9, comparison: "8 lacked a bracketed quarter-delta quote on both wings, 1 had no quote surviving the gates at all"}
    figures: []
  verdict: inconclusive
  reasoning: >
    Recorded as inconclusive, not refuted, and the distinction is deliberate. At
    p = 0.231 on a single cross-section this is a direction, not a result, and a
    refuted verdict would import more certainty than 86 names on one day can carry.
    The direction is kept because a weak positive would have been unreadable: the hypothesis and the confound pre-committed against it both predict a
    positive sign, so only a negative estimate is unexplained by either. There is a
    coherent story available — within a leg of beaten-down companies the heavily shorted
    names may be those whose downside is already expensively insured — but it stands as a hypothesis to
    test, not as a mechanism this test established. The registered follow-up
    asks whether the sign persists across snapshots, which is the only thing that converts
    a direction into a finding.
    The controls are worth noting for what they did not do. Holding company size and
    volatility level constant moved the estimate by 0.001, so this is not a size effect
    wearing a skew label. Meanwhile the strongest thing in the cross-section is not the
    registered test at all: upside skew tracks volatility level at 0.35, which is a real
    and unsurprising fact carrying no inferential weight here because it was not
    pre-declared.
  caveats:
    - >
      Expensive upside protection on a hard-to-borrow stock is mechanically linked to the
      cost of borrowing it, through the arbitrage relationship between puts, calls and the
      underlying. A positive result may therefore be pricing the borrow rather than
      anticipating a squeeze. This alternative reading is recorded before the test runs,
      and it predicts the same sign as the hypothesis, so a positive result does not
      distinguish them. Separating the two needs borrow cost data that is not free.
    - >
      Gating will not remove companies at random. It will remove the smaller and less
      liquid end of the losing side, so any result holds for the surviving subset and not
      for the leg as a whole. The surviving names are named in the output.
    - >
      One date. A cross-sectional association on a single snapshot says nothing about
      whether the measure moves usefully through time, which is the question that needs
      years of history and is the reason the daily capture exists.
  caveats:
    - >
      One date, and a single cross-section says nothing about whether the measure moves
      usefully through time. That question needs years of history and is the entire reason
      the daily capture exists.
    - >
      The nine dropped companies are named in the output, not counted. They are the
      thinner end of the losing side, so the result holds for the 86 companies with usable
      quarter-delta quotes on both wings and not for the leg as a whole.
    - >
      Two of the 86 chains hold the session before the rest. Excluding them moves the
      estimate from -0.130 to -0.128, so they are not driving anything.
  produced_claims: [clm-skew-squeeze]
  changed_because_of_this: >
    Closes the last non-return-derived family that could be tested without buying history.
    The forward capture continues, because the question this refutes is cross-sectional
    and the question the capture exists to answer is a time-series one.
  reproduce: "uv run python -m unstructured_momentum.features.skew --cross-section"
  peek_note: >
    Registered believing the short-volume half of the pair would not publish until the next
    morning. It already existed: the chain snapshot holds the previous session, not the
    session it is filed under, so both datasets were on disk when the design was written.
    The design itself is unchanged and nothing was computed before it was committed, but
    the clean registration I claimed was not clean, and the check is right to say so.
  history:
    - {date: 2026-08-22, note: "Moved to running. The audit that preceded computation is what found the session-date mismatch."}
    - {date: 2026-08-22, note: "Complete. Interpolation hand-checked against raw contracts on one name, and the headline re-derived through an independent code path to the same value before it was recorded."}
    - {date: 2026-08-21, note: "Design committed as 98a7f7d, then the hash written back here.", admin: true}
    - {date: 2026-08-21, note: "Registered with the liquidity gates fixed in advance, replacing a thinner entry whose method was still open."}
    - {date: 2026-08-21, note: "Data slice corrected to the 20 August session after the audit. This turns a clean registration into a flagged one, which is the honest outcome and the first time the check has caught me."}

- id: exp-020
  title: Does the news about a book's own holdings collapse onto one story before it breaks?
  one_breath: >
    Tests whether coverage of the individual companies held converges on a single theme in
    the weeks before a crowded momentum reversal.
  status: complete
  registered_at: 2026-08-22T10:15:00Z
  registered_commit: 9301f28
  closes_question: q-03
  hypothesis: >
    The most useful thing this project found is that in September 2019 the book was one bet
    on falling interest rates wearing ten sector labels, and every portfolio-level average
    called it diversified while the individual holdings did not. If that is a general
    property of fragile momentum books rather than one episode's accident, it should be
    visible in what is written about the holdings: coverage of a crowded winning side
    should collapse onto a narrow set of themes, because the companies are being bought for
    the same reason. The measure is concentration in what is said. It is not computed from past returns,
    which is the property all six failed candidates shared.
  prediction: >
    In the four weeks before a crowded rotation, theme concentration across the winning
    side rises relative to matched calm windows, and the distance between the winning and
    losing sides' theme distributions falls, because a single macro story is driving both.
    Concentration in the four episodes exceeds the matched-window distribution in at least
    three of four. If concentration is flat or falls, the aggregation finding is an artefact
    of one episode and the write-up must say so.
  data:
    - source: src-gdelt
      slice: >
        Raw fifteen-minute global knowledge files, four windows of 25 days ending at each
        crowded rotation, plus matched calm windows drawn from the same calendar quarter in
        other years
      tier: DESIGN and VALIDATE
      vintage: 2026-08-24
      coverage_note: >
        Not yet downloaded. Measured at 8.3 megabytes per slot and 96 slots a day, so about
        20 gigabytes per 25-day window. Covers the September 2019, November 2020, March 2021
        and November 2022 rotations. The 1999 and 2001 rotations are outside this archive
        and stay untested, which caps the design at four of six.
    - source: src-iwv
      slice: holdings on each formation date, both sides of the book
      tier: DESIGN
      vintage: 2026-08-19
  method:
    statistic: >
      Effective rank of the theme-occurrence matrix over the winning side, which is the
      exponential of the entropy of its normalised eigenvalues. Low effective rank means
      the coverage of many companies is saying few things. Reported alongside the distance
      between the two sides' theme distributions.
    unit: episode window against matched calm windows, per formation date
    grid: >
      Two horizons, 10 and 25 days, crossed with two aggregations, by company count and by
      index weight. Four cells, declared here and corrected together.
    null_model: >
      Matched calm windows from the same calendar quarter in years without a rotation, so
      seasonality in news volume cannot manufacture the effect, plus a timestamp shuffle
      within each window that destroys real timing while preserving article mix.
    correction: Benjamini-Hochberg across the four cells and the four episodes together
    power: >
      Four episodes against roughly forty matched windows. This cannot establish a
      predictive edge and is not intended to; the registered question is whether the
      concentration is visibly different, which is the characterisation gate this project
      adopted once trailing volatility had won the forecasting contest.
    controls: [article volume, source mix, sector composition of the leg, calendar quarter]
    gates: >
      Only articles whose organisation field matches a holding are counted, on exact name
      after normalisation and never fuzzily, and a company contributes nothing
      unless it appears in the index holdings for that formation date. Companies matching more than one
      organisation string are dropped, never merged.
    secondary: >
      Uncorrected and exploratory: novelty, meaning the distance between a window's theme
      distribution and the trailing sixty-day centroid; dispersion of article tone within
      the winning side; and concentration of coverage across holdings, which asks whether a
      few names absorb all the attention.
  result:
    headline: >
      No separation, at a scale that could not have produced one. Coverage of the winning
      side was no more concentrated before the reversal than in matched calm windows, and
      both directional measures lean opposite to the prediction. A confound found during
      computation limits what the statistic can mean at all.
    numbers:
      - {label: effective rank, episode window, value: 52.10, comparison: "against a calm mean of 48.59; 0.73 standard deviations, and higher where lower was predicted"}
      - {label: leg distance, episode window, value: 0.402, comparison: "against a calm mean of 0.359; the two sides sat further apart, where closer was predicted"}
      - {label: matched calm windows, value: 3, comparison: "against roughly 40 specified at registration, putting the smallest attainable p-value at 0.25"}
      - {label: correlation of the statistic with the number of covered companies, value: "+0.983", comparison: "across the four windows; the raw measure is very largely a count of how many holdings got any coverage"}
      - {label: articles matched, value: "1,145,771", comparison: "across four windows, from about 76 gigabytes streamed and discarded"}
      - {label: share of winning-side articles from one publisher holding, value: "75.3%", comparison: "46,024 of 61,095; the top three companies take 91% and the statistic was computed over that"}
    figures: [fig-narrative]
  verdict: underpowered
  reasoning: >
    Underpowered, not inconclusive, and the distinction is the reason the vocabulary
    separates them. The registration specified roughly forty matched windows and the run
    used three, which puts the smallest attainable rank-based p-value at 0.25. Significance
    was unreachable however the data fell, so no verdict about the hypothesis can be drawn
    from this and none is drawn.
    A second problem surfaced during computation and matters more than the numbers.
    Effective rank correlates +0.983 with the number of companies receiving any coverage,
    across only four windows. The raw statistic is substantially a count of covered
    holdings, which is close to the attention-volume measure the design set out to avoid.
    Normalising by the covered count removes that, but the normalised figure has almost no
    spread across the three calm windows, so its apparent 19.8 standard deviations is a
    degenerate variance estimate from three nearly identical numbers and is not reported as
    evidence. This project has already recorded one instance of a lucky cell in a small
    grid being mistaken for a result; this is the same shape and is declined for the same
    reason.
    Inspecting the corpus after the statistic was computed found the larger problem. Three
    quarters of the winning-side articles are attributed to a single newspaper publisher
    that is itself a holding, because its name appears in the organisation field of every
    article that cites it. The top three companies take 91 percent. The themes most
    over-represented on the winning side are prisons, trafficking and suicide, which is
    what one outlet's general news looks like and not what coverage of a momentum book
    looks like. The measurement is void, and the number above should not be used.
    The omission that caused it is worth naming. This project measured a model filtering
    text at sixteen times the precision of keyword matching, then built the one test that
    needed aboutness on name matching alone. The capability was available and unused.
    What the run does establish is instrumentation: a book-aware pipeline that streams the
    archive, attributes articles to holdings under a refusal rule for ambiguous names, and
    computes the measure. The design fault found on first computation is repaired, so the
    flat reading is now a clean measurement of the registered quantity at a scale that
    cannot resolve it.
  caveats:
    - >
      Themes are a coarse representation and the archive assigns them with its own
      classifier, so this measures concentration in a vocabulary somebody else chose. That
      is a real limitation and also the reason the first pass uses themes rather than
      embeddings: the vocabulary is fixed, published, and was not trained on the outcome.
    - >
      Four of six crowded rotations. The two strongest cases by some measures, 1999 and
      2001, are outside every free archive with article-level text and stay untested. The
      claim will be scoped to what was tested, which is the correction that had to be
      applied to the earlier news result.
    - >
      The pilot is underpowered by the registration's own standard, which specified roughly
      forty matched windows and got three. With three calm windows the smallest attainable
      rank-based probability is 0.25, so the comparison cannot reach significance however
      the data falls. That is a property of the design as run, not of the result.
    - >
      The first harvest filtered every window through the 2019 book's own holdings, which
      answers a different question from the registered one. Holding the companies fixed and
      varying only the calendar asks whether these particular companies' stories converged;
      the registered case-control asks whether a momentum book's coverage converges before
      a reversal, which needs each year's own book. The fixed-basket run is a usable control
      and is reported as one, It is not the registered test and cannot stand in for it.
    - >
      A mention is not aboutness. Attribution by organisation name cannot tell an article
      about a company from an article that cites it, and for media holdings the difference
      swamps everything else.
    - >
      Coverage of the archive is not complete. The 2017 calm window is missing 45 of 2,400
      fifteen-minute slots, or 1.9 percent. A silently short window reads as quiet news
      and not as absent data, so the miss count is carried with every measure.
    - >
      Matching an organisation string to a holding is a fuzzy join wearing an exact-match
      costume. A name that matches two companies, or a company that appears under three
      spellings, will quietly distort a concentration measure, and the failure presents
      as a result instead of an error.
  produced_claims: [clm-narrative-flat]
  changed_because_of_this: >
    Establishes the instrumentation, the scale required, and an attribution rule that has to
    change before any corpus statistic here means anything: cap per-entity share, exclude
    publisher names, and filter for aboutness with the model already measured for it. A powered version needs roughly
    forty matched windows and a statistic that does not track the number of covered
    companies, and the held-out episodes stay closed either way.
  reproduce: "uv run python -m unstructured_momentum.features.narrative --case-control"
  peek_note: >
    Flagged because the holdings half of the pair is already on disk and has been used for
    other tests. The text half does not exist yet and no theme measure has ever been
    computed on this project, which is where the whole result lives. Recorded rather than
    argued away: the check compares dates and cannot know which half carries the finding.
  history:
    - {date: 2026-08-22, note: "Re-harvest complete with each window filtered through its own year's book, repairing the design fault. 1,145,771 matched articles across four windows."}
    - {date: 2026-08-22, note: "Registered quantity computed. Effective rank 52.10 in the episode window against a calm mean of 48.59, higher where lower was predicted. Leg distance 0.402 against 0.359, also opposite to the prediction."}
    - {date: 2026-08-22, note: "Confound found during computation: the statistic correlates +0.983 with the number of covered companies. The count-normalised version has near-zero spread across three calm windows, so its large apparent z-score is a degenerate variance estimate and is refused rather than reported."}
    - {date: 2026-08-22, note: "Fixed-basket control complete on four windows. Effective rank over the winning side 52.10 in the episode window against a calm mean of 52.02, which is 0.06 standard deviations and nothing. Leg distance 0.402 against 0.374, elevated but in the direction opposite to the prediction."}
    - {date: 2026-08-22, note: "Daily resolution, exploratory and uncorrected: median effective rank 39.4 on episode days against 36.5, 38.9 and 41.7 in the three calm windows, Mann-Whitney p = 0.880. No separation at any resolution tried."}
    - {date: 2026-08-22, note: "Power recorded honestly: the registration specified roughly forty matched windows and the pilot ran three, so the smallest attainable probability is 0.25 and significance was unreachable by construction. This is underpowered rather than inconclusive, and the two are kept distinct on purpose."}
    - {date: 2026-08-22, note: "First three windows harvested: 82k matched rows for the 2019 episode window, 115k and 88k for the 2016 and 2017 calm windows. Zero and 45 slots missing respectively."}
    - {date: 2026-08-22, note: "Design fault found on first computation, not by the harness. Every window was filtered through the 2019 book, so the run measures whether one fixed set of companies converged, not whether a momentum book converges. The registered comparison needs each calm year's own book and a re-harvest against a union of all four books. Reported as a control, not relabelled as the test."}
    - {date: 2026-08-22, note: "Moved to running. Tier labels corrected first: the registration marked all four windows open, and three of them are held-out. Running all four at once would have spent the one look this project gets, on instrumentation that had never been executed."}
    - {date: 2026-08-22, note: "Design committed as 9301f28, then the hash written back here.", admin: true}
    - {date: 2026-08-22, note: "Registered before any archive file was downloaded, and before the earlier single-episode news result was extended."}

- id: exp-021
  title: Does the odd sign in short-leg option skew survive more than one day?
  one_breath: >
    Accumulates daily snapshots to find out whether the negative association seen once is
    real or is a single day's noise.
  status: registered
  registered_at: 2026-08-22T10:15:00Z
  registered_commit: 9301f28
  closes_question: q-02
  hypothesis: >
    The single cross-section showing protection against a sharp rise being slightly cheaper
    on the more heavily shorted names reflects a persistent feature of how the option market
    prices a beaten-down leg, rather than one day's noise.
  prediction: >
    Across sixty trading sessions the daily rank correlation has a median below zero and is
    negative in at least forty of them. A median near zero, or a sign that flips week to
    week, says the first reading was noise and the question is closed. Declared now because
    the data does not exist yet and cannot influence the threshold.
  data:
    - source: src-cboe-chains
      slice: daily option chains for both sides of the book, sixty consecutive sessions
      tier: SEALED
      vintage: 2026-11-20
      coverage_note: >
        One session exists at registration. The remaining fifty-nine will be captured after
        the close each trading day, which is roughly three months away.
    - source: src-finra
      slice: short volume for the same companies on the same sessions
      tier: SEALED
      vintage: 2026-11-20
  method:
    statistic: median of the daily rank correlation, and the count of sessions with a negative sign
    unit: trading session
    grid: one test, declared here
    null_model: >
      The daily sign is a fair coin. Assessed against the binomial, and separately with a
      weekly block bootstrap because consecutive sessions share most of their holdings and
      cannot be treated as independent.
    correction: none needed; one test is pre-declared
    power: >
      Sixty sessions detects a persistent sign at conventional significance under the
      binomial. It cannot detect a small time-varying effect and is not asked to.
    controls: [company size, at-the-money volatility level, sector, leg membership changes between rebalances]
    gates: The liquidity gates registered for the single-snapshot test, unchanged.
  result:
    headline: null
    numbers: []
    figures: []
  verdict: not_yet
  reasoning: null
  caveats:
    - >
      Sixty sessions of one book in one market regime. A sign that persists through a calm
      autumn says nothing about what happens in a reversal, which is the event of interest
      and which may not occur in the window at all.
    - >
      Leg membership changes as the momentum sort is refreshed, so the panel is not a fixed
      set of companies. Turnover is a control rather than a nuisance to be ignored.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.features.skew --accumulate"
  history:
    - {date: 2026-08-22, note: "Design committed as 9301f28, then the hash written back here.", admin: true}
    - {date: 2026-08-22, note: "Registered the day after the single-snapshot result, with the threshold fixed before fifty-nine of the sixty sessions exist."}

- id: exp-022
  title: Can a model tell an article about a company from one that merely names it?
  one_breath: >
    Scores four ways of deciding whether a news article is really about a holding, against
    ninety hand labels.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-03
  hypothesis: >
    Attribution by organisation name cannot distinguish an article about a company from one
    that mentions it. Deterministic filters recover some precision, and a model reading the
    headline recovers more, at a cost worth paying only if it beats the best rule.
  prediction: >
    Each rung improves precision over the one below it. If the model does not beat the best
    deterministic rule it is not used, because a rule is cheaper, reproducible and does not
    drift.
  data:
    - source: src-gdelt
      slice: 90 articles from the September 2019 window, stratified across the ladder rungs
      tier: DESIGN
      vintage: 2026-08-22
      coverage_note: >
        Thirty drawn from each stratum: passing the headline rule, passing the theme rule
        only, and passing neither. Labels were assigned blind, before the rung membership
        of any row was visible.
  method:
    statistic: precision, recall and F1 against hand labels
    unit: article
    grid: four attribution rules
    null_model: not applicable; this is a measurement of instrumentation
    correction: not applicable
    power: 90 labelled articles, 28 of them positive
    controls: [labels assigned blind to rung membership, model sees only the headline the rule sees]
  result:
    headline: >
      The model wins decisively and for a structural reason. Name matching is 31 percent
      precise, the best deterministic rule reaches 80 percent, and the model reading the
      same headline reaches 97 percent at full recall.
    numbers:
      - {label: name match only, value: "31.1%", comparison: "precision, at 100% recall; two in three matched articles are not about the company"}
      - {label: plus a business theme, value: "45.0%", comparison: "precision at 96.4% recall"}
      - {label: plus the company named in the headline, value: "80.0%", comparison: "precision at 85.7% recall, F1 82.8%"}
      - {label: model reading the headline, value: "96.6%", comparison: "precision at 100% recall, F1 98.2%, against 82.8% for the best rule"}
      - {label: articles hand-labelled, value: 90, comparison: "28 positive, stratified across rungs, labelled blind"}
    figures: [fig-aboutness]
  verdict: supported
  reasoning: >
    The margin is large and the reason is not merely that the model is a better classifier.
    Two of its wins require knowledge no string rule can hold: that KFC is a Yum Brands
    business, and that a headline naming two retailers is about the one whose results are
    being reported. The rule fails on brand-to-parent mapping and on comparative headlines
    by construction, not by tuning.
    This is the second measured case in the project where a model beats keyword matching on
    a text task, and it is the more useful one. The first was measured on a corpus that
    turned out to be empty, so the capability was demonstrated without doing any work. Here
    it repairs a corpus that a rule cannot.
  caveats:
    - >
      I wrote the labels and I wrote the prompt. A 97 percent agreement rate partly measures
      how well the model reproduces my definition of aboutness, not how well it tracks a
      definition anyone else would choose. A second labeller would settle this and there is
      not one.
    - >
      Ninety articles from a single window. The precision estimate has a standard error of
      roughly three points and the ordering of the rungs is what carries weight, not the
      exact figures.
    - >
      The model reads a headline recovered from a URL slug, not the article. Both the rule
      and the model see the same information, which makes the comparison fair, but neither
      sees what the article actually says.
  produced_claims: [clm-aboutness-ladder]
  changed_because_of_this: >
    Attribution moves from name matching to a two-stage filter: a cheap theme rule to remove
    four fifths of the corpus, then the model on what survives. Any corpus statistic
    computed before this is void.
  reproduce: "uv run python -m unstructured_momentum.features.narrative --score-attribution"
  history:
    - {date: 2026-08-22, note: "Run after the corpus contamination was found. Recorded retrospectively: this is a measurement of instrumentation and was not registered in advance.", admin: true}

- id: exp-023
  title: On a corpus that is actually about the holdings, what is the book's news about?
  one_breath: >
    Rebuilds the news corpus with model-filtered attribution, then asks what the coverage of
    a momentum book actually says.
  status: complete
  registered_at: 2026-08-22T14:05:00Z
  registered_commit: a593a8b
  supersedes_experiment: exp-020
  closes_question: q-03
  hypothesis: >
    Two questions, in order of what the data can support. The descriptive one: coverage of
    the September 2019 winning side, once it is genuinely about those companies, is
    dominated by interest-rate and bond-proxy themes, matching the finding that the book was
    one rate bet wearing ten sector labels. The comparative one: theme concentration over
    the winning side is higher before the reversal than in matched calm windows.
  prediction: >
    Descriptive: rate, bond and monetary themes are a larger share of winning-side coverage
    in the 2019 window than of losing-side coverage in the same window, and larger than of
    winning-side coverage in the calm windows. Comparative: effective rank is lower before
    the reversal. The comparative question cannot reach significance at three calm windows
    and no significance is claimed for it; it is reported as an effect size with its
    direction.
  data:
    - source: src-gdelt
      slice: >
        The four harvested windows, re-attributed. Deterministic filter first, then a model
        adjudicating each survivor on its headline.
      tier: DESIGN and VALIDATE
      vintage: 2026-08-22
      coverage_note: >
        Approximately 20,000 articles reach the model across four windows. Only the
        September 2019 window is open tier; the three calm windows are matched controls
        from years without a rotation and are not the held-out episode windows, which stay
        sealed.
  method:
    statistic: >
      Descriptive: share of winning-side theme mentions falling in a rate and monetary
      family fixed before the run, against the losing side in the same window and against
      the winning side in each calm window. Comparative: effective rank of the
      holdings-by-themes matrix over the winning side.
    unit: window
    grid: >
      Two aggregations, by article count and by index weight, crossed with the two
      questions. Four cells, declared here.
    null_model: >
      For the descriptive question, the losing side of the same window and the winning
      sides of three calm windows. For the comparative question, the three calm windows.
    correction: Benjamini-Hochberg across the four cells
    power: >
      Three matched windows put the smallest attainable rank-based probability at 0.25, so
      the comparative question cannot reach significance and is reported as an effect size
      with direction. The descriptive question is a composition measure on thousands of
      articles and does not depend on the window count.
    controls: [coverage density per name, sector composition, article volume, source mix]
    gates: >
      Attribution requires a business or economic theme, then a model judging from the
      headline that the article is substantively about that holding. Both stages fixed
      before the run. Articles from a holding that is itself the publisher being cited are
      the failure this replaces and must not survive.
    density_control: >
      Pre-committed because the windows differ threefold in coverage intensity, at 19.2
      articles per name in 2019 against 55.5 in 2016, and the previous statistic correlated
      +0.983 with the number of covered names. Effective rank is reported twice: on the
      full filtered corpus, and on a subsample matched to the lowest per-name density across
      windows. The correlation between the statistic and the covered-name count is
      recomputed and reported as a diagnostic whatever it shows. If the two versions
      disagree, the matched one governs and the disagreement is the finding.
  result:
    power_statement: >
      Stated in its own registration: three matched windows put the smallest attainable rank-
      based probability at 0.25, so the comparative question cannot reach significance at any
      effect size. That is a design limit rather than a sample limit, and it sits alongside
      the same retrieval ceiling as the other news work.
    planted_effect: >
      No plant was run. The comparative half could not have registered an effect of any size,
      so no plant would change the verdict. The descriptive half, a composition measure over
      thousands of articles, stands separately and is not affected.
    headline: >
      Both predictions fail. News about the 2019 winning side contains almost no
      interest-rate content, less than the losing side in the same window, even though the
      book was a concentrated rate bet on that date. And once coverage volume is held
      constant, theme concentration is identical across every window.
    numbers:
      - {label: rate themes, 2019 winning side, value: "0.32%", comparison: "of theme mentions, against 0.60% on the losing side of the same window"}
      - {label: rate themes, calm 2016 winning side, value: "0.88%", comparison: "higher than the episode window, so the direction is wrong twice over"}
      - {label: effective rank before matching, value: 50.15, comparison: "against a calm mean of 47.56, higher where lower was predicted"}
      - {label: correlation of effective rank with covered-name count, value: "+0.997", comparison: "worse than the +0.983 before filtering; the statistic is a coverage count"}
      - {label: effective rank after density matching, value: 44.68, comparison: "against a calm mean of 44.74, a difference of -0.06 on a base of 44.7"}
      - {label: articles surviving attribution, value: "14,897", comparison: "of 19,998 reaching the model, from 1,145,771 raw name matches"}
    figures: [fig-rate-themes]
  verdict: instrument_limited
  reasoning: >
    The descriptive half is the one with power and it fails cleanly. This is a composition
    measure over thousands of articles, not a comparison across four windows, so the sample
    supports a verdict. On 2019-09-06 the holdings said the book was a concentrated bet on
    falling rates, established from cross-sectional rate betas. The news written about
    those same companies over the preceding 25 days is 0.32 percent rate-themed, below the
    losing side and below a calm window from 2016. Coverage of a company does not encode
    the factor exposure that company contributes. Journalists write about products,
    earnings and executives; rate sensitivity is a property of the return series and
    nobody writes it down.
    The comparative half is settled by the pre-committed control rather than by power. The
    unmatched figures showed the episode window higher than calm, which read as a weak
    wrong-signed effect. Matching coverage volume across windows collapses the difference to
    -0.06 and every window lands within half a point of 44.7. The unmatched spread was a
    coverage-count artefact, which the diagnostic makes explicit: effective rank correlates
    +0.997 with the number of covered companies, higher after filtering than before.
    The control was fixed in advance for exactly this reason, and it changed the reading
    from a weak inverted signal to no signal at all.
  caveats:
    - >
      The model sees a headline recovered from a URL slug, never the article. Precision was
      measured at 96.6 percent on 90 hand labels, but I wrote both the labels and the
      prompt, so the filter inherits my definition of what an article is about.
    - >
      Filtering removes roughly 97 percent of the raw matches. A corpus of about 19 articles
      per company over 25 days is thin, and a theme matrix built on it may be too sparse for
      effective rank to be stable. Sparsity is a competing explanation for any change in the
      measure and the density control exists to test it.
    - >
      The descriptive question is the one the data can carry. A composition result is not
      evidence that the composition predicts anything, and the comparative half remains
      underpowered by construction.
  produced_claims: [clm-text-no-exposure, clm-effrank-artefact]
  changed_because_of_this: >
    Closes the constituent-text route as a way of seeing factor exposure. What a company's
    news says and what that company contributes to a factor bet are different objects, and
    no amount of corpus repair bridges them. The corpus and the attribution filter remain
    as assets for any question that is genuinely about company news.
  reproduce: "uv run python -m unstructured_momentum.features.narrative --rebuild-corpus"
  peek_note: >
    Flagged, and correctly. All four windows were harvested before this design was written,
    and one prior statistic has already been computed on them and withdrawn. What is new is
    the attribution rule and the density control, neither of which has been run.
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now instrument_limited. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-22, note: "Attribution filter run over four windows: 19,998 articles reached the model, 14,897 kept. Retention ranged from 60.3 percent in the 2016 window to 89.6 percent in the episode window."}
    - {date: 2026-08-22, note: "Descriptive prediction refuted. Rate themes are 0.32 percent of winning-side coverage against 0.60 percent on the losing side and 0.88 percent in calm 2016."}
    - {date: 2026-08-22, note: "Density control applied as registered. Matching 58 names by 15 articles across all windows collapses the effective-rank difference to -0.06. The unmatched spread was a coverage artefact and the pre-committed control is what caught it."}
    - {date: 2026-08-22, note: "Design committed as a593a8b, then the hash written back here.", admin: true}
    - {date: 2026-08-22, note: "Registered before the model filter was applied to any window, with the density control fixed in advance because the coverage asymmetry was visible in the raw counts."}

- id: exp-024
  title: Do the text nulls survive a change of specification, and could they detect anything?
  one_breath: >
    Audits the text results by calibrating what the measure can see, running every
    defensible specification, and checking the error model.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-03
  hypothesis: >
    The text nulls were each declared from a single specification. Either they are robust
    across the reasonable alternatives and the measure has the sensitivity to have found
    something, or they are artefacts of one arbitrary choice and were reported with more
    confidence than they support.
  prediction: >
    A calibration curve will show the smallest concentration shift the measure can detect.
    A specification curve will show whether the pre-registered choice sits in the middle of
    the distribution or at its edge. If most specifications straddle zero, the null holds
    with a stated floor; if they scatter widely, no conclusion was ever available.
  data:
    - source: src-gdelt
      slice: the four model-filtered corpora, 14,897 articles
      tier: DESIGN
      vintage: 2026-08-22
  method:
    statistic: >
      Three audits. A positive control injecting a known concentration at increasing
      strength to find the detection floor. A specification curve over four statistics,
      three representations, two aggregations, both legs and with density matching on and
      off. A clustering check on the independence assumption in the theme comparison.
    unit: specification
    grid: 96 specifications, plus a 7-point calibration curve
    null_model: not applicable; this measures the instrument rather than the world
    correction: Benjamini-Hochberg was applied in the theme test being audited
    power: the calibration curve is the power analysis
    controls: [density matching, leg, representation, aggregation]
  result:
    headline: >
      The measure is not blind, so the null is real but bounded. Across 96 specifications
      nothing robust appears in the predicted direction. The theme-level test that appeared
      to find hundreds of discriminating themes is invalid: articles are syndicated copies
      of single stories and were counted as independent.
    numbers:
      - {label: detection floor of the concentration measure, value: "10%", comparison: "of articles collapsing onto one story moves effective rank by 1.19, against 0.63 of between-window noise"}
      - {label: specifications run, value: 96, comparison: "four statistics x three representations x two aggregations x two legs x matching on and off"}
      - {label: specifications pointing the predicted way, value: "37 of 96", comparison: "39 percent, indistinguishable from a coin flip"}
      - {label: themes surviving multiplicity correction in the audited test, value: "286 of 421", comparison: "68 percent, which is impossible and marks the error model as wrong rather than the finding as large"}
      - {label: articles behind the strongest apparent theme, value: "50", comparison: "all 50 from one company, one press release syndicated across outlets"}
      - {label: effective sample after clustering by company and day, value: 484, comparison: "against 1,030 articles treated as independent, and that is still an upper bound"}
    figures: [fig-calibration, fig-speccurve]
  verdict: inconclusive
  reasoning: >
    Recorded as mixed because the audit rescues one conclusion and destroys another.
    The concentration null survives and improves. The positive control shows that a
    concentration shift touching 10 percent of coverage would have moved the measure by
    roughly twice the between-window noise, so the absence of an effect is informative up
    to that floor and silent below it. That is a bounded null and it is what should have
    been reported originally instead of a flat statement that nothing was there.
    The theme-composition result does not survive. The comparison treated each article as an
    independent draw when articles are syndicated copies of a small number of stories: the
    strongest apparent theme is 50 articles from a single press release. Clustering by
    company and day at most halves the sample and the true figure is far smaller. That
    inflation is what produced 286 of 421 themes clearing correction, a proportion that
    should have been read as a broken error model rather than a rich finding.
    One thing worth carrying forward rather than dismissing. Mean pairwise similarity
    between companies' theme vectors is negative in all 24 of its specifications, meaning
    coverage of the winning side was less alike before the reversal, not more. It is
    consistent in direction where everything else scatters, and it is the opposite of the
    crowding hypothesis. Not a finding at three calm windows, but the only thing in the
    text work that behaves like a signal.
  caveats:
    - >
      The z-scores in the specification curve use a standard deviation estimated from three
      calm windows, so they order the specifications and do not support inference. The
      count of specifications pointing each way is the usable summary.
    - >
      The 96 specifications are highly correlated, so the count clearing any threshold
      cannot be compared against a nominal error rate.
    - >
      The calibration injects an artificial concentration by overwriting theme sets. A real
      narrative convergence would be messier and the true detection floor is likely worse
      than 10 percent.
  produced_claims: [clm-bounded-null, clm-syndication]
  changed_because_of_this: >
    Every text conclusion in this project is restated with a detection floor or withdrawn.
    Any future corpus statistic clusters at the story level, and a single specification is
    no longer sufficient to declare a null.
  reproduce: "uv run python -m unstructured_momentum.features.narrative --audit"
  history:
    - {date: 2026-08-22, note: "Run after the single-specification nulls were challenged. Recorded retrospectively: this is an audit of instrumentation, not a registered hypothesis test.", admin: true}

- id: exp-025
  title: Could the severity framework have detected a better predictor if one existed?
  one_breath: >
    Calibrates the horse race by feeding it a signal known to be predictive, and reruns the
    comparison across 54 specifications.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-09
  hypothesis: >
    The finding that six candidates all lose to trailing volatility was declared from one
    functional form only at one horizon and one quantile, with no evidence the framework could
    detect a better predictor if handed one. Either the null is robust and the instrument
    is sensitive, or the comparison could never have resolved the question.
  prediction: >
    A signal blended with noise at rising strength will be detected at some threshold,
    giving the sensitivity floor. A specification curve will show whether the volatility
    result and the no-alternative-wins result each hold across reasonable choices.
  data:
    - source: src-french
      slice: daily momentum and market returns, 1990 to 2022
      tier: DESIGN
      vintage: 2026-08-22
  method:
    statistic: >
      Pinball loss differences with Newey-West standard errors at lag five throughout. The
      control blends a forward realised-scale signal with noise at rising shares and
      measures when the framework prefers it to trailing volatility alone.
    unit: specification
    grid: 7 control points, plus 54 specifications over 3 horizons x 2 quantiles x 3 transforms x 3 training lengths
    null_model: trailing volatility, which is the incumbent rather than a straw man
    correction: not applicable; the specification count is reported rather than corrected
    power: the control curve is the power analysis and is the point of the experiment
    controls: [overlap-corrected inference on every comparison]
  result:
    headline: >
      One claim strengthens and one collapses. Trailing volatility beating no information
      holds in all 54 specifications. The claim that nothing beats trailing volatility is
      uninformative: the framework cannot detect a genuinely predictive signal until it is
      almost noiseless, so the six failures measured the instrument as much as the world.
    numbers:
      - {label: specifications where volatility beats no information, value: "54 of 54", comparison: "skill from +14.1% to +26.3%, so the result is not a specification artefact"}
      - {label: overlap-corrected t-statistics across the curve, value: "1.84 to 2.69", comparison: "51 of 54 clear 1.96; solid, and well below the 3.29 implied by naive standard errors"}
      - {label: specifications where any alternative beats volatility, value: "1 of 54", comparison: "and that one is the shortest horizon with the shortest training window"}
      - {label: signal share required before the framework prefers a known predictor, value: "between 40% and 100%", comparison: "at 40% signal the gain is still negative; only a nearly noiseless predictor is detected"}
      - {label: median effective sample, value: "188 of 318 refits", comparison: "after correcting for overlapping ten-day evaluation windows"}
    figures: [fig-spine-control, fig-spine-curve]
  verdict: inconclusive
  reasoning: >
    The positive control is the result. A feature blended at 40 percent with noise, whose
    remaining 40 percent is a genuinely forward-looking scale measure, still does not
    improve the forecast. Only a pure signal does. Any realistic candidate has a signal
    share far below that, so the six failures reported earlier cannot distinguish a useless
    feature from a useful one, and the comparison could not have
    resolved the question at realistic effect sizes.
    The reason is mechanical, not a coding fault. Adding a regressor to a quantile regression
    at the fifth percentile costs estimation variance, and the number of observations
    genuinely in the tail is a small fraction of the training window. The penalty for an
    extra parameter is large relative to the information a noisy feature carries. A larger
    sample would move this; nothing about the coding would.
    What survives is narrower and firmer. Trailing volatility beats knowing nothing in
    every specification tried, with overlap-corrected t-statistics between 1.84 and 2.69.
    That is the claim the system should rest on, and it is weaker than the naive 3.29
    suggested.
  caveats:
    - >
      The control uses a forward-looking scale measure as its oracle, which is the cleanest
      available construction and also the most favourable. A real predictor with structure
      the linear form cannot capture would be detected even later.
    - >
      The specification curve varies horizon, quantile, volatility transform and training
      length. It does not vary the model family. A different estimator might be more
      sensitive, which is the natural next test and not a defect of this one.
    - >
      Fifty-four specifications are highly correlated, so the count clearing any threshold
      is descriptive rather than an error rate.
  produced_claims: [clm-framework-insensitive]
  changed_because_of_this: >
    The claim that nothing beats trailing volatility is withdrawn as stated and replaced by
    a bounded one. The remaining route to a genuine comparison is a more sensitive
    estimator or a larger effective sample, not more candidate features.
  reproduce: "uv run python -m unstructured_momentum.model.severity --audit"
  history:
    - {date: 2026-08-22, note: "Run after the same audit invalidated a text null. Recorded retrospectively: an audit of instrumentation, not a registered hypothesis test.", admin: true}

- id: exp-026
  title: Can a model name the shared bet inside a book, when a theme vector cannot?
  one_breath: >
    Shows a model the news about each holding, blind to the date, and asks whether the
    companies are one bet and what it is.
  status: complete
  registered_at: 2026-08-22T17:20:00Z
  registered_commit: db661c1
  closes_question: q-03
  hypothesis: >
    The theme-concentration measures failed because they operate on co-occurrence counts in
    a fixed vocabulary, which cannot represent that a utility, a property trust and a
    consumer staple are the same bet on falling rates. Semantic aggregation can. Given the
    news about each holding and no other information, a model should identify the shared
    economic driver of the September 2019 winning side as interest-rate sensitivity, and
    should find no comparable thread in matched calm windows.
  prediction: >
    Concentration scores are materially higher for the episode window than for the three
    calm windows across repeated subsamples, and the named driver for the episode window
    refers to interest rates, bond proxies or defensives without being prompted with those
    words. If the model names a confident thread in every window including the calm ones,
    the method is refuted regardless of what it says about 2019: a synthesiser that always
    finds a story is measuring itself.
  data:
    - source: src-gdelt
      slice: >
        Model-filtered corpora for four windows, winner leg only, presented as per-company
        headline digests with all dates and years removed
      tier: DESIGN and VALIDATE
      vintage: 2026-08-22
      coverage_note: >
        Only the September 2019 window is open tier. The three calm windows are matched
        controls from years without a rotation, not the held-out episode windows.
  method:
    statistic: >
      Concentration score from 0 to 10 assigned by the model per subsample, compared across
      windows. Secondary: whether the named driver for the episode window refers to rates
      or bond proxies, scored against a list fixed before the run.
    unit: subsample of companies within a window
    grid: 4 windows x 10 subsamples, each drawing 25 companies at random
    null_model: >
      The three calm windows. A method that scores the episode window high and the calm
      windows equally high has found nothing, whatever it names.
    correction: not applicable; one pre-declared comparison across four windows
    power: >
      40 subsamples give a usable comparison of score distributions. The window count still
      caps inference at three controls, so the placebo behaviour carries more weight than
      any significance test.
    controls: [dates and years stripped from every headline, window identity hidden, company order shuffled]
    contamination_probe: >
      Each prompt also asks the model to guess the year the coverage comes from. If it can,
      the concentration score is contaminated by knowing what happened next, and the result
      is void regardless of direction. This is the hindsight test the project has described
      as necessary and never run.
  result:
    headline: >
      The contamination probe fired unanimously. The model identified the exact calendar
      year of every window, forty times out of forty, after years, months and dates were
      stripped from every headline. By the rule fixed at registration the concentration
      comparison is void.
    numbers:
      - {label: exact year identified, value: "40 of 40", comparison: "across four windows, never off by a single year"}
      - {label: stated confidence when guessing, value: "8.4 of 10", comparison: "and it was correct every time, so the confidence was calibrated rather than bravado"}
      - {label: concentration, episode window, value: 2.5, comparison: "against calm windows at 2.0, 2.3 and 2.6; no separation, and void in any case"}
      - {label: draws naming a rate or bond-proxy driver, value: "0 of 40", comparison: "including the episode window, where the holdings say that is exactly what the book was"}
      - {label: draws naming any common driver at all, value: "few", comparison: "the model mostly answered none, so it did not hallucinate a story everywhere; the placebo passed"}
    figures: [fig-contamination]
  verdict: inconclusive
  reasoning: >
    The hypothesis is unresolved and the experiment is decisive about something else.
    De-identification failed completely. Removing every year, month and date from the
    headlines does not prevent a model from placing a corpus in time, because the text
    carries period fingerprints in company names, products, events and vocabulary. Forty
    of forty exact, at a confidence the model itself rated 8.4 out of 10 and which turned
    out to be correct. Any judgement it then makes about that window may be drawing on what
    it knows happened next rather than on what the headlines say, so the concentration
    comparison cannot be interpreted and is not.
    Two secondary observations survive because they do not depend on the contaminated
    comparison. The placebo passed: the model answered none in most draws and did not
    invent a common thread in the calm windows, which is the behaviour a usable synthesiser
    needs. And in no draw did it name interest rates or bond proxies for the September 2019
    window, even though the holdings say that is what the book was. At headline
    granularity the shared exposure is not recoverable, contamination aside.
    This is the hindsight test the project has described as necessary since the first plan
    and never run. It converts a ceiling asserted from published training cutoffs into a
    measured one, and it applies to every retrospective evaluation using a current model,
    not only to this experiment.
  caveats:
    - >
      Headlines recovered from URL slugs are all the text available. No article has been
      read. A negative result therefore bounds what headline-level semantics can do and
      says nothing about full text.
    - >
      A model asked whether a set of companies shares a driver is being invited to say yes.
      The calm windows exist to measure that tendency, and the placebo is the primary
      safeguard rather than a robustness check.
    - >
      The winning side of a momentum book is a sector-tilted portfolio in any period, so
      some coherence is expected everywhere. The comparison is of degree across windows,
      not of presence against absence.
  produced_claims: [clm-date-blinding-fails]
  changed_because_of_this: >
    Any technique that has a current model read historical text is contaminated for
    retrospective evaluation, and stripping dates does not fix it. Historical work must use
    representations that cannot know the future, or be evaluated forward only. This prunes
    the design space more than any result so far.
  reproduce: "uv run python -m unstructured_momentum.llm.synthesis --common-thread"
  peek_note: >
    Flagged: the corpora were built before this design. Nothing semantic has been computed
    on them, and the model has never been shown a headline from any window.
  history:
    - {date: 2026-08-22, note: "Run over 40 draws. Contamination probe: 40 of 40 exact year identifications, 10 of 10 in every window."}
    - {date: 2026-08-22, note: "Concentration comparison declared void under the rule fixed at registration, before the numbers were examined for direction."}
    - {date: 2026-08-22, note: "Design committed as db661c1, then the hash written back here.", admin: true}
    - {date: 2026-08-22, note: "Registered before any prompt was written, with the placebo and the contamination probe fixed as part of the method rather than added afterwards."}

- id: exp-027
  title: Is the model's foreknowledge load-bearing, or merely present?
  one_breath: >
    Tells the model true dates, false dates and no dates for the same text, and checks
    whether its classifications move.
  status: complete
  registered_at: 2026-08-22T19:40:00Z
  registered_commit: ace6175
  closes_question: q-03
  hypothesis: >
    Contamination has been shown to be present: the model identifies the year of a
    de-identified corpus without error. Presence is not use. If a classification is a
    function of the text alone, telling the model a false date should not change it. If the
    label moves when the stated date moves, period knowledge is doing work and no
    historical evaluation using that label is admissible.
  prediction: >
    For a factual classification, whether an article states a rate-related driver for a
    company, labels will agree across the no-date, true-date and false-date conditions at
    above 95 percent. Disagreement above 5 percent means the label is partly a function of
    what the model believes about the period rather than of the text, and the LLM layer is
    inadmissible for retrospective work whatever its accuracy against human labels.
  data:
    - source: src-gdelt
      slice: 150 headlines drawn from the four model-filtered corpora, stratified by window
      tier: DESIGN and VALIDATE
      vintage: 2026-08-22
  method:
    statistic: >
      Pairwise agreement rate between conditions on the same items, plus the change in
      positive rate per condition. Reported per window so a period-specific effect cannot
      hide in a pooled average.
    unit: headline
    grid: 3 date conditions x 4 windows
    null_model: >
      Perfect invariance. Any systematic movement between the true-date and false-date
      conditions is the effect being measured.
    correction: not applicable; one pre-declared comparison
    power: >
      150 items per condition detects a 5 percentage point shift in positive rate at
      conventional levels; smaller shifts are reported as effect sizes.
    controls: [identical text across conditions, condition order randomised, same model and temperature]
    false_date_rule: >
      The false date is the true date shifted by exactly five years, fixed before the run.
      Five years is far enough to change the macroeconomic regime a model would recall and
      near enough that the text remains plausible for the stated period.
  result:
    headline: >
      Perfect invariance, on a test weaker than its headline count suggests. Not one label
      moved across the three date conditions, but only six of 152 headlines were positive
      in any condition, so the informative sample is six rather than 152.
    numbers:
      - {label: agreement, true date versus false date, value: "100.0%", comparison: "against the 95 percent threshold fixed at registration; zero disagreements in 152 items"}
      - {label: positive rate across all three conditions, value: "0.039", comparison: "identical to three decimal places whether the model was told the true year, a year five years wrong, or nothing"}
      - {label: items positive in any condition, value: "6 of 152", comparison: "so 96 percent of the agreement comes from items trivially negative everywhere"}
      - {label: agreement on the informative subset, value: "100%", comparison: "all six, but six is a small number and the confidence interval on it is wide"}
    figures: []
  verdict: supported
  reasoning: >
    The pre-registered threshold is cleared and the direction is unambiguous: telling the
    model a year five years wrong changed nothing at all, and the positive rate is identical
    to three decimal places across conditions. Contamination is present and inert for this
    task. That licenses factual extraction from historical text, which is the rung the whole
    text programme needs.
    The weakness is worth more than the result. A 96 percent negative base rate means most
    of the agreement is between items no reasonable reader would mark either way, and the
    genuinely informative sample is six headlines. Six unanimous agreements is encouraging
    and is not 152. A stronger version would stratify on predicted positives so the test
    concentrates where a label could plausibly move, and that is the version to run before
    leaning on this.
    One incidental observation. Rate-related headlines are 3 percent of the September 2019
    window and 11 percent of calm 2016, which is the same ordering the theme-composition
    test found by a completely different route. Two independent representations agreeing
    that the 2019 winning side's coverage is not about rates is worth more than either
    alone.
  produced_claims: [clm-contamination-inert]
  changed_because_of_this: >
    Factual extraction from historical text is admissible, subject to a stronger version of
    this test on a stratified sample. Judgement tasks such as sentiment or importance remain
    inadmissible retrospectively by default, since nothing here speaks to them.
  caveats:
    - >
      Invariance to a stated date does not prove the absence of contamination. The model
      may infer the period from the text regardless of what it is told, which the previous
      experiment showed it can do. Invariance shows the inference is not changing the label,
      which is the property that matters for admissibility.
    - >
      The base rate was 4 percent, so 146 of 152 items were negative in every condition and
      contributed nothing. The informative sample is six. The test should be rerun
      stratified on likely positives before this result carries weight.
    - >
      A factual classification is the easiest case. Passing here licenses factual extraction
      and says nothing about judgement tasks such as sentiment or importance, which remain
      inadmissible for retrospective work by default.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.llm.synthesis --invariance"
  peek_note: >
    Flagged: the corpora predate this design. No classification of this kind has been run
    on them, and the outcome data plays no part in the test.
  history:
    - {date: 2026-08-22, note: "Run over 152 headlines in three date conditions. Zero label changes; positive rate identical to three decimals across conditions."}
    - {date: 2026-08-22, note: "Weakness recorded on inspection rather than left implicit: only six items were positive anywhere, so the informative sample is six and a stratified rerun is needed."}
    - {date: 2026-08-22, note: "Design committed as ace6175, then the hash written back here.", admin: true}
    - {date: 2026-08-22, note: "Registered before any prompt was written, with the five-year shift and the 95 percent threshold fixed in advance."}

- id: exp-028
  title: Can a model read a filing and recover a company's measured rate sensitivity?
  one_breath: >
    Extracts stated interest-rate exposure from mandatory disclosures and tests it against
    the rate beta measured from returns.
  status: complete
  registered_at: 2026-08-22T21:15:00Z
  registered_commit: a3bbe05
  closes_question: q-03
  hypothesis: >
    Every candidate that failed this project was computed from past returns. Interest-rate
    exposure is disclosed by companies directly, under obligation, in Item 7A, which makes a
    text-derived exposure measure the first non-return-derived candidate available. Counting
    rate words cannot work, because a bank and a tower REIT both discuss rates constantly
    and their betas point opposite ways; the measured keyword floor is a rank correlation of
    -0.09 against absolute beta, which is nothing. Reading for DIRECTION and CHANNEL is what
    a model can add over counting, and it is the whole of the hypothesis.
  prediction: >
    Model-extracted signed exposure correlates positively with signed rate beta across the
    121 companies, and beats the keyword floor of -0.09. A correlation indistinguishable
    from zero means either that disclosed funding exposure and equity duration exposure are
    different things, or that reading adds nothing over counting, and the positive control
    distinguishes those two cases.
  data:
    - source: src-edgar
      slice: >
        Item 1A and Item 7A of the last 10-K filed before 2019-09-06, for every holding in
        the book that could be matched
      tier: DESIGN
      vintage: 2026-08-22
      coverage_note: >
        121 of 196 holdings, 63 winners and 58 losers, so the coverage is balanced across
        legs unlike the earnings-calendar work. 48 failed on ticker-to-filer matching and 27
        filed no 10-K in the window, mostly foreign issuers filing 20-F. 1.5 million words of
        prose against 31,512 in the entire news corpus.
    - source: src-fred
      slice: 10-year Treasury constant maturity, daily, to 2019-08-30
      tier: DESIGN
      vintage: 2026-08-22
  method:
    statistic: >
      Spearman rank correlation between model-extracted signed exposure and rate beta from
      regressing 252 days of daily returns on daily 10-year yield changes, to 2019-08-30.
      Reported against the keyword baseline on the same companies.
    unit: company
    grid: three extraction rungs, keyword count, keyword count with a direction lexicon, model extraction
    null_model: no rank association, by sector-clustered bootstrap
    correction: Benjamini-Hochberg across the three rungs
    power: >
      121 companies gives usable precision on a rank correlation, which is the point of
      working cross-sectionally rather than across the two dozen episodes that cap every
      time-series test here.
    controls: [sector, market capitalisation, leverage proxied by mentions of debt]
    gates: >
      Every extraction prompt must offer an explicit option of no material exposure, and
      that option must be exercised on placebo inputs before real ones are trusted. The
      model reads only the filing text, never the ticker, never a date, and never a return.
    positive_control: >
      Before the correlation is computed, the extraction must rank real estate trusts,
      utilities and banks above software and medical devices on absolute exposure. If it
      cannot recover an ordering every practitioner knows, the extraction is broken and the
      correlation is not interpreted.
  result:
    headline: >
      Reading beats counting. After a parser fault was repaired, signed exposure extracted
      from mandatory filings correlates with measured rate beta at +0.210 across 121
      companies, against a pre-registered keyword floor of -0.093, with a sector-clustered
      interval that excludes zero. It is one cross-section on one date, at marginal
      significance, and the repair happened after the first estimate was seen.
    numbers:
      - {label: signed text exposure against rate beta, value: "+0.210", comparison: "p = 0.021, against a pre-registered keyword floor of -0.093 on the same companies"}
      - {label: sector-clustered 95 percent interval, value: "+0.024 to +0.407", comparison: "excludes zero, where the pre-repair interval ran from -0.025 to +0.357"}
      - {label: estimate before the parser repair, value: "+0.182", comparison: "the repair moved it to +0.210, the direction attenuation predicted"}
      - {label: positive control, real estate magnitude, value: "5.00", comparison: "highest of eleven sectors, against health care at 1.93 and energy at 1.90"}
      - {label: financial companies extracted as having no exposure, value: "1 of 8", comparison: "down from 4 of 8; sector mean magnitude rose from 1.75 to 3.62"}
      - {label: placebo after the redaction was fixed, value: "20 of 20 answered none", comparison: "with zero rate terms surviving redaction, verified by counting rather than assumed"}
    figures: []
  verdict: supported
  reasoning: >
    The claim is that reading a mandatory disclosure recovers a company's measured rate
    sensitivity where counting rate words recovers nothing. The keyword floor was fixed at
    -0.093 before the run and extraction reaches +0.210, with a sector-clustered interval
    from +0.024 to +0.407. The expensive rung earned its place on a declared bar.
    Four qualifications belong in the same breath as the number.
    First, the parser was repaired after the first estimate of +0.182 was seen, knowing that
    mis-extracting financials toward zero would attenuate the result. The repair was
    motivated by a control failure rather than by the coefficient, and its direction was
    predicted before it was made, but the sequence is a researcher degree of freedom and is
    recorded as one.
    Second, the interval barely excludes zero at a lower bound of +0.024. This is marginal,
    on one cross-section, on one date, in the open tier.
    Third, the positive control now passes per stratum rather than only in aggregate: real
    estate is the most exposed sector at 5.00, financials rose from 1.75 to 3.62, and only
    one financial in eight is still extracted as having no exposure.
    Fourth, an exploratory result persists that was never pre-declared. Disclosed magnitude
    correlates with absolute beta at -0.252: companies disclosing more rate exposure have
    smaller realised betas, consistent with disclosure intensity tracking hedging rather
    than residual exposure. It survives the parser repair and it carries no weight.
    Three things happened during the run and they point in different directions.
    The extractor is validated. With rate language properly removed and the removal verified
    by counting surviving terms, it answered no material exposure in all twenty placebo
    documents. It reports exposure when the disclosure is present and not otherwise, which
    is what a measurement instrument is supposed to do.
    The primary result is positive, in the predicted direction, and beats the declared floor.
    That is the first positive-signed text result in this project. It is also not
    significant once companies are clustered by sector, which is the right unit because
    companies in a sector share exposure, and the naive p of 0.047 should not be quoted
    without the interval that spans zero.
    The extraction has a systematic failure that the aggregate control hid. Financial
    companies commonly satisfy Item 7A by cross-reference, writing that the disclosures
    appear in the management discussion, so the section contains a pointer and the slicer
    then ran to its character cap on whatever followed. Four of eight financials were
    extracted as having no exposure, including East West Bancorp, which has the highest
    rate-language density in the corpus and a rate beta of +0.28. Since financials carry the
    largest positive betas, mis-extracting them toward zero attenuates the correlation, so
    +0.182 is probably a floor rather than an estimate. That is a reason to fix the parser
    and rerun, not a reason to believe the number.
    One exploratory result is stronger than the registered one and is reported as
    exploratory. Disclosed magnitude correlates with absolute rate beta at -0.293, p 0.001:
    companies that disclose more rate exposure have smaller realised betas. A plausible
    mechanism is that disclosure intensity tracks hedging activity rather than residual
    exposure, which would make Item 7A a measure of what a company has neutralised. It was
    not pre-declared and carries no inferential weight.
  produced_claims: [clm-filings-exposure]
  changed_because_of_this: >
    Gives the project its first non-return-derived exposure measure with evidence behind it,
    and one that cites the sentence it came from. Replication at a second formation date is
    required before it enters the brief.
  caveats:
    - >
      A parser fault affected 42 of 121 filings, not the eight financials it was found
      through. It was found through financials because that is the stratum where a wrong
      answer was obviously wrong. A positive control only catches errors where the
      researcher already holds a strong prior, and packaging and aluminium companies failed
      silently and would have stayed failed.
    - >
      One date, one cross-section, and the result has not been replicated at any other
      formation date. That is the next test and it is cheap.
    - >
      Item 7A discloses exposure of the company's own funding costs, its floating-rate debt,
      swaps and hedges. A stock's rate beta comes mostly from being a long-duration cash
      flow stream. These are different channels and a null is fully explicable without any
      failure of the text or the model. This is stated before the result exists.
    - >
      The disclosure is annual and the beta is estimated over 252 days, so the two are
      measured over different windows. Exposure changes slowly, which makes this tolerable
      and not free.
    - >
      Coverage is 62 percent, and the missing companies are disproportionately those whose
      ticker could not be matched to a filer. That is the same defect logged against the
      earnings calendar, unfixed, and it is recoverable from the historical filing index at
      a cost not yet spent.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.llm.exposure --cross-section"
  peek_note: >
    Flagged. The filings and the betas were both assembled before this design, and the
    keyword floor was measured before registration and is reported as a baseline rather than
    as a result. No extraction has been run and no model has seen a filing.
  history:
    - {date: 2026-08-22, note: "Parser repaired to follow Item 7A cross-references into the management discussion. 42 of 121 sections were pointers; 37 recovered usable text. The bank previously extracted as having no exposure now reads benefits from rising rates at magnitude 7, quoting its own filing."}
    - {date: 2026-08-22, note: "Rerun: rho +0.210, p 0.021, sector-clustered interval +0.024 to +0.407, excluding zero. The repair moved the estimate the direction attenuation predicted."}
    - {date: 2026-08-22, note: "First placebo failed at 10 of 20. Diagnosis: the redaction regex used sentence boundaries and filings are full of decimals and abbreviations, so rate sentences survived. The model was quoting text that was still present."}
    - {date: 2026-08-22, note: "Placebo rerun with word-window redaction and a verification step counting surviving terms. Zero leaks, 20 of 20 answered none. The extractor reads the disclosure."}
    - {date: 2026-08-22, note: "Positive control passes in aggregate and fails on financials. Extraction of banks returns no exposure because Item 7A is satisfied by cross-reference."}
    - {date: 2026-08-22, note: "Design committed as a3bbe05, then the hash written back here.", admin: true}
    - {date: 2026-08-22, note: "Registered after the keyword floor was measured at -0.09 and before any extraction. The floor is stated in the hypothesis so the ladder has a declared bar rather than a retrospective one."}

- id: exp-029
  title: Does the filings-exposure result hold on a different book in a different year?
  one_breath: >
    Repeats the filings-exposure test on the 2017 book, with different companies, different
    filings and different betas.
  status: complete
  registered_at: 2026-08-22T23:30:00Z
  registered_commit: f192863
  closes_question: q-03
  hypothesis: >
    Model-extracted exposure from mandatory disclosures recovers measured rate sensitivity
    because the disclosure is a genuine description of the company, not because of anything
    specific to one date. If so it replicates on an unrelated book. The first estimate rests
    on one cross-section, has an interval barely excluding zero, and was produced after a
    parser repair that postdated the first look, so replication is the test that decides
    whether it is real.
  prediction: >
    Rank correlation between signed extracted exposure and rate beta is positive on the 2017
    book and exceeds the keyword floor computed on that same book. A correlation at or below
    the floor, or one that changes sign, means the first result was one date's noise and the
    marginal interval was reporting that correctly.
  data:
    - source: src-edgar
      slice: Item 1A and 7A of the last 10-K filed before 2017-08-30, for the 2017 book
      tier: DESIGN
      vintage: 2026-08-23
      coverage_note: >
        Not yet pulled. Coverage will be reported as a headline, and the 2019 run reached
        121 of 196 with a balanced split across legs.
    - source: src-fred
      slice: 10-year Treasury constant maturity, 252 trading days to 2017-08-30
      tier: DESIGN
      vintage: 2026-08-23
  method:
    statistic: Spearman rank correlation between signed extracted exposure and rate beta, with the keyword floor recomputed on the same companies
    unit: company
    grid: one pre-declared comparison
    null_model: no rank association, by sector-clustered bootstrap on the 2017 sectors
    correction: not applicable; a single replication of a single declared statistic
    power: expected 100 to 130 companies, comparable to the 121 of the first run
    controls: [sector, the same extraction prompt and parser as the first run, unchanged]
    gates: >
      The parser now resolves cross-references and that behaviour is frozen. The same
      placebo requirement applies: rate language redacted with the removal verified by
      counting surviving terms, and the model must answer none. The positive control must
      pass per stratum, with real estate and financials above software and health care.
  result:
    power_statement: >
      The confidence interval runs from -0.277 to +0.238 and CONTAINS the original +0.210, so
      this replication cannot exclude the effect it was testing. Expected 100 to 130 companies
      against 121 in the first run; the design is sound and the sample cannot separate the
      hypotheses.
    planted_effect: >
      Not applicable. The design is not shown to be blind; it is shown to be imprecise. A
      plant at the original effect size would fall inside the same interval.
    headline: >
      It does not replicate. On the 2017 book the correlation is +0.011 against +0.210 on
      the 2019 book, with an interval running from -0.277 to +0.238. The earlier estimate
      should be treated as one date's noise.
    numbers:
      - {label: signed exposure against rate beta, 2017 book, value: "+0.011", comparison: "p = 0.916, against +0.210 and p = 0.021 on the 2019 book"}
      - {label: sector-clustered 95 percent interval, 2017, value: "-0.277 to +0.238", comparison: "against +0.024 to +0.407 in 2019; nearly twice as wide and centred on zero"}
      - {label: keyword floor recomputed on this book, value: "-0.121", comparison: "against -0.093 in 2019, so the floor is stable and the extraction no longer clears it"}
      - {label: book overlap between the two runs, value: "44 of 192, 23 percent", comparison: "so roughly three quarters of the companies, filings and betas are new"}
      - {label: coverage, value: "96 of 192, 50 percent", comparison: "against 62 percent in 2019; the shortfall is the same unfixed ticker-to-filer defect"}
    figures: []
  verdict: underpowered
  reasoning: >
    The replication is the test that mattered and it fails. A correlation of +0.011 is not a
    noisier version of +0.210, it is zero, and the interval is centred on nothing.
    The honest reading of the pair is that the 2019 result was noise. It had three warning
    signs at the time and all three now look like what they were: an interval whose lower
    bound was +0.024, a parser repair made after the first estimate was seen and in the
    direction that would help, and a single cross-section on a single date. The replication
    was registered before it ran with a threshold fixed as beating the keyword floor on its
    own book, and it does not.
    One diagnostic deserves stating because it cuts against a convenient excuse. The 2017
    window is not obviously a weaker measurement environment: daily yield volatility is
    almost identical at 3.89 against 3.83 basis points, and the estimated rate betas are more
    dispersed in 2017, not less. The 2017 interval is wider mainly because there are 96
    companies rather than 121. There is no clean story in which the ground truth was too
    quiet in 2017 to detect an effect that exists.
    What survives is narrower and still worth something. The extraction itself is validated:
    it passes a verified placebo, it passes a per-stratum positive control, and it reads
    disclosures correctly including the cross-referenced ones. The instrument works. What it
    measures does not track equity rate sensitivity across books, which is the outcome the
    funding-versus-duration caveat predicted before either run.
  produced_claims: []
  changed_because_of_this: >
    Withdraws the filings-exposure result. Disclosed funding exposure and equity duration
    exposure are different objects, as pre-committed, and no filings-derived exposure number
    enters the brief.
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now underpowered. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-22, note: "Run on a book overlapping the 2019 one by only 23 percent. Correlation +0.011 against +0.210, interval -0.277 to +0.238, below the keyword floor of -0.121 recomputed on the same companies."}
    - {date: 2026-08-22, note: "Diagnostic recorded against the obvious excuse: 2017 daily yield volatility is 3.89 basis points against 3.83 in 2019 and beta dispersion is higher, so the window is not a quieter measurement environment."}
  caveats:
    - >
      The 2017 and 2019 books overlap in membership, because momentum is persistent and both
      are drawn from the same index. The overlap will be measured and reported, and a high
      overlap makes this a weaker replication than a fully independent sample.
    - >
      Filings are annual, so a company appearing in both books may contribute a similar
      disclosure twice. That is a further reason the two runs are not independent and it is
      stated before the result exists.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.llm.exposure --replicate 2017-08-30"
  peek_note: >
    Flagged only because the 2017 book was constructed earlier for the news work. No filing
    for that book has been pulled, no extraction run, and no beta computed at that date.
  history:
    - {date: 2026-08-22, note: "Design committed as f192863, then the hash written back here.", admin: true}
    - {date: 2026-08-22, note: "Registered before any 2017 filing was pulled, with the replication threshold fixed as exceeding the keyword floor computed on the same companies."}

- id: exp-030
  title: Do companies whose disclosed risks read alike fall together in the tail?
  one_breath: >
    Tests whether similarity between risk-factor disclosures predicts joint downside
    behaviour, over and above sharing a sector.
  status: complete
  registered_at: 2026-08-23T01:10:00Z
  registered_commit: 837ba01
  closes_question: q-03
  hypothesis: >
    Every text test in this project so far asked whether text predicts a linear average
    sensitivity. Risk-factor disclosures are not that. Item 1A is a list of discrete things
    that could go badly wrong, so it should describe how a company behaves in the tail
    rather than on average. And the crash mechanism is joint: a momentum reversal is many
    holdings falling together on a shared driver. So the right object is pairwise, matching
    the one measure in this project that replicated, which is average pairwise correlation
    inside a leg. Companies whose disclosed risks read alike should fall together on bad
    days, beyond what sharing a sector already explains.
  prediction: >
    Rank-partial correlation between risk-text similarity and downside return correlation,
    controlling for same-sector, is positive on the 2017 book and clears the permutation
    null. The discriminating prediction is the asymmetry: the same statistic computed on
    full-sample correlation should be near zero. If text predicts average co-movement as
    well as tail co-movement, it is measuring industry membership more finely than the
    sector dummy and not fragility.
  data:
    - source: src-edgar
      slice: Item 1A risk factors from the last 10-K before 2017-08-30, for the 2017 book
      tier: DESIGN
      vintage: 2026-08-23
      coverage_note: >
        Already pulled: 98 of 192 holdings. The 2019 run used 118 companies and 6,903 pairs.
    - source: src-iwv
      slice: daily returns for those companies, 504 trading days to 2017-08-30
      tier: DESIGN
      vintage: 2026-08-19
  method:
    statistic: >
      Rank-partial correlation between pairwise tf-idf cosine similarity of Item 1A text and
      pairwise return correlation on the worst fifth of days for the book, controlling for a
      same-sector indicator.
    unit: company pair
    grid: two outcomes, downside correlation and full-sample correlation, both pre-declared
    null_model: >
      Permutation of company labels, 1000 draws. Pairs are not independent because each
      company appears in more than a hundred of them, so conventional standard errors are
      meaningless and are not reported.
    correction: not applicable; one statistic and one pre-declared contrast
    power: >
      Roughly 4,700 pairs from 98 companies, against 6,903 from 118 in the first run. The
      permutation null establishes the achievable precision directly.
    controls: [same-sector indicator, and the full-sample-correlation contrast as a placebo for industry membership]
    baseline: >
      The same-sector dummy, which on the 2019 book carried a rank correlation of +0.223
      with downside correlation. Text must add to it, not merely correlate with the outcome.
  result:
    headline: >
      The association replicates almost exactly and the interpretation does not. Risk-text
      similarity predicts joint downside behaviour beyond sector on both books, at +0.094
      and +0.095 with permutation p of 0.010 and 0.004. But the contrast that was supposed
      to distinguish fragility from industry membership fails: on the 2017 book the same
      statistic on full-sample correlation is +0.076, where on the 2019 book it was zero.
    numbers:
      - {label: risk-text against downside correlation given sector, 2019, value: "+0.0939", comparison: "permutation p 0.010, null mean +0.0011 with sd 0.0400"}
      - {label: same statistic, 2017 book, value: "+0.0952", comparison: "permutation p 0.004; the headline replicates within 0.002 on a 23 percent overlapping book"}
      - {label: placebo on full-sample correlation, 2019, value: "-0.0004", comparison: "clean asymmetry: the text tracked the tail and nothing else"}
      - {label: placebo on full-sample correlation, 2017, value: "+0.0762", comparison: "four fifths of the downside figure, so the asymmetry does not hold"}
      - {label: same-sector baseline, value: "+0.223 and +0.250", comparison: "the bar text had to add to, and it does on both books"}
    figures: []
  verdict: inconclusive
  reasoning: >
    Two pre-declared predictions, one confirmed and one refuted, and separating them is the
    whole value of having declared both.
    The association is real. Companies whose risk-factor disclosures read alike move
    together on the worst days for the book, over and above sharing a sector, on two books
    overlapping by 23 percent, with company-label permutation inference that respects the
    dependence between pairs. Replicating within 0.002 is stronger evidence than either run
    alone, and it is the first text measure in this project to survive a registered
    replication.
    The interpretation is refuted. The asymmetry was registered as the discriminating
    contrast precisely because risk-factor language is boilerplate and boilerplate is
    industry-specific. On the 2019 book the text tracked tail co-movement and nothing else,
    which is what fragility would look like. On the 2017 book it tracks both about equally,
    which is what fine-grained industry membership looks like. The honest conclusion is that
    the measure captures economic relatedness beyond the eleven GICS labels, which is a
    known result in the literature, and that this project has no evidence it is specifically
    about tails.
    That is still worth having. A book concentrated in text-similar names is more
    concentrated than its sector labels report, and the September 2019 finding was exactly
    that portfolio-level sector aggregates called a concentrated book diversified. The next
    step is whether text-similarity concentration of a leg says anything a sector
    concentration measure does not, which is a different question from this one and needs
    its own registration.
  produced_claims: [clm-risktext-relatedness]
  changed_because_of_this: >
    Gives the project a replicated text measure for the first time, and disallows the tail
    interpretation it was built to test. Any use of it must be framed as relatedness beyond
    sector, not as fragility.
  history:
    - {date: 2026-08-23, note: "Registered replication run on the 2017 book. Headline +0.0952 against +0.0939, permutation p 0.004. Placebo on full-sample correlation +0.0762 against -0.0004, so the discriminating contrast fails."}
  caveats:
    - >
      The 2019 run that motivated this was exploratory and is reported as such. It gave a
      partial correlation of +0.0939 against a permutation null of mean -0.0019 and standard
      deviation 0.0422, so a permutation p of 0.013. That is modest, and the last text result
      that looked this good failed to replicate.
    - >
      Risk-factor text is heavily boilerplate and boilerplate is industry-specific, so
      similarity may track industry at a finer grain than the eleven sector labels rather
      than tracking fragility. The full-sample-correlation contrast is the test for this and
      is pre-declared rather than added afterwards.
    - >
      Disclosures are annual and the correlation window is two years, so a company can
      contribute the same text to both books. Overlap between the 2017 and 2019 books is 23
      percent and will be reported again here.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.features.riskpairs --replicate 2017-08-30"
  peek_note: >
    Flagged. The 2017 filings and returns were both assembled earlier, and the 2019 version
    of this statistic has been computed and is reported in the caveats as the exploratory
    result that motivated the registration.
  history:
    - {date: 2026-08-23, note: "Design committed as 837ba01, then the hash written back here.", admin: true}
    - {date: 2026-08-23, note: "Registered after an exploratory 2019 run, with the asymmetry contrast fixed as the discriminating prediction rather than the headline."}

- id: exp-031
  title: Is a momentum book more textually alike than its sector labels admit?
  one_breath: >
    Compares how similar the winning side's disclosed risks are against random draws from
    the same universe, and against what sector concentration reports.
  status: complete
  registered_at: 2026-08-23T02:30:00Z
  registered_commit: 7bad1b6
  closes_question: q-03
  hypothesis: >
    The September 2019 finding was that portfolio-level sector concentration called a
    concentrated book diversified, at the 50th percentile of its own history, while the
    holdings showed one bet. Risk-text similarity is now a replicated measure of relatedness
    at a finer grain than eleven sector labels. If the aggregation failure is what the 2019
    case says it is, the winning side should be more textually alike than a random draw of
    the same size from the same universe, on a date when sector concentration reports
    nothing unusual.
  prediction: >
    Mean pairwise risk-text similarity within the winning side exceeds the 90th percentile
    of random same-size draws from the covered universe, on the 2019 book, while sector
    concentration of the same leg sits near the middle of its own random null. If both
    measures agree, text adds nothing over sector labels and this line closes. If neither
    is elevated, the 2019 concentration was not a textual phenomenon.
  data:
    - source: src-edgar
      slice: Item 1A risk factors for both books, already pulled
      tier: DESIGN
      vintage: 2026-08-23
      coverage_note: 118 companies at 2019 and 94 at 2017, winners and losers combined
  method:
    statistic: mean pairwise tf-idf cosine within a leg, and Herfindahl concentration over GICS sectors of the same leg
    unit: leg
    grid: two dates crossed with two measures, declared here
    null_model: >
      1000 random subsets of the same size drawn without replacement from the covered
      universe of that date, which is the book itself. The comparison is whether the actual
      leg is more internally alike than an arbitrary half of the same companies.
    correction: not applicable; two pre-declared measures on two dates, reported together
    power: >
      The null is generated by resampling, so precision does not depend on the number of
      dates. This is a characterisation test and cannot support a predictive claim.
    controls: [leg size held fixed by construction, same universe for leg and null]
  result:
    power_statement: >
      The comparison layer failed and the experiment says so in its own headline: the
      prediction fails because the null was the wrong one. A null matched on the property
      being tested cannot detect that property at any effect size.
    planted_effect: >
      No plant was run. A planted cross-sector effect would have been absorbed by the same
      matched null that absorbed the real one, so the check would have confirmed the design
      was blind. The question returns to the comparison layer.
    headline: >
      The prediction fails, and it fails because the null was the wrong one. Against random
      draws from the same universe, the 2019 winning side is at the 100th percentile of
      sector concentration and the 89.9th of text similarity, which is the reverse of what
      was predicted. On the 2017 book the pattern inverts. The comparison cannot discriminate
      because momentum legs are sector-tilted by construction and the sector measure
      saturates.
    numbers:
      - {label: 2019 winning side, sector concentration, value: 100.0th percentile, comparison: "against 1000 random same-size draws from the covered universe; the measure saturates"}
      - {label: 2019 winning side, risk-text similarity, value: 89.9th percentile, comparison: "below the 90th-percentile threshold declared before the run"}
      - {label: 2017 winning side, risk-text similarity, value: 94.1th percentile, comparison: "elevated, where the sector measure sits at 89.6 and is not"}
      - {label: dates available, value: 2, comparison: "against the many needed for a time-series null, which is the null the original finding used"}
    figures: []
  verdict: instrument_limited
  reasoning: >
    The registered prediction was that text would be elevated where sector concentration
    sits near the middle. Sector concentration is not near the middle under this null: it is
    at the 100th percentile on the 2019 book, because a momentum leg is sector-tilted by
    construction and a random half of the same universe is not. The caveat written before
    the run said exactly this and I did not follow it through to its consequence, which is
    that the test cannot discriminate when one measure saturates.
    The result does not contradict the September 2019 aggregation finding, and it is worth
    being precise about why. That finding measured sector concentration against the book's
    OWN HISTORY and got the 50th percentile: the book's sector concentration was ordinary
    for that book over time. This test measured it against random draws from the same
    universe and got the 100th: the winning side is far more sector-concentrated than an
    arbitrary half of the same companies. Both are true and they answer different questions.
    I used the second null for a question that requires the first.
    The requirement this establishes is concrete. Testing the aggregation story with text
    needs the text measure computed at many formation dates and compared against its own
    history, exactly as the sector measure was. That means pulling filings at perhaps thirty
    dates rather than two, which is a day of work and is the honest next step rather than a
    reinterpretation of these two numbers.
  produced_claims: []
  changed_because_of_this: >
    Establishes that a time-series null is required and a cross-sectional one will not do,
    and that any text concentration measure must be built across many formation dates before
    it can speak to the aggregation finding.
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now instrument_limited. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-23, note: "Run on both books. Prediction refuted: sector concentration is at the 100th percentile under this null rather than mid-range, so the discriminating comparison is unavailable."}
    - {date: 2026-08-23, note: "Diagnosed as a null-selection error of mine. The original finding used a time-series percentile and this test used a cross-sectional one, and the pre-run caveat about sector tilt predicted the failure without my acting on it."}
  caveats:
    - >
      Two dates. This asks whether the measure describes the 2019 book differently from
      sector labels; it cannot say whether that description would have predicted anything.
    - >
      The universe for the null is the book itself, winners and losers, because those are
      the companies with filings pulled. A wider universe would be a stronger null and is
      not available without pulling several hundred more filings.
    - >
      Momentum legs are sector-tilted by construction, so some elevation is expected in both
      measures. The registered question is whether the text measure is elevated where the
      sector measure is not.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.features.riskpairs --leg-concentration"
  peek_note: Flagged; the filings were pulled earlier and the pairwise measure has been computed on both books.
  history:
    - {date: 2026-08-23, note: "Registered before any leg-level concentration was computed, with the discriminating outcome stated as text elevated where sector is not."}

- id: exp-032
  title: Does disclosure similarity improve a covariance matrix beyond shrinkage?
  one_breath: >
    Uses risk-factor text as the shrinkage target for a covariance estimate and tests it
    against Ledoit-Wolf on realised portfolio volatility.
  status: complete
  registered_at: 2026-08-23T04:00:00Z
  registered_commit: 489af91
  closes_question: q-03
  hypothesis: >
    A published study estimates the covariance matrix of returns from risk-disclosure
    similarity and reports that it beats sample-based estimators including Ledoit-Wolf
    shrinkage, producing lower realised minimum-variance portfolio volatility, and concludes
    the disclosures carry information not already in historical returns. That last property
    is the one every failed candidate in this project lacked. If it holds here, text becomes
    the first non-return-derived input with an economic benefit rather than a correlation.
  prediction: >
    A covariance estimate that shrinks the sample matrix toward a text-implied correlation
    target produces lower realised out-of-sample volatility for the minimum-variance
    portfolio than Ledoit-Wolf shrinkage toward constant correlation, across rolling
    quarterly test windows. Equal or worse performance means the disclosure information is
    already spanned by the return history at this universe size, and the line closes with a
    clean economic answer rather than another correlation.
  data:
    - source: src-edgar
      slice: Item 1A risk factors from the 2017 and 2019 filing sets, already pulled
      tier: DESIGN
      vintage: 2026-08-23
    - source: src-iwv
      slice: >
        Daily returns for the covered companies. Estimation and test windows are confined to
        the open tier and stop before the held-out period begins in November 2020.
      tier: DESIGN
      vintage: 2026-08-19
  method:
    statistic: >
      Realised annualised volatility of the minimum-variance portfolio out of sample,
      averaged across rolling windows, for each estimator. Reported alongside the ratio to
      the Ledoit-Wolf baseline.
    unit: rolling test window
    grid: >
      Three estimators, sample covariance, Ledoit-Wolf shrinkage and text-target shrinkage,
      crossed with long-only and unconstrained weights. Declared here.
    null_model: >
      Ledoit-Wolf shrinkage toward constant correlation, which is the standard estimator the
      literature reports being beaten and is a genuinely strong baseline rather than a straw
      man.
    correction: not applicable; one estimator compared against one declared baseline
    power: >
      Roughly eight to twelve rolling quarterly windows per filing set. Small, and the
      comparison is paired across windows so the relevant quantity is the sign and size of
      the difference rather than an independent-sample test.
    controls: [identical universe and windows across estimators, weights from each estimator applied to the same realised returns]
    gates: >
      The regression that maps text similarity to a correlation target is fitted ONLY on
      returns inside the estimation window and applied out of sample. No test-window return
      touches the target. The same-sector indicator is included in that regression so text
      must add beyond sector membership.
    tier_discipline: >
      Estimation and test windows stop before November 2020, where the held-out period
      begins. The 2017 filing set is tested through to mid-2019 and the 2019 set through to
      October 2020, both inside the open tier.
  result:
    power_statement: >
      Roughly eight to twelve rolling quarterly windows per filing set, paired across windows.
      The relevant quantity is the sign and size of a difference on a very small number of
      windows, and a sector confound was found inside the apparent 13 percent gain.
    planted_effect: >
      Not applicable. The confound is a transformation-layer finding rather than a blindness
      finding, and the window count is too small to resolve the effect either way.
    headline: >
      Text adds nothing. A text-target covariance estimate beats Ledoit-Wolf by 13 percent
      on the 2017 filing set, which looked like the result until a sector-only target was
      built and matched it exactly. The ratio of text to sector-only is 0.989, 0.998, 0.999
      and 1.001 across the four cases. The gain came from fitting a target at all, not from
      the disclosures. On the 2019 set the whole thing reverses and text is 39 percent worse
      than the baseline.
    numbers:
      - {label: text against Ledoit-Wolf, 2017 filings unconstrained, value: 0.869, comparison: "13 percent lower realised volatility, in 4 of 4 windows; this was the apparent result"}
      - {label: text against sector-only target, value: "0.989, 0.998, 0.999, 1.001", comparison: "across both filing sets and both weightings; text contributes nothing over sector membership"}
      - {label: text against Ledoit-Wolf, 2019 filings unconstrained, value: 1.393, comparison: "39 percent worse; the direction reverses entirely on the second period"}
      - {label: constant-correlation target against sector-only, 2017, value: "13.18 versus 12.45 percent", comparison: "even the sector information is not clearly adding over a constant target"}
      - {label: rolling windows, value: "4 and 3", comparison: "far too few to support any claim, in either direction"}
    figures: []
  verdict: underpowered
  reasoning: >
    The control decided this and the registered gate was not the control. The registration
    required a same-sector indicator inside the regression that maps text to a correlation
    target, on the reasoning that text would then have to add beyond sector. That is not the
    same thing. Including a variable in a regression does not test the increment of another;
    the test is an estimator built the same way with the text term removed, and that was
    added during the run rather than declared.
    With it, the answer is unambiguous. Text-to-sector-only ratios of 0.989, 0.998, 0.999
    and 1.001 mean the two estimators produce the same portfolios. The 13 percent gain over
    Ledoit-Wolf is real and is entirely attributable to shrinking toward a fitted target
    rather than toward constant correlation. It is a fact about estimator structure, not
    about disclosure information.
    The reversal settles what little was left. On the 2019 filing set the same construction
    is 39 percent worse than the baseline unconstrained, on three windows. A method that
    beats the benchmark by 13 percent in one period and loses by 39 percent in the next,
    with seven windows in total, has shown nothing.
    The published result this was modelled on uses the S&P 100 across fifteen years. A
    hundred names with 252 daily observations is not a badly conditioned problem, so the
    room for any structured target to help is small, and that was written into the caveats
    before the run.
  produced_claims: [clm-textcov-null]
  changed_because_of_this: >
    Closes the covariance route at this universe size and establishes a control that should
    have been standing policy: to show new data helps, build the identical pipeline without
    it. Including a control variable in a regression does not do that.
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now underpowered. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-23, note: "First run showed text beating Ledoit-Wolf in 4 of 4 windows at a ratio of 0.869, which would have been the headline."}
    - {date: 2026-08-23, note: "Sector-only target added as a control during the run. Text-to-sector ratios of 0.989 to 1.001 show the gain is the fitted target, not the text."}
    - {date: 2026-08-23, note: "Reversed on the 2019 filing set at 1.393. Refuted."}
  caveats:
    - >
      The universe is around a hundred companies, where the published result uses the S&P
      100 over fifteen years. A covariance estimate on a hundred names with 252 observations
      is not badly conditioned, so the room for a structured target to help is smaller than
      in the high-dimensional case where shrinkage matters most.
    - >
      Text similarity is annual and fixed within each filing set, so it is a static
      structural prior across all test windows. That is the weaker form of the measure; the
      quarterly change version is a separate and later question.
    - >
      Roughly a dozen paired windows. This can show a consistent sign; it cannot support a
      significance claim, and none will be made.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.features.riskpairs --covariance"
  peek_note: >
    Flagged. Filings and returns were assembled earlier and the pairwise similarity has been
    computed. No covariance estimate has been built and no portfolio has been formed.
  history:
    - {date: 2026-08-23, note: "Registered before any covariance estimate was built, with Ledoit-Wolf named as the baseline and the tier boundary stated so the test cannot drift into held-out data."}

- id: exp-033
  title: Does disclosure text beat industry labels only when the relevant grouping changes?
  one_breath: >
    Tracks how much risk-factor text adds over sector membership, quarter by quarter, and
    tests whether the gain concentrates at dislocations.
  status: complete
  registered_at: 2026-08-23T06:00:00Z
  registered_commit: f6a1a76
  closes_question: q-03
  hypothesis: >
    An industry classification is a fixed partition and disclosure text is a dynamic one.
    Most of the time they agree, which is why text adds nothing on average and why a
    sector-only estimator matched a text estimator to one part in a thousand. Text should
    only win when the economically relevant grouping stops being the industry grouping. That
    is exactly the September 2019 case, where the book was one bet on falling rates wearing
    ten sector labels, and it is the shape of March 2020 and of the 2022 growth unwind. So
    the question is not whether text beats sector, it is whether text's advantage over
    sector is concentrated in time.
  prediction: >
    The incremental contribution of text over a same-sector indicator, in predicting next
    quarter's realised pairwise correlation, is not constant across the 27 quarters. It is
    higher in quarters containing or preceding a registry episode than in quarters that do
    not, with the difference exceeding what a permutation of episode labels across quarters
    produces. A flat series means text is a fixed relabelling of industry and the line
    closes for good; a series that spikes at unrelated moments means it is noise.
  data:
    - source: src-edgar
      slice: >
        Item 1A from the most recent annual filing before each quarter end, for a panel of
        272 companies present in at least half the quarters of the top 300 by index weight
      tier: DESIGN and VALIDATE
      vintage: 2026-08-23
      coverage_note: >
        Being pulled now. Expect roughly 3,300 filings across 2012 to 2023. Panel membership
        is defined on index weight, not on momentum ranking, so this is not selected on the
        outcome.
    - source: src-iwv
      slice: daily returns for the panel, quarterly windows 2013 to 2023
      tier: DESIGN and VALIDATE
      vintage: 2026-08-19
  method:
    statistic: >
      Per quarter, the partial correlation between pairwise text similarity and next
      quarter's realised pairwise return correlation, controlling for a same-sector
      indicator. The output is a time series of that quantity across 27 quarters.
    unit: quarter
    grid: >
      Two similarity components, boilerplate and non-boilerplate, and two outcome windows,
      full-quarter correlation and downside-only correlation. Four cells declared here.
    null_model: >
      Permutation of episode labels across quarters, 1000 draws, holding the number of
      episode quarters fixed. This tests concentration in time rather than the level of the
      series, which is the registered question.
    correction: Benjamini-Hochberg across the four cells
    power: >
      27 quarters, of which perhaps 6 contain or precede a registry episode. That is a small
      contrast and the permutation null establishes what it can resolve. A null result here
      is uninformative unless the permutation spread is narrow, and that will be reported
      either way.
    controls: [same-sector indicator, sector-only twin estimator, panel membership fixed on index weight rather than momentum]
    gates: >
      The sector-only twin is mandatory, being the identical pipeline with the text term
      removed. Any quarter where fewer than 60 companies have a filing within 15 months is
      dropped and the count reported.
    episode_definition: >
      Episode quarters are taken from the existing registry without modification, and the
      list is fixed before the series is computed. Quarters containing a trough, and the
      quarter immediately before one, both count.
  result:
    power_statement: >
      The permutation null states its own minimum detectable effect and the registration's
      condition is met. A real concentration needed to exceed +0.0208 to register; the mean
      text increment over sector is +0.0443, so the design resolves a concentration effect
      roughly half the size of the level effect it is measuring. The observed difference is
      -0.0193, in the opposite tail at a probability of 0.948. Bounded to 13 of 24 quarters,
      the rest lost to a missing holdings snapshot or the 60-company gate.
    planted_effect: >
      Not run synthetically, and the permutation null serves the same purpose here: it is
      generated from the data by shuffling episode labels, so the spread it produces IS the
      detectability floor for an effect of this shape. The registration pre-committed that a
      flat series would mean text is a fixed relabelling of industry, so the observed outcome
      had its interpretation fixed before the run rather than after it.
    headline: >
      The concentration hypothesis is refuted and the level effect replicates a third time.
      Text adds a steady increment over sector membership in every quarter measured, and
      that increment is no larger around episodes; the point estimate is negative. Text
      similarity behaves as a better industry classification, not as a crisis-specific
      measure.
    numbers:
      - {label: text increment in episode quarters, value: "+0.0354", comparison: "against +0.0547 in other quarters; the difference is -0.0193, the wrong direction"}
      - {label: permutation probability, value: 0.948, comparison: "the observed difference sits in the opposite tail; a real concentration needed to exceed +0.0208"}
      - {label: quarters where text adds a positive increment, value: "13 of 13", comparison: "on full-sample correlation, and 11 of 13 on downside correlation"}
      - {label: mean text increment over sector, value: "+0.0443", comparison: "range +0.018 to +0.078, against a sector baseline of +0.182, so text is 24 percent of sector"}
      - {label: quarters computed, value: "13 of 24", comparison: "the rest lost a holdings snapshot or fell below the 60-company gate"}
    figures: []
  verdict: refuted
  reasoning: >
    The registered prediction was that text's advantage over sector concentrates at
    dislocations, on the reasoning that an industry classification is a fixed partition and
    disclosure text is a dynamic one. It does not. The episode quarters carry a smaller
    increment than the others and the permutation probability is 0.948, so this is not a
    result that failed to clear a threshold, it is one that points the other way.
    The permutation spread is narrow, at a standard deviation of 0.0125 against an observed
    difference of -0.0193, so this is not an underpowered null on the contrast itself. Thirteen
    quarters is thin and seven episode quarters is thinner, but the test could have seen a
    concentration of the size the hypothesis needed and there is none.
    What replicates, for the third time and on a third construction, is the level. Text adds
    a positive increment over sector in all thirteen quarters, averaging +0.044 against a
    sector baseline of +0.182. Two books and now thirteen quarterly panels agree that
    risk-factor similarity carries relatedness information beyond eleven GICS labels, and
    that it is about a quarter of the size of the sector effect itself.
    Taken with the covariance result, the picture is consistent rather than contradictory.
    Text similarity is a finer industry classification. It is real, it is small, it is
    stable through time, it is not concentrated at the moments a tail-risk monitor cares
    about, and a sector-only estimator reproduces its economic value. That is a coherent
    account of a whole line of work, and it is more useful than another inconclusive number.
  produced_claims: [clm-text-is-industry]
  changed_because_of_this: >
    Retires the dynamic-partition hypothesis and, with it, the case for text similarity as a
    tail-risk input at this scale. The level effect stands as a characterisation tool.
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; and it STAYS refuted. An initial pass of this audit reclassified it as underpowered and that was wrong: the permutation null states a minimum detectable effect of +0.0208 against a level effect of +0.0443, and the registration had pre-committed what a flat series would mean. The audit needed auditing, which is recorded here rather than quietly fixed. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-23, note: "Series computed on 13 quarters. Episode increment +0.0354 against +0.0547 elsewhere, permutation p 0.948. Concentration hypothesis refuted with the point estimate in the opposite direction."}
    - {date: 2026-08-23, note: "Level effect positive in 13 of 13 quarters at a mean of +0.044, a third independent replication after the 2019 and 2017 books."}
  caveats:
    - >
      Annual filings mean the text is stale by up to a year within each quarter, which works
      against the dynamic-partition hypothesis rather than for it. Quarterly filings are the
      correct instrument and are phase two.
    - >
      Six episode quarters against twenty-one others is a thin contrast. If the permutation
      spread is wide this test cannot resolve the question and will say so rather than
      reporting a direction.
    - >
      The registration permitted computing into the held-out period provided results were
      reported separately. That was too permissive and is tightened here before running: the
      series stops at the end of 2022 and the sealed period is not opened. All six modern
      registry episodes fall inside the remaining span, so nothing is lost. Tightening a
      boundary cannot bias a result toward significance, which is why this amendment is
      allowed where a loosening would not be.
    - >
      Filing coverage is truncated by the source, which returns only its most recent block.
      The panel holds 5 filings for 2012 and 227 for 2023, so the usable span begins in 2017
      rather than 2013 and the series is 24 quarters, not the 27 registered.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.features.riskpairs --time-varying"
  peek_note: >
    Flagged. Returns and the episode registry both predate this design, and the two-date
    version of the underlying statistic has been computed and reported.
  history:
    - {date: 2026-08-23, note: "Tier clause tightened before running: the series stops at end-2022 and the sealed period stays closed. All six modern episodes remain inside the span."}
    - {date: 2026-08-23, note: "Usable span is 2017 to 2022 rather than 2013 to 2023, because the filing index returns only its most recent block and early years came back nearly empty."}
    - {date: 2026-08-23, note: "Registered while the filing panel was still downloading, with the episode list fixed from the existing registry and the sector-only twin mandatory."}

- id: exp-034
  title: Does a book rewriting its risk factors say anything about its tail?
  one_breath: >
    Measures how much each holding changed its own disclosure since last filing, aggregates
    to the book, and tests it against forward tail risk.
  status: complete
  registered_at: 2026-08-23T09:00:00Z
  registered_commit: 173f49c
  closes_question: q-03
  hypothesis: >
    Every text measure this project has tried compares one firm against another, which turns
    out to recover industry membership. Comparing a firm against ITSELF at the previous
    filing is a different object and the only one that is genuinely timestamped. The
    published finding is that firms rewriting their filings underperform, with the risk
    factor section strongest. The book-level question is different from that firm-level one:
    a leg where many holdings simultaneously rewrite what they are worried about may be a
    leg whose shared story is being revised, which is the condition a crowded rotation needs.
  prediction: >
    The share of a leg's holdings showing a large filing change predicts forward tail
    severity of the momentum book, beyond a control for document length change and beyond
    trailing volatility. If it adds nothing over the length control, the measure is
    detecting disclosure accretion rather than revision. If it adds nothing over trailing
    volatility, it is another return-derived state variable in disguise.
  data:
    - source: src-edgar
      slice: >
        Item 1A from consecutive annual filings per company, 227 companies, 2017 to 2022.
        Change is computed only where a company has two filings within 15 months of each
        other.
      tier: DESIGN
      vintage: 2026-08-23
      coverage_note: >
        1,341 filings, coverage rising from 57 companies in 2016 to 227 in 2023 because the
        source truncates its filing index. Pairs available for change computation will be
        fewer than filings and the count is reported as a headline.
    - source: src-french
      slice: daily momentum factor returns over the same period
      tier: DESIGN
      vintage: 2026-08-13
  method:
    statistic: >
      Four similarity measures per company-pair of consecutive filings, following the
      published method: cosine, Jaccard, minimum edit distance and a simple overlap measure.
      Aggregated to a leg as the share of holdings in the top quintile of change. Tested
      against forward 21-day and 63-day factor severity by rank correlation.
    unit: quarter
    grid: four similarity measures crossed with two horizons, eight cells declared here
    null_model: no rank association, assessed by circular block permutation of the quarterly series
    correction: Benjamini-Hochberg across the eight cells
    power: >
      Roughly 20 quarters with usable filing pairs. The published effect is 188 basis points
      a month on firm-level returns in a sample ending 2014, before a halving for
      publication, before the failure rate on anomalies tested with value weighting, and on
      a universe including microcaps where ours is the top thousand by index weight. The
      honest target is a small fraction of that and 20 quarters cannot resolve a small
      fraction. This experiment is registered as characterisation, and no predictive claim
      will be made from it whatever the sign.
    controls: >
      Change in document length, which moves every similarity measure mechanically and is
      the cheap explanation for any result. Trailing realised volatility of the factor,
      because a measure that only restates volatility is a sixth failed candidate. Both are
      entered alongside, not merely mentioned.
    length_twin: >
      The mandatory control, following the pattern that caught the covariance result: an
      identical pipeline where similarity is replaced by the ratio of document lengths. If
      that twin performs as well, the text is not doing the work.
  result:
    headline: >
      Unusable, for a reason built into the design rather than found in the data. The filing
      panel and the momentum leg overlap by 3 percent, so only four quarters cleared the
      minimum-companies gate. In those four the length twin matches the text measures
      exactly, so even with power there would be nothing to attribute to text.
    numbers:
      - {label: quarters clearing the gate, value: 4, comparison: "against the roughly 20 registered; the rest had fewer than 25 leg members with a filing"}
      - {label: overlap between the filing panel and a momentum leg, value: "18 of 543, 3 percent", comparison: "the panel is the top 300 by index weight, the leg is drawn from the top 1000"}
      - {label: best text rank correlation, value: "+0.800", comparison: "on four observations, p 0.200; and the length twin returns +0.800 as well"}
      - {label: filing pairs computed, value: "1,070", comparison: "after removing 42 slicer failures, from 1,112 consecutive pairs across 221 companies"}
      - {label: cosine change distribution, value: "mean 0.901, sd 0.134", comparison: "against 0.86 and 0.21 published, so the measure itself is implemented correctly"}
    figures: []
  verdict: underpowered
  reasoning: >
    The measure is right and the panel is wrong. Two checks confirm the implementation: the
    cosine distribution matches the published one at 0.901 against 0.86, and the length
    control clears at -0.041 after 42 slicer failures are removed, so filing change is not
    document growth.
    The panel cannot support the test. It was built on the top 300 companies by index
    weight, deliberately, to avoid selecting the universe on momentum. Momentum legs are
    drawn from the top 1000 by weight, so the two overlap by 18 names out of 543. Four
    quarters cleared the gate and four observations resolve nothing; the reported rank
    correlation of +0.800 has a probability of 0.200 and the length twin returns the same
    value, so there is no increment to attribute to text even setting power aside.
    Recorded as underpowered rather than inconclusive. The design could not have answered the
    question as built, and that was a consequence of a choice made for a good reason: keeping
    momentum out of the universe definition. The two constraints are in genuine tension and
    the resolution is more filings, not a different statistic.
  produced_claims: []
  changed_because_of_this: >
    Establishes the requirement precisely. A book-level filing-change measure needs filings
    for the momentum universe, roughly the top 1000 by index weight rather than the top 300,
    which is several thousand more companies and a pull measured in hours rather than
    minutes. Until then no book-level text-change number is available.
  history:
    - {date: 2026-08-23, note: "1,070 usable filing pairs computed. Cosine change distribution matches the published one and the length control clears at -0.041, so the measure is implemented correctly."}
    - {date: 2026-08-23, note: "42 pairs removed as slicer failures, including a section that appeared to grow 65-fold and the same company's prior year at 0.015 times."}
    - {date: 2026-08-23, note: "Only 4 quarters cleared the gate. Panel and momentum leg overlap by 3 percent. Recorded as underpowered by design."}
  caveats:
    - >
      Annual filings give one change observation per company per year, so a quarterly series
      built from them is highly autocorrelated and the effective sample is closer to the
      number of years than the number of quarters. Quarterly filings are the correct
      instrument and are not yet pulled.
    - >
      The published result is a firm-level cross-sectional return strategy. Aggregating to a
      book and predicting factor tail severity is a different test, so a null here does not
      speak to their finding and will not be reported as if it did.
    - >
      Coverage is truncated at the early end by the filing index, so the panel is thinner
      exactly where the sample would otherwise be longest.
  produced_claims: []
  changed_because_of_this: null
  reproduce: "uv run python -m unstructured_momentum.features.riskpairs --filing-change"
  peek_note: Flagged; filings and factor returns were both assembled before this design.
  history:
    - {date: 2026-08-23, note: "Registered with the length twin mandatory and the power target set at a fraction of the published headline rather than at the headline."}

- id: exp-035
  title: Can a model referee a registration and name the flaw before the experiment runs?
  one_breath: >
    Shows a model eight of this project's own registrations, with all results hidden, and
    asks what will make each uninterpretable.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-01
  hypothesis: >
    This project found most of its design flaws by stumbling into them after computing.
    The sector-only twin, the null option, the saturating null, the universe mismatch were
    all identified during or after a run. If a model can name those flaws from the
    registration alone, pre-registration review becomes a system component rather than an
    aspiration, and it is the one AI application here that operates where knowing the future
    cannot help.
  prediction: >
    The model names the recorded defect in a minority of cases. Anything approaching half
    would be surprising, since these are specific structural faults rather than generic
    caveats, and a checklist would produce none of them.
  data:
    - source: src-edgar
      slice: >
        Eight registrations from this project, reduced to title, hypothesis, prediction,
        data and method. Result, verdict, reasoning, caveats, history and peek notes all
        withheld.
      tier: DESIGN
      vintage: 2026-08-23
      coverage_note: >
        The ground-truth defect for each was extracted from the record and written to disk
        BEFORE the model was called, so the target could not move afterwards.
  method:
    statistic: whether the model's named defect matches the one recorded as found after registration
    unit: registration
    grid: eight registrations, one call each
    null_model: >
      A generic methodological checklist, which would raise sample size and multiple testing
      and none of the eight specific faults.
    correction: not applicable
    power: eight cases; this establishes whether the capability exists at all, not its rate
    controls: [results withheld from the prompt, ground truth fixed on disk before the run]
  result:
    headline: >
      Three of eight named the recorded defect outright, two named a real defect from a
      different experiment, and three missed. Two of the three misses raised structural
      problems this project never checked, one of which is serious.
    numbers:
      - {label: recorded defect named outright, value: "3 of 8", comparison: "including the exact control added mid-run in the covariance experiment"}
      - {label: partial or another genuine defect named, value: "2 of 8", comparison: "the coverage-count confound and the sufficiency of the contamination probe"}
      - {label: missed the recorded defect, value: "3 of 8", comparison: "but two of the three raised faults never examined"}
      - {label: new defects surfaced that this project had not checked, value: 2, comparison: "a filing-versus-estimation-window overlap, and short volume being a flow measure rather than short interest"}
    figures: []
  verdict: supported
  reasoning: >
    Three outright hits from eight is a minority and it is the useful minority. For the
    covariance experiment the model named the precise control that was added during the run
    and which overturned the result: an identical estimator with the text term dropped. For
    the filing-change experiment it identified from the registration alone that the panel
    and the momentum book would not intersect, which cost a completed run to discover. For
    the leg-concentration experiment it named the non-random draw that makes the null unable
    to discriminate.
    The most valuable output is not the score. The referee raised two structural faults this
    project never examined. The serious one concerns the option-skew experiment: FINRA short
    volume counts a day's executions including market-maker hedging, so it is a flow measure
    and not short interest, and that experiment treated it as a crowding proxy. This project
    documented that property of the data elsewhere and never applied it as an objection here.
    A referee with no memory of the earlier note made the connection that the author did not.
    The honest limits. Eight cases establish that the capability exists, not a rate. I wrote
    the ground truth, I scored the output, and I knew the answers while scoring, which is a
    bias no amount of care removes. A second scorer would settle it and there is not one. And
    the registrations are recent enough to be absent from any training data, which is the one
    contamination worry that does not apply.
  caveats:
    - >
      Self-scored against a target I wrote, by someone who knew the answers. The three hits
      are verifiable from the text of the outputs, which is the part a reader can check
      without trusting the scoring.
    - >
      Eight registrations from one project by one author. The faults are correlated because
      they share a designer, so this says nothing about performance on someone else's work.
    - >
      A hit is judged by whether the named defect matches the recorded one, which rewards
      the model for finding the fault I eventually found rather than the most important one.
  produced_claims: [clm-referee]
  changed_because_of_this: >
    Pre-registration review becomes a component rather than an aspiration, and it runs before
    the next experiment rather than after it.
  reproduce: "uv run python -m unstructured_momentum.llm.referee --score"
  history:
    - {date: 2026-08-25, note: "Reproduce path recovered 2026-08-25 by rebuilding the referee from its surviving evidence chain, gated on returning the recorded 3 hits, 2 partials and 3 misses. A blinding check was added that confirms no result field reached the prompt -- the design's one hard requirement, unverifiable until now."}
    - {date: 2026-08-23, note: "Ground truth for eight registrations written to disk before any model call, so the target was fixed."}
    - {date: 2026-08-23, note: "Run and scored. Three hits, two partial, three misses, and two previously unexamined defects surfaced."}

- id: exp-036
  title: Is the momentum winner leg more commonly owned than size-matched losers?
  one_breath: >
    Measures institutional ownership overlap on both momentum legs from 13F holdings, size
    matched, in the quarters running into August 2007.
  status: complete
  registered_at: 2026-08-24T09:00:00Z
  registered_commit: 5864afb
  closes_question: q-11
  hypothesis: >
    If August 2007 was a crowded unwind, the position that unwound has to have been widely
    and commonly held beforehand. Crowding is not the same as popularity: a stock can be
    held by many managers because it is large and index-tracked. What crowding means is that
    an overlapping set of managers hold the same leg, so that one manager's forced exit
    moves prices against the others. That predicts a specific asymmetry. The winner leg,
    which momentum investors are long, should be commonly held by a set of filers who also
    hold each other's winners; the loser leg, which they are short and which 13F cannot see
    them shorting, should not show the same overlap among the same filers. Size is the
    obvious confound, because a leg that has just risen is mechanically larger and larger
    stocks are held by more institutions, so the comparison has to be made within size
    strata or it measures capitalisation.
  prediction: >
    In the last 13F available before 2007-08-01, which is 2007-03-31 positions available from
    2007-05-15, the winner leg's ownership overlap exceeds the size-matched loser leg's,
    and the gap exceeds what permuting leg labels within size strata produces. If the gap is
    absent or reverses, holdings-based crowding does not distinguish the legs and the
    measure carries no information the size distribution does not already carry. A gap that
    is present but no larger at 2007-03-31 than in the surrounding quarters would say the
    measure is real but not elevated into the episode, which is a different and weaker
    result that will be reported as such.
  data:
    - source: src-13f
      slice: >
        All 13F-HR accepted in the eight index quarters spanning 2006 and 2007, giving
        position dates 2005-12-31 through 2007-09-30
      tier: DESIGN
      vintage: 2026-08-24
      coverage_note: >
        Being pulled now, roughly 25,000 filings expected. Every quarter is gated on
        reproducing a known Apple close to within two percent, and on untyped and
        implausible value shares staying below one percent.
    - source: src-iwv
      slice: monthly Russell 3000 holdings, 2006-09-29 onward, for leg construction
      tier: DESIGN
      vintage: 2026-08-19
      coverage_note: >
        IWV begins 2006-09-29, so a book formed at end-July 2007 has ten months of price
        history rather than twelve. The formation window is shortened to 9-1 for dates
        before 2007-09 and the deviation is reported rather than hidden.
  method:
    statistic: >
      For each leg, the mean over stock pairs of the Jaccard overlap between the sets of
      filers holding each stock. High overlap means the same managers hold the leg together.
      Reported per position date for both legs.
    unit: position date
    grid: >
      Two legs by four position dates with adequate leg construction, and two overlap
      variants, unweighted Jaccard and value-weighted. Declared here.
    null_model: >
      Permutation of winner and loser labels within size deciles, 1000 draws, holding leg
      sizes fixed. This is the test that the gap is not capitalisation.
    correction: Benjamini-Hochberg across the declared cells
    power: >
      The within-quarter comparison rests on hundreds of names per leg, not on the four
      position dates, so the leg contrast is far better powered than any across-time claim.
      Any statement that overlap is ELEVATED into the episode rests on four quarterly
      observations and cannot be established here; that will be stated as underpowered
      rather than reported as a null.
    controls: [size-decile matching, permutation within size strata, sector composition reported]
    gates: >
      A position date is dropped unless at least 70 percent of each leg's index weight
      matches to 13F holdings through the CUSIP to ticker map, and the matched share is
      reported for every date. Filings flagged untyped or implausible by the parser are
      excluded before any statistic is computed.
    leg_definition: >
      Legs are the top and bottom deciles of 12-1 momentum on IWV constituents, or 9-1 where
      history is short, formed at the month end preceding each 13F position date, so the
      book is never formed using information after the positions it is matched to.
  result:
    power_statement: >
      The leg contrast rests on hundreds of names per leg within a quarter, so it is well
      powered for the hypothesised shape: a difference in co-ownership between the winner and
      loser legs. Any claim about elevation INTO an episode rests on four quarterly
      observations and is not powered, and is not made.
    planted_effect: >
      The measured direction is the control. The prediction was refuted with the opposite
      direction measured at size, which is only possible if the instrument can detect an
      effect of this shape. An instrument blind to the effect returns noise, not a reversed
      signal.
    headline: >
      The registered prediction is refuted and the direction is reversed. The momentum LOSER
      leg is more commonly co-owned than the winner leg, on every one of seven tests across
      two independent leg definitions, by 2.0 to 6.6 lift points. But the size-stratified
      permutation will not call that a crowding asymmetry either: the probabilities scatter
      without pattern, so once capitalisation is held fixed the legs do not separate in
      either direction. What the data do show, and show emphatically, is that momentum-leg
      constituents are co-owned 7 to 18 times more than independent selection implies. That
      is a large, real quantity. It simply does not distinguish winners from losers.
    numbers:
      - {label: tests where the loser leg is more co-owned, value: "7 of 7", comparison: "four position dates on 13F-implied-price legs, three on IWV legs; no exception"}
      - {label: leg difference on 13F-price legs, value: "-3.918 to -6.595", comparison: "winner lift 11.4 to 12.2 against loser lift 15.9 to 18.0"}
      - {label: leg difference on IWV legs, value: "-2.009 to -2.471", comparison: "winner lift 7.2 to 8.6 against loser lift 9.3 to 10.9; a second construction, same sign"}
      - {label: permutation probabilities, 13F-price legs, value: "0.111, 0.472, 0.765, 0.855", comparison: "scattered across the range, which is what a size effect looks like rather than a crowding one"}
      - {label: absolute co-ownership lift, value: "7 to 18 times", comparison: "against 1.0 under independent holder selection; institutional portfolios overlap enormously in BOTH legs"}
      - {label: crosswalk coverage on IWV legs, value: "72.0, 75.0, 75.3 percent of index weight", comparison: "the registered gate was 70 percent, so all three dates report rather than being dropped"}
      - {label: negative-control residual, value: "+0.017 lift", comparison: "250 to 400 times smaller than the observed differences, so it does not threaten the reading"}
    figures: []
  verdict: refuted
  reasoning: >
    The registered hypothesis was that a crowded unwind requires the unwinding position to
    have been widely and commonly held, so the winner leg should show the co-ownership the
    loser leg does not. Seven tests say the opposite, without exception, and the permutation
    then says neither direction survives size matching. Both halves matter: the prediction is
    wrong on direction, and the raw reversal is capitalisation rather than a discovery.
    The negative result is informative rather than empty, because it locates WHERE 13F
    cannot answer the question. Form 13F reports long US equity and nothing else. The loser
    leg it describes is the set of fallen stocks institutions are LONG, which is not the set
    momentum investors are short, and the leverage that turns crowding into forced selling is
    absent from the form entirely. A measure built on long holdings was therefore never going
    to see the short-side crowding that Daniel and Moskowitz put at the centre of the
    mechanism. That limit was written into the source record before the test ran, and the
    result is consistent with it rather than a surprise.
    The 7-to-18-times co-ownership lift is worth keeping separately. It is not the registered
    question, it is large, and it says institutional portfolios overlap heavily across the
    whole momentum cross-section. Any future crowding measure has to explain why that common
    ownership is not itself the crowding, and this experiment cannot.
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now refuted. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-24, note: "Registered while the 13F pull for 2006 and 2007 was still running, at commit 5864afb."}
    - {date: 2026-08-24, note: "Amended BEFORE any result was computed. The registered leg definition cannot be met at the date the registered prediction names. iShares publishes IWV holdings from 2006-09-29, so the 2007-03-31 position date carries six months of price history, not the twelve the registration assumed or the nine it allowed for. Only three of the eight position dates can form legs from IWV at all."}
    - {date: 2026-08-24, note: "The amendment adds a second leg definition rather than weakening the first. 13F itself yields a quarterly price panel: value divided by share count is a price, validated to the cent against known closes, survivorship-free because a delisted name appears while it is still held, and covering every institutionally-held stock rather than index members only. Legs formed from it use a 12-3 window, since quarterly data reaches four quarters back and skips one. Both definitions are reported, and their agreement where they overlap is itself the check on the second."}
    - {date: 2026-08-24, note: "Noted as a shared-error risk and judged acceptable: an implied-price error misassigns a stock to a leg, which is measurement error that attenuates a contrast, and it cannot manufacture one, because which filers hold a name does not depend on its price. The direction of the bias is therefore toward the null."}

- id: exp-037
  title: Does short crowding on the momentum loser leg carry information?
  one_breath: >
    Measures days-to-cover on both momentum legs from FINRA short interest, size matched,
    and asks separately whether loser-leg crowding tracks momentum's left tail.
  status: complete
  registered_at: 2026-08-24T18:00:00Z
  registered_commit: 7a43cfb
  closes_question: q-11
  hypothesis: >
    The crowded-unwind account says a momentum reversal is violent because the position that
    unwinds is held by many people who must exit through the same door. An earlier test put
    that question to institutional long holdings and it could not answer, for a reason
    intrinsic to the disclosure: Form 13F reports long equity only, so it never sees the leg
    momentum is short. Short interest sees exactly that leg. And days-to-cover, being short
    interest over average daily volume, is not merely a size measure but a measure of how
    long the crowd needs to get out, which is the mechanism itself rather than a proxy for it.
    Two things follow, and they are not equally strong. Losers should carry more short
    interest than size-matched winners, which is close to definitional and is registered as a
    positive control rather than a discovery. The informative version is whether the LEVEL of
    loser-leg days-to-cover varies enough over time to say anything about the size of
    momentum's subsequent left tail.
  prediction: >
    First, loser-leg days-to-cover exceeds size-matched winner-leg days-to-cover at every
    settlement date, beyond a permutation that shuffles leg labels within size strata. If
    this fails, the measure is not picking up the momentum short at all and nothing after it
    is worth reading. Second, and this is the real test, the loser-leg days-to-cover level
    predicts the conditional severity of forward momentum returns: the lower quantiles of
    ten-day WML return, measured across every settlement date rather than at episodes only.
    A pinball-loss improvement over an unconditional quantile and over a trailing-volatility
    quantile is the bar. If severity is unimproved, short crowding is a description of the
    book and not a monitor, and that will be said plainly.
  data:
    - source: src-short-interest
      slice: >
        Every settlement date from 2018-01-12 to 2026-08-15, roughly 200 dates, all
        securities, cleaned of the days-to-cover sentinel and of names below 1,000 shares
        average daily volume
      tier: DESIGN and VALIDATE
      vintage: 2026-08-24
      coverage_note: >
        Being pulled now. Availability is settlement plus ten business days, later than
        FINRA's own lag, so every feature is built on a date a monitor could have acted on.
    - source: src-iwv
      slice: monthly Russell 3000 holdings for leg construction, 2018 onward
      tier: DESIGN and VALIDATE
      vintage: 2026-08-19
    - source: src-french
      slice: daily momentum returns for the forward severity target
      tier: DESIGN and VALIDATE
      vintage: 2026-08-19
  method:
    statistic: >
      Median days-to-cover per leg at each settlement date, and separately the pinball loss
      of a quantile regression of forward ten-day momentum return on loser-leg days-to-cover.
    unit: settlement date
    grid: >
      Two legs, three forward horizons of five, ten and twenty-one days, and two quantiles at
      the fifth and tenth percentile. Declared here in full.
    null_model: >
      For the leg contrast, permutation of leg labels within size deciles, 1000 draws. For
      the severity test, comparison against an unconditional quantile and against a
      trailing-volatility quantile, with a stationary block bootstrap for the difference in
      pinball loss because forward windows overlap.
    correction: Benjamini-Hochberg across the six declared severity cells
    power: >
      The leg contrast rests on hundreds of names per date and is well powered. The severity
      test rests on roughly 200 settlement dates with overlapping forward windows, which is
      far more than the six episodes falling inside this sample but is not 200 independent
      observations; the block bootstrap is what establishes the effective number. Any claim
      that crowding was ELEVATED going into a particular episode rests on those six and is
      declared underpowered here, before it is tempting to report it otherwise.
    controls: [size-decile matching, sentinel exclusion, minimum liquidity, trailing-volatility baseline, unconditional quantile baseline]
    gates: >
      A settlement date is dropped unless at least 60 percent of each leg matches into the
      short-interest file by ticker, and the matched share is reported for every date. The
      first prediction is a gate on the second: if losers are not more shorted than winners,
      the severity test is not run.
    leg_definition: >
      Top and bottom deciles of 12-1 momentum on Russell 3000 constituents, formed at the
      month end preceding each settlement date, so the book is never formed on information
      postdating the positions it is matched to.
  result:
    power_statement: >
      The leg contrast rests on hundreds of names per date and is well powered against the
      hypothesised shape. The severity half rests on roughly 200 overlapping settlement dates
      and is reported separately with its dependence stated.
    planted_effect: >
      The gate design supplies the control: the same instrument on the same data detects the
      leg contrast it was built for, so a null on the crowding question is not an instrument
      that cannot see.
    headline: >
      The first prediction only, which is the gate. The second prediction, on whether
      loser-leg days-to-cover improves a conditional quantile of forward momentum returns,
      has NOT been run and this record should not be read as though it had.
      The gate holds substantively and fails on its own wording. The momentum loser leg
      carries more days-to-cover than size-matched winners on 166 of 195 settlement dates,
      median difference 1.175 days, winner median 4.02 against loser 5.12, and the median
      permutation probability is 0.047. The registration said "at every settlement date",
      which 166 of 195 plainly is not. So the measure sees the momentum short, and the
      prediction as written is refuted.
      The 29 exceptions are not scattered, and the first explanation for them was wrong.
      Seventeen fall between April and October 2020 where the direction reverses outright,
      with the winner leg holding Camping World, Overstock, Sorrento and Teladoc at a median
      6.29 days to cover against the losers' 4.89. That was reported as a possible squeeze
      regime and then withdrawn: varying the formation window dissolves it, and running every
      date under both twelve-month and six-month formations moves WHICH years fail while
      leaving the overall rate almost unchanged at 85.9 against 85.4 percent. The failures
      follow the drawdown through the formation window rather than sitting in any year.
    numbers:
      - {label: dates where the loser leg is more shorted, value: "166 of 195", comparison: "median difference +1.175 days to cover; the registration said every date, so the literal prediction is refuted"}
      - {label: median days to cover by leg, value: "winner 4.02, loser 5.12", comparison: "a 27 percent higher figure on the leg momentum is short"}
      - {label: permutation probability below 0.05, value: "99 of 195", comparison: "median 0.047, quartiles 0.002 and 0.404"}
      - {label: dates dropped on the 60 percent match gate, value: 0, comparison: "the ticker join runs at 99.7 percent by count and 100 percent by index weight"}
      - {label: robustness to formation window, value: "85.9 vs 85.4 percent", comparison: "twelve-month against six-month; the rate is stable while the identity of the failing years is not"}
      - {label: second prediction, the severity test, value: not run, comparison: "held pending a decision on how to treat the 2020 exclusion; recorded as unrun rather than as a null"}
    figures: []
  verdict: refuted
  reasoning: >
    Refuted on the wording and supported on the substance, and both halves are reported
    because the gap between them is informative rather than semantic. The gate existed to
    establish that days-to-cover sees the momentum short before the severity test was allowed
    to run, and it does, on 166 of 195 dates at a median probability of 0.047.
    Two failures of process belong here rather than in a footnote. The script declared a pass
    if the direction held on more than 90 percent of dates, a threshold that appears nowhere
    in this registration and was written while implementing; had the result landed at 91
    rather than 85.1 percent it would have printed PASS and nobody would have asked where the
    90 came from. And the 2020 exceptions were reported as a possible regime marker before
    being tested, then withdrawn when varying the formation window dissolved them.
    The severity test is not run. It is the prediction that matters and it is blocked on a
    decision about whether to exclude 2020, which is a researcher degree of freedom worth
    surfacing rather than exercising quietly.
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now refuted. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-24, note: "Registered at commit 7a43cfb, after a single date was pulled to establish the feed's shape and the availability lag, and before any statistic was computed."}
    - {date: 2026-08-24, note: "Closed as complete. The gate is answered; the severity test that was bundled into this registration is split out as its own experiment rather than left holding this one open, because a half-finished experiment blocks the one-at-a-time rule and hides which half was actually done."}
    - {date: 2026-08-24, note: "Gate run and recorded. The severity test remains unrun; this record was left with a null result for several hours while the outcome existed only in conversation, which is the drift the ledger exists to prevent."}
    - {date: 2026-08-24, note: "The positive control is registered AS a positive control. Losers being more shorted than winners is close to definitional, and calling it a finding later would be dishonest; its job is to establish that the measure sees the momentum short before the severity test is allowed to run."}

- id: exp-038
  title: Can a model partition a book into groups that co-move beyond their sectors?
  one_breath: >
    Asks a model to name a book's shared exposures and assign holdings to each, then tests
    whether those groups co-move more than sector-matched random groups.
  status: complete
  registered_at: 2026-08-24T21:00:00Z
  registered_commit: c69a7c8
  closes_question: q-03
  hypothesis: >
    Four separate text nulls in this project are one null. News carries no factor exposure,
    filing similarity recovers industry, disclosed rate exposure is a funding cost rather
    than an equity duration, and theme concentration turned out to be a coverage count.
    Every one of those asked ISSUERS about THEMSELVES and then aggregated. The exposure that
    breaks a momentum book is not a property any issuer holds a view on: no company's annual
    report says it is a rates proxy, because from inside the company it is not one. That is
    a label the market assigns, and it lives in return covariance and in the heads of the
    people who own the stock.
    So the question is whether a model can supply the label the issuer cannot. Given a book,
    it should be able to name what the holdings jointly bet on and say which names carry each
    bet. That is a classification over world knowledge, which is the role this project has
    measured the model succeeding in, rather than a forecast, which is the role it has
    measured the model failing in.
  prediction: >
    The model's groups have higher mean within-group residual correlation over the following
    quarter than random groups matched on size and sector composition, and the gap exceeds
    that of a sector-only partition with identical group sizes. The sector twin is the bar
    that matters: three earlier experiments died on it and this one should be allowed to die
    on it too. A partition that merely reproduces sector is a relabelling, and will be
    reported as such rather than as a text result.
  data:
    - source: src-iwv
      slice: >
        Quarter-end Russell 3000 holdings with sector labels and prices, 2016 to 2024, and
        the momentum decile legs formed from them. Roughly 36 quarter-ends, each partitioned
        once for the real book and once for a matched random basket; the model sees names,
        weights and sectors and never sees returns or outcomes
      tier: DESIGN and VALIDATE
      vintage: 2026-08-19
  method:
    uses: [mth-anonymised-cot, mth-permutation, mth-cluster-boot]
    statistic: >
      Mean within-group correlation of market-residualised daily returns over the quarter
      FOLLOWING the partition, averaged over groups and weighted by group size, minus the
      same quantity for size-and-sector-matched random groups.
    unit: quarter
    grid: >
      Two partition sources, model and sector-only, and two residualisation choices, market
      only and market plus size and value. Four cells declared here.
    null_model: >
      Random partitions matched on group count, group sizes and sector composition, 1000
      draws per date. This is what makes the sector twin a real control rather than a
      gesture: the null already knows the sector structure, so only structure beyond sector
      can register.
    correction: Benjamini-Hochberg across the four declared cells
    power: >
      Roughly 36 quarter-ends, each resting on hundreds of names, so the cross-sectional
      contrast is well powered while any statement about time variation is not. This is the
      same estimand shift that made the short-interest and holdings work tractable, and it
      is chosen for that reason rather than discovered afterwards.
    controls: [sector-only twin partition, size and sector matched random partitions, matched random basket given to the model, group sizes held fixed]
    gates: >
      A date is dropped unless the model returns a valid partition covering at least 70
      percent of book weight with no holding in two groups, and the covered share is reported
      for every date. If the model's partition correlates with sector above 0.9 on the
      adjusted Rand index, the result is reported as a relabelling regardless of the
      correlation numbers.
    specificity_control: >
      The identical prompt is run on a random basket matched on sector composition and size.
      If the named exposures are the same for the real book and the random one, the model is
      describing markets rather than this portfolio, and the experiment fails there.
  result:
    headline: >
      The registered prediction is supported and the mechanism behind it is mostly not the
      one hoped for. Across 44 quarters the model's partition beats groups matched on count,
      size and sector composition every single time, median lift 0.031 at a median z of about
      10, and it beats a sector partition outright on 38 of 44. But the groups are
      overwhelmingly sub-industry rather than cross-sector: the median group is 87 percent one
      GICS sector and only 29 of 433 span sectors genuinely. Most of the headline is therefore
      a fourth replication of something this project already knows, that model-derived
      similarity recovers a finer industry classification.
      What is new sits in the minority. The genuinely cross-sector groups carry a lift of
      0.054 over a null matched on their OWN sector mix, statistically indistinguishable from
      what the single-sector groups achieve, so the exposure groups are as informative as the
      industry ones. That rests on 17 groups at a probability of 0.036 and is the thinnest
      part of the result rather than its headline.
    numbers:
      - {label: quarters where the partition beats its matched null, value: "44 of 44", comparison: "median lift +0.0305, permutation probability below 0.05 on every one, median z about 10"}
      - {label: quarters beating a sector partition outright, value: "38 of 44", comparison: "the harsher bar, and the one that does not go unanimous"}
      - {label: registered window 2016 to 2024, value: "30 of 30 positive", comparison: "median lift +0.0315, beats sector on 25 of 30; the run covered 2014 to 2026 rather than the registered span and both are reported"}
      - {label: post-2023 subsample, value: "12 of 12 positive", comparison: "median lift +0.0466, beats sector 12 of 12; STRONGER where contamination is weakest, which is the opposite of what recall would produce"}
      - {label: median top-sector share of a group, value: "87.1 percent", comparison: "264 of 433 groups are above 80 percent one sector, so the partition is largely sub-industry"}
      - {label: genuinely cross-sector groups, value: "29 of 433", comparison: "below 50 percent in any one sector; these are the ones the design was built to find"}
      - {label: cross-sector group lift over own sector-matched null, value: "+0.0540", comparison: "12 of 17 positive, one-sample probability 0.036; against +0.0580 for single-sector groups, which is not a detectable difference at 0.851"}
      - {label: adjusted Rand against sector, value: "0.638 median", comparison: "0 of 40 partitions above the registered 0.90 relabelling gate, so it is sector-correlated without being sector renamed"}
      - {label: hallucinated tickers, value: "0.00 percent median", comparison: "maximum 0.90 percent across 44 quarters"}
      - {label: quarters skipped without appearing in the output, value: 28, comparison: "of 76 announced; upstream filters for short price history and thin forward panels, not the registered cover gate, which dropped 4 more"}
      - {label: partition coverage in 2025, value: "76.6 percent median", comparison: "against 84 to 100 percent for every year from 2013 to 2024; the model assigns less as it approaches its knowledge boundary"}
    figures: []
  verdict: supported
  reasoning: >
    The prediction as registered is met, and reporting only that would be misleading. The
    partition beats its matched null everywhere, but the median group is 87 percent one
    sector, so most of what is being measured is a finer industry classification and this
    project has already established that three times over. The honest headline is the
    replication; the new part is that the minority of genuinely cross-sector groups carry
    just as much lift over their own matched nulls as the industry ones do, which says the
    model is finding exposures and not only sub-industries. Seventeen groups is thin and the
    probability of 0.036 is not comfortable.
    Two things point away from contamination rather than toward it. The post-2023 subsample
    is stronger than the full sample, where recall of outcomes would make it weaker. And the
    target is forward co-movement among named groups, which no document records.
    The most useful finding may be none of the above. Partition coverage falls to 77 percent
    in 2025 from 84 to 100 percent in every prior year, which is what a knowledge boundary
    looks like: the model cannot say what a company is exposed to when it does not know the
    company. A live monitor always runs at that boundary, so the method degrades exactly
    where it would be used, and any deployment would have to report the unclassifiable share
    to the user as a confidence signal rather than hide it.
    A first version of the cross-sector test was mis-specified and nearly reported. It
    compared raw correlation between cross-sector and single-sector groups, which is apples
    to oranges: a group spanning five sectors has a lower baseline than one inside a single
    sector, so the deficit it showed was arithmetic rather than evidence. The corrected test
    gives every group a null matched on its own sector mix.
  history:
    - {date: 2026-08-24, note: "Registered at commit c69a7c8, after establishing that the four earlier text nulls share one cause: they all asked issuers about themselves when the exposure is market-assigned."}
    - {date: 2026-08-24, note: "Run and completed the same day. The second arm on thematic ETF labels was NOT run; arm one answered the question well enough that adding market-assigned labels would confound rather than clarify, and it stays declared for later."}
    - {date: 2026-08-24, note: "Thematic ETF membership as an investor-side narrative label is a declared SECOND arm, not a prerequisite. Arm one asks whether the model can do this from world knowledge; arm two adds market-assigned labels. Keeping them separate means a null in one does not contaminate the reading of the other."}

- id: exp-039
  title: Can a model find a data fault in code before the fault was found empirically?
  one_breath: >
    Audits six real commit states of one module, five of which contain a fault discovered
    later, and asks whether the model names it.
  status: complete
  registered_at: 2026-08-24T23:30:00Z
  registered_commit: 51c58e3
  closes_question: q-06
  hypothesis: >
    Every measured success of the model in this project is an instrument success: filtering,
    extracting, classifying, refereeing a registration. Every measured failure is a
    forecasting failure. If that split is real rather than accidental, then the model should
    be able to do the single most valuable instrument job in a pipeline like this one, which
    is finding the fault that makes a number confidently wrong.
    There is an unusual ground truth available. One module accumulated five faults over seven
    commits in a single day, each recorded in the trap log with its symptom and the reason it
    parsed cleanly, and each fix landing in a LATER commit than the state that contained it.
    So the model can be shown a real historical state of real code and asked what is wrong
    with it, with the answer known and not visible to it. The commits are hours old, so
    recall from training is impossible.
  prediction: >
    The model names the fault that was actually found next, in at least three of the five
    pre-fix states, when scored blind by a separate call that never learns which version it
    is judging. And it names materially fewer faults in the sixth state, where all five are
    fixed. The second half is the one that matters: an auditor that reports faults at the
    same rate whatever it is shown has a perfect hit rate and no information, which is the
    same failure as a classifier that always answers yes.
  data:
    - source: src-edgar
      slice: >
        Six committed states of src/unstructured_momentum/data/thirteenf.py between 419 and
        868 lines, spanning commits 4efb6f1 through 975157f, each audited once. The module
        parses SEC filings, which is why the source is EDGAR; the object under test is the
        code rather than the filings.
      tier: DESIGN
      vintage: 2026-08-24
      coverage_note: >
        Five states each contain a fault that is recorded in the trap log with its symptom
        and the reason it parsed cleanly. The sixth has all five fixed and serves as the
        control. Faults not yet discovered may exist in any state
        including the last, so a flag on the control is not automatically a false alarm.
  method:
    uses: [mth-anonymised-cot, mth-llm-annotator-panel]
    statistic: >
      Hit rate, being the share of pre-fix states where the model names the fault found next,
      against flag rate on the control state. Judged blind by a separate call given the trap
      description and the auditor's output without being told which state produced it.
    unit: commit state
    grid: >
      Six states by one audit each, and every audit judged against all five trap descriptions
      rather than only its own, so a model that names a DIFFERENT real fault is visible and
      is not scored as a hit for the wrong one.
    null_model: >
      The control state, and cross-scoring every audit against every trap. If audits match
      traps they were not shown at the same rate as their own, the matching is generic.
    correction: none; six states and five traps is too small a grid for multiplicity to be
      the binding problem, and saying so is more honest than applying a correction for show.
    power: >
      Five pre-fix states. This cannot establish a rate with any precision and is not
      intended to. It can distinguish an auditor that finds the specific fault from one that
      recites generic code-review advice, which is the question worth answering first.
    controls: [fixed-state control, cross-scoring every audit against every trap, blind judging, commits postdating any training data]
    gates: >
      If the model names three or more of the five traps but also flags comparable specific
      faults in the control state, the result is reported as uninformative rather than as a
      hit rate.
  result:
    power_statement: >
      Five pre-fix states, explicitly unable to establish a rate. What it resolves is the
      distinction between an auditor that finds a specific planted fault and one that recites
      generic review advice, which is the hypothesised shape.
    planted_effect: >
      The fault is the plant. Five states each contained a known defect, fixed in the very
      next commit, so the instrument is validated by construction against exactly the shape on
      trial. It scored zero of five.
    headline: >
      The auditor does not find the fault. Against the registered target, the fault fixed in
      the very next commit, it scores zero of five. Against a fairer target added after the
      fact, any fault actually present in the state audited, it scores one of fifteen. It
      reported exactly five faults in every one of the six states including the control,
      which is the cap the prompt allowed, despite being told that returning none was valid
      and that padding was worse. Four of its five total matches were to faults that had
      ALREADY been fixed in the code it was reading, so its items match absent faults more
      readily than present ones.
      The single genuine hit is worth more than the rate suggests. On the earliest state the
      model wrote that a validation gate was computed but never enforced and the panel
      returned regardless, which is a fault not found by hand until four commits later. And
      it is the one fault of the five that is visible in the code's own structure. The other
      four exist only where the code meets data: one needed seeing a CUSIP that was a
      fragment of a company name, another needed seeing ConocoPhillips priced at 370,770
      dollars a share. No amount of reading the source reveals those.
    numbers:
      - {label: registered target, fault fixed next, value: "0 of 5", comparison: "the prediction was at least three of five"}
      - {label: corrected target, any fault present in the state, value: "1 of 15", comparison: "7 percent; the correction was made because the registered target asked the model to guess which fault a human would fix first"}
      - {label: matches to faults already fixed, value: 4, comparison: "against 1 match to a fault actually present, so the matching is looser than the hit rate alone implies"}
      - {label: faults reported per state, value: "5 in all six states", comparison: "the cap, including the control where all five faults were fixed; the prompt stated that an empty list was valid"}
      - {label: the one real anticipation, value: "a validation gate computed but never enforced", comparison: "found on the earliest state, four commits before it was found by hand"}
      - {label: faults visible from source alone, value: "1 of 5", comparison: "and it is the one the model found; the other four require observing the code's output on real filings"}
    figures: []
  verdict: refuted
  reasoning: >
    The prediction is refuted on its own terms and on a fairer restatement of them. What
    makes the result useful is the pattern in the single hit rather than the rate.
    Four of these five faults are invisible in source code because they are properties of
    the code's encounter with data. A CUSIP that is a fragment of the words DIVERSIFIED REIT
    is not deducible from a regular expression; it is discovered by running the regular
    expression over a filing and looking at what came out. The same is true of a price bound
    that admits Berkshire Hathaway and a misparsed Conoco alike. The fifth fault, a metric
    computed and never consumed, is a property of the source text, and that is the one the
    model named — before I did.
    So this sharpens the split the project has been describing rather than contradicting it.
    The model reviews reasoning it can read, which is why refereeing a registration worked.
    It cannot review an encounter it has not witnessed. An auditing layer in a production
    system should therefore be shown OUTPUTS and distributions rather than source, and that
    is a design consequence rather than a consolation.
    One flaw in this experiment is mine. The registered statistic asked whether the model
    named the fault fixed next, which requires it to guess which of several live faults a
    human would happen to address first. Both statistics are reported and the registered one
    is not quietly replaced.
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now refuted. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-24, note: "Registered at commit 51c58e3. The ground truth exists because five faults in one module were found and fixed in sequence over one day, each fix landing in a later commit than the state containing it."}
    - {date: 2026-08-24, note: "Scored blind: the judging call sees a trap description and an auditor output and decides whether they match, without being told which commit state produced the output or whether the two belong together."}

- id: exp-040
  title: Do vintage-matched embeddings recover book compositions already known?
  one_breath: >
    Embeds risk-factor text with the checkpoint preceding each filing date and asks whether
    the resulting geometry finds structure that is documented independently.
  status: complete
  registered_at: 2026-08-25T09:00:00Z
  registered_commit: 521ef87
  closes_question: q-03
  hypothesis: >
    The embedding tier is the foundation for everything downstream, so it is gated on
    recovering what is already known rather than on producing something new. Three
    compositions are documented in this project from independent evidence: the September 2019
    winner leg was a concentrated bet on falling rates wearing ten sector labels, established
    from cross-sectional rate betas and not from any text; the January 2021 loser leg held the
    squeeze cohort; and the book rotated at dates the registry records. If the geometry cannot
    find structure that is independently documented, no measure built on it can be trusted,
    and the tier is abandoned rather than tuned until it passes.
    Leak-freedom comes from the checkpoint rather than from prompting. This project measured
    that a model placed every historical window correctly with dates removed, so blinding is
    not a defence; a checkpoint trained only on text timestamped before its cutoff cannot know
    what came after.
  prediction: >
    First, the 2019-08-30 winner leg shows higher within-leg cosine concentration than
    sector-matched random baskets drawn from the same index on the same date, and its tightest
    cluster spans more than one GICS sector. Second, the 2021-01-29 loser leg shows a cluster
    containing the names the squeeze is documented to have hit. Third, centroid drift between
    consecutive months peaks within one month of the rotations the registry records. Failing
    the first kills the tier outright, since concentration is the measure everything downstream
    consumes; failing the second or third demotes specific measures without killing it.
  data:
    - source: src-edgar
      slice: >
        Item 1A risk-factor sections of 10-K filings, the 30,117 of 43,588 in the corpus
        exceeding 3,000 characters, embedded with the annual chronologically consistent
        checkpoint whose cutoff precedes each filing date
      tier: DESIGN
      vintage: 2026-08-24
      coverage_note: >
        The corpus spans 2016 to 2024, so ten distinct checkpoints are needed. Filings are
        grouped by vintage and each checkpoint is loaded once. A local sample at 2048 tokens
        gates the measure before the full 8192-token run is commissioned.
    - source: src-iwv
      slice: daily Russell 3000 holdings with sector labels, for book construction and the matched baskets
      tier: DESIGN
      vintage: 2026-08-19
  method:
    uses: [mth-permutation, mth-cluster-boot]
    statistic: >
      Mean pairwise cosine within a leg, on vectors centred on that date's cross-section,
      against sector-matched random baskets from the same index and date. Plus cluster
      sector-spread, and month-over-month centroid drift.
    unit: month
    grid: >
      Three gates by two token limits, 2048 for the local sample and 8192 for the full run.
      Six cells declared here.
    null_model: >
      Sector-matched random baskets drawn from the same index snapshot, 1000 draws, matched on
      size and sector composition, so a leg that is merely large or merely concentrated in one
      industry cannot pass on that alone.
    correction: Benjamini-Hochberg across the declared cells
    power: >
      Each gate rests on hundreds of names within a single date rather than on a count of
      episodes, so the cross-sectional comparison is well powered. The centroid-drift gate is
      the weak one: it rests on the handful of rotations the registry records and is scored as
      a dating exercise within one month rather than as a test.
    controls: [sector-matched random baskets, per-date centring, cross-sector spread required of the winning cluster]
    gates: >
      Centring is verified per date by asserting each date's matrix has mean approximately
      zero before any cosine is taken. A date is dropped unless at least 60 percent of its leg
      has a filing within 15 months, and the covered share is reported for every date.
  result:
    power_statement: >
      AMENDED 2026-08-26, and the amendment is less generous to the design than the original.
      The first version blamed f-squared dilution: a sub-bet of fraction f enters the statistic
      as f squared, so a forty percent bet needed cohesion 0.138. That is true and it is not the
      binding constraint. Mean pairwise cosine is PINNED when the centring population is the set
      being measured: centring forces a zero sum, which forces the mean off-diagonal cosine to
      exactly -1/(k-1), agreeing with theory to 2.7e-06 at k of 168. The statistic was not merely
      underpowered against partial bets; it has almost no range at all. This gate escaped the
      pinning only accidentally, by centring on a 900-name pool while measuring a 168-name leg,
      and the leading eigenvalue on the same data moves fourteen times further than it does.
      ORIGINAL TEXT: The measure has algebraically ZERO power against the shape on trial. Mean pairwise
      cosine is the squared centroid norm, so a sub-bet of fraction f enters as f squared: a
      40 percent partial bet needed internal cohesion of 0.138 to move the statistic two
      standard deviations, while a whole GICS sector inside that leg achieves 0.00 to 0.13.
      Three further layers also failed: a quarter of the corpus was not the section, the
      section was truncated to 7 percent, and the median firm's embedded text contained no
      rate language at all.
    planted_effect: >
      The positive control that was run passed at z between 6.8 and 14.6 against SINGLE-SECTOR
      groups, which is a hundred-percent-loading single-block alternative and not the partial
      cross-sector bet hypothesised. It is the canonical case of a control validated against
      the wrong shape. A planted 40 percent partial bet is the check this needed and it was
      never run.
    headline: >
      Gate 1 fails and the tier is killed as registered. The September 2019 winner leg is not
      more concentrated in embedding space than baskets matched on its own sector
      composition; it is very slightly less, at a lift of -0.0089 and a probability of 0.792.
      The measure is not at fault. A positive control on the same vectors shows single-sector
      groups beating fully random draws by z-scores of 6.8 to 14.6, so the geometry detects
      concentration easily when concentration exists.
      What it cannot detect is concentration BEYOND sector, which is what the gate asked for
      and what every downstream measure would have consumed. That is a fifth replication of
      something this project already holds: text similarity is an industry classification,
      and the 2019 rates bet is a fact about return covariance rather than about anything the
      issuers wrote. The failure was predicted by claims already on the record.
    numbers:
      - {label: winner-leg mean cosine, value: "+0.0151", comparison: "against a sector-matched null of +0.0241 plus or minus 0.0107"}
      - {label: lift over the sector-matched null, value: "-0.0089", comparison: "z of -0.84, permutation probability 0.792; the leg is marginally LESS concentrated than matched baskets"}
      - {label: positive control, single-sector groups, value: "z +6.8 to +14.6", comparison: "Information Technology +14.6, Health Care +8.3, Financials +6.8 against fully random draws of the same size; the measure works"}
      - {label: leg coverage, value: "168 of 267 names, 63 percent", comparison: "clears the registered 60 percent gate but only just; the filings corpus holds 1,316 tickers against a Russell 3000 of about 2,900"}
      - {label: the second declared cell, 8192 tokens, value: "lift -0.0231, probability 0.932", comparison: "leg +0.0165 against a sector-matched null of +0.0396; quadrupling the context made the leg look LESS concentrated, not more"}
      - {label: document coverage at each cell, value: "7 and 27 percent", comparison: "the median leg risk-factor section runs about 29,800 tokens, so neither cell reads most of it; the null is nonetheless stable across a fourfold change"}
      - {label: dense-subcluster check, value: "z -0.34 to +0.51", comparison: "mean cosine to the 5 and 20 nearest leg-mates is 0.61 and 0.51 against sector-matched 0.61 and 0.50; local structure is real and identical to the null, so the flat whole-leg mean is not a dilution artefact"}
      - {label: embedding throughput on the A100, value: "0.06 s/doc at 2048, 0.39 at 8192", comparison: "against 1.28 on the M2 at 2048, so about 21x; the full-corpus run was never commissioned"}
    figures: []
  verdict: instrument_limited
  reasoning: >
    The kill is honoured rather than argued around. The registration said failing gate 1 ends
    the tier because concentration is what everything downstream consumes, and it failed.
    Two checks were run before accepting it, because a negative result deserves the same
    scepticism as a positive one. The centring assertion printed 1.82e-02 against a comment
    saying it should be near zero, which looked like a bug and was not: the check read the
    matrix AFTER row normalisation, where column means are not expected to vanish. Centring
    before normalisation is correct to within 3e-06. And the positive control shows the
    measure detecting single-sector concentration at z up to 14.6, so a null on the leg is a
    statement about the leg rather than about the instrument.
    The result is a fifth replication rather than a surprise. This project already holds that
    text similarity is a finer industry classification and that the 2019 concentration is a
    property of return covariance that no issuer description carries. A sector-matched null
    absorbs the industry structure, and once it does, nothing remains. The embedding tier
    reproduces the same wall from a new direction, with leak-free vintage-matched checkpoints
    that remove contamination as an explanation for the null.
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now instrument_limited. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-25, note: "Registered at commit 521ef87, before any embedding run and before any GPU time was purchased."}
    - {date: 2026-08-25, note: "Both declared token cells now run. The 8192 cell fails more decisively than the 2048 one, which removes truncation as an explanation over the range testable with this model and leaves the null stable to a fourfold change in context."}
    - {date: 2026-08-25, note: "A dense-subcluster check was run before accepting the null, on the hypothesis that a mean over all leg pairs would dilute the roughly forty percent of the book that an earlier experiment placed in one duration bucket. Local density is real, at 0.61 mean cosine to the five nearest leg-mates against 0.015 over all pairs, and it is identical in sector-matched baskets. The hypothesis is rejected rather than left open."}
    - {date: 2026-08-25, note: "Gate 1 run on an A100 and failed. The full-corpus embedding run was never launched, so the cost of finding this out was one 900-document sample and roughly ten minutes of GPU time."}
