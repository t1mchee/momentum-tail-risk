      '
    numbers:
    - label: control
      same hosts re-read unplanted: null
      value: 1.7 percent flagged
      comparison: keyword rule 46.7 percent on identical documents
    - label: model
      planted conditions: null
      value: 19.2 percent, span localised 17.5
      comparison: registered prediction was 70 and 60; REFUTED
    - label: lift over the unplanted control
      value: model +17.5 points, rule +7.5
      comparison: the comparison that matters; the rule's recall advantage is a base rate
    - label: specificity on real boilerplate
      value: model 97.5 percent, rule 62.5
      comparison: registered at 85 percent for the model; met
    - label: run-to-run stability
      value: 98.3 percent
      comparison: declined filings staying declined on a fresh read of identical text
    - label: leakage split
      value: 16.5 against 31.6 percent
      comparison: n = 91 and 19; not resolved, and the sign is the wrong way for recognition
    figures: []
  reasoning: 'Run because precision and recall are blocked on annotation resources and the keyword comparison
    came back inconclusive without truth. Constructing the truth rather than buying it answers the question
    the labels were needed for, and the answer is that the model''s contribution is discrimination and
    not sensitivity: it responds to a planted condition more than twice as strongly as the rule while
    flagging almost nothing when nothing was planted.

    '
  caveats: 'TWO EARLIER VERSIONS OF THIS EXPERIMENT WERE WRONG AND BOTH ARE KEPT. The first drew plants
    at random, which put an FDA nerve-graft sentence into a cruise line''s filing and an air-travel-demand
    sentence into a vaccine manufacturer''s. Declining those is CORRECT -- the instructions ask for the
    condition the FILER states about its own survival -- so the constructed ground truth was invalid and
    the run measured whether the model detects a topically foreign splice. It does, at 83 percent, and
    the keyword rule does not, at 37. That is an incidental finding from a broken design and is reported
    as one. The second added sector matching, which moved recall from 16.7 to 21.7 percent, and still
    had no control, so its recall number had no denominator. Remaining limits. Sector is a coarse notion
    of congruence and a plant can still be implausible for its host inside one. Precision on real documents
    is still unmeasured and still needs annotation; only specificity against planted negatives is available
    here. And the plant is one sentence inserted at a sentence boundary, which is a cleaner signal than
    a condition expressed across a paragraph, so this is likely an upper bound on how findable a real
    condition is.


    ARM PAIRING FAULT, found by external audit 2026-09-07 and fixed in code (trp-99). The loop index `hi`
    was initialised once above the arm loop instead of per arm, so the three arms consumed DISJOINT slices
    of the shuffled host list -- measured overlap 3, 3 and 0 of 120 -- while the code''s own label and
    this registration both said the control re-read the SAME documents. The lift is therefore a difference
    between independent samples, not a paired one: +10.0 points model over rule with a 95 percent interval
