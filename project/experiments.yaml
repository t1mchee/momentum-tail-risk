# Every test, registered before it runs.
#
# Entries 001 to 014 and 017 to 018 were recorded retrospectively, after the work was done.
# They carry `registered_at: null` and say so, and the console shows them as unregistered.
# Honesty here costs nothing and is what makes the registered entries mean anything.
#
# `hypothesis`, `prediction`, `method` and `registered_commit` freeze at registration.
# Changing one means abandoning the entry and opening a new one that references it.

- id: exp-001
  title: How many genuinely independent momentum reversals are there to learn from?
  one_breath: >
    Counts how many separate reversal regimes the historical record actually contains,
    which bounds every claim the project can make.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-01
  hypothesis: >
    The apparent sample of roughly two dozen reversals overstates the information
    available, because episodes cluster into a much smaller number of independent regimes.
  prediction: >
    The effective sample is small enough that only a very large effect could ever reach
    statistical significance, which would rule out timing as a research target.
  data:
    - source: src-iwv
      slice: index membership across the modern era
      tier: DESIGN
      vintage: 2026-08-13
  method:
    statistic: count of independent regimes after collapsing temporally adjacent episodes
    unit: episode
    grid: three definitions of adjacency
    null_model: none; this is a descriptive power calculation
    correction: not applicable
    power: the calculation is itself the power analysis
    controls: [construction choice, horizon choice]
  result:
    headline: >
      Roughly two dozen raw episodes collapse to between eight and seventeen independent
      regimes, and only three in the era with daily holdings data.
    numbers:
      - {label: independent regimes, value: "8 to 17", comparison: "from ~24 raw episodes"}
      - {label: regimes in the daily-holdings era, value: "7, 5 and 3", comparison: "at increasing strictness of the adjacency rule"}
      - {label: minimum detectable effect, value: 2.2x, comparison: "at 24 observations against a 15.4% base rate"}
    figures: []
  verdict: supported
  reasoning: >
    The effective sample is far smaller than the raw episode count suggests. This is the
    reason the project forecasts severity rather than timing, and it is stated first
    because every later null result has to be read against it.
  caveats:
    - >
      Independence is defined by temporal separation, which is a proxy. Two reversals
      years apart could still share a common cause and would be counted as separate here.
  produced_claims: [clm-power]
  changed_because_of_this: >
    The entire research target changed from forecasting when a reversal happens to
    forecasting how bad it would be if it did.
  reproduce: "uv run python -c 'from unstructured_momentum.validation import hypotheses as H; print(H.minimum_detectable_lift(24, 0.154))'"
  history:
    - {date: 2026-08-14, note: "Run as the first substantive analysis."}
    - {date: 2026-08-21, note: "Recorded here retrospectively; it predates this registration system.", admin: true}

- id: exp-002
  title: Does the list of momentum crashes depend on how the portfolio is built?
  one_breath: >
    Builds the momentum portfolio twelve ways and checks whether the same crashes appear
    in all of them.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-01
  hypothesis: >
    Which episodes count as reversals is not a fact about markets but a joint fact about
    markets and the construction chosen to measure them.
  prediction: >
    At least one well-known episode will be severe in some constructions and absent in
    others, and at least one will vanish entirely when the measurement horizon changes.
  data:
    - source: src-iwv
      slice: index membership, modern era, both sides of the book
      tier: DESIGN
      vintage: 2026-08-13
  method:
    statistic: drawdown severity percentile per episode
    unit: portfolio construction crossed with horizon
    grid: 12 constructions crossed with 4 horizons
    null_model: not applicable; this is a sensitivity analysis
    correction: not applicable
    power: full historical sample, so precision is not the binding constraint
    controls: [company size, weighting scheme, whether the sides are separated]
  result:
    headline: >
      Construction and horizon each independently change which episodes exist. Neither
      choice is neutral, so both must be declared rather than defaulted.
    numbers:
      - {label: August 2007 among large companies, value: "-8.37%", comparison: "against -4.53% in the headline construction"}
      - {label: January 2021 weighted by size, value: "-6.88%", comparison: "against -0.89% weighting equally, where it disappears"}
      - {label: November 2022 at one and five days, value: "-11.5% and -15.8%", comparison: "and entirely absent at ten and twenty-one days"}
    figures: []
  verdict: supported
  reasoning: >
    A single construction would have silently selected the event set and then explained it.
    Carrying twelve makes the choice visible, and the November 2022 case shows the horizon
    choice is just as consequential as the weighting choice.
  caveats:
    - >
      Twelve constructions is a defensible spread but not exhaustive. A thirteenth could
      produce a thirteenth event set.
  produced_claims: [clm-definition, clm-construction]
  changed_because_of_this: >
    Every later result is reported against a named construction and horizon rather than
    against an unqualified momentum series.
  reproduce: "uv run python -m unstructured_momentum.factor.constructions --report"
  history:
    - {date: 2026-08-14, note: "Run after the detector disagreed with the hand-written episode list."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-003
  title: Can the severity of a momentum reversal be forecast at all?
  one_breath: >
    Tests whether today's market state predicts how bad the worst case over the next two
    weeks would be, against a baseline that uses no information.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-01
  hypothesis: >
    Conditional severity is forecastable even though timing is not, because severity
    depends on persistent state rather than on the arrival of news.
  prediction: >
    A model conditioned on recent volatility will beat an unconditional baseline on a
    scoring rule that cannot be gamed by shifting forecasts in one direction.
  data:
    - source: src-french
      slice: daily momentum and market returns, 1990 to 2022
      tier: DESIGN
      vintage: 2026-08-13
  method:
    statistic: pinball loss at the fifth percentile, ten-day horizon
    unit: expanding-window refit
    grid: three horizons crossed with two quantiles
    null_model: unconditional quantile of the training window
    correction: not applicable; the comparison is against a fixed baseline
    power: 318 out-of-sample forecasts
    controls: [minimum training window of 1500 days, no forecast sees its own future]
  result:
    headline: >
      Severity is forecastable, and trailing volatility alone captures essentially all of
      the forecastable part. Adding more state makes the forecast worse.
    numbers:
      - {label: volatility-scaled model, value: 0.00379, comparison: "against 0.00495 unconditional, a 23.4% improvement; lower is better"}
      - {label: full model, value: 0.00393, comparison: "worse than volatility alone despite more information"}
      - {label: bear-market model, value: 0.00400, comparison: "also worse than volatility alone"}
      - {label: out-of-sample refits, value: 318, comparison: "each trained only on preceding data"}
    figures: []
  verdict: supported
  reasoning: >
    The positive result and the negative result arrive together. Severity is predictable,
    and the simplest possible conditioning variable already extracts it. That combination
    sets the bar every later layer has to clear, and shapes the honest version of the
    system.
  caveats:
    - >
      A scoring rule that cannot be gamed still measures average performance, and average
      performance can hide systematic failure on a specific kind of day.
  produced_claims: [clm-severity-forecastable]
  changed_because_of_this: >
    Trailing volatility became the baseline every subsequent candidate had to beat, rather
    than one feature among many.
  reproduce: "uv run python -m unstructured_momentum.model.severity --backtest --horizon 10 --quantile 0.05"
  history:
    - {date: 2026-08-16, note: "Run, then reproduced from a clean interpreter before being quoted anywhere."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-004
  title: Is the severity model honest about how often it will be wrong?
  one_breath: >
    Checks whether losses exceed the model's own estimates at the promised rate, and
    whether those breaches cluster.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-01
  hypothesis: >
    A conventional volatility model with an asymmetric, skewed error distribution will be
    well calibrated, and the quantile-regression model will not be.
  prediction: >
    The conventional model will pass the standard coverage tests. Any miscalibration in
    the other model will be visible in the breach rate rather than in the average score.
  data:
    - source: src-french
      slice: daily momentum returns
      tier: DESIGN
      vintage: 2026-08-13
  method:
    statistic: breach rate, plus tests of correct rate, independence, and both jointly
    unit: daily forecast
    grid: two model families crossed with two quantiles
    null_model: breaches occur at the stated rate and independently of each other
    correction: not applicable
    power: 325 forecasts
    controls: [out-of-sample forecasts only]
  result:
    headline: >
      The conventional model is well calibrated on every test. The other model is wrong in
      both directions at once, too cautious on average and not cautious enough at crowded
      rotations.
    numbers:
      - {label: conventional model breach rate, value: 0.052, comparison: "against 0.050 expected, essentially exact"}
      - {label: test that the rate is correct, value: "p = 0.850", comparison: "no evidence against correct calibration"}
      - {label: test that breaches do not cluster, value: "p = 0.279", comparison: "no evidence of clustering"}
      - {label: other model breach rate, value: 0.028, comparison: "against 0.050 expected; too conservative overall"}
      - {label: test of that shortfall, value: "p = 0.054", comparison: "borderline, so real but not overwhelming"}
    figures: []
  verdict: supported
  reasoning: >
    Building a genuinely strong classical baseline was the right call, because a weak one
    would have flattered everything that came after. The two-sided miscalibration finding
    was not predicted and is more useful than the calibration result itself.
  caveats:
    - >
      The under-alarm at crowded rotations rests on a handful of episodes and is a
      direction, not a measured magnitude.
  produced_claims: [clm-garch, clm-miscalibration]
  changed_because_of_this: >
    Evaluation moved permanently to two metrics, because average score and breach behaviour
    disagree and only one of them is what a practitioner cares about.
  reproduce: "uv run python -m unstructured_momentum.model.baselines --garch --christoffersen"
  history:
    - {date: 2026-08-16, note: "Run and reproduced."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-005
  title: Does any crowding or stress measure beat plain trailing volatility?
  one_breath: >
    Adds six candidate signals to the severity model one at a time and checks whether any
    improves the forecast.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-01
  hypothesis: >
    Measures of crowding and market stress carry information about severity that recent
    volatility does not already contain.
  prediction: >
    At least one of the six will improve the out-of-sample forecast score against the
    volatility-scaled baseline.
  data:
    - source: src-french
      slice: daily factor returns
      tier: DESIGN
      vintage: 2026-08-13
  method:
    statistic: pinball loss against the volatility-scaled baseline
    unit: candidate feature
    grid: 6 candidates crossed with 3 horizons
    null_model: the volatility-scaled model, which is a strong baseline rather than a straw man
    correction: not applicable; each candidate is judged against the same fixed baseline
    power: 318 out-of-sample forecasts per candidate
    controls: [identical training windows and refit schedule across candidates]
  result:
    power_statement: >
      This design cannot distinguish a useless feature from a useful one at realistic effect
      sizes. Handed a genuinely predictive signal blended with noise, the framework does not
      prefer it to trailing volatility until the signal is nearly noiseless; at a 40 percent
      signal share the gain is still negative.
    planted_effect: >
      A planted-effect check WAS run and the instrument FAILED it. That is what reclassifies
      this: six candidates losing to trailing volatility says nothing about those candidates,
      because a known-good signal also loses. The question of whether any crowding measure
      beats trailing volatility is reopened at the measure layer.
    headline: >
      All six candidates lose. Every one of them is computed from past returns, and that
      shared property is more informative than any individual failure.
    numbers:
      - {label: candidates tested, value: 6, comparison: "crowding, bear-market state, leg-beta asymmetry, eigenvalue concentration, joint stress on quiet days, implied volatility"}
      - {label: candidates that beat the baseline, value: 0, comparison: "out of six, on out-of-sample forecast score"}
    figures: []
  verdict: instrument_limited
  reasoning: >
    Six failures with a common cause is a finding rather than six disappointments. It
    redirected the remaining work toward families that are not functions of past returns:
    forward catalysts, text about the companies held, contractual rebalancing, and option
    prices on the book itself.
  caveats:
    - >
      Each candidate was tested in a simple additive form. A more elaborate functional form
      could in principle succeed where the simple one failed, though with this few
      independent regimes that flexibility would mostly buy overfitting.
  produced_claims: [clm-nothing-beats-vol]
  changed_because_of_this: >
    The remaining research plan was rewritten around non-return-derived data families.
  reproduce: "uv run python -m unstructured_momentum.model.severity --ladder"
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now instrument_limited. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-17, note: "Fifth and sixth candidates added. The shared-property observation only became visible at six."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-006
  title: Is the 2007 quant crisis actually a momentum event?
  one_breath: >
    Measures the two most famous episodes on momentum alone and on all factors jointly,
    and finds each detector blind to one of them.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-01
  hypothesis: >
    The 2007 crisis and the 2019 reversal are different phenomena that share a name, and a
    single detector cannot see both.
  prediction: >
    At least one of the two will fail to register as extreme on a momentum-only measure
    while registering as extreme on a joint measure across factors.
  data:
    - source: src-french
      slice: daily factor returns covering both episodes
      tier: DESIGN
      vintage: 2026-08-13
  method:
    statistic: severity percentile, momentum-only and jointly across factors
    unit: episode crossed with construction
    grid: 12 constructions
    null_model: the full historical distribution of daily moves
    correction: not applicable
    power: full sample
    controls: [construction, horizon]
  result:
    headline: >
      The 2007 crisis is not a momentum event and the 2019 reversal is not a joint event.
      They are mirror images and each detector is blind to the other's worst day.
    numbers:
      - {label: 2007 measured on momentum alone, value: 5.97th percentile, comparison: "clears no severity threshold in any of 12 constructions"}
      - {label: 2007 measured jointly, value: 0.10th percentile, comparison: "the most extreme day in the entire sample"}
      - {label: 2019 measured on momentum alone, value: -6.03 sigma, comparison: "a severe event"}
      - {label: 2019 measured jointly, value: "+0.59", comparison: "positive, so a non-event on the measure that flags 2007"}
    figures: []
  verdict: supported
  reasoning: >
    This is the most surprising result in the project and it survived checking in twelve
    constructions. It justifies running two detectors rather than combining them, and it
    means the widely repeated description of 2007 as a momentum crash is imprecise.
  caveats:
    - >
      The joint measure aggregates four factors with equal standing. A different weighting
      would move the 2007 percentile, though not far enough to change the conclusion.
  produced_claims: [clm-quake-not-momentum, clm-2019-mirror]
  changed_because_of_this: >
    The episode registry was inverted so that the 2007 crisis must be absent from the
    momentum detector for the check to pass.
  reproduce: "uv run python -m unstructured_momentum.factor.comovement --episodes 2007-08,2019-09"
  history:
    - {date: 2026-08-15, note: "Reproduced across all twelve constructions because the first result was too surprising to trust."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-007
  title: Does sorting reversals into two types help forecast them?
  one_breath: >
    Tests whether the panic-rebound and crowded-rotation distinction both describes
    episodes and improves predictions, or only the first.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-06
  hypothesis: >
    Reversals fall into two mechanically distinct types, and knowing which type is live
    improves a severity forecast.
  prediction: >
    The two groups will separate on state variables measured at the trough, and adding
    group membership to the severity model will improve its score.
  data:
    - source: src-french
      slice: daily factor returns with episodes labelled by a pre-specified rule
      tier: DESIGN
      vintage: 2026-08-13
  method:
    statistic: group means at troughs, and pinball loss with group membership added
    unit: episode
    grid: two gates, descriptive and predictive
    null_model: no difference between groups, and no improvement over the baseline
    correction: not applicable
    power: limited by the regime count, which is why the descriptive gate carries the weight
    controls: [labels assigned by rule rather than by hand]
  result:
    headline: >
      The descriptive half passes cleanly and the predictive half fails. The taxonomy is
      real and does not help forecast.
    numbers:
      - {label: bear-market indicator at trough, value: "1.000 versus 0.167", comparison: "panic rebounds versus crowded rotations; a clean separation"}
      - {label: joint-factor stress at trough, value: "-3.509", comparison: "for joint unwinds against better than -0.24 for every other group"}
      - {label: losing-side downside beta, value: "1.588 versus 1.209", comparison: "panic rebounds versus crowded rotations"}
      - {label: effect on forecast score, value: worse, comparison: "adding the group label degrades a model trailing volatility already wins"}
    figures: []
  verdict: inconclusive
  reasoning: >
    Recorded as mixed rather than supported or refuted, because the two gates genuinely
    disagree and collapsing them into one verdict would hide the useful part. The taxonomy
    earns a place in the explanation and is excluded from the model.
  caveats:
    - >
      Labels come from a rule fixed in advance, which prevents fitting the taxonomy to the
      narrative but does not guarantee the rule itself is the right one.
  produced_claims: [clm-taxonomy]
  changed_because_of_this: >
    Later layers are judged on whether they would have changed a specific historical
    briefing, rather than on forecast score, which they would all fail.
  reproduce: "uv run python -m unstructured_momentum.features.channels --separation"
  history:
    - {date: 2026-08-17, note: "Both gates run. The split verdict is the result."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-008
  title: What did the system actually see on the eve of the September 2019 reversal?
  one_breath: >
    Rebuilds every measurement available on one historical morning and compares it against
    what happened next.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-01
  hypothesis: >
    The reason the book was fragile in September 2019 was visible in the data available at
    the time, in some form.
  prediction: >
    Either the portfolio-level measures will have shown elevated risk, or they will not and
    something more granular will.
  data:
    - source: src-iwv
      slice: holdings as of 2019-09-06, both sides of the book
      tier: DESIGN
      vintage: 2026-08-15
    - source: src-fred
      slice: interest rate and credit series to 2019-09-06
      tier: DESIGN
      vintage: 2026-08-15
  method:
    statistic: percentile of each measure against its own history, strictly point-in-time
    unit: measure
    grid: portfolio-level measures against holding-level measures
    null_model: not applicable; this is a case study
    correction: not applicable
    power: a single date, so this is characterisation and not inference
    controls: [nothing dated after 2019-09-06 enters any calculation]
  result:
    headline: >
      Every portfolio-level summary said the book was ordinary. The individual holdings
      said it was one bet on falling interest rates wearing ten sector labels. The failure
      was aggregation, not measurement.
    numbers:
      - {label: full model loss estimate, value: "-3.94%", comparison: "against -4.86% for the no-information baseline; calmer than knowing nothing"}
      - {label: same estimate from volatility alone, value: "-4.70%", comparison: "roughly neutral, so volatility was not the cause"}
      - {label: same estimate from the bear-market term alone, value: "-3.48%", comparison: "this is what produced the complacency"}
      - {label: what actually happened over five days, value: "-6.98%", comparison: "worse than the model's -4.41% estimate of the average bad outcome"}
      - {label: trailing volatility, value: 75th percentile, comparison: "not low, contradicting my own initial explanation"}
      - {label: sector concentration, value: 50th percentile, comparison: "reads as ordinary diversification"}
      - {label: portfolio interest-rate sensitivity, value: 32nd percentile, comparison: "reads as unremarkable"}
      - {label: rate sensitivity of the twelve largest holdings, value: median 26th percentile, comparison: "five of twelve in the bottom fifth of all stocks"}
      - {label: crowding within the winning side, value: 87th percentile, comparison: "against the market-wide correlation index at the 26th"}
    figures: []
  verdict: supported
  reasoning: >
    This is the spine of the whole project. The model failed on this date and the reason is
    fully traceable, which makes it a better exhibit than a date where the model was right.
    It also produced the aggregation diagnosis that redirected the system toward describing
    exposure rather than predicting timing.
  caveats:
    - >
      One date. The aggregation diagnosis generalises as a mechanism argument, not as a
      measured frequency, and the project does not claim otherwise.
    - >
      My own first explanation of the model's calmness was wrong, twice, and only
      decomposing the model revealed it. The wrong version is kept in the record.
  produced_claims: [clm-aggregation, clm-2019-complacency, clm-lowvol-wrong]
  changed_because_of_this: >
    The briefing gained a section listing what could not be measured on the date in
    question, and holding-level measures were promoted above portfolio-level ones.
  reproduce: "uv run python -m unstructured_momentum.report.memo --as-of 2019-09-06"
  history:
    - {date: 2026-08-16, note: "First run."}
    - {date: 2026-08-18, note: "Decomposed after catching my own wrong explanation. The decomposition is what turned a story into a finding."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-009
  title: Does news coverage discuss factor crowding before a reversal?
  one_breath: >
    Reads every article in the weeks before the September 2019 reversal, by hand and by
    machine, and counts the genuine ones.
  status: complete
  registered_at: null
  registered_commit: null
  closes_question: q-03
  hypothesis: >
    Market commentary discusses crowded factor positioning before an unwind, and a language
    model can extract that discussion where keyword matching cannot.
  prediction: >
    A minority of retrieved articles will be genuine factor-positioning items, and the
    language model will identify them far more precisely than keyword matching.
  data:
    - source: src-gdelt
      slice: articles in the 25 days before 2019-09-06 matching factor and crowding terms
      tier: DESIGN
      vintage: 2026-08-18
  method:
    statistic: precision against hand labels, and count of genuine items
    unit: article
    grid: publisher quality tiers
    null_model: the corpus contains no genuine items
    correction: not applicable
    power: 246 articles, ample to detect a signal of any useful size
    controls: [hand labels recorded in a file anyone can open and check]
  result:
    power_statement: >
      The data layer decides this before any test runs. The news index begins in 2017 and caps
      each query at 250 records, and 246 articles survived filtering, so the slice is at its
      ceiling. A design at its retrieval cap cannot separate 'news does not discuss crowding'
      from 'the reachable slice of news does not'.
    planted_effect: >
      No plant was run and the coverage audit fails first, so one would not settle it.
      Reopening requires a corpus without the cap, which prices the question rather than
      answering it.
    headline: >
      The corpus is empty. Hand labelling found no genuine items in 246 articles, and the
      language model reading blind agreed. The model is however sixteen times more precise
      than keyword matching at saying so.
    numbers:
      - {label: genuine factor-positioning items by hand, value: "0 of 246", comparison: "209 templated filler, 22 macroeconomic, 15 other"}
      - {label: highest-quality sources, value: "0 of 8", comparison: "the major-wire hits were a bond survey, gold, and recession sentiment"}
      - {label: articles marked relevant by keyword matching, value: "48 of 48", comparison: "against 3 of 48 by the language model, same articles"}
      - {label: templated filler correctly rejected, value: "20 of 20", comparison: "against 0 of 20 for keyword matching"}
      - {label: date of actual unwind coverage, value: "12 to 14 September", comparison: "after the move on the 9th to 11th"}
    figures: []
  verdict: instrument_limited
  reasoning: >
    The hypothesis is refuted and the refutation is a deliverable. Two independent methods
    agreeing that a corpus is empty is a much stronger statement than either alone. The
    filtering-precision measurement is a separate positive result and is what makes reading
    a larger corpus feasible.
  caveats:
    - >
      The free news index starts in 2017 and caps every query at 250 records, so this
      cannot distinguish an empty world from an incomplete index. That distinction is
      exactly what a licensed archive would buy.
    - >
      Coverage about factors was tested. Coverage about the individual companies held is a
      different corpus and remains untested.
  produced_claims: [clm-news-crowding, clm-semantic-filter, clm-empty-corpus]
  changed_because_of_this: >
    The text effort moved from market commentary to text about the individual companies
    held, and the language model's role narrowed to filtering and structuring.
  reproduce: "uv run python -m unstructured_momentum.llm.evaluate --corpus 2019-09 --compare"
  history:
    - {date: 2026-08-26, note: "Reclassified under the diagnostic protocol on 2026-08-26. Original verdict refuted; now instrument_limited. The original verdict stays in this history rather than being overwritten, because the record of our own over-killing is evidence the protocol works."}
    - {date: 2026-08-18, note: "Hand labels and model labels produced without reference to each other."}
    - {date: 2026-08-21, note: "Recorded retrospectively.", admin: true}

- id: exp-010
