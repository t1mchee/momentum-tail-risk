    '
  data:
  - source: src-french
    slice: daily WML, 1926-11-03 to the design-tier seal at 2023-01-01
    tier: DESIGN
    vintage: 2026-08
    coverage_note: 'The published factor rather than the reconstructed book. The brief names this series,
