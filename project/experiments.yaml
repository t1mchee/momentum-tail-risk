      INTERPRETATION was wrong: news co-mention carries genuine cross-sectional structure,
      and that structure is a strict subset of what trailing return correlations already
      contain. Part B, mixed as registered: the 2019 era-permutation misses the frozen
      top-five-percent gate narrowly (p 0.0574, rank 7 of 122 windows) so the
      exceptionality claim stays retracted; the entanglement attack FAILS (overlap-
      disjoint books still converge at 0.821 versus a corrected placebo 90th percentile
      of 0.442) so the convergence itself is genuine; the size-matched placebo floor
      moved DOWN (0.264 mean), against the reviewer's direction. Part C: the exit-door
      conclusions are robust to episode clustering (35 episodes; null cell interval
      -0.024 to +0.030; reversed cell +0.041 to +0.101, still excluding zero).
    numbers:
      - {label: text minus correlation-cluster increment, value: "-0.0144 monthly mean", comparison: "Newey-West t -6.5; text wins 2 of 120 months; correlation clusters 0.0273 vs text 0.0129 over point-in-time sectors"}
      - {label: text minus weight-matched placebo, value: "+0.0056", comparison: "Newey-West t 13.0; above the per-partition placebo 90th percentile in 99.2 percent of months -- real structure, subset of price structure"}
      - {label: 2019 era-permutation rank, value: "7 of 122 windows (p 0.0574)", comparison: "fails the frozen top-5-percent gate by one rank; disjoint-book convergence 0.821 vs corrected floor p90 0.442 survives"}
