  verdict: refuted
  reproduce: uv run python scripts/poc_e1_tail.py
  result:
    headline: 'The design''s tail model as specified is refuted, and the half of it that works is worth
      keeping. Two registered comparisons on 1047 non-overlapping monthly formation dates, 1935-10-31
      to 2022-12-30, at the 5 percent quantile over ten trading days. PRIMARY, SUPPORTED. Dividing by
      trailing volatility beats an unconditional quantile on out-of-sample pinball loss: a ratio of 0.8561
      with a 90 percent circular block bootstrap interval of [0.7864, 0.9277], excluding one. Scaling
      cuts the loss by 14.4 percent and the result is identical at block lengths of six, twelve and twenty-four
      months. SECONDARY, REFUTED. Conditioning on the bear state on top of the scaling makes the forecast
      WORSE: a ratio of 1.0252 with an interval of [1.0046, 1.0457] that excludes one on the wrong side.
      The registration predicted this was possible and said why -- the state splits an already small tail
      sample and the indicator is a coarse binary -- so the fail sentence is the one that publishes and
      the bear state is not used. COVERAGE, FAILED. The registration required both lines to pass a Kupiec
      test at the 10 percent level. The scaled line breaches 75 times in 1047, a rate of 7.16 percent
      against a nominal 5, and Kupiec rejects at p = 0.002. The unconditional line passes at 5.44 percent
      with p = 0.515. On the registered condition the model fails. AND THE POOLED TEST IS THE WRONG INSTRUMENT,
      which is the finding worth more than either verdict. Split by volatility tercile the unconditional
      line breaches at 0.86 percent in calm months and 11.17 percent in volatile ones, a spread of 10.3
      points; it passes the pooled test by averaging two large errors in opposite directions. The scaled
      line spreads 3.4 points. A portfolio manager is never in the pooled sample. The scaled line is uniformly
      about two points too shallow, which is a level offset and is disclosed; the alternative is wrong
      in whichever direction the regime happens to be.

      '
    power_statement: '1047 monthly formation dates, non-overlapping at a ten-day horizon so the breach
      sequence is independent trials and Kupiec means what it says. About 52 breaches are expected at
      the nominal rate, which makes the coverage test informative about gross miscalibration and not about
      small departures. The pinball comparison resolved the primary effect of 14 percent and the secondary
      degradation of 2.5 percent, both with intervals excluding one at three block lengths. What it could
      NOT resolve is stated under planted_effect: an improvement of the exact shape the secondary was
      looking for is worth only 0.4 percent of pinball loss and the comparison cannot see it. So the secondary
      refutes a degradation of the size observed and does not rule out a small benefit; that limit is
      the result, not a caveat on it.

      '
    planted_effect: 'An improvement of the right shape was planted and the comparison FAILED TO DETECT
      IT, which is itself the finding. Multiplying the scaled line by 1.158 brings its breach rate from
      7.16 percent to 5.06 percent, a genuine calibration fix that leaves the conditioning intact. Pinball
      loss scores that at 0.9963 with an interval of [0.9782, 1.0165], which contains one, and no partial
      share of the correction is detected either. A first attempt planted the wrong shape: shrinking the
      scaled line toward the realised unconditional quantile, a constant, which destroys the conditioning
      it is meant to improve and turns into a degradation past 40 percent shrinkage. That was corrected
      before the result was recorded. The consequence is the experiment''s most useful output. Pinball
      loss, the proper scoring rule for a quantile and the one the design scores on, cannot see a fix
      that halves a two-point coverage error. The loss function and the calibration diagnostic disagree
      about what matters, and only the second is about what a reader of the page experiences.

      '
