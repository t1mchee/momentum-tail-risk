- id: exp-088
  title: With ground truth constructed rather than annotated, does the model read a filing in a way a
    keyword rule cannot?
  one_breath: 'Plants real conditions and real boilerplate into declined filings, so recall and specificity
    have a known answer without a human.

    '
  status: complete
  registered_at: 2026-09-04 18:00:00+00:00
  registered_commit: b510f97
  hypothesis: 'Precision and recall for the extractor need labels produced independently of the model,
    and that measurement is blocked on annotation resources this project does not have. Everything reported
    about the extractor is therefore a rate and not an accuracy, and the comparison against a keyword
    rule came back inconclusive because neither reader could be scored against truth. Ground truth can
    be CONSTRUCTED instead of annotated. A condition span the model already extracted from one filing
    is a real statement of an external survival condition in a real filer''s words. Injected into a different
    filing that the model declined, on a different date and for a different company, it makes a document
    whose correct answer is known exactly: a condition is present, and the span stating it is known character
    for character. The same construction runs the other way with real forward-looking boilerplate, which
    the extraction instructions explicitly exclude, giving documents whose correct answer is that no condition
    is stated. This measures three things a rate cannot: whether the reader finds a condition that is
    definitely there, whether it points at the right sentence rather than merely raising a flag, and whether
    it can tell a stated condition from the boilerplate surrounding it in every filing ever written.

    '
  prediction: 'ARM A, planted conditions. The model flags at least 70 percent of documents carrying a
    planted condition, and quotes the planted span itself on at least 60 percent. Span localisation is
    the harder bar and no rate in this package has ever measured it. ARM B, planted boilerplate. The model
    stays declined on at least 85 percent, because the instructions name boilerplate forward-looking risk
    language as not a stated condition and the live decline rate is already 88 percent. ARM C, the keyword
    rule on the same documents, and this is the comparison that matters. I predict the rule''s RECALL
    is comparable to the model''s or better, because the planted spans are real conditions in real vocabulary
    and the rule already fires on 43 percent of all filings. I predict its SPECIFICITY is far worse: it
    should flag most of the boilerplate plants, because boilerplate is precisely the conditional language
    it keys on. If that holds, the model''s contribution is discrimination rather than sensitivity, and
    the difference is measured rather than inconclusive. If the rule matches the model on both, the model
    adds nothing this design can detect and the fail sentence publishes. ARM D, the leakage bound. Recall
    on planted positives is compared between host documents dated on or before 2024-12-31, which may be
    in the labelling model''s training data, and documents from 2025-09-30 onward, which postdate its
    release. I predict no material difference, because the task is reading a span that is present rather
    than recalling a fact. A materially higher recall on older documents would be measured recognition.

    '
  data:
  - source: src-edgar-8k
    slice: filings the model declined, across the 28 formation dates already read
    tier: DESIGN
    vintage: 2026-09
    coverage_note: 'Plants are drawn from grounded condition records on a DIFFERENT formation date and
      a DIFFERENT company from the host, so the host supplies no context making the answer guessable,
      and the plant is language a real filer wrote rather than language the author invented. Boilerplate
      plants are drawn the same way from real filing text. Every plant is injected inside the 18,000-character
      window the reader is given, and its presence there is asserted before the call is made.

      '
  method:
    statistic: 'arm A, the share flagged and the share quoting the planted span; arm B, the share remaining
      declined; arm C, the same for the keyword rule on the same documents; arm D, arm A''s flag rate
      split by host document date

      '
    unit: planted document
    grid: '120 planted positives and 120 planted negatives, hosts sampled without replacement from filings
      the model declined on its committed run. Injection is at a sentence boundary near the 40th percentile
      of the excerpt. Span localisation counts a hit when the returned quote overlaps the planted span
      by at least forty characters, so a partial but correct quotation counts and a quotation of another
      sentence does not.

      '
    null_model: 'the keyword rule on identical documents, which is arm C; for arm A the baseline is the
      model''s own decline on the unplanted host, which is 100 percent by construction

      '
    correction: Four pre-stated arms reported separately; no arm rescues another.
  power_statement: '120 documents per arm gives a binomial standard error near 4.5 points at a rate around
    0.7 and near 3 points at 0.9, so the design resolves a difference between the model and the rule of
    about 10 points and not less. If the two land within 10 points on either quantity the correct report
    is that this sample could not separate them. The design cannot measure precision on real documents,
    only specificity against planted negatives, because a filing the model flagged has no verified answer
    without annotation. That limit is inherited from the blocked labelling entry and is not repaired here.
    Arm D splits arm A roughly in half and resolves only a large recall gap; a small one returns an interval
    containing zero and is reported as not resolved.

    '
  verdict: supported
  reproduce: uv run python scripts/poc_e4_planted.py
  result:
    headline: 'MY OWN PREDICTION IS REFUTED AND THE EXPERIMENT''S QUESTION IS ANSWERED, in opposite directions.
      I predicted the model would flag at least 70 percent of documents carrying a planted condition and
      quote the planted span on at least 60. It flags 19.2 percent and localises 17.5. The model is far
      more conservative than I expected and the registered recall prediction fails. THE CONTROL IS WHAT
      MAKES THE NUMBER READABLE, and the first two runs did not have one. Every host was declined on the
      committed run, but the reader is not deterministic, so the baseline for "does a plant make it flag"
      is not zero. Re-reading the same 120 documents with nothing added, the model flags 1.7 percent.
      So the plant lifts it by +17.5 points, about eleven times the baseline rate. THE KEYWORD RULE LOOKS
      BETTER ON RECALL AND IS NOT. It flags 54.2 percent of planted documents against the model''s 19.2.
      But it also flags 46.7 percent of the same documents UNPLANTED, so its lift is +7.5 points against
      the model''s +17.5. Measured as a response to the thing that was actually added, the model reacts
      more than twice as strongly. Its apparent recall advantage is a base rate. AND ON SPECIFICITY THE
      GAP IS NOT CLOSE. Given real forward-looking boilerplate, which the instructions name as not a stated
