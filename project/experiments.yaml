- id: exp-081
  title: Do the route detectors, read at the formation date, recover the route the episode turned out
    to be?
  one_breath: 'Scores the three detectors against the inventory''s rule-assigned routes, before the event,
    on the only tier where all three detectors exist.

    '
  status: complete
  registered_at: 2026-09-03 09:00:00+00:00
  registered_commit: 8982ae927
  hypothesis: 'A partition is not a system. The system''s claim is that the route can be read at the formation
    date from the detectors of Table 3, ahead of the event, from data available then. If the detectors''
    formation-date readings agree with the routes the crash inventory assigns by rule, the detectors are
    anticipatory. If they agree no better than chance, they are descriptive: they can label a reversal
    after it has happened and cannot type one before. The routes this is scored against are the ones the
    crash inventory assigns by rule, listed in the `needs` field.

    '
  prediction: 'I expect agreement above chance and well below anything decisive, and I expect Route 1
    to be recovered better than Routes 2 and 3, because Route 1 is the only one whose detector reads a
    condition stated in advance rather than a property of returns. Route 3''s detector is the one I expect
    to fail, because Section 3.2 already states it is blind until crowding has moved prices. Chance is
    one in three across three routes.

    '
  data:
  - source: src-iwv
    slice: reconstructed holdings era, 2014-01 to the design-tier seal
    tier: DESIGN
    vintage: '2026-08-19'
    coverage_note: 'Only episodes whose formation date falls inside the reconstructed era can be scored,
      which is what caps the sample at roughly a dozen.

      '
  method:
    statistic: 'share of scorable episodes where the argmax of the three standardised detector readings
      at the formation date equals the rule-assigned route

      '
    unit: episode
    grid: 'the three detector readings as Table 3 defines them: Route 1, the loser leg''s stated-condition
      concentration; Route 2, the winner leg''s rate-sensitivity z net of sector; Route 3, within-leg
      co-movement against its own trailing band. Each standardised on its own pre-episode distribution
      so the argmax is comparable across detectors.

      '
    null_model: one in three, exact binomial
    correction: One statistic, stated in advance.
  power_statement: 'This is the binding constraint and it is stated before the run rather than discovered
    after. At twelve scorable episodes against a one-in-three null, eight hits are needed for a one-sided
    exact binomial p below 0.05, which is an agreement rate of 0.67. The design can therefore detect only
    a large effect. A result of five or six of twelve is the modal outcome under a genuine but moderate
    effect AND under the null, and will be reported as instrument-limited under the floor rule of Section
    5.1, not as a refutation. The registered pass level is 0.67; anything below it publishes the sentence
    that the detectors are descriptive rather than anticipatory at this sample, with the interval printed
    beside it.

    '
  needs:
  - exp-080
  verdict: instrument_limited
  reproduce: uv run python scripts/crash_inventory_score.py
  result:
    headline: 'The detectors agree with the rule-assigned route on 4 of 7 scorable episodes, an agreement
      of 0.571 against a one-in-three null, one-sided exact binomial p = 0.173. The registered pass level
      was 0.67 and 5 of 7 was the smallest count that would have cleared p = 0.05, so this neither clears
      the level nor refutes the claim. It is the outcome the power statement named in advance as modal
      under both a genuine moderate effect and the null, and the floor rule of section 5.1 governs: the
      sentence that publishes is that the detectors are DESCRIPTIVE rather than anticipatory AT THIS SAMPLE,
      with the count printed beside it. Three things about the run are worth more than the headline. The
      sample is the finding. The registration assumed about twelve scorable episodes across three routes.
      The census produced 30 episodes in the reconstructed era, of which only 8 carry a route at all --
      22 are FITS-NONE -- and one of those 8 has a formation date of 2014-03-31, before the 8-K corpus
      begins in 2018, leaving 7. Route 3 has no instances anywhere in the record, so a three-class argmax
      was scored against a truth set containing two classes. Three extraction runs were commissioned to
      fill the Route 1 detector on the design-tier formation dates that lacked it, at 2021-01-31, 2021-03-31
      and 2021-06-30, and all three read cleanly: 154, 221 and 170 filings, zero errors, stated-condition
      rates of 18.2, 8.1 and 8.8 percent. The registered direction is wrong. The registration predicted
      Route 1 would be recovered better than Routes 2 and 3, because Route 1 is the only detector reading
      a condition stated in advance rather than a property of returns. It was recovered on 1 of 3 while
      Route 2 was recovered on 3 of 4, and the argmax lands on Route 2 on 5 of the 7 dates. The detector
      set is biased toward Route 2, and the prediction that was written down is the one that failed. Route
      3''s detector never wins. Its standardised reading is BELOW its own trailing band on every one of
      the seven dates, with a maximum of -0.228. That is an independent second sign of what the census
      already showed: within-leg co-movement, read at formation, carries no signal that a crowded exit
      is building. Section 3.2 says the Route 3 detector is blind until crowding has moved prices, and
      this is that statement measured rather than asserted.

      '
    power_statement: 'At 7 scorable episodes against a one-in-three null, 5 hits are needed for a one-sided
      exact binomial p below 0.05 and 6 for p below 0.01. The observed 4 gives p = 0.173 and a design
      that can distinguish only a very large effect from chance. The registration fixed this before the
      run, naming five or six of twelve as the modal outcome under both hypotheses and committing in advance
      to reporting that as instrument-limited rather than as a refutation. Nothing about the result licenses
      a claim that the detectors do not work; it licenses only the claim that this sample cannot tell.

      '
    numbers:
    - label: agreement
      value: 4 of 7 (0.571)
      comparison: against a 1/3 null; p = 0.173 one-sided exact
    - label: what would have cleared
      value: 5 of 7
      comparison: the registered pass level was 0.67
    - label: why the sample is small
      value: 8 typed of 30 reconstructed-era episodes
      comparison: 22 fit no route; one more predates the 8-K corpus
    - label: classes available in the truth set
      value: 2
      comparison: Route 3 has no instances anywhere in the record
    - label: the registered direction
      value: wrong
      comparison: Route 1 recovered 1 of 3, Route 2 recovered 3 of 4
    - label: Route 3's detector
      value: below its own band on all 7 dates
      comparison: maximum standardised reading -0.228
    - label: extractions commissioned to fill the gap
      value: 3 dates, 545 filings, 0 errors
      comparison: rates 18.2, 8.1 and 8.8 percent at 2021-01-31, 2021-03-31 and 2021-06-30
    figures: []
  reasoning: 'Run because a partition is not a system: the claim the design makes is that the route can
    be read at the formation date, before the event, from data available then. The honest answer at this
    sample is that it cannot be settled, and two by-products are worth more than the headline -- a directional
    prediction that was written down and failed, and a Route 3 detector that never fires either ex post
    in the census or ex ante here.

    '
  caveats: 'The standardisation is full-sample per detector rather than point-in-time. That is what makes
    the argmax comparable across three series measured in different units on one date, which is what the
    statistic needs, and it means each reading knows its own series'' distribution across the whole panel.
    The bias runs toward agreement, so it does not explain the null. The Route 2 detector uses the raw
    ten-year-yield spread rather than the sector-net version Table 3 specifies, because the shipped reference
    panel carries no per-name industry adjustment. Using the raw spread can only add noise to Route 2''s
    own detector, and Route 2 is the one that was recovered, so the shortcut did not manufacture the result.
    Seven episodes is not a sample from which anything about route frequencies, timing or detector ranking
    can be concluded, and none of those statements is made.

    '
