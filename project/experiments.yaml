- id: exp-041
  title: Can a model name a book's shared bet, or does the question decide the answer?
  one_breath: >
    Crosses task framing against the option to decline, to settle which of two conflicting
    results measured the model and which measured its prompt.
  status: abandoned
  registered_at: 2026-08-25T18:00:00Z
  registered_commit: 5976e37
  closes_question: q-03
  hypothesis: >
    WITHDRAWN BEFORE THE GRID RAN. The premise was false and the falsity is the finding.
    The two results were never in conflict, because they were never given the same input. The
    whole-book result fed a model each holding's NEWS with dates and tickers stripped; the
    partition result fed it a HOLDINGS TABLE with sector labels and weights. News carries no
    shared driver and a holdings table supports naming a cross-sector group. Both are true and
    they agree with the rest of the record rather than contradicting it.
    Two errors put a contradiction on the page where none existed. The whole-book claim said
    "given the largest holdings" when its input was news, and it quoted a confidence of 8 out
    of 10 that belonged to the hindsight probe measuring whether the model could date the
    window. Both are now corrected at the claim. This registration was built on the misquote
    without checking it against the experiment behind it, which is the same fault as trusting
    an auditor's reading of the record, one day apart.
    ORIGINAL HYPOTHESIS, kept for the record:
    Two results in this project answer the same question oppositely and both carry real
    matched controls, so one of them is measuring its own prompt rather than the model.
    The earlier one handed a model the largest holdings, asked what they shared, and offered
    an explicit option to decline; it reported no coherent shared exposure at confidence 8 of
    10, and reported the same for randomly drawn companies. The later one asked a model to
    PARTITION the book into exposure groups, against random partitions matched on group count,
    sizes and sector composition, and put 76 names in a duration bucket against 19 for a
    matched random basket given the identical prompt.
    The difference is not a missing control. It is that one framing permits a null and the
    other cannot produce one, because a model asked to partition will always partition. If
    framing decides the answer, the naming capability argued about here does not exist as
    claimed, and the later result is partly the compliance of a model given no way to say
    nothing.
  prediction: >
    Framing dominates and the decline option does not. Specifically: both partition cells
    produce a cross-sector group beating its matched null, in both decline conditions, while
    both whole-book cells produce a decline or a null, again in both decline conditions. That
    would mean the whole-book result and the partition result are compatible and measure different things, and the
    naming seat survives with its scope narrowed to partition tasks.
    Two results would demote it instead. If the decline option flips the answer within a
    framing, the model is complying rather than detecting, and the partition result's result is an artifact
    of being given no exit. If the partition cells fail to beat their matched nulls once
    ensembled over ten runs, the partition result was a lucky draw and the naming claim is withdrawn
    rather than rescoped. A partition that scores above 0.9 adjusted Rand against sectors is
    reported as a relabelling whatever else it achieves, as in the partition result.
  data:
    - source: src-iwv
      slice: >
        The 2019-08-30 and 2021-01-29 books, legs built on the split-corrected panel with
        corporate actions divided out rather than filtered, and the sector-yield add-back
        reported as a sensitivity
      tier: DESIGN
      vintage: 2026-08-25
      coverage_note: >
        Both books are used so the verdict does not rest on the single date the two prior
        experiments disagreed about.
    - source: src-edgar
      slice: company identifiers only; no filing text enters this experiment
      tier: DESIGN
      vintage: 2026-08-25
      coverage_note: >
        Deliberately excluded. This tests whether a model can name what a SORT selected, given
        the holdings. Adding text would confound it with the question five experiments have
        already answered.
  method:
    uses: [mth-anonymised-cot, mth-permutation, mth-cluster-boot]
    statistic: >
      Mean within-group correlation of market-residualised daily returns over the quarter
      FOLLOWING the partition, minus the same for characteristic-matched random groups. For
      the whole-book cells, where no partition exists, the statistic is whether the model
      names an exposure at all and whether the named cohort's within-cohort correlation beats
      its matched null.
    unit: quarter
    grid: >
      Two framings, whole-book and partition, crossed with two decline conditions, offered
      and not offered. Four cells, each ensembled over ten independent runs, on two books.
      Twenty declared cells.
    null_model: >
      AMENDED BEFORE RUNNING, with the original text and the reason kept below.
      Two nulls, both reported: an unmatched random basket from the same index snapshot, and
      a basket matched on sector composition and market-cap decile. 1000 draws each.
      Momentum rank is NOT matched. The original design said it should be, and building it
      showed why it cannot: the winner leg IS the top momentum decile, so a basket matched on
      momentum rank and excluding leg members returned two names out of 266. Loosening it to
      near-winners would be worse than infeasible, because names that just missed the cut
      carry the same conferred tilt, so the null would absorb the treatment. That is the
      sector-matching error of the failed embedding gate repeated one level up, and it is
      avoided here by declining to match on the variable that defines the sample.
      The consequence is stated rather than hidden: these nulls cannot separate "the model
      named what the companies are" from "the model named what the sort selected". That
      separation is not available from a basket comparison at all, which is a limit of the
      question rather than of this design.
      SUPERSEDED TEXT: matched on group count, group sizes, sector composition, market-cap
      decile AND momentum rank, on the reasoning that the reframe holds that the sort
      confers exposure, so a null not holding momentum rank fixed would let the conferred
      tilt register as a naming success. Correct in principle, unbuildable in practice.
    correction: Benjamini-Hochberg across the twenty declared cells
    power: >
      Each cell rests on hundreds of names within a date, so the cross-sectional contrast is
      well powered. The ensemble dimension is the weak one: ten runs bounds run-to-run
      variance loosely and is scored as a stability report rather than a test.
    controls: [characteristic-matched random partitions, identical prompt on a matched random basket, sector-only twin partition, adjusted Rand against GICS6, momentum-rank matching]
    gates: >
      A cell is dropped unless the model returns a valid output covering at least 70 percent
      of book weight, and the covered share is reported for every cell. Agreement across the
      ten runs is reported before any correlation number, because an unstable partition
      cannot support a naming claim however well one draw scores.
    specificity_control: >
      Every cell runs its identical prompt on a characteristic-matched random basket. If the
      named exposures match between the real book and the random one, the model is describing
      markets rather than this portfolio, and that cell fails there regardless of correlation.
  result: null
  verdict: inconclusive
  reasoning: >
    Withdrawn before the grid ran, after two validation calls and a trace of the claim to its
    source. The reconciliation was unnecessary because the contradiction was an artefact of a
    mis-stated claim rather than a property of the model.
    What survives is worth stating. The validation calls reproduced the partition finding on
    the corrected book: eight groups named, the largest being long-duration
    rate-sensitive growth at 39 names, and the whole-book framing on the SAME holdings table
    also named a cross-sector duration group rather than declining. So framing does not decide
    the answer when the input is holdings, which was the prediction this design existed to
    test, answered by two calls instead of a hundred and sixty.
    The amendment made to the null model before withdrawal stands on its own and should
    survive into any successor: matching a momentum leg's null on momentum rank is
    unbuildable, because the leg IS the top decile, and the near-winners that come closest
    carry the same conferred tilt and would absorb the treatment.
  history:
    - {date: 2026-08-25, note: "Registered after noticing that two prior naming results answer the same question oppositely, both with real matched controls, which means the difference is in the asking."}
    - {date: 2026-08-25, note: "Momentum-rank matching added beyond the earlier partition null. The conferred-exposure finding implies a null not holding momentum rank fixed would credit the model for naming what the sort built."}
    - {date: 2026-08-25, note: "EXPERIMENT WITHDRAWN before the grid ran. Tracing the whole-book result to its source showed it consumed news, not holdings, so it never contradicted the holdings-based partition result. The registration had been built on a claim's summary of an experiment rather than on the experiment."}
    - {date: 2026-08-25, note: "Momentum-rank matching WITHDRAWN before any model call, after building it returned two candidates out of 266. The leg is the top momentum decile, so nothing outside the leg shares its momentum rank, and the near-winners that come closest carry the same conferred tilt and would absorb the treatment. Amended pre-run rather than reinterpreted post-run, and the resulting limit on what the nulls can separate is stated in the null model."}

- id: exp-042
  title: Does the model's exposure partition survive the corrected book and an ensemble?
  one_breath: >
    Replicates the holdings-based naming result on a split-corrected leg, over ten runs,
    against two nulls given the identical prompt.
  status: complete
  registered_at: 2026-08-25T21:00:00Z
  registered_commit: 4fc7a01
  closes_question: q-03
  hypothesis: >
    The naming result this project holds rests on a single partition of a single book, drawn
    from a price panel whose corporate actions had not been divided out. Three things about it
    are untested. Whether it survives on the corrected leg; whether it is stable across runs,
    since one draw of a generative model is one draw; and whether it beats a null built from
    companies of the same sectors and sizes rather than from a general random basket.
    The withdrawn reconciliation established that framing does not decide the answer when the
    input is a holdings table, on two calls. What it did not establish is whether the answer is
    right. A model handed 266 tickers with sector labels will produce a confident partition
    whatever the truth, so the question is entirely whether the groups it names co-move more
    than groups a null names from comparable companies.
  prediction: >
    On the corrected 2019-08-30 leg the model's partition beats BOTH nulls on mean within-group
    correlation of market-residualised returns over the following quarter, and the largest
    named group spans more than one GICS sector. Ensemble agreement across ten runs exceeds
    0.5 on the adjusted Rand index, so the partition is a property of the book rather than of
    a sampling temperature.
    Three results would demote it. If the nulls match the real leg, the model is describing
    companies rather than this book. If ensemble agreement falls below 0.5, no single
    partition can be quoted and the naming claim scopes down to whatever survives averaging.
    If the partition scores above 0.9 adjusted Rand against GICS sectors it is a relabelling,
    reported as such whatever its correlation.
  data:
    - source: src-iwv
      slice: >
        The 2019-08-30 winner leg on the split-corrected panel, 266 names, with corporate
        actions divided out rather than filtered; plus the two null baskets drawn from the
        same index snapshot
      tier: DESIGN
      vintage: 2026-08-25
      coverage_note: >
        One book and one date. This is a replication of an existing result under corrected
        inputs and an ensemble, not a claim about momentum books in general.
  method:
    uses: [mth-anonymised-cot, mth-cluster-boot]
    statistic: >
      Mean within-group correlation of market-residualised daily returns over the quarter
      FOLLOWING the partition date, weighted by group size, for the model's partition minus
      the same quantity for the nulls' partitions. Secondary: adjusted Rand against GICS
      sectors, and sector span of the largest group.
    unit: quarter
    grid: >
      One book, three inputs — real leg, sector-and-cap-matched basket, unmatched random
      basket — by ten runs each. Thirty declared cells.
    null_model: >
      Two baskets from the same index snapshot, each the same size as the leg with no overlap
      with it: one matched on sector composition and market-cap decile, one unmatched. Both
      receive the IDENTICAL prompt, so a model that names duration groups for any list of
      companies registers as a null rather than as a finding.
      Momentum rank is deliberately not matched, for the reason established when the previous
      design was amended: the leg IS the top momentum decile, so nothing outside it shares its
      rank, and near-winners carry the same conferred tilt and would absorb the treatment.
      The consequence stands and is stated: these nulls cannot separate naming what the
      companies are from naming what the sort selected.
    correction: Benjamini-Hochberg across the three input arms
    power: >
      Each arm rests on 266 names within one date, so the cross-sectional contrast is well
      powered. The ensemble dimension is not: ten runs bounds run-to-run variance loosely and
      is reported as a stability figure rather than tested.
    controls: [sector-and-cap-matched basket, unmatched random basket, identical prompt across arms, adjusted Rand against GICS]
    gates: >
      A run is dropped unless its partition covers at least 70 percent of leg weight with no
      ticker in two groups and no invented ticker, and the covered share is reported for every
      run. Ensemble agreement is reported BEFORE any correlation number, because an unstable
      partition cannot support a naming claim however well one draw scores.
  result:
    headline: >
      The prediction said the partition would beat BOTH nulls. It beats one decisively and
      loses to the other, so it is reported as inconclusive rather than as the partial win it
      would be if only the first null had been registered.
      Everything else the registration asked for passed. Ensemble agreement across runs is
      0.682 on the adjusted Rand index, well above the 0.5 the design required, so the
      partition is a property of the book rather than of a sampling temperature. The largest
      named group spans five GICS sectors at a median of 46 names, and five of eight surviving
      runs name it some variant of long-duration growth with discount-rate sensitivity, which
      is the exposure this book is independently documented to have carried. Agreement with
      GICS is 0.563, below the 0.9 that would have made it a relabelling, though more than half
      the structure is sector.
      Against a basket matched on the leg's own sector composition and market-cap decile, the
      model's groups co-move more by 0.041 at a t of 6.79. Against an unmatched random draw
      from the same index they co-move LESS, by 0.018 at a t of -1.92. The likely reason is
      that a random slice of the index carries intact high-correlation blocks — utilities,
      REITs, banks in index proportion — while a momentum leg is selected precisely for having
      moved differently, so the random arm is an easier task rather than a stricter control.
      That reading is plausible and was not registered, so it is offered as an explanation to
      test rather than as a finding.
      What can be said without interpretation: the model finds co-moving structure in any list
      of companies it is given, its edge on this book over a composition-matched comparison is
      real and large, and "can a model find co-movement here" is not special to this book.
    numbers:
      - {label: ensemble agreement across runs on the leg, value: "+0.682", comparison: "adjusted Rand, against the 0.5 the registration required; the null arms score 0.826 and 0.693"}
      - {label: leg against the sector-and-cap-matched null, value: "+0.0406", comparison: "t of +6.79; 0.1774 against 0.1368 on within-group correlation of market-residualised returns"}
      - {label: leg against the unmatched random null, value: "-0.0184", comparison: "t of -1.92; the random draw's groups co-move MORE than the leg's, which the prediction did not allow for"}
      - {label: largest named group, value: "46 names across 5 GICS sectors", comparison: "named a variant of long-duration growth with discount-rate sensitivity in five of eight surviving runs"}
      - {label: agreement with GICS sectors, value: "+0.563", comparison: "below the 0.9 that would make it a relabelling, but more than half the structure is sector"}
      - {label: runs dropped by the coverage gate, value: "5 of 30", comparison: "two leg, one sector-matched, two random; the two random runs dropped carried the two highest correlations in the whole grid at 41 and 37 percent coverage"}
    figures: []
  verdict: inconclusive
  reasoning: >
    Inconclusive is the honest verdict and it is not a hedge. The prediction named two nulls
    and required both; one was cleared at a t of 6.79 and the other was lost at a t of -1.92,
    and nothing registered in advance says which of the two is the right comparison. Choosing
    the favourable one now would be selecting a null after seeing the result, which is the
    fault this project has spent a month building machinery to prevent.
    The registration's three demotion conditions did not fire: the nulls do not match the leg,
    ensemble agreement clears 0.5 comfortably, and the partition is not a GICS relabelling. So
    the naming capability is not refuted either. What is refuted is the strong reading, that a
    model shown a book's holdings finds structure specific to that book. It finds structure in
    any list of companies, and on this book it finds more of it than in a composition-matched
    comparison and less than in a broad random one.
    The design flaw worth carrying forward is that the two nulls answer different questions and
    the registration treated them as interchangeable. A composition-matched null asks whether
    the model beats the book's own sector and size structure. An unmatched null asks whether
    this book is a better hunting ground than the market at large. Only the first is a control;
    the second is a difficulty comparison, and it should have been declared as such before the
    run rather than recognised after it.
  history:
    - {date: 2026-08-25, note: "Complete. Prediction failed on one of two nulls. The coverage gate was applied as registered and dropped 5 of 30 runs, including the two random-arm runs carrying the highest correlations in the grid at 41 and 37 percent coverage; without the gate the random arm would have looked stronger still."}
    - {date: 2026-08-25, note: "Registered after the reconciliation was withdrawn. Two validation calls had already shown the partition reproduces on the corrected book; this tests whether it is stable and whether it beats comparable companies, neither of which a validation call can answer."}

- id: exp-043
  title: Does the named partition beat a composition-matched null, with the difficulty gap explained?
  one_breath: >
    Re-runs the naming test with one declared control, the random arm demoted to a labelled
    reference, and its advantage given a registered explanation to check.
  status: complete
  registered_at: 2026-08-26T09:00:00Z
  registered_commit: 8065d1b
  closes_question: q-03
  hypothesis: >
    The predecessor required the partition to beat two nulls, cleared one at a t of 6.79 and
    lost the other at a t of -1.92, and could not adjudicate because nothing declared in
    advance said which comparison the claim rested on. That was a design fault rather than an
    ambiguous result. The two arms answer different questions. A basket matched on the leg's
    own sector composition and market-cap decile asks whether the model finds structure beyond
    what the book's composition already implies, which is a control. An unmatched draw from
    the index asks whether this book is a better hunting ground than the market at large,
    which is a difficulty comparison and cannot refute a claim about the book.
    The explanation for why the unmatched arm wins is registered here so it is checked rather
    than assumed. A random index slice carries intact high-correlation sector blocks —
    utilities, REITs and banks in index proportion — while a momentum leg is selected
    precisely for having moved differently from the market, so its constituents are more
    heterogeneous within any sector. If that is right, the unmatched arm should beat the leg
    on a MODEL-FREE measure of block structure as well, and its advantage is a property of the
    sample rather than of the naming.
  prediction: >
    Primary, and the only claim this experiment can support: the model's partition of the
    corrected winner leg beats the sector-and-cap-matched null on mean within-group
    correlation of market-residualised returns over the following quarter, with ensemble
    agreement across runs above 0.5 on the adjusted Rand index and the largest named group
    spanning more than one GICS sector.
    Registered explanation, checked and reported but not claim-bearing: the unmatched arm's
    mean within-SECTOR correlation, computed without any model, exceeds the leg's. If it does,
    the difficulty gap is confirmed as a property of the sample. If it does NOT, the
    explanation is refuted and the unmatched arm's advantage becomes an open question that
    weakens the primary result, which is recorded as such rather than set aside.
    Demotion conditions unchanged from the predecessor: nulls matching the leg, ensemble
    agreement below 0.5, or an adjusted Rand above 0.9 against GICS, any of which scopes the
    naming claim down regardless of the correlation numbers.
  data:
    - source: src-iwv
      slice: >
        The 2019-08-30 and 2021-01-29 winner legs on the split-corrected panel, with corporate
        actions divided out rather than filtered, plus the matched basket and the unmatched
        reference basket drawn from the same index snapshots
      tier: DESIGN
      vintage: 2026-08-26
      coverage_note: >
        Two books rather than the predecessor's one, so a verdict does not rest on the single
        date. The second book is a different regime and a different leg composition, which is
        the point.
  method:
    uses: [mth-anonymised-cot, mth-cluster-boot]
    statistic: >
      Primary: mean within-group correlation of market-residualised daily returns over the
      quarter FOLLOWING the partition date, weighted by group size, for the model's partition
      minus the same quantity on the sector-and-cap-matched basket given the identical prompt.
      Registered explanation: mean within-GICS-sector correlation of the same residualised
      returns, computed per basket with no model involved, compared across arms.
      Secondary: adjusted Rand against GICS, sector span of the largest group, and ensemble
      agreement across runs.
    unit: quarter
    grid: >
      Two books by three baskets — leg, matched null, unmatched reference — by ten runs each.
      Sixty declared cells, of which only the leg-versus-matched contrast on each book is
      claim-bearing.
    null_model: >
      ONE control, declared primary: a basket from the same index snapshot, the same size as
      the leg, no overlap with it, matched on sector composition and market-cap decile, given
      the identical prompt.
      The unmatched random basket is retained and reported as a DIFFICULTY REFERENCE, labelled
      as such in every table, and is not permitted to refute the primary. It is kept because
      dropping an arm that embarrassed the predecessor would be selecting a null after seeing
      a result, which is the fault this design exists to correct.
      Momentum rank remains unmatched for the reason established when the predecessor's design
      was amended: the leg IS the top momentum decile, so nothing outside it shares its rank,
      and near-winners carry the same conferred tilt and would absorb the treatment. The
      consequence stands: neither arm separates naming what the companies are from naming what
      the sort selected.
    correction: Benjamini-Hochberg across the two claim-bearing contrasts
    power: >
      Each arm rests on the full leg within one date, so the cross-sectional contrast is well
      powered; the predecessor cleared its matched null at a t of 6.79 on eight surviving runs.
      The ensemble dimension is not powered and is reported as a stability figure. Two books
      is not a sample of regimes and no statement about time variation is available here.
    controls: [sector-and-cap-matched basket, identical prompt across arms, model-free within-sector correlation, adjusted Rand against GICS, ensemble across ten runs]
    gates: >
      A run is dropped unless its partition covers at least 70 percent of basket weight with no
      ticker in two groups and no invented ticker, and the covered share is reported for every
      run. The predecessor's gate dropped five of thirty runs including the two carrying the
      highest correlations in the grid, so it is retained unchanged. Ensemble agreement is
      reported before any correlation number.
  result:
    headline: >
      The primary clears on both books and the predecessor's ambiguity does not recur, because
      the comparison that carries the claim was named before the run. Against a basket matched
      on the leg's own sector composition and market-cap decile, the model's partition co-moves
      more by 0.032 at a t of 5.00 on the 2019 book and by 0.070 at a t of 9.17 on the 2021
      one. Ensemble agreement is 0.722 and 0.784 across ten runs, well above the 0.5 required,
      and agreement with GICS is 0.617, below the 0.9 that would make it a relabelling. The
      largest named group runs to a median of 48 names across four sectors and is called a
      variant of long-duration growth with discount-rate sensitivity in ten of the surviving
      leg runs.
      The registered explanation splits, and the split is informative rather than awkward. The
      mechanical test asked whether the unmatched arm exceeds the leg on a model-free
      within-sector correlation: it does on 2019 by 0.046 and does not on 2021 by -0.014. But
      the clause it serves was conditioned on the unmatched arm HAVING an advantage, and the
      two quantities move together on both books. Where the unmatched draw carries more intact
      sector-block structure it beats the leg by 0.030; where it carries less it loses to the
      leg by 0.027. On 2021 there is no advantage to explain.
      That correspondence is two points and was noticed after the run, so it is reported as an
      observation and not as the registered check passing. What the registered check
      establishes on its own is narrower: the unmatched arm's 2019 advantage, which embarrassed
      the predecessor, has a measurable non-model cause.
    numbers:
      - {label: primary lift on the 2019 book, value: "+0.0316", comparison: "t of +5.00; leg 0.1859 against the sector-and-cap-matched control at 0.1543"}
      - {label: primary lift on the 2021 book, value: "+0.0695", comparison: "t of +9.17; leg 0.2605 against control 0.1910"}
      - {label: ensemble agreement across ten runs, value: "0.722 and 0.784", comparison: "adjusted Rand on the two legs, against the 0.5 the registration required"}
      - {label: agreement with GICS sectors, value: "+0.617", comparison: "below the 0.9 that would make the partition a relabelling; roughly three fifths of the structure is sector"}
      - {label: block structure against performance, value: "signs track on both books", comparison: "2019 unmatched carries +0.046 more within-sector correlation and wins by 0.030; 2021 it carries -0.014 less and loses by 0.027. Noticed after the run, on two points"}
      - {label: largest named group, value: "median 48 names across 4 sectors", comparison: "a long-duration growth with discount-rate sensitivity variant in ten of the surviving leg runs"}
      - {label: runs dropped by the coverage gate, value: "7 of 60", comparison: "gate unchanged from the predecessor, where it removed the two runs carrying the highest correlations in that grid"}
    figures: []
  verdict: supported
  reasoning: >
    Supported, and the thing that made it supportable was declaring the control before the
    run rather than collecting two numbers and choosing between them afterwards. The
    predecessor measured the same contrast at a t of 6.79 and could not use it.
    The honest limits are unchanged by the result. Two books are not a sample of regimes, so
    nothing here speaks to time variation. Neither arm separates naming what the companies ARE
    from naming what the sort SELECTED, because momentum rank cannot be matched without
    absorbing the treatment; the naming seat is validated as useful and not as reading the
    conferred tilt specifically. And roughly three fifths of the partition's structure is
    sector, so what survives the control is a real but minority component.
    ORIGINAL REASONING, kept: registered with one change of substance from the predecessor and
    it is a change to what the design is allowed to conclude, not to what it measures. The same three arms run; only
    one is a control. Naming which comparison carries the claim BEFORE the run is the whole
    point, because the predecessor collected a clean t of 6.79 and could not use it.
    The block-structure explanation is registered as a check rather than offered afterwards,
    for the same reason. It was the obvious reading of the predecessor's result and obvious
    readings arrived at after the fact are how this project has previously talked itself into
    things. If the model-free measure does not show it, the explanation is refuted and that
    counts against the primary result rather than being quietly dropped.
  history:
    - {date: 2026-08-26, note: "Complete and supported on both books. The registered block check splits — confirmed on 2019, refuted on 2021 — but the clause it serves was conditioned on the unmatched arm having an advantage, and on 2021 it has none. The sign correspondence between block structure and performance holds on both books; it was noticed after the run and rests on two points, so it is reported as an observation rather than as the check passing."}
    - {date: 2026-08-26, note: "Registered as the last gate on the exposure stage. Design fully determined by the predecessor's failure mode: one declared control, the difficulty arm retained but labelled, and the explanation for the difficulty gap frozen as a checkable prediction."}

- id: exp-044
  title: Which text representation separates a book's grouping beyond its sector labels?
  one_breath: >
    Five representations, one task, one null, with each arm's statistic chosen by its own
    certificate before any result exists.
  status: complete
  registered_at: 2026-08-25T18:00:00Z
  registered_commit: 92e6a50
  closes_question: q-03
  hypothesis: >
    Every text result in this project has been measured against itself. Filing similarity was
    found to recover industry and stop, embeddings were found instrument-limited, and a model
    naming groups from holdings was found to beat a composition-matched control -- but no two of
    those ran on the same task with the same null, so none is comparable to another and none has
    a floor. The published literature supplies the floor and this project has never run it: a
    binary bag-of-nouns with a document-frequency stopword filter and plain cosine built an
    industry classification that beats standard codes, with no neural encoder anywhere.
    The question is not which representation is best in the abstract. It is which of them
    separates a book's grouping from characteristic-matched baskets AT ALL, once a sector dummy
    is already in the comparison. A representation that cannot beat sector membership is a
    sector detector wearing a more expensive coat.
  prediction: >
    Primary, and the only claim-bearing reading: at least one non-sector representation clears
    the sector floor on the 2019 book at the registered target, against characteristic-matched
    nulls, surviving Benjamini-Hochberg across the five arms.
    Second pre-registered reading, decided now because it decides the atlas seat rather than the
    science: among arms that clear, the CHEAPEST clearing arm takes the seat. A bag-of-nouns
    recipe from 2011 beating vintage-matched transformers is a real outcome and must be reported
    as such, not explained away.
    The interpretation of that cell is pre-committed, because it has a known failure mode: a
    bag-of-nouns win is meaningful only RELATIVE TO THE SECTOR FLOOR. Winning by being a better
    sector detector is not winning, and this project has already measured text similarity to be
    a finer industry classification at roughly a quarter of the sector effect. An arm that beats
    the transformers while merely tracking sector more closely is recorded as a sector detector.
    If NO arm clears the floor, link three of the chain scopes to statistical groupings with
    sector-level labels, which is a working atlas and not a failure.
  data:
    - source: src-edgar
      slice: >
        Item 1 business descriptions and Item 1A risk factors for the 2019-08-30 book and its
        characteristic-matched comparison baskets, from the expanded 2,622-ticker corpus
      tier: DESIGN
      vintage: 2026-08-25
      coverage_note: >
        Item 1 is newly extracted and is the section the entire product-similarity literature
        uses; it had never been sliced out of this corpus before today.
    - source: src-iwv
      slice: daily holdings with sector labels, for the book and the matched nulls
      tier: DESIGN
      vintage: 2026-08-25
  method:
    uses: [mth-permutation, mth-cluster-boot, mth-risk-peers, mth-boilerplate-split]
    statistic: >
      Mean within-group co-movement of market-residualised returns over the quarter FOLLOWING
      the grouping, minus the same on characteristic-matched baskets, per arm.
      THE STATISTIC IS CHOSEN BY CERTIFICATE, NOT BY REPUTATION. For each arm, the
      verdict-bearing statistic is the one with the best certified minimum detectable effect at
      the registered target on THAT ARM'S OWN POOL. This is written into the registration
      because the certification layer just demonstrated that the ranking is pool-dependent: on
      the 2019 embedding pool mean pairwise cosine resolves a forty-percent sub-bet at cosine
      0.05 while the leading eigenvalue needs 0.40, inverting the ordering this project had
      provisionally assumed from an algebraic argument. Selecting the instrument before results
      exist is the certification layer doing its actual job.
    candidate_statistics: [mean_within, max_within, eigen_within, peer_cohesion]
    instrument_choice: >
      The verdict-bearing statistic for each arm is the one with the best certified minimum
      detectable effect at the registered target on that arm's own pool, read off the returns-
      layer certificate before any arm result exists. Ties break on the lower false-alarm rate.
      The network arm cannot share the partition arms' statistic -- a peer set is not a
      partition -- so it carries its own statistic and its own certificate.
    preprocessing: >
      Decided before any arm ran and applied identically to every arm. Every representation is
      CENTRED on the measured cross-section before use, because raw encoder vectors for two
      firms in unrelated businesses sit at cosine 0.97 -- the shared direction is the register
      of a 10-K, not the firm -- and a clusterer handed that geometry has nothing to separate.
      The bag-of-nouns arm approximates the published recipe's noun restriction without a
      tagger, since none is available here. A suffix heuristic alone was measured to keep a
      quarter of the distinct vocabulary and to discard exactly the most discriminative class:
      company names, brands and short nouns. Words appearing capitalised in a clear majority of
      their occurrences are therefore kept as proper nouns, recovering that class for nothing
      and moving the approximation toward the published method. Stated because it is a
      judgement call on the arm that serves as the literature's floor, and a floor set too low
      flatters everything above it.
    unit: book
    grid: >
      Five arms -- sector-dummy floor, TNIC-style peers, the bigram-proximity recipe,
      bag-of-nouns on Item 1, chrono embeddings at the matched vintage -- on one book. Five
      declared cells.
    null_model: >
      Characteristic-matched baskets from the same index snapshot, matched on sector composition
      and market-cap decile, 1000 permutations, with the sector-dummy arm as an explicit FLOOR
      rather than as another competitor. An arm is only interesting to the extent it exceeds
      that floor.
    robustness: >
      Declared after the certificates were issued and before any arm ran. The registered rule
      picks one statistic and it did, but on this panel all three partition statistics reach
      the target at the same cohesion, so the choice falls to a tie-break on false-alarm rates
      of 0.045, 0.055 and 0.065 -- three numbers within about one standard error of each other.
      The rule is applied as written, because a deterministic rule chosen in advance is worth
      more than a better rule chosen now. What is not defensible is presenting its winner as
      though the certificate had discriminated. Every partition arm is therefore ALSO scored
      under the two statistics the tie-break did not pick, reported alongside and excluded from
      the multiplicity correction. If a conclusion moves with an arbitrary choice among equally
      certified instruments, that is the finding.
    correction: >
      Benjamini-Hochberg across the five ARMS only. The two floors are the comparison, not
      competitors in it, so correcting them alongside the arms would spend the family-wise
      budget on rows whose job is to be a benchmark.
    secondary: >
      MATCHED INPUT, declared here as a secondary rather than left as a caveat. The encoder
      reads roughly its first thousand tokens and stops; a bag-of-nouns recipe reads the whole
      section, about ten times as much on a median Item 1. A win driven by reading more text is
      a context-window win, not a representation win, and this experiment has already
      pre-committed to not misattributing exactly that kind of result. The gauntlet therefore
      runs twice -- once with each arm on its natural input, once with every arm cut to the
      encoder's window -- and the difference between the two measures what the extra text buys.
      The primary reading stands on the natural-input run; the matched run decides how the
      primary is DESCRIBED.
    power: >
      The contrast rests on hundreds of names within one date and is well powered
      cross-sectionally; nothing here supports a statement about time variation, and none is
      made. Each arm carries its own certificate, and an arm whose certified MDE exceeds the
      registered target is reported as instrument-limited for that arm rather than as a null.
    controls: [sector-dummy floor, characteristic-matched baskets, per-arm certificate, BH across arms]
    gates: >
      SCOPE, stated so the certificates are not over-read. The existing certificates are
      VECTOR-LAYER, on ONE vintage, at ONE basket size: the 2019 measurement-date pool of Item 7A
      sections under the 2019 checkpoint at basket 168.
      AMENDED 2026-08-25, BEFORE ANY ARM RAN AND WITH NO ARM RESULT SEEN. Building the first arm
      established that those certificates do not bind this experiment at all, and the original
      wording of this gate assumed they did. The verdict statistic here is co-movement lift --
      mean within-group correlation of residual returns against a characteristic-matched
      permutation null. That is a RETURNS-LAYER instrument on a returns panel. The vector-layer
      certificates describe embedding-cohesion instruments on a pool of embedding vectors: a
      different instrument, a different layer, a different pool, and a different section. Citing
      them here would be exactly the over-reading this gate exists to forbid, with the gate
      itself doing the over-reading.
      A third plant layer was therefore added to the harness and this experiment carries a
      RETURNS-LAYER certificate, issued on the exact panel the arms are measured on and
      fingerprinted to it. The plant gives a random subset a genuine common factor at a
      calibrated correlation and asks at what (fraction, correlation) a PERFECTLY informed
      grouping would be detected -- an upper bound every real arm is beneath.
      Basket cannot be fixed at 168 and is not: 168 is the leg, but the measured set is the names
      that have an Item 1 section, an index weight and an unbroken quarter of prices. That is a
      coverage fact, not a design choice, and the certificate is issued on the surviving set
      rather than on a number chosen in advance. Vintage stays at 2019 for the embedding arm.
      Arms whose claim starts at text rather than at vectors still need a text-layer plant, and
      the current text-layer certificate is underpowered, so such an arm is exploratory until
      that is re-issued.
      A certificate grid over basket sizes and vintages is a later rung, taken only if a verdict
      ever depends on another configuration.
  result:
    headline: >
      One arm clears the sector floor, and it is a GROUPING RULE rather than a representation.
      A peer network built from binary nouns on Item 1, thresholded at sector density, separates
      the book's co-movement beyond sector and size at p = 0.002 on natural input and p = 0.001
      on matched input -- the only arm surviving Benjamini-Hochberg in either pass. The same
      vectors forced into a partition do not clear it in either pass. Representation held fixed,
      grouping rule varied, and the rule carried the result.
    primary_reading: supported
    n_measured: 162
    of_leg: 168
    power_statement: >
      max_within (returns layer) resolves a sub-group given a genuine common factor at f>=0.20 at
      cosine>=0.200, at 80% power and alpha 0.05. False-alarm rate 0.052 (+/-0.011, 400
      replicates). Null: group labels shuffled within sector-by-size cells, 1000 draws, on a
      panel of 162 names. Universe 162 rows, hash d0021f70cda6ee39. Null hash 88908c13fb10fcbf. The network arm is gated by
      its own certificate: peer_cohesion resolves the same target at cosine>=0.200, false-alarm
      0.055 (+/-0.016), universe hash 3722defcc03fa076, null hash 3f92ec59f8c91fac.
      CORRECTED 2026-08-26. This statement first quoted false-alarm rates measured under the
      LEAKY characteristic cells, from a console log written before the null was repaired at
      17:48 on 2026-08-25. The certificate artefact was correctly re-issued after the repair and
      the ledger was not updated with it. Both sets are deterministic and both were reproduced
      exactly on 2026-08-26: under the leaky cells mean_within 0.055, max_within 0.045,
      eigen_within 0.065; under the repaired cells 0.065, 0.052 and 0.055. The figures above are
      now the repaired-null ones. mth-null-repair forbids exactly this and was written the same
      day; it caught its own violation. No arm is instrument-limited: all four
      certified instruments reach the registered target on this panel.
    planted_effect: >
      Returns-layer plant, added for this experiment because the existing certificates are
      vector-layer and do not bind a statistic measured on returns. A random subset is given a
      genuine common factor calibrated by bisection to a target mean pairwise correlation --
      verified to hit 0.10, 0.25 and 0.40 to three decimal places -- and the certified arm is a
      PERFECTLY informed one that names the planted set exactly, so every real arm is bounded
      above by it.
    floors_calibrated: >
      All four floors read exactly 0.000000. That is the required reading, not a null result:
      the sector partition cannot explain anything beyond sector, so under a correctly
      sector-matched permutation it must be invariant. It was not, on the first run, and the
      floor row is what said so.
    not_robust_to_the_statistic: >
      Among the PARTITION arms the ranking flips with the tie-break. Under max_within, the
      statistic the certificate picked, bag-of-nouns has the largest lift on natural input
      (+0.071, p = 0.032, not surviving correction) and the chrono embeddings are second
      (+0.038, p = 0.184). Under both other certified statistics the order reverses: chrono
      leads (p = 0.023 and 0.004) and bag-of-nouns is the weakest of the three (p = 0.247 and
      0.190). On matched input max_within returns NEGATIVE lifts for both while the other two
      return positive and nominally significant ones. Since the tie-break separated false-alarm
      rates of 0.045, 0.055 and 0.065 -- within about one standard error -- no ordering among
      the partition arms is supported.
    max_within_is_the_wrong_instrument: >
      Recorded as a measured property of the instrument rather than as an excuse. A maximum over
      groups is decided by one group, and this project already holds a trap about a lucky cell in
      a three-by-three grid. Its certified MDE and false-alarm rate are indistinguishable from
      the alternatives, so the certificate could not see the difference; the two runs could.
    tnic_is_partly_a_sector_detector_and_the_result_survives_it: >
      31.6 percent of the network's edges join same-sector pairs against a 15.0 percent base
      rate, a 2.1-fold enrichment, and in ABSOLUTE terms its peers co-move LESS than sector-mates
      do (0.143 against 0.156 on identical edge counts). Sector remains the stronger raw
      grouping. The result stands anyway because the null permutes firms within sector-by-size
      cells, so every peer set's sector composition is held fixed and the enrichment cannot
      produce the p-value.
    truncation_cost: >
      Cutting every arm to the encoder's window removes the partition arms' signal under the
      picked statistic and leaves it under the others, and it kills the bigram arm outright: its
      ten dimensions count risk words near seed topics, and in 5,595 characters most documents
      have no hits, so 150 of 162 names land in one cluster. Reported as a degenerate arm rather
      than as a null. The network arm is unaffected.
    transformers_did_not_lose_to_the_bag_of_nouns: >
      The pre-committed warning was that a bag-of-nouns win over transformers would be
      meaningful only relative to the sector floor. That scenario did not arise. Under both
      non-degenerate statistics and in both passes the chrono embeddings carry a lower p-value
      than the bag-of-nouns partition.
    numbers:
      - {label: "tnic peer network, natural input", value: "lift +0.0113, p 0.002", comparison: "against a sector-density-matched network floor of exactly 0.0000; the only arm surviving BH across the arms"}
      - {label: "tnic peer network, matched input", value: "lift +0.0091, p 0.001", comparison: "same conclusion when every arm is cut to the encoder's window"}
      - {label: "bag-of-nouns as a PARTITION, same vectors", value: "p 0.032 / 0.247 / 0.190", comparison: "under max_within / mean_within / eigen_within on natural input; not significant after correction under any"}
      - {label: "chrono 2019 embeddings, partition", value: "p 0.184 / 0.023 / 0.004", comparison: "same three statistics; leads the partition arms under the two the tie-break did not pick"}
      - {label: "sector enrichment of the winning network", value: "31.6% against 15.0%", comparison: "2.1x, and its absolute cohesion is BELOW sector's at identical edge count; the null holds sector fixed, so this is not what drives the result"}
      - {label: "encoder coverage", value: "99 of 162 sections whole", comparison: "at 8,192 tokens; at the 1,024 every previous pass in this project used, a median 6,641-token section was cut to about a seventh"}
      - {label: "book coverage", value: "162 of 168 names", comparison: "96 percent of the leg, against 78 percent before the extraction fixes"}
  evidence:
    - {label: "tnic peer network, natural input", value: "lift +0.0113, p 0.002", comparison: "against a sector-density-matched network floor of exactly 0.0000; the only arm surviving BH"}
    - {label: "tnic peer network, matched input", value: "lift +0.0091, p 0.001", comparison: "same conclusion when every arm is cut to the encoder's window"}
    - {label: "bag-of-nouns as a PARTITION, same vectors", value: "p 0.032 / 0.247 / 0.190", comparison: "under max_within / mean_within / eigen_within on natural input; not BH-significant under any"}
    - {label: "chrono 2019 embeddings, partition", value: "p 0.184 / 0.023 / 0.004", comparison: "same three statistics; leads the partition arms under the two the tie-break did not pick"}
    - {label: "sector enrichment of the winning network", value: "31.6% against 15.0%", comparison: "2.1x, and its absolute cohesion is BELOW sector's at identical edge count -- the null holds sector fixed, so this is not what drives the result"}
    - {label: "encoder coverage", value: "99 of 162 sections whole", comparison: "at 8,192 tokens; at the 1,024 every previous pass in this project used, a median 6,641-token section was cut to about a seventh"}
  verdict: supported
  reproduce: uv run python scripts/run_exp044_gauntlet.py --certify --no-embed --n-rep 40 && uv run python scripts/run_exp044_gauntlet.py --run --n-perm 1000
  reasoning: >
    The registered primary reading is met: at least one non-sector representation clears the
    sector floor against characteristic-matched nulls, surviving Benjamini-Hochberg across the
    arms. Exactly one does, in both passes.
    The second pre-registered reading awards the atlas seat to the cheapest clearing arm. Only
    one arm clears and it is the cheapest -- binary nouns on Item 1, no encoder anywhere in it --
    so the seat goes to the bag-of-nouns representation, reached through the published
    density-calibrated peer network rather than through a partition.
    The finding underneath is sharper than the contest the experiment was framed as. The two
    arms that share a representation and differ only in grouping rule land on opposite sides of
    the line, in both passes, while the three arms that share a grouping rule and differ in
    representation cannot be ordered at all once the arbitrary tie-break is varied. On this book
    and this horizon, how a representation is turned into groups mattered more than which
    representation it was -- and the published network's distinctive property, that it is not a
    partition, is the part that carried it.
    Two cautions belong with the verdict. It rests on ONE book at ONE date over ONE quarter, so
    it says nothing about time variation and none is claimed. And the winning arm is measurably
    a partial sector detector; it survives only because the null holds sector fixed, which is
    the one property that construction had to have and did not have until the floor row caught
    it.
  history:
    - {date: 2026-08-25, note: "Registered on certified ground. The re-issued certificates showed every detectable effect moves with the universe, so this is the first experiment whose instruments were selected by measurement rather than by argument."}
    - {date: 2026-08-25, note: "Gates amended before any arm ran, with no arm result seen. The vector-layer certificates this registration leaned on do not bind a returns-layer verdict statistic, so the harness gained a third plant layer and this experiment carries its own certificate on its own panel. Basket is the surviving common support rather than 168, because 168 names do not all have the inputs."}
    - {date: 2026-08-25, note: "The false-alarm estimate was itself underpowered: 100 replicates give a standard error of 0.022 on a rate near 0.05, and two seeds of the same certificate returned 0.05 and 0.13. Raised to 400 and every certificate now carries its replicate count, so the rate is a number with an error bar rather than a number."}
    - {date: 2026-08-25, note: "Item 1 was empty for 36 of the 168 leg names and their Item 1A ran to the 200,000-character cap. Four extraction bugs, fixed and measured on held-out filings before any arm read the text. The corpus a comparison runs on is part of the comparison."}

- id: exp-045
  title: Does any selection rule confer the tilt, or only selection on past returns?
  one_breath: >
    One set of placebo books, three verdicts: is the conferred tilt momentum-specific, and do
    the namer and the peer network find structure no sort built?
  status: complete
  registered_at: 2026-08-25T23:30:00Z
  closes_question: q-03
  hypothesis: >
    This project's central finding is that the momentum sort MANUFACTURES the exposure it later
    gets blamed for -- a selection rule applied to past returns confers a factor loading on the
    names it selects, which is why five text experiments found nothing: the exposure did not
    exist in any document because it did not exist until the ranking was computed.
    That finding has never been given a null. If ANY selection rule applied to the same universe
    confers a comparable tilt, the claim is not about momentum at all; it is about selection, and
    the conferred series is a diagnostic of sorting rather than a property of this factor.
    Two downstream results inherit the same gap. A model naming groups from a book's holdings
    beats a composition-matched control at t of 5.00 and 9.17, and the claim itself records that
    the design "cannot separate naming what these companies ARE from naming what the sort
    SELECTED, because a null matched on momentum rank is unbuildable when the leg is the top
    momentum decile". A placebo book dissolves that objection: it is a book no sort constructed,
    so structure found in it cannot have been conferred by selection. The peer network that was
    the comparator's one clearing arm inherits the identical gap.
    Three questions, one set of placebo books, one registration.
  prediction: >
    PRIMARY, one cell, uncorrected. The momentum book's absolute conferred beta spread sits
    ABOVE the 95th percentile of the placebo distribution, on the 134-month panel. The panel is
    the answer; the single 2019 date is the exhibit.
    Pre-committed readings, all three outcomes, so that no result can be re-described after the
    fact:
      * momentum well above placebo -- the finding stands as momentum-specific and the conferred
        series keeps its headline.
      * momentum indistinguishable from placebo -- the claim CHANGES, to "selection on past
        returns confers tilt generically". That is a real finding and a sharper one, not a
        failure: it reframes the conferred series as a selection diagnostic and makes the five
        text nulls a statement about sorting rather than about momentum. Only the two registered
        rungs follow, in order: loading-beyond-matched-characteristics, then alternative factor
        loadings.
      * momentum BELOW placebo -- treated as a construction fault and diagnosed before it is
        interpreted, because a sort selected on past returns producing LESS return-related tilt
        than a random draw is more likely a bug than a discovery.
    SECONDARY A, namer discrimination. The two real books score t = 5.00 (2019) and t = 9.17
    (2021) against composition-matched controls. Prediction: placebo books score materially
    lower, with the real values outside the placebo t-distribution. If placebo books score
    comparably, the namer is reading what the companies ARE and not what the sort conferred,
    which caps the naming seat and settles its ceiling.
    SECONDARY B, peer-network discrimination. The comparator's one clearing arm scored lift
    +0.0113 at p = 0.002 on the 2019 winner leg. Prediction: placebo books do not clear their
    sector floor at comparable strength. If they do, the peer-network structure is a property of
    US large-cap filings rather than something momentum selection assembled -- which does not
    retract the comparator result, but scopes it.
  data:
    - source: src-iwv
      slice: >
        The identical universe the real sort runs on, at the same dates, after the same
        split-correction and the same regression gate. Placebo legs are drawn to the SAME SIZE
        as the real legs at each date rather than to a fixed count, so leg size is matched by
        construction rather than by assumption.
      tier: DESIGN
      vintage: 2026-08-25
    - source: src-french
      slice: daily Mkt-RF, SMB, HML for the loading block
      tier: DESIGN
      vintage: 2026-08-25
    - source: src-edgar
      slice: Item 1 business descriptions for placebo constituents, for secondary B
      tier: DESIGN
      vintage: 2026-08-25
  method:
    uses: [mth-permutation, mth-cluster-boot, mth-risk-peers]
    statistic: >
      PRIMARY: absolute conferred beta spread, |winner-leg minus loser-leg market loading over
      the 12-month FORMATION window|, momentum rule against the placebo distribution.
      Stated precisely because two different quantities carry the name. The formation-window
      block is what data/processed/conferred_tilt.csv holds and is the registered primary. The
      claim's headline figures -- winners 0.554, losers 2.016, spread 1.46 -- belong to the
      POST-FORMATION block, a different estimand, and at 2019-08 the formation-window spread is
      -0.359. Testing only the formation block would leave the number the claim actually leads
      with untested, so the post-formation block runs as a declared secondary on the same books.
      SECONDARY A: t-statistic of the namer's lift over a composition-matched control, identical
      prompt, identical seam, identical nulls, on k = 10 placebo books.
      SECONDARY B: peer-network cohesion lift against the exact sector-matched null, with the
      statistic chosen per arm by its own certificate, on the same placebo books.
    candidate_statistics: [mean_within, max_within, eigen_within, peer_cohesion]
    instrument_choice: >
      Unchanged from the comparator: the verdict-bearing statistic for each arm is the one with
      the best certified MDE at the registered target on that arm's own pool. The comparator
      established that this rule can pick badly when the tie-break separates false-alarm rates
      by less than their standard error, so where instruments tie, every tied instrument is
      reported and none is presented as chosen.
    unit: book
    grid: >
      Three declared cells -- one primary, two secondaries -- over one set of placebo books.
    null_model: >
      PLACEBO FAMILIES, and which one is the null matters.
      The primary null is CAP-MATCHED random selection: draws stratified to reproduce the real
      book's market-cap distribution, verified by a two-sample KS test before anything is
      scored. Unstratified random draws are confounded by size, because momentum winners are not
      a size-neutral sample of the universe, and a spread difference would then be a size effect
      wearing a selection effect's name.
      Free random selection runs alongside as a labelled diagnostic with its KS distance to the
      real book reported, since it answers the broader question of whether ANY draw confers
      tilt.
      Two structured families test what KIND of rule matters: selection on a SHORT-horizon past
      return, which is still selection on past returns but a different window, and selection on
      a non-return characteristic. If the short-horizon rule confers comparable tilt and the
      characteristic rule does not, the finding is about selection on past returns rather than
      about the 12-1 sort.
      REVERSED MOMENTUM IS NOT AMONG THEM, and the reason is recorded rather than left as an
      omission. Swapping the legs negates the spread exactly, so on the registered ABSOLUTE
      statistic it is identical to the real book by construction -- a degenerate cell of the
      kind that reports as a perfect result while being unable to move. It runs instead as a
      HARNESS CHECK on the signed spread, where it must reproduce the negation to machine
      precision or the leg plumbing is wrong.
    correction: >
      Primary uncorrected, one declared cell. Secondaries Benjamini-Hochberg within their own
      family. Robustness panels across tied instruments reported and excluded from correction.
    gates: >
      Nothing is scored until three data-quality gates pass, all three found while writing this
      registration rather than during the run.
      KS GATE: cap-matched placebo books must be indistinguishable from the real book in
      market-cap distribution.
      SECTOR PLACEHOLDER: 419 names in the panel universe carry "-" as their sector label. It is
      the modal label often enough that top_sector reads "-" in all 134 rows of the existing
      conferred panel. A placeholder ranked as a value is a trap this project has already paid
      for once.
      SECTOR TAXONOMY DRIFT: the panel carries BOTH schemes -- Financial Services and Financials,
      Technology and Information Technology, Producer Durables and Industrials, Materials &
      Processing and Materials, Telecommunications and Communication. iShares switched from the
      Russell scheme to GICS partway through the panel, so a company changes sector without
      changing business. Any sector-matched null over the panel is broken until these are
      reconciled. The single-date comparator was unaffected because its labels are GICS
      throughout; the 134-month panel is not.
  result:
    primary_verdict: supported
    headline: >
      The momentum book's conferred spread sits above the MAXIMUM of its cap-matched placebo
      distribution at the 2019 date, and above the placebo 95th percentile in 104 of 128 months
      on the panel, with the median month at the 100th percentile. The two cells agree, so the
      disagreement between the registration and the work order about which one bears the verdict
      did not have to be adjudicated.
      What the discriminating families add is sharper than the primary. Selection on past returns
      confers the tilt at EVERY look-back window tested -- one, three, six, nine and twelve
      months all clear their own cap-matched nulls at the 100th percentile -- while selection on
      a non-return characteristic confers nothing, sitting below the random null's median. The
      12-1 window is one point on a continuum, not a special case, and the mechanism is selection
      on PAST RETURNS rather than selection as such.
      This confirms the claim as it was already written, which says "a selection rule applied to
      past returns confers a factor loading on the names it selects", and adds the negative half
      the claim never had: a rule that does not sort on returns does not confer one.
    numbers:
      - {label: "2019 cell, real book against its cap-matched null", value: "100th percentile", comparison: "|spread| 0.3585 against a null median of 0.0855, 95th of 0.1316 and MAXIMUM of 0.1592 over 200 books"}
      - {label: "panel, months clearing the placebo 95th", value: "104 of 128 (81.2%)", comparison: "median month at the 100th percentile; median real |spread| 0.2644 against a median null 95th of 0.0825"}
      - {label: "selection on a 1-month past return", value: "0.3052", comparison: "85 percent of the 12-1 sort's tilt, at the 100th percentile of its OWN cap-matched null"}
      - {label: "selection on market capitalisation", value: "0.0579", comparison: "BELOW the random null's median of 0.0855; a non-return characteristic confers nothing"}
      - {label: "window curve, 1/3/6/9/12 months", value: "0.305 / 0.156 / 0.238 / 0.248 / 0.359", comparison: "every window clears its own matched null at the 100th percentile"}
      - {label: "KS gate on the primary null", value: "pass rate 1.00, median KS 0.036", comparison: "against 0.03 for unmatched free draws, which is why the matched family is the primary and the free one a diagnostic"}
      - {label: "recovery of the published panel", value: "difference 0.00e+00", comparison: "the shared measurement path against conferred_tilt.csv at 2019-08-31; reversed legs negate to machine zero"}
    not_universal: >
      At 2020-11-30 the momentum book sat at the 55th percentile of its own placebo distribution
      and did NOT clear -- |spread| 0.0185 against a null 95th of 0.0386. Twenty-four of 128
      months behave that way. The conferred tilt is a strong regularity, not a constant, and any
      exhibit built on it should carry the 81 percent rather than the 2019 date alone.
    leg_size_matters: >
      Placebo legs match the real book's size rather than a fixed hundred, and the reason is
      measured. Sixty random books at 100-name legs give a |spread| 95th percentile of 0.0962
      against 0.0646 at 269, because a smaller leg portfolio is less diversified and its beta
      noisier. Scoring a 269-name book against a 100-name null would have inflated the null by
      about half. The fixed-size family ran anyway, labelled, so the effect is visible.
    one_rule_has_no_null: >
      Selection on market cap has no buildable cap-matched null, because the rule puts every
      chosen name in the extreme buckets and excluding the book's own names leaves those buckets
      empty. Recorded rather than skipped: the absence is informative about the rule, and its raw
      spread against the momentum book's null is reported instead.
    secondary_b_verdict: refuted
    secondary_b: >
      The registered prediction was that placebo books would NOT clear their sector floor at
      comparable strength. Every one of forty did, and 38 of 40 cleared it more strongly than
      the momentum leg. The peer-network structure is a property of US large-cap filings, not
      something momentum selection assembled. Per the pre-committed reading this SCOPES the
      comparator result rather than retracting it: the network still separates a book's grouping
      beyond sector and size, on the momentum leg and on books no sort constructed alike.
      The real leg was RE-MEASURED through the identical path rather than quoted, because the
      comparator's number was computed before the characteristic cells were fixed to never span
      a sector boundary. It survives the fix unchanged, at +0.0114 against a published +0.0113.
      Comparing placebo books under the fixed null with a real number under the leaky one would
      have been a difference in the null wearing the appearance of a difference in the books.
    secondary_b_mechanism: >
      THE MECHANISM PROPOSED HERE WAS TESTED ON 2026-08-26 AND IS REFUTED. It is left in place,
      corrected rather than deleted, because the caveat attached to it was the thing that made
      the test happen.
      The observation stands. In ABSOLUTE peer cohesion the momentum leg sits at the 100th
      percentile of the placebo distribution -- 0.1432 against a placebo median of 0.0761 -- and
      in LIFT over a sector-and-size-matched null it sits at the 5th.
      The explanation offered for it does not. The proposal was that a grouping can only add what
      the baseline has not already taken, so a conferred loading raises the co-movement floor and
      leaves any grouping less room. That was recorded as "the natural candidate rather than a
      demonstration: the compression is measured, the attribution of it to the conferred loading
      is not." The attribution was then measured across sixty books under six sorting rules, and
      there is no relationship between a book's covariance floor and its grouping lift --
      Spearman -0.001. Low-volatility books carry twice the momentum winner leg's floor and about
      three times its lift. A raised floor does not suppress grouping.
      What survives is narrower and more specific than the story it replaces, and it is recorded
      in the cross-sort cell rather than here.
    secondary_b_numbers:
      - {label: "placebo books clearing their own sector floor", value: "40 of 40", comparison: "at p<=0.05, and at p<=0.0015 by the 90th percentile"}
      - {label: "placebo books out-lifting the momentum leg", value: "38 of 40 (95%)", comparison: "the real leg sits at the 5th percentile of the placebo lift distribution"}
      - {label: "lift, real against placebo", value: "+0.0114 vs median +0.0248", comparison: "placebo range +0.0098 to +0.0392, all at n of 162 or 163 names"}
      - {label: "absolute cohesion, real against placebo", value: "0.1432 vs median 0.0761", comparison: "the momentum leg is at the 100th percentile; it co-moves more and gains less"}
      - {label: "sector-network floor across all books", value: "max |lift| 4.2e-17", comparison: "exactly zero everywhere, which is what confirms the fixed null is calibrated"}
      - {label: "real leg re-measured under the fixed null", value: "+0.0114 at p 0.0020", comparison: "against +0.0113 as published under the leaky cells; the comparator survives the fix"}
    secondary_b_scope: >
      Placebo legs are drawn from the Item-1-covered universe, 1,613 of 2,693 eligible names, so
      that both sides are 162-name sets that all have filings. Drawing 168 from everything and
      then filtering leaves about 109 names, and a 109-name grouping is measured with visibly
      more noise -- the comparison would have been partly about sample size.
      The coverage asymmetry this appeared to create is smaller than first stated, and the
      correction runs in the safe direction. The momentum leg reads 97 percent covered against a
      60 percent universe, but the leg IS already a covered-only selection: the source spec
      records 267 winners at a text coverage of 0.629, which is exactly the 168 names it holds.
      Both sides were covered-only sets from the start.
      The residual concern -- that coverage rises with size, from 43 percent in the smallest cap
      decile to 80 in the largest, so the covered subpopulation might differ in ways cap-matching
      does not reach -- was tested rather than argued. Restricting BOTH sides to the upper half by
      market value, where coverage runs 63 to 80 percent, leaves every conclusion standing: 30 of
      30 placebo books clear their own sector floor, 26 of 30 out-lift the momentum leg, and the
      real leg moves from the 5th percentile to the 13th. Both lifts rise in the larger-name
      stratum, real from +0.0114 to +0.0224 and the placebo median from +0.0248 to +0.0337, and
      the ordering does not change. The asymmetry is cosmetic.
    secondary_a_verdict: refuted
    secondary_a: >
      Ten placebo books at 2019-08-30, each a random basket matched to the real leg on sector and
      capitalisation decile, each scored against its OWN matched control built the way the real
      leg's was. Ten partitions per arm, identical prompt, identical parsing, identical model.
      The placebo t-statistics run -1.73, 1.45, 2.55, 3.09, 3.09, 3.96, 4.10, 6.07, 7.47, 8.27,
      with a median of +3.53. The real leg reads +3.99 -- the 60th percentile, with four of ten
      placebo books reaching or exceeding it. Indistinguishable.
      The naming claim's own stated gap was that it "cannot separate naming what these companies
      ARE from naming what the sort SELECTED". It is separated now, and the answer is the
      companies. Books no sort constructed score the same.
      This is NOT a null on the namer. Most placebo books beat their own matched controls
      decisively; the model finds real structure nearly everywhere it is pointed. What it does
      not do is find MORE in a sorted book, which is what a claim about the sort would require.
    secondary_a_doubly_informative: >
      The reading is stronger than the numbers alone because of what secondary B established.
      Placebo books carry MORE text-legible structure than the momentum leg -- higher grouping
      lift, at the leg's 5th percentile against them -- so the namer was working with more raw
      material on the placebo side and still produced a comparable spread of t-statistics. The
      real leg's advantage does not survive being asked to beat books that had more to find.
      One detail cuts against over-reading it in the other direction. The real leg's raw LIFT is
      +0.0268, BELOW the placebo median of +0.0291; its t sits above the placebo median only
      because its ten runs varied less. That is ensemble stability, not structure, and it should
      not be quoted as the former.
    secondary_a_numbers:
      - {label: "real leg t against the placebo distribution", value: "60th percentile", comparison: "+3.99 against a placebo median of +3.53; four of ten placebo books reach or exceed it"}
      - {label: "real leg raw lift", value: "+0.0268", comparison: "BELOW the placebo median lift of +0.0291; the higher t comes from lower run-to-run variance, not more structure"}
      - {label: "placebo t range", value: "-1.73 to +8.27", comparison: "most placebo books beat their own matched control decisively, so this is not a null on the namer"}
      - {label: "an arm that already existed", value: "t of -4.62", comparison: "the reference_unmatched arm on disk since August is one random basket per date; at 2019 the namer found MORE structure in it than in the leg, pointing the same way before this cell ran"}
    bundle_reading: >
      Three cells, one registration, and they only make sense together.
      Selection on past returns manufactures a factor loading, at every look-back window, on 104
      of 128 months, where selection on a non-return characteristic manufactures none. That
      manufactured loading raises the whole book's covariance floor, which leaves any grouping
      less to add -- the leg co-moves at twice a random draw and gains the least from being
      grouped. And a model asked to name a book's shared exposures finds the same amount in books
      no sort constructed.
      Text methods work. They find company structure -- industry, product market, shared business
      model -- and they find it about equally well anywhere they are pointed. That uniformity was
      itself measured afterwards: across fifty-seven books under six sorting rules, both
      directions and three depths, grouping lift has a mean of +0.0195 and a standard deviation
      of 0.0073, with group means spanning only +0.0132 to +0.0245. Momentum reversal risk is not
      a company-structure phenomenon. It is a portfolio-construction phenomenon, created by the
      sort and absent from documents.
      For this problem, on this population, text measures the wrong object. Correctly.
      NARRATIVE CORRECTION, 2026-08-26. This entry first read the winner leg's low grouping lift
      as one end of a suppression gradient. It is not. Lift is near-uniform across construction
      and the winner leg is a single outlier cell sitting 1.85 standard deviations below the
      band, with one of fifty-seven other books beneath it. "Thirty-eight of forty placebo books
      out-lift the real leg" remains true and now reads as an outlier rather than as a mechanism.
      The verdicts are unchanged; the arc is.
  reproduce: uv run python scripts/run_exp045_placebo.py --recover && uv run python scripts/run_exp045_placebo.py --primary --draws 200 && uv run python scripts/run_exp045_secondary_b.py --books 40 --n-perm 2000 && uv run python scripts/run_exp045_secondary_a.py --books 10 --runs 10
  verdict: supported
  reasoning: >
    The PRIMARY is answered and was recorded before either secondary was touched, which is the
    order the bundle was registered in. Both secondaries are refuted, and the bundle verdict is
    `supported` because the bundle's own hypothesis was that the placebo books would separate
    these three questions. They did.
    Each cell alone would have been reportable and misleading. The primary alone reads as a
    result about momentum; the discriminating families make it a result about return-sorting. The
    secondaries alone read as failures of two text methods; together with the primary they are
    the mechanism that explains a year of nulls. Recording them under one registration is what
    made the joint reading available. The bundle's own verdict stays open until the namer and
    peer-network cells land, because a bundle verdict that quotes one of three cells would be
    the thing the single registration was meant to prevent.
    Registered before a single placebo book existed. The bundle is one registration because the
    three questions share one input and separating them would invite scoring the same books
    three times under three framings.
    Two departures from the plan as handed over, both stated here rather than discovered in the
    output. Reversed momentum is degenerate on the registered absolute statistic and is demoted
    to a harness check. And the post-formation block joins as a declared secondary, because the
    registered primary is the formation-window spread while the claim leads with the
    post-formation figures, and a placebo test that left the headline number untested would be
    answering the question next to the one that matters.
  history:
    - {date: 2026-08-25, note: "Registered as a bundle before any book was generated. Three data-quality gates were found while writing it: a placeholder sector label on 419 names, a mid-panel taxonomy switch between the Russell and GICS schemes, and the fact that the registered primary statistic and the claim's headline figure are two different estimands."}
    - {date: 2026-08-25, note: "Primary answered. The sector gate turned out to be far larger than the registration knew: first-occurrence-wins had left 46 percent of the panel universe unlabelled, not the 419 names the placeholder count suggested, because the earliest files are the least labelled and every long-lived ticker inherited its oldest empty cell."}
    - {date: 2026-08-25, note: "The non-clearing month is informative rather than embarrassing. At 2020-11-30 the conferred tilt sat at the 55th percentile of its own placebo null, in a mechanism that clears 81 percent of the time -- and that episode is the vaccine-day reversal, which the mechanism map classes as catalyst inversion rather than a conferred-concentration unwind. A diagnostic reading low where a different mechanism is driving is what a separable set of mechanisms should look like. One observation, not a test."}

- id: exp-046
  title: Is the window curve stable, and does conferred magnitude predict reversal severity?
  one_breath: >
    Two questions parked before anyone eyeballs them: does the dose-response curve hold across
    the panel, and does conferred size relate to what follows?
  status: registered
  registered_at: 2026-08-26T00:15:00Z
  closes_question: q-01
  hypothesis: >
    The placebo bundle produced a dose-response curve at ONE date: conferred tilt against
    look-back window, reading 0.305 at one month, 0.156 at three, 0.238 at six, 0.248 at nine and
    0.359 at twelve-minus-one, every point clearing its own cap-matched null. That shape is a
    single date's descriptive and nothing more.
    Two questions follow from it and both are the kind that get data-mined by accident if left
    unregistered. Whether the SHAPE is stable across the panel or an artefact of one
    cross-section. And whether conferred MAGNITUDE relates to subsequent reversal severity --
    which is the bridge between this mechanism and the severity model, and the reason the
    conferred series would be worth monitoring rather than merely explaining.
    Registered now, before either is looked at, because the curve exists and the temptation to
    read it does too.
  prediction: >
    CHARACTERISATION FIRST, and this is a gate rather than a preference. Neither question gets a
    supported or refuted verdict until its power is stated: the panel carries 8 to 17 independent
    regimes by this project's own count, and a relationship between conferred magnitude and
    forward drawdown estimated across 128 overlapping monthly observations has far fewer
    independent observations than rows.
    Cell 1, window-curve stability: the curve is recomputed at every month-end the panel
    supports and reported as a distribution of shapes, not a mean. The declared reading is
    whether the ORDERING of windows is stable, not whether any point is.
    Cell 2, conferred magnitude against forward severity: characterisation only at first pass --
    the joint distribution, with the effective sample size stated before any coefficient is
    quoted. A verdict-bearing test needs a power certificate on the returns layer and the
    overlapping-window correction, and neither exists yet, so the first pass is explicitly
    not verdict-bearing.
    CELL 3, ADDED 2026-08-26 BEFORE ANY CELL RAN. The within-project claim is that text-grouping
    lift falls as conferred tilt rises on OUR panel. The claim's actual reach is wider and is
    testable in the same run: any text-versus-returns contest run on a CHARACTERISTIC-SORTED
    portfolio is biased against text by construction, because sorting raises the covariance floor
    the text signal is trying to beat. If that holds, it is a statement about how the
    text-similarity literature evaluates itself, since those evaluations are routinely run on
    sorted or characteristic-matched portfolios.
    The test builds books from the same universe under several sorting rules, measures each
    book's covariance floor and its text-grouping lift, and predicts a SINGLE downward-sloping
    relationship across all of them, with random books at the unconferred end and no rule
    occupying its own regime.
    ONE CORRECTION MAKES THIS SOUND, and it changes the axis. The relationship must be measured
    against the COVARIANCE FLOOR -- absolute within-book co-movement -- and not against the
    conferred beta spread. Sorting on trailing volatility produces a beta spread almost by
    definition, since low-volatility names carry low betas, so a volatility-sorted book plotted
    against conferred beta would confirm the hypothesis tautologically. The floor is the quantity
    the mechanism is actually about, it is measured rather than inferred, and no sorting rule
    produces it by definition. Conferred beta is reported as a second axis where the mechanism is
    beta-specific, and the tautology is stated next to it.
    This cell also ABSORBS the residualised-seam proposal, which is its cross-sectional form.
    Two registrations over one claim is the ledger smell the protocol exists to prevent.
  data:
    - source: src-iwv
      slice: the same panel and universe the placebo bundle used, 128 usable month-ends
      tier: DESIGN
      vintage: 2026-08-25
    - source: src-french
      slice: daily momentum factor returns for the forward-severity side
      tier: DESIGN
      vintage: 2026-08-25
  method:
    uses: [mth-permutation]
    statistic: >
      Cell 1: the rank ordering of conferred |spread| across look-back windows, per month.
      Cell 2: conferred |spread| at formation against the worst forward drawdown of the
      momentum factor over the following quarter. Characterisation first; the statistic that
      would bear a verdict is not chosen until the power statement exists, per the standing rule
      that the certificate picks the instrument.
    unit: month
    grid: five look-back windows across 128 month-ends
    null_model: >
      Cap-matched placebo books per date, as in the bundle, so each window's curve point carries
      its own null rather than being read against a single pooled one.
    correction: >
      Not applicable at the characterisation stage, and that is the point: nothing here is
      significance-tested until the design is verdict-bearing.
    power: >
      To be stated BEFORE any coefficient is quoted. Overlapping quarterly forward windows on
      monthly observations, over a panel this project has already measured to hold 8 to 17
      independent regimes.
    gates: >
      No verdict without a returns-layer power certificate and an overlapping-window correction.
      A characterisation that gets quoted as a finding is the failure mode this registration
      exists to prevent.
  result: null
  verdict: not_yet
  reasoning: >
    Parked rather than improvised. The curve is already computed and sitting in
    data/processed/exp045/families_2019.csv, which is exactly the condition under which an
    unregistered look becomes a finding by accident.
  history:
    - {date: 2026-08-26, note: "Registered immediately after the placebo primary produced the curve, and before the curve was examined beyond the single date that produced it."}
    - {date: 2026-08-26, note: "Cell 3 added before any cell ran, extending the claim from this panel to characteristic-sorted portfolios generally. Its axis is the measured covariance floor rather than the conferred beta, because a volatility-sorted book would confirm a beta-axis version of the hypothesis by definition. Absorbs the residualised-seam proposal as its cross-sectional form."}
    - {date: 2026-08-26, note: "Cell 3 ran and refuted the generalisation, which retired a mechanism that had already been written into another experiment's result field. That entry is corrected rather than deleted, and the standing rule it supported is re-grounded on the measurement instead of the explanation. Cells 1 and 2 remain open."}

- id: exp-047
  title: Does the manufactured bet crowd out what text could otherwise see?
  one_breath: >
    If a conferred loading raises the co-movement floor, text-based grouping should add least
    where the sort conferred most.
  status: running
  registered_at: 2026-08-26T01:30:00Z
  closes_question: q-03
  hypothesis: >
    The placebo bundle produced two facts about the same book that only make sense together. On
    ABSOLUTE peer cohesion the 2019 momentum leg sits at the 100th percentile of forty
    cap-matched placebo books -- 0.1432 against a placebo median of 0.0761, co-moving nearly
    twice as much as any random draw of the same size. On LIFT over a sector-and-size-matched
    null it sits at the 5th.
    A grouping can only add what the baseline has not already taken. The sort confers a shared
    factor loading on the whole leg, which is what this bundle's primary measured across 128
    months, and a raised baseline leaves less room for ANY grouping to improve on. If that is
    the mechanism, the manufactured bet does not merely fail to leave a trace in documents; it
    actively SUPPRESSES what a document-based grouping could otherwise resolve.
    That would put a third leg under the reframe. The exposure is not in the documents; the sort
    manufactures it; and the manufacturing crowds out the channel that would have read it. It
    would also reclassify five historical nulls, from "text failed here" to "text was tested on
    the adversarially worst population", because every one of them ran on a momentum book.
    HYPOTHESIS AS REGISTERED, AND IT WAS REFUTED. The reclassification above does not survive
    cell 3 in this form. What survives is the narrower and still-true version: the momentum
    winner leg scores lowest of any construction measured, cause unknown. "Adversarially worst
    population" is withdrawn as an explanation and kept only as a measured ranking.
  prediction: >
    Text-based grouping lift is INVERSELY related to conferred-tilt magnitude across the panel:
    strongest in low-conferral months such as November 2020, where the book sat at the 55th
    percentile of its own placebo null, and weakest in high-conferral months such as August 2021,
    where it sat at the 100th with a spread of 0.5171.
    CHARACTERISATION FIRST and this is a gate, not a preference. The compression is already
    measured at one date; the ATTRIBUTION of it to the conferred loading is not, and the two must
    not be reported as one thing. The first pass produces the joint distribution of conferred
    magnitude against grouping lift with the effective sample size stated before any coefficient
    is quoted, and nothing is significance-tested until the design is verdict-bearing.
    A verdict needs what this design does not yet have: a returns-layer certificate for the
    grouping-lift statistic on each month's panel, and a correction for the fact that conferred
    tilt is persistent month to month, so 128 rows are nowhere near 128 independent observations.
  data:
    - source: src-iwv
      slice: the 128 usable month-ends from the placebo panel, with their conferred spreads
      tier: DESIGN
      vintage: 2026-08-26
    - source: src-edgar
      slice: Item 1 for each month's leg constituents, for the grouping side
      tier: DESIGN
      vintage: 2026-08-26
  method:
    uses: [mth-permutation, mth-risk-peers]
    statistic: >
      Per month: conferred |beta spread| on the formation window, against peer-network cohesion
      lift over a sector-and-size-matched null on the following quarter. Characterisation first;
      the statistic that would bear a verdict is not chosen until a certificate exists, per the
      standing rule that the certificate picks the instrument.
    candidate_statistics: [peer_cohesion, mean_within, eigen_within]
    instrument_choice: >
      Unchanged: the verdict-bearing statistic is the one with the best certified MDE at the
      registered target on that month's own pool. No statistic is nominated in advance here
      because no certificate exists for a monthly panel yet.
    unit: month
    grid: >
      Cells 1 and 2: 128 month-ends, one conferred magnitude and one grouping lift each.
      Cell 3: one date, several sorting rules, each producing a book from the identical
      universe -- random draws at the unconferred end, then market capitalisation, trailing
      realised volatility, days-to-cover from the short-interest tape, past returns at one
      month, and past returns at twelve months skipping one. The non-return characteristics are
      what the data supports: there are no fundamentals in this corpus, so a book-to-market sort
      is unavailable and is recorded as absent rather than approximated by something that is not
      value.
    null_model: >
      The fixed sector-and-size-matched cells, which may never span a sector boundary. Every
      month's lift carries its own null rather than being read against a pooled one.
    correction: >
      Not applicable at the characterisation stage, which is the point.
    power: >
      To be stated BEFORE any coefficient. Conferred tilt is persistent month to month and this
      project has already measured the panel to hold 8 to 17 independent regimes, so the
      effective sample size is far below the row count.
    gates: >
      No verdict without a returns-layer certificate for the monthly grouping statistic and a
      persistence correction. Text coverage per month must also be reported: the Item 1 corpus
      thins in earlier years and a coverage trend correlated with the conferred series would
      produce this relationship without any mechanism behind it.
  result:
    cell_2_verdict: underpowered
    cell_2: >
      Conferred magnitude at formation against the worst peak-to-trough drawdown of the momentum
      factor over the following quarter, on 128 month-ends. Characterisation only, as registered,
      and the effective sample size was computed before any coefficient: the lag-1
      autocorrelation of conferred magnitude is +0.401, so 128 rows carry an effective n of 54.8,
      and the forward windows overlap by two months out of three besides.
      THE REGISTERED STATISTIC RETURNS NOTHING. Spearman between |conferred spread| and forward
      drawdown is +0.023. Median drawdown by conferred quartile is flat at -0.070, -0.053, -0.070
      and -0.064, and the worst single drawdown falls in the SECOND quartile.
      THE ABSOLUTE VALUE WAS A DESIGN ERROR AND IT DISCARDED THE INFORMATIVE DIRECTION. A
      defensive tilt and a pro-cyclical tilt are different bets that fold together under a modulus.
      On the SIGNED spread the rank correlation is +0.212, and splitting on sign is legible
      without statistics: the 78 months with a defensive tilt carry a median forward drawdown of
      -0.073 and a tenth percentile of -0.178, against -0.054 and -0.107 for the 50 pro-cyclical
      months. A defensive book's tail is roughly two thirds larger.
      IT IS NOT A FINDING AND IS NOT REPORTED AS ONE. At an effective n of 55 the design detects
      a rank correlation of 0.40 in 84 percent of replicates, 0.30 in 57 percent and 0.20 in 32
      percent. The observed +0.212 sits where the design would miss it two times in three. And it
      was examined AFTER the registered statistic returned nothing, which is the shape of a
      forking path even when the reasoning behind it is sound.
      The honest output is a better-specified question, which is what a characterisation cell is
      for: the signed conferred tilt against forward severity, on a design with the power to
      resolve a rank correlation near 0.2 and a correction for overlapping windows. That is
      registered separately rather than claimed here.
    cell_2_numbers:
      - {label: "registered statistic, |conferred| against forward drawdown", value: "Spearman +0.023", comparison: "128 rows, effective n 54.8 after a lag-1 autocorrelation of +0.401; median drawdown flat across conferred quartiles"}
      - {label: "signed spread instead", value: "Spearman +0.212", comparison: "examined after the registered statistic returned nothing; the design detects this magnitude 32 percent of the time"}
      - {label: "defensive against pro-cyclical months", value: "p10 drawdown -0.178 against -0.107", comparison: "78 defensive months against 50 pro-cyclical; medians -0.073 against -0.054"}
      - {label: "what the design can resolve", value: "rho 0.40 at 84 percent power", comparison: "0.30 at 57 percent and 0.20 at 32 percent, at the effective sample size of 55"}
    cell_3_verdict: refuted
    cell_3: >
      The registered prediction was a single downward-sloping relationship between a book's
      covariance floor and its text-grouping lift, across all sorting rules, with random books at
      the unconferred end. Sixty books, six rules, three depths each: Spearman -0.001, Pearson
      +0.103. There is no relationship.
      The refutation is not marginal and the decisive pair is legible without statistics.
      Low-volatility books carry a covariance floor of 0.205 to 0.256, by far the highest in the
      table, and grouping lifts of +0.023 to +0.032, among the highest. Momentum winner books
      carry a floor of 0.102 to 0.120 and lifts of +0.0001 to +0.0135, the lowest. If a raised
      floor suppressed grouping, that would be reversed.
      So the mechanism proposed for the placebo bundle's secondary B is wrong, and the entry
      there is corrected rather than quietly left standing. The compression is real; the floor is
      not what causes it.
    cell_3_what_survives: >
      One thing in the table is striking and it is narrower than the claim it replaces. The
      momentum WINNER books have the lowest grouping lift of anything measured, at +0.0060 on
      average against +0.0203 for random draws -- about two standard deviations of the random
      spread below it -- and two of their three depths do not reach significance at all, at
      p = 0.485 and p = 0.160.
      It is specific to that leg. Momentum LOSER books lift +0.0179. One-month return sorts lift
      +0.0153 at the top and +0.0111 at the bottom. Capitalisation sorts lift +0.0214 at the top.
      Whatever suppresses text-grouping on the momentum winner leg is not return-sorting in
      general, is not the loser side, and is not a high covariance floor.
      Three books per cell. This is an observation that needs replication across dates before it
      is anything else, and it is recorded as one.
    power_statement: >
      Rank correlation between covariance floor and grouping lift, on 60 books spanning a floor
      range of 0.0008 to 0.2558 with a lift standard deviation of 0.0077. A planted rank
      relationship is recovered at 80 percent power and alpha 0.05 when its true strength is
      rho = -0.50; at -0.30 the design detects it only 36 percent of the time. The false-alarm
      rate on a planted zero is 0.02, below nominal.
      THE SCOPE OF THE REFUTATION FOLLOWS FROM THAT AND IS STATED PLAINLY. This design refutes a
      STRONG floor-lift relationship. A modest one, around rho = -0.3, would have been missed
      most of the time and is not excluded by the correlation alone.
      The mechanism is nonetheless contradicted by something power does not touch. It predicts
      that the books with the highest covariance floor carry the lowest grouping lift. The
      low-volatility books have the highest floor in the table, at 0.205 to 0.256, and among the
      highest lifts, at +0.023 to +0.032; the momentum winner books have half their floor and a
      third of their lift. That is a reversal of the predicted ordering, not a failure to detect
      a weak version of it.
    planted_effect: >
      Synthetic lifts were generated on the OBSERVED floors as lift = -b * z(floor) + noise, with
      the noise standard deviation matched to the observed spread, 400 replicates per level. The
      harness recovers a planted rho of -0.60 in 93 percent of replicates, -0.50 in 80 percent,
      -0.40 in 62 percent and -0.30 in 36 percent, and fires on a planted zero in 2 percent. The
      instrument can see the effect it was asked about at the strength the hypothesis implied;
      the observed value is -0.001 at p = 0.992.
    cell_3_numbers:
      - {label: "floor against lift across all books", value: "Spearman -0.001", comparison: "60 books, six sorting rules, three depths; Pearson +0.103. The registered prediction was a single downward slope"}
      - {label: "the decisive pair", value: "low-volatility floor 0.205-0.256, lift +0.023 to +0.032", comparison: "against momentum-winner floor 0.102-0.120, lift +0.0001 to +0.0135: twice the floor and roughly three times the lift"}
      - {label: "momentum winner books against random draws", value: "+0.0060 against +0.0203", comparison: "about two standard deviations of the random spread below it; two of three depths not significant, at p 0.485 and 0.160"}
      - {label: "it is the winner leg, not return-sorting", value: "loser books lift +0.0179", comparison: "one-month sorts +0.0153 and +0.0111, capitalisation +0.0214; only the twelve-month winner leg collapses"}
  verdict: refuted
  reasoning: >
    Cell 3 is refuted and the refutation is the useful part: it retires an attractive mechanism
    that had already been written into another experiment's result field, and it does so before
    that mechanism reached a memo.
    The protocol worked exactly as intended here. The attribution was flagged as untested at the
    moment it was proposed, the flag was what motivated this cell, and the cell killed it. A
    version of this project that had recorded the floor story as a finding would now be carrying
    a wrong explanation for its most-quoted result.
    Cell 2 ran and is underpowered rather than refuted, and its useful output is a design fault
    it exposed in itself: the registered statistic took an absolute value, which folds a
    defensive tilt and a pro-cyclical one into the same number. The signed version carries a rank
    correlation this design cannot resolve, so it becomes a better-specified question rather than
    a result. Cell 1, whether the window curve's shape is stable, remains open and is descriptive
    polish for an exhibit; it loses nothing by waiting behind the wiring.
    Registered before the relationship was looked at, on the same reasoning that parked the window
    curve: the two series both exist on disk, in data/processed/exp045/panel.csv and in the
    comparator's machinery, and a relationship that is one join away from being visible is one
    that gets found by accident.
    The caveat travels with the hypothesis rather than being appended to a result. The
    compression at 2019 is measured; that the conferred loading CAUSES it is the open part, and
    a competing reading is available -- a returns-selected set may co-move more for reasons that
    have nothing to do with the loading the sort conferred.
  history:
    - {date: 2026-08-26, note: "Registered immediately after the secondary-B mechanism table appeared, and before the panel-wide relationship it suggests was examined."}

- id: exp-048
  title: Do dated catalysts carry timing information where the sort conferred least?
  one_breath: >
    The one reversal mechanism where conferral is low, so the crowding-out that defeated five
    text experiments does not bite.
  status: registered
  registered_at: 2026-08-26T03:00:00Z
  closes_question: q-04
  hypothesis: >
    AMENDED 2026-08-26, BEFORE THIS EXPERIMENT RAN. It was registered on the reasoning that the
    sort raises the covariance floor and leaves document-based grouping less to add, so text
    should work where the sort conferred little. That mechanism was tested the same week and
    refuted: there is no relationship between a book's covariance floor and its grouping lift.
    The site selection survives on different and weaker grounds, stated here rather than
    inherited. Catalyst inversion is worth a text experiment because it is a DATED mechanism and
    dating is what timestamped streams do, and because it is the one reversal class this project
    can identify where the conferred tilt is measurably low. Whether low conferral helps text is
    now an open question rather than a prediction, since the mechanism that connected them is
    gone.
    The mechanism map already names such a case. Catalyst inversion is a reversal driven by a
    dated surprise that inverts the basis of the sort, and it shows up as a drawdown concentrated
    into a single dated day rather than as a slow unwind of a shared exposure. The November 2020
    vaccine reversal is the example, and at that date the conferred tilt sat at the 55th
    percentile of its own placebo null in a mechanism that clears 81 percent of the time.
    Low conferral, dated cause, and a text stream whose native strength is precisely dating
    things. This is the corner of the problem where the bundle's own logic says text should have
    headroom, and it is the only such corner the project has identified.
  prediction: >
    On episodes classed as catalyst inversion, dated text arriving before the reversal carries
    timing information that market-derived measures do not: specifically, a rise in
    catalyst-consistent language across the book's own holdings ahead of the drawdown day.
    THE HONEST FAILURE MODE IS PRE-COMMITTED because it is the likely one. Catalyst inversions
    are surprises. A surprise that was legible in documents beforehand was not a surprise, so
    the strongest version of this hypothesis is close to self-refuting. The defensible version
    is narrower: text may date the TRANSMISSION -- which holdings were exposed to the catalyst
    once it occurred -- faster than covariance can, which is a coverage-and-lead-time claim and
    not a prediction claim.
    Registered with the narrower version as the primary and the strong version named so it
    cannot be quietly substituted later.
  data:
    - source: src-edgar
      slice: 8-K bodies and their exhibits, with second-level acceptance stamps
      tier: DESIGN
      vintage: 2026-08-26
    - source: src-iwv
      slice: daily holdings across the episode window
      tier: DESIGN
      vintage: 2026-08-26
  method:
    uses: [mth-permutation, mth-quarterly-risk]
    statistic: >
      Lead time in trading days between a text measure crossing its own trailing null and the
      covariance-side measure crossing its, on the same universe with the same threshold rule --
      the emergence design, applied to an episode chosen for LOW conferral rather than for size.
    unit: episode
    grid: >
      Episodes the mechanism map classes as catalyst inversion, of which the November 2020
      reversal is the primary. Conferred tilt at each episode is reported alongside, so the
      selection of episodes on low conferral is visible rather than implicit.
    null_model: >
      Trailing-window nulls on both sides, same universe, same threshold construction, so
      neither medium is handed an easier bar.
    correction: none needed at one declared primary episode
    power: >
      Stated before any verdict. One episode cannot support a claim about episodes, and this
      project has already measured its panel to hold 8 to 17 independent regimes.
    gates: >
      Episodes must be classified BEFORE their text is examined, and the classification rule
      recorded, or this becomes selection on the outcome.
      PARKED: registered now, runs behind the committed queue.
  result: null
  verdict: not_yet
  reasoning: >
    Written now because the bundle's logic implies it and an implication left unwritten becomes
    an improvisation later. It runs behind the gold set, the wiring, extraction at scale and the
    transmission tests, all of which were committed first and all of which operate on text's
    surviving turf.
  history:
    - {date: 2026-08-26, note: "Registered as a parked workstream the day the placebo bundle closed, because the bundle predicts where text should work and this is the only such corner identified."}

- id: exp-049
  title: Does investor-side positioning see what company filings cannot?
  one_breath: >
    Reopening positioning under the bundle's logic, with the prior limits stated rather than
    quietly dropped.
  status: registered
  registered_at: 2026-08-26T03:10:00Z
  closes_question: q-11
  hypothesis: >
    The bundle explains why company text cannot see the momentum book's exposure: the sort
    creates it, and companies do not write about who owns them or about a ranking computed after
    they filed. That argument is about what documents CONTAIN and it is untouched by the
    refutation of the separate suppression mechanism -- investor-side records are about holders
    rather than firms, so they can carry what firm filings structurally cannot.
    THIS IS A REOPENING, NOT NEW TERRITORY, and the prior verdicts are carried rather than
    forgotten. Two experiments here already returned refuted on positioning. The co-ownership
    test found the direction reversed -- the LOSER leg more commonly co-owned, on seven of seven
    tests -- and then found that neither direction survives size matching; it also found that
    momentum-leg constituents are co-owned 7 to 18 times more than independent selection implies,
    which is a real fact about the population that the asymmetry test could not use. The
    short-interest gate was refuted on its wording and held on its substance: the loser leg
    carries more days-to-cover than size-matched winners on 166 of 195 settlement dates, median
    difference 1.175 days, at a median permutation probability of 0.047.
    The live thread is the half that was never run. That gate existed to license a severity test
    -- whether loser-leg days-to-cover improves a conditional quantile of forward momentum
    returns -- and the severity test has not been run. Reopening means running it, not
    re-litigating the gate.
  prediction: >
    Loser-leg days-to-cover improves a conditional quantile of forward momentum returns over the
    quantile model that does not use it, measured on the existing severity backtest with the same
    loss function.
    Ordering is deliberate. Short interest and any flow stream come FIRST because they are
    settlement-stamped and see the short leg. Institutional holdings come last and only for what
    they can see: they are long-only, never observe the short leg, and arrive with a 45-day lag
    that the earlier work recorded as close to disqualifying. A positioning claim resting on them
    would inherit that lag whatever else it showed.
  data:
    - source: src-finra
      slice: bi-monthly short interest with settlement and availability stamps
      tier: DESIGN
      vintage: 2026-08-26
    - source: src-french
      slice: daily momentum factor returns for the forward-quantile side
      tier: DESIGN
      vintage: 2026-08-26
  method:
    uses: [mth-quantile-reg, mth-expanding, mth-pinball]
    statistic: >
      Pinball loss of a conditional quantile with the positioning feature against the same model
      without it, on the existing expanding backtest.
    unit: date
    grid: one declared quantile and one horizon, both inherited from the severity model
    null_model: the same model without the feature, on the identical sample
    correction: none at one declared cell
    power: >
      The severity backtest returns per-block loss rather than per-observation predictions, which
      is a known limitation recorded against the conformal work, so a like-for-like comparison
      needs the per-observation refactor first. Stated here so the dependency is visible.
    gates: >
      No institutional-holdings claim without its 45-day lag stated in the same sentence as its
      result. PARKED: runs behind the committed queue.
  result:
    procedure_certificate: cert-severity-conditioning
    n_obs: 1241
    n_stamps: 108
    statistic: -0.0433
    null: +0.0053 +/- 0.0247
    p_raw: 0.9833
    p_bh: 0.9833
    primary: >
      NULL on the registered direction. The prediction was that MORE short-seller crowding in the
      losing stocks carries the heavier tail, which makes the statistic positive. It is -0.0433.
      One-sided on the registered side the probability is 0.98. The severity half of the gate is
      now run, which was the whole point of the reopening.
    unregistered_direction_observation: >
      RECORDED AS AN OBSERVATION, NOT A FINDING, AND DELIBERATELY NOT PROMOTED. The point estimate
      is opposite-signed at -0.0433, which is 78 percent of the certified MDE and would carry a
      two-sided probability of 0.033. Read literally it says the LESS crowded loser legs preceded
      the worse ten-day momentum crashes.
      Three reasons it is not reported as a result. The direction was registered before the number
      was seen, and swapping to whichever direction won is precisely the multiplicity laundering
      the protocol forbids. The magnitude is still below the certified MDE, so the procedure could
      not reliably detect an effect of this size even in the direction it was pointed at. And a
      nominal 0.033 against a procedure whose measured false-alarm rate is 0.033 is not a
      distinguishing observation.
      It is carried to Phase 4 as a candidate registration on held-out years, where it can be
      tested in the direction it actually points with the direction fixed in advance.
  verdict: underpowered
  power_statement: >
    Same certified procedure as exp-051, same DESIGN-tier population, block length doubled to 12
    so that a block spans the same six calendar months on a bi-monthly settlement series as on the
    monthly conferred series -- their lag-1 persistence is nearly identical, +0.607 against +0.600.
    MDE at 80 percent power is a 0.0558 gap; false alarm 0.033 at a nominal 0.05.
  planted_effect: >
    Inherited from cert-severity-conditioning: a tail plant moving the lower quartile by
    effect * sigma * z, certified on surrogate conditioners drawn to match the real persistence.
  reasoning: >
    Registered as a reopening with its own prior verdicts cited, because reopening a question the
    ledger has already answered negatively is exactly where a project quietly loses its memory.
    The reopening did what it promised: the unrun severity half is run, and the answer on the
    registered direction is a null the instrument cannot sharpen. The gate that licensed it still
    stands on its substance -- loser legs do carry more days-to-cover than size-matched winners on
    166 of 195 settlement dates -- and that fact now has a measured consequence attached, which is
    that it does not predict forward crash severity in the direction anyone expected.
    The opposite-signed estimate is the interesting residue and it is being handled the slow way on
    purpose. It is the second time this session that a registered direction came back inverted;
    the first was co-ownership, where the loser leg turned out more commonly co-owned than the
    winner. A pattern of inverted crowding intuitions is worth a registration of its own rather
    than two footnotes.
  history:
    - {date: 2026-08-26, note: "Registered the day the placebo bundle closed. The bundle's logic says investor-side records are the corpus the sort cannot suppress; the prior refutations and their surviving substance are carried into the registration rather than dropped."}

- id: exp-050
  title: Does the momentum winner leg's low text-grouping lift replicate at other dates?
  one_breath: >
    One anomalous cell at one date, registered for replication before anybody explains it.
  status: registered
  registered_at: 2026-08-26T05:00:00Z
  closes_question: q-03
  hypothesis: >
    A cross-sort run at 2019-08-30 measured text-grouping lift across sixty books under six
    sorting rules, in both directions, at three depths. Lift is close to uniform: fifty-seven of
    the sixty books have a mean lift of +0.0195 with a standard deviation of 0.0073, and the
    group means span only +0.0132 to +0.0245.
    The momentum WINNER books are the exception, at +0.0060 -- 1.85 standard deviations below
    that band, with one of the other fifty-seven falling beneath their mean, and two of their
    three depths not reaching significance at all. The momentum LOSER books sit inside the band
    at +0.0179.
    Three books at one date. That is an observation, and the question is whether it is a fact.
    TWO EXPLANATIONS ARE ALREADY FORMING AND ARE FROZEN HERE SO THEY CANNOT BE IMPROVISED LATER.
    That winner legs are momentum's crowded side, so this is crowding. And that winner legs are
    growth-heavy, so this is a composition artefact. Neither is tested by this experiment, which
    exists only to establish whether there is anything to explain.
  prediction: >
    The momentum winner leg's grouping lift sits below the pooled band of all other constructions
    at three further formation dates, chosen for regime spread and not for outcome.
    CHARACTERISATION FIRST. This is a replication of a ranking, not a test of a cause. The
    declared reading is how many of the additional dates place the winner leg below the pooled
    band, with the band recomputed at each date from that date's own books. Nothing about
    crowding or composition is claimed whatever the answer.
    A single failure to replicate retires the observation. Three replications make it a fact
    worth explaining, and the explanation is a separate registration.
  data:
    - source: src-iwv
      slice: the same universe and sorting rules at three further formation dates
      tier: DESIGN
      vintage: 2026-08-26
    - source: src-edgar
      slice: Item 1 business descriptions for each date's constituents
      tier: DESIGN
      vintage: 2026-08-26
  method:
    uses: [mth-permutation, mth-risk-peers]
    statistic: >
      Peer-network cohesion lift over the fixed sector-and-size-matched null, per book, with the
      winner leg's position expressed in standard deviations of that date's own pooled band.
    unit: date
    grid: >
      Six sorting rules, both directions, three depths, plus random draws, at each of three
      dates. The design is copied from the run that produced the observation and is not tuned.
    null_model: the fixed sector-and-size-matched cells, which may never span a sector boundary
    correction: none; one declared reading per date
    power: >
      Stated before any verdict. The observation rests on three books per cell and the pooled
      band on fifty-seven, so the winner leg's position is far better estimated than its own
      mean. Text coverage per date must be reported, because the Item 1 corpus thins in earlier
      years and a coverage difference would move a lift without any change in the phenomenon.
    gates: >
      Dates are chosen and recorded BEFORE their books are built. Choosing them after seeing any
      lift would make this selection on the outcome.
  result: null
  verdict: not_yet
  reasoning: >
    Registered the same day the observation appeared and before either candidate explanation was
    examined, because the lesson of the week is that an attractive story reaches prose faster
    than a test reaches a result. The machinery is warm from the run that produced it, so this
    is cheap.
  history:
    - {date: 2026-08-26, note: "Registered immediately, with the two forming explanations frozen in the hypothesis so they cannot be presented later as though they had been predicted."}

- id: exp-051
  title: Does a defensive conferred tilt carry worse forward severity than a pro-cyclical one?
  one_breath: >
    The signed question the absolute-value design could not ask, on a design built to resolve it.
  status: registered
  registered_at: 2026-08-26T06:00:00Z
  closes_question: q-01
  hypothesis: >
    A characterisation cell asked whether conferred tilt MAGNITUDE relates to forward severity
    and found nothing, at a rank correlation of +0.023. The statistic was |conferred spread|, and
    the modulus was a design fault: it folds a defensive book, whose winners carry lower beta
    than its losers, together with a pro-cyclical one, where the sign is reversed. Those are
    opposite bets and there is no reason they should share a severity profile.
    On the signed spread the same 128 months give a rank correlation of +0.212, and the split is
    legible: 78 defensive months carry a median forward drawdown of -0.073 and a tenth percentile
    of -0.178, against -0.054 and -0.107 for 50 pro-cyclical months. A defensive book's tail runs
    about two thirds larger.
    That was examined after the registered statistic returned nothing, and the design detects a
    relationship of that size only about a third of the time, so it is a question and not a
    result. This registration exists to ask it properly.
    A MECHANISM CANDIDATE IS NAMED HERE AND EXPLICITLY NOT TESTED, per the standing rule that an
    attribution is flagged where it is proposed. A defensive tilt is a rate bet, and the 2019
    book is the documented case: low-beta winners crowded on falling rates, then a reversal. If
    defensive books reverse harder because rate reversals are sharper than growth reversals, that
    is a mechanism -- and nothing in this design tests it. The severity difference is the claim;
    the reason for it is not.
  prediction: >
    Months whose conferred spread is defensive carry heavier left tails in the momentum factor
    over the following quarter than pro-cyclical months, measured at a declared quantile rather
    than at the median, because the registered interest is severity and not central tendency.
    The design must resolve a rank correlation near 0.2, which the characterisation design could
    not. That means either more effective observations or a statistic with less noise than a
    single quarter's peak-to-trough. Both routes are open and the choice is part of the design
    work, not of the result.
  data:
    - source: src-french
      slice: daily momentum factor returns over the panel's forward windows
      tier: DESIGN
      vintage: 2026-08-26
    - source: src-iwv
      slice: the conferred series, signed, at each month-end
      tier: DESIGN
      vintage: 2026-08-26
  method:
    uses: [mth-quantile-reg, mth-permutation]
    statistic: >
      A declared lower quantile of the forward momentum return distribution, conditioned on the
      SIGNED conferred spread. The quantile is fixed before the run.
    unit: month
    grid: one declared quantile, one horizon
    null_model: >
      Block permutation of the conferred series against the forward windows, with blocks long
      enough to preserve its month-to-month persistence, so the null carries the autocorrelation
      the raw series has.
    correction: none at one declared cell
    power: >
      A GATE. The characterisation design carried an effective n of 54.8 against 128 rows,
      because conferred magnitude has a lag-1 autocorrelation of +0.401 and the forward quarters
      overlap by two months in three. At that effective size a rank correlation of 0.20 is
      detected 32 percent of the time. No verdict is recorded until the design's own detection
      curve is computed and shows it can resolve the effect it is asked about.
    gates: >
      The quantile and the horizon are fixed before the run. The overlapping-window correction
      exists before any coefficient. And the result reports the SIGNED relationship only -- the
      absolute-value version is already answered and is not re-run as an alternative.
  design_frozen_2026_08_26: >
    THE PEEK IS DISCLOSED IN THE RECORD RATHER THAN BURIED. The signed relationship was seen
    during characterisation, at Spearman +0.212 with 78 defensive months carrying a tenth
    percentile forward drawdown of -0.178 against -0.107 for 50 pro-cyclical months. This design
    exists because that number could not be believed at a detection rate of 32 percent, and the
    design is written to resolve it rather than to reproduce it.
    STATISTIC. A declared lower quantile of the forward momentum return distribution conditioned
    on the SIGNED conferred spread, not its absolute value. The absolute version is already
    answered at +0.023 and is not re-run as an alternative.
    HORIZON AND QUANTILE, fixed before the run: 10 trading days, 5 percent.
    LOWER-VARIANCE SEVERITY. The characterisation used a single quarter's peak-to-trough, which
    is one draw from a fat-tailed distribution per observation. This uses the conditional
    quantile itself, which pools across observations and is what the severity model already
    scores on.
    NULL. Block permutation of the conferred series against the forward windows, blocks long
    enough to preserve its month-to-month persistence -- the lag-1 autocorrelation is +0.401, so
    an i.i.d. shuffle would understate the null's spread and manufacture significance.
    MULTIPLICITY. This test and the short-crowding test are two related hypotheses about the same
    forward series and are corrected together, Benjamini-Hochberg across the pair.
    POWER IS A GATE, NOT A FOOTNOTE. The procedure is certified first: synthetic conditioning
    effects of known size are planted in the historical series and the procedure must recover
    them at a stated false-alarm rate, with the smallest detectable effect recorded. No verdict
    is written until that certificate exists.
  result:
    procedure_certificate: cert-severity-conditioning
    n_obs: 2330
    n_stamps: 91
    statistic: +0.0157
    null: +0.0031 +/- 0.0177
    p_raw: 0.7245
    p_bh: 0.9833
    primary: >
      NULL on the registered direction, and the point estimate carries the OPPOSITE sign. The
      registered prediction was that a defensive conferred tilt carries the heavier tail, which
      makes the statistic negative. It is +0.0157: if anything the pro-cyclical months carried the
      slightly worse ten-day crash quantile. One-sided on the registered side the probability is
      0.72; two-sided it is 0.55. There is nothing here in either direction.
    power: >
      THE GATE DECIDES HOW THIS READS. The procedure was certified before the test ran, on this
      exact population, and its smallest detectable effect at eighty percent power is a 0.0558 gap
      between the two halves' five percent quantiles. The observed statistic is 0.0157 -- 28
      percent of what the procedure can see. This is an UNDEFINED NULL, not a refutation: the
      instrument cannot distinguish the registered hypothesis from no effect at this sample size,
      so recording `refuted` would be a claim the evidence does not support.
  verdict: underpowered
  power_statement: >
    Detection curve measured on the DESIGN-tier population before the test ran: 3 percent at a
    planted zero, 13 percent at 0.10 sigma, 22 at 0.20, 27 at 0.40, 43 at 0.60, 70 at 0.90, 93 at
    1.30, 100 at 2.00. MDE at 80 percent power is 1.30 sigma, which is a 0.0558 gap between the
    two halves' five percent quantiles, against an unconditional five percent quantile of -0.0430.
    The conditioning would have to roughly double the crash before this procedure could see it.
    False alarm rate 0.033 against a nominal 0.05, block permutation, 1,000 draws per replicate,
    60 replicates per grid point.
  planted_effect: >
    Tail plant, not a location shift: the lower quartile of forward returns moved by
    effect * sigma * z, so a low conditioner genuinely carries a worse quantile. Each replicate
    tested a surrogate conditioner with the same within-month constancy and block persistence as
    the real one.
  reasoning: >
    The registration said POWER IS A GATE, NOT A FOOTNOTE, and the gate closed before the test
    ran. Certifying first turned what would have been a confident negative into an honest
    admission that the question is not answerable at this sample size -- 92 month-ends, 1,877
    forward observations, an effective sample far smaller than either because ten-day forward
    returns overlap and the conditioner is monthly with lag-1 persistence +0.600.
    That is the finding worth carrying: not that a defensive tilt is safe, but that a monthly
    conditioner on ten-day momentum severity over the DESIGN decade cannot resolve anything short
    of an effect that doubles the crash. It is the same arithmetic the brief reading already
    recorded for probability of a rare event, arriving now at severity CONDITIONING -- severity
    itself remains estimable from thousands of observations; differences in severity between
    conditioned halves are not.
    The peek is disclosed as registered: the signed relationship was seen in a characterisation
    pass before this experiment was written. It made no difference -- the sign came back opposite
    to the one the peek suggested, which is itself a small lesson about reading characterisation
    passes.
  history:
    - {date: 2026-08-26, note: "Registered the same hour the characterisation cell exposed the absolute value as a design fault. The signed relationship was seen before this was written, which is why it is registered as a question with a power gate rather than reported as a finding."}
    - {date: 2026-08-26, note: "Ran through the certified procedure. Undefined null: statistic +0.0157 against an MDE of 0.0558, opposite in sign to the registered direction and 28 percent of what the instrument can detect. The certification cost four rebuilds and caught three bugs before it produced a usable number."}


- id: exp-052
  title: Story-neutral momentum construction — does capping the named bet change the tail?
  one_breath: >
    The economic conversion of the whole text program: not a signal, a construction rule,
    judged on mechanism attribution across the registered episodes.
  status: complete
  registered_at: 2026-08-27T06:38:31Z  # VCS-derived; see 2026-08-27 correction note
  verdict: refuted
  hypothesis: >
    The conferred-exposure experiment established that the momentum sort manufactures
    concentrated narrative bets (conferred story-beta at roughly the 93rd placebo percentile),
    and the anatomy, tail-shape-calibration, and day-of programs established that timing those
    bets' breaks is not achievable at this event count.
    The remaining testable economic claim is constructional: a book whose loading on any single
    validity-gated narrative is capped harvests a similar premium with better tail shape,
    specifically dodging rotation-class breaks -- the cell vol-scaling is structurally blind to,
    per the 2019 brief -- while costing little when no story dominates. This is a rule, not a
    forecast; we are diversifying against a validated mechanism, not predicting events.
  prediction: >
    P-C1: story-capped, story-hedged, and vol-scaled-plus-capped variants improve on vanilla
    WML materially ONLY over event windows (day 0 to +21) of rotation-class episodes where a
    validity-gated theme existed pre-event (2020-11 vaccine, 2025-01 DeepSeek, 2025-04 tariff);
    approximately neutral in unwind/macro/vol episodes (2024-08, 2022-11, 2018-02); quiet in
    the 2019-09 negative control, where any deviation is drag and is reported as such.
    Full-period shape metrics (skew, 5 percent CVaR, max drawdown, worst-5-day sum) are
    SECONDARY with block-bootstrap intervals. Mean return and Sharpe differences are NO-CLAIM:
    a decade cannot power a premium-preservation claim; tracking error and cap-binding
    frequency are reported instead.
  data:
    - source: src-iwv
      slice: monthly 12-1 decile books 2016-01..2025-08 and the daily price panel
      tier: DESIGN
      vintage: 2026-08-27
    - source: src-gdelt
      slice: clean v2 attention and co-mention tables, frozen registration-v2 parameters
      tier: DESIGN
      vintage: 2026-08-27
  method:
    uses: [mth-legs, mth-constructions, mth-cluster-boot]
    statistic: >
      Six pre-declared variants, one shot each, no grid: V0 vanilla WML; V1 sector-neutral;
      V2 Barroso-Santa-Clara vol-scaled (12 percent annual target, 126d realised vol, published
      parameterisation); V3 story-capped (any validity-gated theme above 20 percent of a leg's
      normalised attention mass -- the registered sharedness threshold reused, never tuned --
      has lowest-momentum-rank members demoted for next-ranked non-theme names until the cap
      holds, same leg sizes); V4 story-hedged (vanilla plus a short overlay on the top theme's
      purged factor sized by the frozen A3 beta, active only while the registration-v2 rotation
      door is armed); V5 = V3 then vol-scaled. Primary readout is per-episode 0..+21d cumulative
      return by variant; secondary is full-period shape with stationary block bootstrap
      (mean block 21d).
    unit: registered episode (primary), day (secondary)
    grid: none -- every threshold, cap, window, and sizing rule is inherited frozen
  result:
    headline: >
      The registered informative-failure branch fired, in its most instructive form. The cap
      engaged 23 of 122 months (226 swaps) -- the sort's story concentration is real and the
      rule is live -- but NOT in the months governing any rotation episode, and the rotation
      door armed zero times in the decade. Story-capped and story-hedged books therefore
      entered every registered crash identical to vanilla. Meanwhile the vol-scaled incumbent
      improved every shape metric with intervals excluding zero: five percent CVaR +0.0274
      [+0.0212, +0.0338], max drawdown +0.372 [+0.209, +1.031], worst-five-day sum +0.412
      [+0.204, +0.628], and cut the vaccine-window loss from -33.4 to -7.5 percent.
    numbers:
      - {label: months where the story cap bound, value: "23 of 122", comparison: "226 member swaps total; tracking error vs vanilla 0.54 percent annualised"}
      - {label: months the rotation door armed, value: "0 of 122", comparison: "against the calm-date false-positive rate of 3 percent measured by the anatomy gate"}
      - {label: rotation-cell mean episode delta of the story-capped book, value: "+0.0002", comparison: "vs vanilla over the registered 0..+21d windows; identically zero at the vaccine episode because the cap did not bind at the governing month-end"}
      - {label: negative-control delta of the story-capped book, value: "0.0", comparison: "exactly zero -- no arming, no swaps, no drag, as registered"}
      - {label: vol-scaled five percent CVaR improvement, value: "+0.0274", comparison: "block-bootstrap 95 percent interval +0.0212 to +0.0338, excluding zero; max drawdown +0.372 and worst-five-day +0.412 likewise exclude zero"}
      - {label: vol-scaled vaccine-window return, value: "-0.075", comparison: "vs -0.334 for vanilla over the same 22 days"}
    figures: []
    power_statement: >
      The evaluation could see construction-level improvements of the size that matter:
      the vol-scaled comparator's shape improvements carry bootstrap intervals excluding
      zero on the identical panel (five percent CVaR +0.0212 to +0.0338, worst-five-day
      +0.204 to +0.628), so an episode-cell improvement of comparable magnitude from the
      story variants would have been visible. The story variants' rotation-cell delta was
      +0.0002 because the frozen identification never engaged at a rotation-governing
      month-end -- which is itself the registered claim failing as stated, not a blind
      instrument: the claim under registration was capping UNDER HONEST FROZEN
      IDENTIFICATION, and that composite is what the decade refutes.
    planted_effect: >
      The rule's liveness is evidenced by its own record rather than a synthetic plant:
      the cap engaged in 23 of 122 months (226 swaps) between episodes, and the negative
      control returned exactly zero drag -- the mechanism could act and could stay quiet;
      it simply never acted where the registered claim needed it to.
  reasoning: >
    Not a code failure and not a power failure: a diagnostic rerun of the DeepSeek-governing
    month-end showed the AI names all present in the book (all winner-side) and clustered in
    communities, but every AI-touching theme FAILED the frozen event-day validity gate --
    in the calm fourth quarter of 2024 the story was not moving the book distinctively, so the instrument
    declined to treat it as a bet. Same shape at the vaccine month-end: the pandemic-loser
    theme identified and gated, but saturation at 5.8 percent of book mass with the trailing
    percentile crushed by the COVID-spring baseline. The gate demands a story demonstrate
    market-moving power in the trailing window; rotations happen precisely when a story that
    was quiet gets repriced. This is the fourth independent program (after the anatomy, the
    tail-shape calibration, and the day-of classifier) to converge on the same wall from a
    different direction -- now at the construction level. The negative-control cell behaved
    exactly as registered: no arming, no swaps, zero drag. Per the registration's kill
    criterion, the mechanism does not convert to construction value under honest frozen
    identification, and the economic case for the text instrument rests on exposure
    knowledge, hedge-instrument choice, sizing, and attribution -- with vol-scaling
    confirmed, again, as the only construction that robustly buys tail shape.
  expectations: >
    Kill/success criteria are in docs/registration_construction.md section 4, binding at this
    commit. Cap-never-binds is a scope finding, not licence to tune. If the cap binds and the
    rotation-cell improvement is absent or reversed, the mechanism does not convert to
    construction value and the economic case rests on sizing, hedging, and attribution alone.
  history:
    - {date: 2026-08-27, note: "Registered before any variant was computed, on user sign-off of docs/registration_construction.md. All inputs frozen from registration v2; no new thresholds introduced."}
    - {date: 2026-08-27, note: "Ran to completion same day: 122 monthly checkpoints, six variants, registered eval. Verdict instrument_limited: the frozen identification never flagged the fatal story at a pre-episode month-end, so the construction claim was never put to its test; the cap binding 23 times BETWEEN episodes is the informative residue. Vol-scaled incumbent dominant on every shape metric with CIs excluding zero. Post-hoc diagnostics (DeepSeek and vaccine month-ends) logged in the reasoning; thresholds untouched."}
    - {date: 2026-08-27, note: "RECORD CORRECTION, prompted by adversarial review: the registered_at stamp was hand-typed at registration and did not match the version-control record -- for the two overlap/covariance entries it even postdated the completion commit. All six stamps in this block are now the registration COMMIT times from git (which do precede each completion commit). Standing rule adopted: registration timestamps are VCS-derived, never hand-typed, and future registrations carry an externally verifiable timestamp and a freeze-to-run gap. The same-day register-and-run pattern of this block cannot be repaired retroactively and is disclosed as a weakness of the whole block."}
    - {date: 2026-08-27, note: "VERDICT AMENDED instrument_limited -> refuted, per adversarial review: the observed outcome (cap binds between episodes, rotation-cell improvement absent) is verbatim the registration section-4 INFORMATIVE FAILURE branch, and choosing a fourth category kept the mechanism-conversion claim alive when the registration required closing it. The claim as registered -- story-capping under honest frozen identification converts to crash protection -- is refuted. The instrument-timing diagnosis stays in the reasoning as diagnosis, not as escape."}

- id: exp-053
  title: Analog detector — certificate and mechanism-family retrieval
  one_breath: >
    Does the fragility state space organize history by mechanism, tested as a representation
    check with a planted certificate first, never as a forecast.
  status: complete
  registered_at: 2026-08-27T07:21:43Z  # VCS-derived; see 2026-08-27 correction note
  verdict: refuted
  hypothesis: >
    A discretionary reader reasons by analogy; the analog panel gives that reasoning receipts
    only if similarity in our state space means mechanical similarity. The state vector is
    frozen before any retrieval runs: nine daily text-structure features from the state series
    (node count, effective rank, top-theme share, per-leg effective rank, per-leg shared mass,
    per-leg attention concentration), four monthly construction-study features forward-filled
    (top gated-theme loading percentile, maximum saturation percentile, gated-theme count,
    cap-bound indicator), and five daily price features (21d and 126d realised factor vol,
    63d factor path, 252d market path, 5d factor z). Causal trailing z-scores over up to 756
    days with a 200-day minimum, clipped at five sigma; Euclidean distance; candidates from
    2017 onward; a 45-day exclusion zone around any query; neighbours within 21 days collapse
    to one episode for display. Estimator-display separation is a standing constraint: no
    outcome statistic is ever quoted from the displayed handful of analogs, and no tail
    probability is quoted at all -- the timing wall stands.
  prediction: >
    CERTIFICATE (gate, runs first): fifty planted queries per noise level -- a historical
    day's feature row plus per-feature noise of zero, a quarter, a half, and one z-unit --
    must recover their true neighbourhood (top collapsed analog within ten days of the true
    date) at ninety percent or better at the quarter-z level, or the instrument cannot
    support any analog display and the panel is descoped.
    PRIMARY: querying each of the eight registered episodes at its pre-event score day and
    ranking the other seven episodes by state distance, the nearest episode shares the
    query's declared mechanism family (rotation: 2019-09, 2020-11, 2025-01, 2025-04;
    positioning-amplification: 2021-01, 2024-08; macro-vol: 2018-02, 2022-11) more often
    than family-label permutations allow, exact one-sided permutation p on ten thousand
    shuffles. The January-2025 episode is the anatomy's spent calibration case; using its
    state as a retrieval query tunes nothing and is disclosed rather than excluded.
    SECONDARY, descriptive only: unrestricted top-three collapsed analogs per episode,
    tabulated for the tribunal.
    KILL CRITERION: retrieval at chance means the analogs panel ships without any mechanism
    language, with the null disclosed in the panel itself. Eight queries cannot power a
    strong claim in either direction and this is registered as a representation check, not
    a claim about the world.
  data:
    - source: src-gdelt
      slice: daily state series 2016-01 through the present, clean v2 tables
      tier: DESIGN
      vintage: 2026-08-27
    - source: src-iwv
      slice: monthly books and daily price panel for the factor-path features
      tier: DESIGN
      vintage: 2026-08-27
  method:
    uses: [mth-permutation]
    statistic: >
      Certificate recovery rate by noise level; count of eight episode queries whose nearest
      other episode is same-family, against the label-permutation null.
    unit: episode query
    grid: none -- one frozen feature set, one metric, one exclusion rule
  result:
    headline: >
      Certificate PASSED, primary REFUTED, kill criterion fires. Planted queries recovered
      their true neighbourhood 50 of 50 at the quarter-z gate (47 of 50 at half a z, 28 of 50
      at a full z -- a clean sensitivity curve), so distances are meaningful. Then the
      registered mechanism-family retrieval returned ZERO of eight: no episode's nearest
      fellow episode shares its declared family, against a permutation-null mean of 2.29.
      The secondary table shows what the space actually organises by -- era and regime, and
      locally very well: the squeeze retrieves the crowded-covid autumn, the 2022 CPI day
      retrieves other 2022 macro days, the January-2025 episode retrieves the late-2024 AI
      book, the 2018 vol shock retrieves August 2018. State similarity is real; the coming
      mechanism is not written in the prior state. The analogs panel therefore ships with
      similarity language only, no mechanism families, with this null disclosed in the panel.
    numbers:
      - {label: certificate recovery at quarter-z noise, value: "50 of 50", comparison: "gate required 45 of 50; degradation curve 47 of 50 at half a z and 28 of 50 at one z"}
      - {label: nearest-episode same-family count, value: "0 of 8", comparison: "permutation null mean 2.29; one-sided p 1.0; below-chance but not significantly so at this n"}
      - {label: geometry-aligned label plant, value: "6 of 8", comparison: "the identical statistic under labels drawn from the vectors' own ward clustering -- the test can see structure when structure is there"}
    figures: []
    power_statement: >
      Eight queries, one-sided exact permutation test: significance requires at least five of
      eight nearest-neighbour family matches, and eighty percent power requires a true
      per-query match propensity near 0.70 against a chance rate of 0.29. The refutation
      therefore covers only the strong form -- mechanism family as the dominant organiser of
      pre-event state geometry. Weak family structure below that detection floor is not
      excluded and is not claimed.
    planted_effect: >
      Two plants. The retrieval instrument's certificate planted noisy copies of real
      historical days and recovered them 50 of 50 at the registered noise level, so the null
      is not a degenerate-metric artifact. The statistic itself was planted by assigning the
      eight episodes labels from their own hierarchical clustering: the same test returns six
      of eight, so the procedure detects geometry-aligned labels on exactly this data.
  reasoning: >
    A day-zero diagnostic (disclosed post-hoc, not verdict-bearing) reproduced the identical
    zero of eight with the identical nearest-neighbour pairs: the state features are slow
    rolling structures, so the event day barely moves them, and the failure is not about
    which day was queried. No single feature dominates the pairwise distances (the largest
    contributor carries eighteen percent). The reading that survives: the fragility state
    space encodes WHICH WORLD the book lives in -- era, regime, concentration, kinematics --
    and encodes it well enough for planted recovery and locally sensible analogs; but the
    mechanism of the next break is selected by the arriving shock, not by the resting state.
    That is the same wall the anatomy, the calibration test, the day-of classifier, and the
    construction study each hit, now expressed geometrically. Product consequence, per the
    registered kill criterion: the analogs panel presents nearest historical states as
    similarity-of-condition with receipts, never as mechanism or outcome claims, and carries
    the refutation line verbatim.
  history:
    - {date: 2026-08-27, note: "Registered before the state-vector builder ran. Feature set, normalisation, distance, exclusion, collapse, certificate gate, family labels, and kill criterion all frozen here."}
    - {date: 2026-08-27, note: "Ran same day. One coverage bug fixed before any retrieval (NaN saturation percentiles amputating 2016-2017 via a truthiness slip; the fix restored the registered burn-in and put the 2018 vol-shock episode back in coverage). Certificate passed, primary zero of eight, kill criterion fired; day-zero diagnostic and both plants logged. Verdict refuted on the strong form only, per the power statement."}
    - {date: 2026-08-27, note: "RECORD CORRECTION, prompted by adversarial review: the registered_at stamp was hand-typed at registration and did not match the version-control record -- for the two overlap/covariance entries it even postdated the completion commit. All six stamps in this block are now the registration COMMIT times from git (which do precede each completion commit). Standing rule adopted: registration timestamps are VCS-derived, never hand-typed, and future registrations carry an externally verifiable timestamp and a freeze-to-run gap. The same-day register-and-run pattern of this block cannot be repaired retroactively and is disclosed as a weakness of the whole block."}
    - {date: 2026-08-27, note: "Adversarial review: this entry was judged the clean one of the block (certificate, label plant, kill criterion fired, scoped power statement). Retained as the template."}

- id: exp-054
  title: Exit-door economics — does exit cost price severity cross-sectionally on crash days?
  one_breath: >
    The tournament's deferred Exit Door idea, run in the one category that survived the
    refutations: severity given the event, tested cross-sectionally where the power is.
  status: complete
  registered_at: 2026-08-27T07:49:49Z  # VCS-derived; see 2026-08-27 correction note
  verdict: refuted
  hypothesis: >
    Five programs killed timing; severity-given-event survived. The exit-door claim is that
    WHO owns a position and HOW COSTLY the exit is do not predict when the crash comes but
    do price how hard each name moves when it arrives: on momentum crash days, heavily
    shorted losers squeeze harder (the exit door for shorts is narrow) and concentrated-
    ownership winners fall harder (few doors, many exiters). This is a sizing input, not a
    signal, and it is testable with real power because the unit is the stock-day within
    event days -- hundreds of names per event, not fifteen events.
  prediction: >
    Events are the ninety-three causal bottom-2.5-percent factor days already frozen for
    the day-of classifier -- reusing that set spends nothing new. The short-interest cell
    covers the eighty-eight events from February 2018 when the settlement archive begins,
    disclosed. Calm baseline: an equal count of non-event business days from the same span,
    at least five days from any event, seed 2032. Exposures are point-in-time: days-to-cover
    from the latest settlement file available at t; per-stock 13F filer top-ten share from
    the latest quarter past its deadline with rows available at t. Outcome: day-t stock
    return, sector-demeaned within the book. Statistic: within-leg per-day Spearman, and
    the PRIMARY readout is the event-minus-calm difference in mean per-day Spearman --
    the interaction, because exit cost correlating with returns on ordinary days is not
    the claim. Two primary cells, Benjamini-Hochberg as the repo pair convention:
    Cell one, loser leg by days-to-cover, event-minus-calm mean Spearman POSITIVE (crowded
    shorts squeeze harder on crash days). Cell two, winner leg by filer top-ten share,
    event-minus-calm mean Spearman NEGATIVE (concentrated ownership falls harder).
    Bootstrap over days, ten thousand draws. SECONDARY, exploratory: filer HHI variant;
    increment from membership in a validity-gated crowded theme over the stock-level read.
    CERTIFICATE before verdict: a planted tilt -- synthetic exposure-proportional return
    shifts of declared sizes injected on placebo event days -- must be recovered at its
    known size, with the smallest detectable event-minus-calm gap recorded; no verdict
    without it. Disclosures carried: the archived finding that short-interest asymmetry
    inverts when the formation window spans a crash; the vaccine-episode short-leg
    coherence asymmetry; both are context, neither is tuned on here.
  data:
    - source: src-iwv
      slice: daily returns and books on the frozen event days and calm baseline
      tier: DESIGN
      vintage: 2026-08-27
    - source: src-13f
      slice: per-stock filer concentration, point-in-time quarters 2016 through 2025q4
      tier: DESIGN
      vintage: 2026-08-27
    - source: src-short-interest
      slice: days-to-cover from settlement files 2018-01 onward
      tier: DESIGN
      vintage: 2026-08-27
  method:
    uses: [mth-spearman, mth-cluster-boot]
    statistic: >
      Event-minus-calm difference in mean per-day within-leg Spearman between sector-
      demeaned stock return and the exit-cost exposure, one declared sign per cell.
    unit: day (clustering unit); stock-day (observation)
    grid: none -- two declared cells, one baseline construction, one demeaning rule
  result:
    headline: >
      Both declared cells REFUTED on a certified instrument -- one as a well-powered null,
      one with the sign reversed. Cell one (loser leg by days-to-cover): event-minus-calm
      mean per-day Spearman +0.001, interval -0.024 to +0.026, against a certified minimum
      detectable effect of 0.05 -- crowded shorts do NOT squeeze harder than their leg
      peers on crash days. Cell two (winner leg by filer top-ten share): +0.070, interval
      +0.046 to +0.093 -- significant and OPPOSITE the declared sign: concentrated-
      ownership winners OUTPERFORM their leg on crash days. The exploratory cells double
      the reversal: winner-leg HHI +0.053 and winner-leg days-to-cover +0.079, intervals
      excluding zero, while loser-leg concentration is flat. Per this project's standards
      the reversed effect is refused as a finding and logged as a hypothesis: crash days
      are squeeze days, and within the winner leg the still-shorted, tightly-held names
      behave like the squeezed cohort -- rising with it -- rather than like exits under
      pressure. A size confound (concentration and days-to-cover both proxy for small
      caps, which outperform on rebound days) is the named alternative; neither story is
      claimed.
    numbers:
      - {label: loser leg by days-to-cover, value: "+0.001", comparison: "interval -0.024 to +0.026 over 88 event and 77 calm days; certified MDE 0.05; a genuine null, not an underpowered one"}
      - {label: winner leg by filer top-ten share, value: "+0.070", comparison: "interval +0.046 to +0.093; declared sign was negative; refused as a finding, logged as the squeeze-cohort hypothesis"}
      - {label: winner-leg days-to-cover (exploratory), value: "+0.079", comparison: "interval +0.053 to +0.104, same reversed direction; loser-leg concentration flat at -0.009"}
      - {label: certificate recovery at the 0.05 plant, value: "40 of 40 in both cells", comparison: "false alarms 0 of 40 (loser cell) and 13 of 40 (winner cell) at zero plant -- the latter from a chance 0.03 offset between the realized non-event pools, which sets the interpretability floor"}
    figures: []
    power_statement: >
      The planted-tilt certificate ran to verdict on the final instrument: an exposure-
      proportional tilt of 0.05 in per-day rank correlation is recovered forty of forty
      times in both cells; at zero plant the loser cell false-alarms zero of forty and the
      winner cell thirteen of forty, driven by a chance offset near 0.03 between the two
      realized non-event day pools. Effects below roughly 0.03 are therefore not
      interpretable on this panel; both primary readings are clear of that floor -- the
      null by construction of its interval, the reversal by more than twice it.
    planted_effect: >
      Synthetic exposure-proportional return tilts injected on pseudo-event days drawn
      from a two-hundred-day certification pool disjoint from the calm baseline, at
      declared sizes zero, 0.05, 0.1 and 0.2 of the day's cross-sectional dispersion,
      forty replicates per size, scored by a two-sample test against the calm pool.
      The certificate itself required two repairs before it read correctly, both logged:
      a single constant-input day's undefined correlation was poisoning entire replicates,
      and the original one-sample form treated the estimated calm mean as known truth
      and false-alarmed twenty-seven of forty on the winner cell.
  reasoning: >
    The exit-door claim inherited from the tournament dies in its registered form: exit
    cost does not price crash-day severity in the declared directions. What the panel
    actually shows -- refused as a finding, recorded as structure for future work -- is
    that momentum crash days behave as squeeze days all the way down: the names that
    rise most within EACH leg are the crowded, expensive-exit ones, which is the
    Khandani-Lo unwind signature expressed cross-sectionally. The practical consequence
    for the product is real either way: per-stock exit-cost readings remain descriptive
    sizing context in the X-ray, and no severity multiplier keyed to concentration or
    days-to-cover is defensible for the book's own names. Instrument history: thirty
    late-2025 and 2026 day-rows were rebuilt after four missing SEC quarters (the
    filing-season naming change) landed, so every exposure reflects the fullest archive
    that was truly available at each date; results were unchanged by the rebuild.
  history:
    - {date: 2026-08-27, note: "Registered before any exposure was joined to any return. Event set reused frozen; calm seed, demeaning, cells, signs, correction, and the certificate gate all declared here."}
    - {date: 2026-08-27, note: "Ran to verdict same day: 187,339 stock-day rows across 386 days. Two certificate repairs (NaN poisoning; one-sample vs two-sample) and one archive completion (stale 13F quarters rebuilt) logged before the verdict pass; primary numbers identical before and after the archive rebuild. Verdict refuted: certified null in the loser cell, sign reversal refused in the winner cell."}
    - {date: 2026-08-27, note: "RECORD CORRECTION, prompted by adversarial review: the registered_at stamp was hand-typed at registration and did not match the version-control record -- for the two overlap/covariance entries it even postdated the completion commit. All six stamps in this block are now the registration COMMIT times from git (which do precede each completion commit). Standing rule adopted: registration timestamps are VCS-derived, never hand-typed, and future registrations carry an externally verifiable timestamp and a freeze-to-run gap. The same-day register-and-run pattern of this block cannot be repaired retroactively and is disclosed as a weakness of the whole block."}
