- id: cmp-placebo
  label: Placebo books
  one_breath: >
    Books no sort built, so the sort's effect has something to be measured against.
  layer: feature
  state: working
  module: factor/placebo.py
  does: >
    Constructs comparison books from the same universe under selection rules other than
    momentum. The project's central finding is that the momentum sort MANUFACTURES the
    exposure it later gets blamed for, and that finding had no null until this existed: if any
    selection rule confers a comparable tilt, the claim is about sorting, not about momentum.
  inputs: [cmp-legs, cmp-sectors]
  outputs: [cmp-conferred]
  last_changed: 2026-08-26
  claims: []

- id: cmp-conferred
  label: Conferred-tilt channel
  one_breath: >
    What the ranking BUILDS into the book, as opposed to what the companies in it disclose.
  layer: feature
  state: working
  module: features/conferred.py
  does: >
    Measures the factor loadings the momentum sort creates at each formation date. The
    exposure that made September 2019 fragile was not a property the constituent firms had and
    wrote down; it was conferred on them by the ranking. This is the mechanism behind the
    project's most useful finding and the reason company filings cannot see it.
  inputs: [cmp-legs, cmp-placebo]
  outputs: [cmp-severity, cmp-translate]
  last_changed: 2026-08-26
  claims: []

- id: cmp-crowding
  label: Return-based crowding
  one_breath: >
    How much arbitrage capital is in the same trade, inferred from how the stocks move.
  layer: feature
  state: working
  module: features/crowding.py
  does: >
    Computes the average pairwise correlation of factor-residual returns among stocks inside a
    momentum leg, the published measure of arbitrage activity, alongside short-interest based
    components.
  inputs: [cmp-legs, cmp-shortinterest]
  outputs: [cmp-channels]
  last_changed: 2026-08-26
  claims: []

- id: cmp-overlap
  label: Ownership overlap
  one_breath: >
    Separates a stock being popular from a basket being held together by the same managers.
  layer: feature
  state: working
  module: features/overlap.py
  does: >
    Measures how far one set of institutions holds a basket jointly, rather than how many
    institutions hold each name. Popularity and crowding are different quantities and the
    difference is the entire point: large index-tracked stocks are held by everyone without
    anyone being crowded into them.
  inputs: [cmp-thirteenf]
  outputs: []
  last_changed: 2026-08-24
  claims: [clm-13f-legs-no-asymmetry]

- id: cmp-comovement
  label: Partition co-movement test
  one_breath: >
    Asks whether the names a grouping puts together actually fall together, against
    sector-matched random groups.
  layer: feature
  state: working
  module: features/comovement.py
  does: >
    Takes any grouping of a book and tests whether its groups co-move more than random groups
    drawn to match the same sector composition. This is how a naming layer gets graded on
    something outside the document it read, and the sector matching is what stops industry
    membership answering for it.
  inputs: [cmp-sectors]
  outputs: [cmp-partition]
  last_changed: 2026-08-25
  claims: []

- id: cmp-concentration
  label: Sub-bet statistics
  one_breath: >
    Finds a concentrated bet inside a book that averages look right through.
  layer: feature
  state: working
  module: features/concentration.py
  does: >
    Statistics for whether a SUBSET of a book shares one direction, rather than whether the
    book as a whole does. Mean pairwise similarity is algebraically the squared centroid norm,
    so a sub-bet covering a fraction of the book enters that statistic squared and disappears.
    This is the algebra behind five of the project's underpowered nulls.
  inputs: [cmp-chrono]
  outputs: [cmp-power]
  last_changed: 2026-08-25
  claims: []

- id: cmp-factor-comovement
  label: Cross-factor co-movement
  one_breath: >
    The deleveraging channel, for the founding episode that is invisible in momentum returns
    alone.
  layer: feature
  state: working
  module: factor/comovement.py
  does: >
    Measures co-movement across factors rather than within one. The August 2007 quant quake --
    the founding episode of the whole crowded-unwind literature -- does not appear as an
    extreme move in daily momentum returns at all, so an episode detector reading momentum
    alone will never find it.
  inputs: [cmp-french]
  outputs: [cmp-episodes]
  last_changed: 2026-08-24
  claims: []

- id: cmp-narrative
  label: Narrative concentration
  one_breath: >
    Concentration in what is written about the holdings, rather than in the holdings
    themselves.
  layer: feature
  state: working
  module: features/narrative.py
  does: >
    Measures whether coverage of a book's holdings converges on one story. Built from the
    finding that in September 2019 the book was one bet wearing ten sector labels while every
    portfolio-level average said it was ordinary.
  inputs: [cmp-news]
  outputs: [cmp-channels]
  last_changed: 2026-08-22
  claims: []

- id: cmp-riskpairs
  label: Risk-text pair statistics
  one_breath: >
    Whether two firms' disclosure similarity explains their co-movement beyond shared
    industry.
  layer: feature
  state: working
  module: features/riskpairs.py
  does: >
    Compares pairs of firms on disclosure language against their realised co-movement, with
    industry held fixed. Rebuilt from its own outputs: the original was written, run, cited
    under two reproduced claims and four experiments, and never committed, leaving eleven
    reproduce commands in the ledger pointing at code that did not exist.
  inputs: [cmp-filings]
  outputs: []
  last_changed: 2026-08-25
  claims: []

- id: cmp-retrieve
  label: Retrieval
  one_breath: >
    Targeted reading, with its own recall measured rather than assumed.
  layer: feature
  state: working
  module: text/retrieve.py
  does: >
    Treats a candidate driver as a query, pulls each holding's relevant passages, and hands
    them to extraction. Availability is a hard filter on the acceptance timestamp rather than
    a re-ranking. Recall bootstraps from cached extraction records, whose quoted evidence
    marks a known-relevant passage in a known filing, so recall is computable before anyone
    hand-marks anything.
  inputs: [cmp-filings]
  outputs: [cmp-harvest]
  last_changed: 2026-08-25
  claims: []

- id: cmp-harvest
  label: Dual-harvest reader
  one_breath: >
    Reads one filing twice at once: in the company's own words, then against eight fixed
    themes.
  layer: feature
  state: working
  module: llm/harvest.py
  does: >
    Asks first for every exposure the company names itself, unprompted by any list, so the
    anchors cannot prime it; then for an explicit judgement on each of eight registered
    themes. Every claim in both halves carries a quote checked mechanically against the source.
    Three schema versions in one day: the first forced a direction onto disclosure that states
    an exposure without giving one, the second exposed that `hurt_by_rising` was being used as
    a generic "bad for us" label and inverting every passage describing harm from a FALL.
  inputs: [cmp-filings, cmp-retrieve, cmp-taxonomy]
  outputs: [cmp-translate]
  last_changed: 2026-08-26
  claims: [clm-harvest-schema-honesty]

- id: cmp-exposure
  label: Per-name exposure extraction
  one_breath: >
    One model, one document, one call about it -- the shape this project measures the model to
    be good at.
  layer: feature
  state: working
  module: llm/exposure.py
  does: >
    Extracts what a company states about its own rate exposure from its own filing, with the
    quoted evidence checked as a substring of the source. Hallucinated evidence is the failure
    mode this layer exists to prevent and it is machine-checkable for free, so failures are
    build failures.
  inputs: [cmp-filings]
  outputs: [cmp-harvest, cmp-ppi]
  last_changed: 2026-08-26
  claims: []

- id: cmp-schema
  label: Typed evidence records
  one_breath: >
    The contract that stops the language layer ever producing a number a model consumes.
  layer: feature
  state: working
  module: llm/schema.py
  does: >
    Defines what the language layer is allowed to emit: a structured record with a citation,
    saying whether a passage is genuinely about the mechanism. It reads text and never
    produces a probability or a magnitude. Aggregation into numbers happens in arithmetic that
    can be audited.
  inputs: []
  outputs: [cmp-exposure, cmp-harvest, cmp-extract]
  last_changed: 2026-08-20
  claims: []

- id: cmp-partition
  label: Book partitioner
  one_breath: >
    Asks a model to name what a book jointly bets on, and which holdings carry each bet.
  layer: feature
  state: working
  module: llm/partition.py
  does: >
    Produces named groupings of a book's holdings, graded on whether the names inside a group
    actually fall together rather than on whether the names sound plausible. Built because
    four separate text nulls reduce to one cause, and none of them tested naming.
  inputs: [cmp-chrono]
  outputs: [cmp-comovement]
  last_changed: 2026-08-25
  claims: []

- id: cmp-synthesis
  label: Semantic news aggregation
  one_breath: >
    Aggregation over a book's coverage that can express a shared bet, with a placebo and a
    hindsight probe.
  layer: feature
  state: working
  module: llm/synthesis.py
  does: >
    Aggregates news semantically rather than by counting theme words, because a fixed
    vocabulary cannot express what the September 2019 book actually was. Ships with a placebo
    arm and a hindsight probe, since an aggregator that reads the future is the obvious way
    this fails.
  inputs: [cmp-news]
  outputs: [cmp-narrative]
  last_changed: 2026-08-22
  claims: []

- id: cmp-power
  label: Planted-effect certificates
  one_breath: >
    What could this instrument have seen? A null is a claim about the world only if the answer
    is "enough".
  layer: model
  state: working
  module: validation/power.py
  does: >
    Plants effects of known size and measures how often the instrument detects them,
    producing a smallest-detectable-effect region and a false-alarm rate. The validator
    refuses a refutation without one. Each certificate is fingerprinted twice, on the
    POPULATION it was issued against and on the NULL CONSTRUCTION it used, because a
    certificate that survives a change in either silently gates the wrong verdict -- both
    failures have happened here.
  inputs: [cmp-concentration]
  outputs: [cmp-severity]
  last_changed: 2026-08-26
  claims: []

- id: cmp-ppi
  label: Prediction-powered inference
  one_breath: >
    Honest intervals on a quantity built from twenty thousand model labels and ninety human
    ones.
  layer: model
  state: partial
  module: validation/ppi.py
  does: >
    Combines a large set of model labels with a small set of human labels to give an interval
    that is neither tight-around-a-biased-number nor unbiased-and-useless. Partial because the
    gold sets are task-matched and the exposure gold set does not exist yet: aboutness labels
    rectify aboutness quantities only, and cached extraction records are a regression target,
    never ground truth.
  inputs: [cmp-exposure]
  outputs: []
  last_changed: 2026-08-25
  claims: []

- id: cmp-regimes
  label: Regime clustering
  one_breath: >
