  claims: []

- id: cmp-state-vector
  label: State vector
  one_breath: >
    One numeric row per month-end describing the sensor's state, block-standardised on
    expanding windows and gated before anything retrieves against it.
  layer: feature
  state: working
  module: ../scripts/build_state_vector.py
  does: >
    Assembles eight blocks -- conferred tilt with its placebo percentile, within-leg
    comovement, cross-sectional dispersion, a conferred valuation spread, the trailing
    volatility regime, the two-channel mechanism indicator, short-side pressure and the
    index-implied options state -- into one month-end panel running 1927-03 to the seal at
    2023-01. Each column is z-scored on an expanding window through t inclusive with a
    36-month burn-in, so a value never uses data after its own date. Blocks are weighted
    equally and a block's weight is split evenly across its own columns, so adding a column
    to a block does not buy that block influence. Missing blocks are explicit NaN beside a
    per-block coverage column and are never imputed.
  inputs: [cmp-conferred, cmp-channels]
  outputs: []
  last_changed: 2026-08-30
  claims: []
  artifacts:
    - data/processed/state_vector.parquet
    - data/processed/state_vector_spec.json
  interface: >
    FROZEN at sha256 01e6458bc8365aa2 (recorded in state_vector_spec.json alongside the
    block map, the column weights, the burn-in and the per-column first-valid dates).
    Consumers read the spec for the weights; they do not re-derive them. The panel is
    ragged by design and a consumer must compute over present blocks only: 754 of 1,150
    rows carry three blocks, 68 carry six or more, 18 carry all eight.
  limits: >
    Conferred loadings are masked where the formation window carries fewer than 120
    observations, which removes 2007-10 to 2013-05 from the tilt and valuation blocks; the
    monthly holdings panel cannot support a loading before then. Comovement starts 2014-01,
    the placebo percentile 2013-09, short-side pressure 2018-08, and the options term slope
    2009-09 against 1990-01 for implied level and skew. French publishes with roughly a
    fifty-day lag, so the blocks derived from it are unavailable for the two newest months
    of a live reading.
