  inputs: [cmp-severity, cmp-channels, cmp-conferred, cmp-crowding]
  outputs: [cmp-brief]
  last_changed: 2026-08-26
  claims: []

- id: cmp-brief
  label: Brief renderer
  one_breath: >
    The page a portfolio manager reads, with the could-not-measure list in the body rather than
