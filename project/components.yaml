- id: cmp-run
  label: End-to-end run
  one_breath: >
    One date in, one brief out, with every stage that could not run saying so.
  layer: output
  state: working
  module: pipeline/run.py
  does: >
    Executes every stage for a single date and renders regardless of failures, each gap
    carrying a reason. A monitor whose gaps are invisible is worse than one full of holes,
