  layer: output
  state: working
  module: pipeline/nightly.py
  does: >
    Emits a dated, versioned brief every day at whatever coverage the system currently has. A
    system demonstrated on request is a backtest with a nice renderer; one that has been
    emitting dated briefs for weeks, with its could-not-measure list visibly shrinking, is a
