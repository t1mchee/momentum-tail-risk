- id: cmp-official
  label: Official-sector commentary
  one_breath: >
    Central bank review text, the last text source with a plausible lead on a new driver.
  layer: data
  state: partial
  module: data/official.py
  does: >
    Loads quarterly official-sector reviews. Coverage is the limitation and it is a hard one:
