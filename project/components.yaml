- id: cmp-referee
  label: Adversarial referee
  one_breath: >
    Can a model name an experiment's structural flaw from its registration alone?
  layer: model
  state: working
  module: llm/referee.py
  does: >
    Reads an experiment's registration and tries to name what is wrong with it, graded against
