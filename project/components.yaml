  inputs: [cmp-run, cmp-translate]
  outputs: []
  last_changed: 2026-08-25
  claims: []

- id: cmp-nightly
  label: Nightly run
  one_breath: >
    One dated brief per calendar day, whatever coverage exists, because monitoring is proven by
