  outputs: [cmp-taxonomy]
  last_changed: 2026-08-25
  claims: []

- id: cmp-chrono
  label: Vintage-matched embeddings
  one_breath: >
    Reads old documents with a model that did not know how the story ended.
  layer: feature
  state: partial
  module: embed/chrono.py
  does: >
    Embeds each document under the latest model checkpoint whose training predates the
    measurement date, because a modern model placed every historical window correctly with
    dates stripped -- blinding is not a defence. Vintage is keyed to the MEASUREMENT date, not
    the filing date, since vectors from different checkpoints are not comparable and mixing
    them inside one cross-section invalidates everything downstream.
  inputs: [cmp-filings]
  outputs: [cmp-concentration]
  last_changed: 2026-08-25
  claims: []

- id: cmp-cleanlegs
  label: Corporate-action correction
  one_breath: >
    Stops a share consolidation reading as a nineteen-hundred percent return.
  layer: feature
  state: working
  module: factor/cleanlegs.py
  does: >
    Detects and corrects splits in the unadjusted price field before momentum is computed. A
    one-for-twenty consolidation is a step change in an unadjusted series, and this project
    recorded one ranking as the best-performing stock in the book before the correction
    existed.
  inputs: [cmp-holdings]
  outputs: [cmp-legs]
  last_changed: 2026-08-23
  claims: []

- id: cmp-sectors
  label: Sector taxonomy bridge
  one_breath: >
    One sector scheme for a panel carrying two, and no dash ranked as a company.
  layer: feature
  state: working
  module: factor/sectors.py
  does: >
    Maps the older and newer sector schemes onto one another across the vendor change around
