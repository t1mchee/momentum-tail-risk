  claims: []

- id: cmp-translate
  label: Translation layer
  one_breath: >
    Turns a measured tilt into something a portfolio manager can act on and be scored against.
  layer: output
  state: working
  module: llm/translate.py
  does: >
    Converts sentences like "the book just inherited a 1.46 beta spread with a defensive tilt
