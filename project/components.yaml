# The system as a graph. `inputs` and `outputs` are what draw the schematic.

# ---- getting the data in ---------------------------------------------------------

- id: cmp-pit
  label: Availability discipline
  one_breath: >
    Stamps every record with when it happened and when we could first have known it, and
    refuses to build features on the former.
  layer: data
  state: working
  module: pit.py
  does: >
    Separates the moment something occurred from the moment it became knowable, and raises
    an error when a calculation reaches across that line. Built in the first commit,
    because retrofitting it never works.
  inputs: []
  outputs: [cmp-holdings, cmp-french, cmp-edgar, cmp-news]
  last_changed: 2026-08-12
  claims: []

- id: cmp-holdings
  label: Index holdings loader
  one_breath: >
    Downloads and validates the daily list of index constituents, including companies that
    later disappeared.
  layer: data
  state: working
  module: data/ishares.py
  does: >
    Fetches holdings, rejects the several kinds of plausible-looking rubbish the endpoint
    returns, and maintains a rebuildable panel of prices and weights. Most of the trap log
    lives here.
  inputs: [cmp-pit]
  outputs: [cmp-legs, cmp-composition]
  last_changed: 2026-08-16
  claims: []

- id: cmp-french
  label: Academic factor returns
  one_breath: >
    Loads the standard published factor return series and keeps a hash of every download,
    because the publisher restates history silently.
  layer: data
  state: working
  module: data/french.py
  does: >
    Provides the reference momentum series used for research, records the publication
    delay that rules it out of live use, and can report exactly what changed between two
    downloads.
  inputs: [cmp-pit]
  outputs: [cmp-constructions, cmp-severity]
  last_changed: 2026-08-13
  claims: []

- id: cmp-cboe
  label: Volatility and correlation indices
  one_breath: >
    Loads free daily option-implied volatility and correlation history, with an explicit
    list of series that quietly stopped updating.
  layer: data
  state: working
  module: data/cboe.py
  does: >
    Supplies market-wide option-implied measures back to 1990, and guards against the
    failure mode where a discontinued series reads as permanent calm.
  inputs: [cmp-pit]
  outputs: [cmp-channels]
  last_changed: 2026-08-19
  claims: [clm-implied-corr]

- id: cmp-options
  label: Option chain capture
  one_breath: >
    Captures full option prices for every stock in the book each day, forward only, because
    no free history exists to buy or download.
  layer: data
  state: partial
  module: data/options.py
  does: >
    Walks both sides of the book, throttled to a pace the provider tolerates, and stores
    raw chains. A day missed here can never be recovered, which drives every design choice
    in the module.
  inputs: [cmp-pit, cmp-legs]
  outputs: [cmp-skew]
  last_changed: 2026-08-21
  claims: []

- id: cmp-edgar
  label: Regulatory filing timestamps
  one_breath: >
    Reads when each company actually filed its earnings release, stamped to the second by
    the regulator.
  layer: data
  state: working
  module: data/earnings.py
  does: >
    Builds a dated earnings calendar for the companies actually held, which is the
    book-specific version of a catalyst calendar.
  inputs: [cmp-pit]
  outputs: [cmp-grid]
  last_changed: 2026-08-21
  claims: []

- id: cmp-news
  label: News index reader
  one_breath: >
    Queries a free worldwide news index, cached to disk because the service allows roughly
    one request every twelve seconds.
  layer: data
  state: working
  module: data/gdelt.py
  does: >
    Retrieves dated article metadata for a topic and time window, and sorts results by
    publisher quality so a null can be tested separately at each tier.
  inputs: [cmp-pit]
  outputs: [cmp-extract]
  last_changed: 2026-08-18
  claims: [clm-news-crowding]

- id: cmp-shortside
  label: Short selling data
  one_breath: Daily short volume per stock, plus the settlement-failure list that turned out unusable.
  layer: data
  state: partial
  module: data/shortside.py
  does: >
    Supplies the only free daily measure of short activity per stock. Levels are
    meaningless because market makers hedge; only changes carry information.
  inputs: [cmp-pit]
  outputs: [cmp-skew]
  last_changed: 2026-08-16
  claims: [clm-regsho]

# ---- turning it into measurements ------------------------------------------------

- id: cmp-constructions
  label: Portfolio constructions
  one_breath: >
    Builds the momentum portfolio twelve different ways, because which crashes exist
    depends on how it is built.
  layer: feature
  state: working
  module: factor/constructions.py
  does: >
    Produces value-weighted and equally-weighted variants, size splits, and each side of
    the portfolio separately, so no single construction choice is smuggled in as an
    assumption.
  inputs: [cmp-french]
  outputs: [cmp-episodes, cmp-severity]
  last_changed: 2026-08-14
  claims: [clm-construction]

- id: cmp-legs
  label: Book reconstruction
  one_breath: >
    Rebuilds what a momentum book would actually have held on any past date, from the
    index membership of that date.
  layer: feature
  state: working
  module: factor/legs.py
  does: >
    Ranks the investable universe on past performance and forms the winning and losing
    sides, keeping companies that later delisted so the losing side is not quietly
    flattered.
  inputs: [cmp-holdings]
  outputs: [cmp-comomentum, cmp-composition, cmp-options]
  last_changed: 2026-08-15
  claims: []

- id: cmp-comomentum
  label: Crowding measure
  one_breath: >
    Measures how similarly the stocks inside one side of the book move together, after
    removing what the market explains.
  layer: feature
  state: working
  module: features/comomentum.py
  does: >
    Implements a published crowding measure and reproduces its central result on data
    published after the original paper ended. Descriptively useful, economically worthless
    as a trigger.
  inputs: [cmp-legs]
  outputs: [cmp-brief]
  last_changed: 2026-08-17
  claims: [clm-comomentum-replicates, clm-comomentum-useless]

- id: cmp-channels
  label: Two-channel state
  one_breath: >
    Distinguishes a panic rebound from a crowded rotation, which are two different events
    that share a name.
  layer: feature
  state: partial
  module: features/channels.py
  does: >
    Separates episodes cleanly into the two mechanisms and correctly fails to improve any
    forecast. Retained for explanation, excluded from the model.
  inputs: [cmp-cboe, cmp-constructions]
  outputs: [cmp-brief]
  last_changed: 2026-08-17
  claims: [clm-taxonomy, clm-quake-not-momentum, clm-2019-mirror]

- id: cmp-composition
  label: Exposure map
  one_breath: >
    Describes what the book is actually betting on, beyond the sector labels its holdings
    happen to carry.
  layer: feature
  state: working
  module: features/composition.py
  does: >
    Measures concentration and turnover, and compares portfolio-level summaries against
    the individual holdings. This is where the most useful finding in the project came
    from.
  inputs: [cmp-holdings, cmp-legs]
  outputs: [cmp-brief]
  last_changed: 2026-08-18
  claims: [clm-aggregation]

- id: cmp-skew
  label: Option skew features
  one_breath: >
    Turns raw option chains into the price of downside protection per stock, comparable
    across the book.
  layer: feature
  state: working
  module: features/skew.py
  does: >
    Interpolates option prices to a fixed sensitivity point so one stock's crash protection
    is comparable with another's, applies the liquidity gates, and reports which companies
    dropped and why as an output rather than a footnote.
  inputs: [cmp-options, cmp-shortside]
  outputs: [cmp-brief]
  last_changed: 2026-08-22
  claims: [clm-skew-squeeze]

- id: cmp-extract
  label: Evidence extraction
  one_breath: >
    Reads news text and returns structured, dated evidence records that cannot contain a
    probability.
  layer: feature
  state: partial
  module: llm/extract.py
  does: >
    Filters and structures text far more precisely than keyword matching. The record
    format has no field for a probability, so the model is structurally unable to produce
    the number the deterministic code is responsible for.
  inputs: [cmp-news]
  outputs: [cmp-brief]
  last_changed: 2026-08-18
  claims: [clm-semantic-filter, clm-empty-corpus]

# ---- deciding what it means ------------------------------------------------------

- id: cmp-episodes
  label: Episode detector
  one_breath: >
    Finds the historical reversals from the return data itself, rather than from a list
    someone wrote down.
  layer: model
  state: working
  module: events/episodes.py
  does: >
    Derives drawdown episodes at several horizons, so the event set is an output to be
    inspected rather than an assumption to be defended.
  inputs: [cmp-constructions]
  outputs: [cmp-grid, cmp-severity]
  last_changed: 2026-08-14
  claims: [clm-definition]

- id: cmp-severity
  label: Severity model
  one_breath: >
    Turns today's market state into an estimate of how bad the next two weeks could get,
    with no attempt to say when.
  layer: model
  state: working
  module: model/severity.py
  does: >
    Estimates the conditional tail of momentum returns by quantile regression, refit on an
    expanding window so no forecast ever sees its own future.
  inputs: [cmp-french, cmp-constructions, cmp-episodes]
  outputs: [cmp-brief]
  last_changed: 2026-08-16
  claims: [clm-severity-forecastable, clm-nothing-beats-vol, clm-miscalibration, clm-2019-complacency]

- id: cmp-baselines
  label: Classical baselines
  one_breath: >
    The strong conventional models that anything cleverer has to beat, plus the tests of
    whether they are honest.
  layer: model
  state: working
  module: model/baselines.py
  does: >
    Provides a well-calibrated volatility model, formal coverage tests, and a costed
    exposure-reduction backtest that separates statistical skill from money.
  inputs: [cmp-french]
  outputs: [cmp-brief]
  last_changed: 2026-08-16
  claims: [clm-garch, clm-comomentum-useless]

- id: cmp-grid
  label: Multiplicity-corrected testing
  one_breath: >
    Runs a hypothesis across every reasonable definition at once and corrects for having
    looked many times.
  layer: model
  state: working
  module: validation/hypotheses.py
  does: >
    Tests each idea over a grid of horizons and thresholds, corrects for multiple testing,
    and reports the smallest effect the sample could ever have detected. Both refutations
    came from here.
  inputs: [cmp-episodes, cmp-edgar]
  outputs: [cmp-brief]
  last_changed: 2026-08-21
  claims: [clm-power, clm-fomc, clm-earnings-density]

- id: cmp-registry
  label: Episode registry
  one_breath: >
    A hand-written list of known episodes used to check the detector, with one entry
    deliberately inverted.
  layer: model
  state: working
  module: events/registry.py
  does: >
    Records what each detector should and should not find. The 2007 crisis must be absent
    from the momentum detector and present in the joint one, so the check fails if the
    detector merely agrees with folklore.
  inputs: [cmp-episodes]
  outputs: []
  last_changed: 2026-08-15
  claims: [clm-quake-not-momentum]

# ---- what comes out --------------------------------------------------------------

- id: cmp-brief
  label: Risk briefing
  one_breath: >
    The one-page output a portfolio manager actually reads, for any date past or present.
  layer: output
  state: working
  module: report/memo.py
  does: >
    States how bad the tail is, which mechanism is live, what the book is concentrated in,
    and what was not measured on that date. The last section is what makes it honest.
  inputs: [cmp-severity, cmp-baselines, cmp-composition, cmp-comomentum, cmp-channels, cmp-extract, cmp-grid, cmp-skew]
  outputs: []
  last_changed: 2026-08-18
  claims: [clm-aggregation, clm-2019-complacency]

- id: cmp-console
  label: Project console
  one_breath: >
    Renders the project's own state from structured files, so no fact has two homes that
    can disagree.
  layer: output
  state: working
  module: build/render_console.py
  does: >
    Generates both this dashboard and the cold-start ledger from the same source files,
    after validation that fails loudly on contradictions.
  inputs: []
  outputs: []
  last_changed: 2026-08-21
  claims: []

- id: cmp-taxonomy
  label: taxonomy-v4, the eight-driver screen vocabulary
  layer: data
  state: partial
  module: text/taxonomy.py
  one_breath: >
    Eight drivers, seed terms expanded from the corpus, one content-hashed snapshot per year.
  does: >
    Supplies the term lists a lexical screen uses to select candidate firm-quarters per driver.
    Now on its FOURTH revision, and both repairs are worth carrying: single-word seeds pulled
    polysemous matches across three drivers, so inflation_pricing is seeded on PHRASES rather
    than words; and terms are stored in LIFT order rather than alphabetically, because storing
    them alphabetically once made a good expansion read as noise when its first entries were
    inspected.
    Snapshots are point-in-time: a snapshot for year Y is expanded using only filings available
    before Y, enforced in the builder rather than trusted to a caller. Seven vintages exist,
    2017 through 2023, each content-hashed and immutable on write.
  honest_scope: >
    THE EIGHT-DRIVER LIST IS A DESIGN-LEVEL CHOICE MADE WITH HINDSIGHT over the whole period. It
    is frozen and disclosed as such, which is the same status as the decision to study momentum
    at all. Pretending the list was derived point-in-time would be the more misleading option.
    The VINTAGE snapshot governs any claim whose content carries a date. The union vocabulary is
    licensed for SCREENING only, on the reasoning that a term which exists only in 2022 finds
    nothing in a 2016 filing and that what the screen misses is measured by the false-negative
    design rather than assumed.
    Quality is NOT uniform across drivers and the state is `partial` for that reason. Strong
    expansions: energy_commodities (geological, hydraulic, fracturing, rail, rigs), fx_dollar
    (japanese, australian, sterling, reconcile), ai_compute (fabrication, electronics, silicon).
    Weak: rates_duration, whose expansion returns identical, false, removed and instituted,
    because its seed words interest and rate are polysemous in filing prose; supply_chain and
    inflation_pricing carry medical and IP boilerplate. rates_duration being the weakest is the
    one that matters most, since it is the driver this project uses.
    A document-frequency ceiling at the 95th percentile of each vintage's own distribution
    removed signature-block boilerplate -- undersigned at 0.191 and thereunto at 0.185 -- while
    keeping libor at 0.137. It treats a symptom: the confound is document length, since an
    over-captured section holds both a seed word and a signature block because it is long, and
    the ceiling does not measure length.
    SUPERSEDED BY v3, 2026-08-26. v1 is kept in history. Two rounds of reseeding followed, both
    made before any extraction record existed, so nothing was invalidated.
    v2 replaced the sampled expansion with exact document-frequency counting and reseeded
    rates_duration on unambiguous unigrams plus phrase seeds. rates now expands to risk interest,
    rate swaps, average interest, outstanding borrowings and libor plus. Jaccard between nested
    vintages rose on seven of eight drivers -- energy 0.40 to 0.76, fx 0.22 to 0.62, credit 0.18
    to 0.53, rates 0.11 to 0.35 -- reported descriptively, since v1 and v2 differ in seeds, in
    bigram space AND in sampling.
    v3 fixed two more drivers with the SAME disease, which v1's unigram space had masked.
    fx_dollar's seed "exchange" matched Securities Exchange Act and recruited disclosure-controls
    boilerplate; china_trade's seed "trade" matched trade secrets and recruited
    intellectual-property language. Both now expand into their own subject: currency forward,
    currency exposure, australian dollar; chinese yuan, chinese renminbi, tariffs quotas.
    Cross-driver leak at vintage 2019 is 0.000 for six of eight drivers.
    WHAT IS STILL OPEN, and it is selectivity rather than correctness. A mechanical seed audit
    raises nine of forty-eight seeds, and three fire on both its signals: "credit" appears in 67
    percent of filings, "cost" in 56, "interest rate" in 56. Their EXPANSIONS are on-topic --
    credit agreement, credit facilities, additional indebtedness -- so this is not the drift that
    v2 and v3 fixed. It is a screen that may select two thirds of the corpus for one driver and
    do no work. The cost is directly measurable in the screen counts rather than assertable from
    a triage statistic, so it is measured there rather than reseeded on suspicion.
  inputs: [cmp-edgar]
  outputs: []
  last_changed: 2026-08-26
  claims: []
  reproduce: uv run python scripts/build_taxonomy_versioned.py

- id: cmp-screen
  label: screen-v2, the operative funnel
  layer: data
  state: working
  module: text/screen.py
  one_breath: >
    How many of a driver's terms a document must carry before it is worth reading, versioned
    separately from the terms themselves.
  does: >
    A screen is not a taxonomy. The taxonomy says which terms belong to a driver; the screen says
    how many of them a document must carry. They change independently, so a record needs both to
    be reproducible and carries the screen identifier alongside the taxonomy hash.
    screen-v1 was implicit and required ONE term. Measured on 6,000 sampled filings it selected
    94 percent of the corpus, fired 4.84 of 8 drivers on the average document, produced unique
    shares of 0.001 to 0.015, and projected 700M input tokens across 200,000 cells. A funnel that
    does no funnelling.
    screen-v2 requires a FRACTION of each driver's own vocabulary rather than an absolute count,
    because vocabularies run 55 to 125 terms and an absolute threshold demands twice as much of a
    small vocabulary as of a large one. At ten percent it selects 59 percent of the corpus at 1.53
    drivers per document and 221M tokens: a 3.2-fold reduction that costs no reseed and re-hashes
    no taxonomy.
  honest_scope: >
    The threshold was chosen from a measured table AFTER seeing it, which is licensed hindsight of
    the same kind as choosing a horizon. It is an operational cost parameter and not a
    verdict-bearing statistic, it is disclosed rather than buried, and what the tightening misses
    is MEASURED by the false-negative design rather than assumed -- which is why that design
    stratifies on the band the threshold drops as well as on never-selected documents.
    Counting is of DISTINCT terms, not occurrences: ten mentions of one phrase is one term, since
    the threshold exists to require breadth.
  inputs: [cmp-taxonomy]
  outputs: []
  last_changed: 2026-08-26
  claims: []
  reproduce: uv run python scripts/d2_threshold_sweep.py


# ---- registered 2026-08-26: 38 modules that existed and were not on the schematic --------
# The system had grown to 61 modules while the graph described 23. An agent reading the
# console saw about a third of what is built, and the third it saw was the oldest third.

- id: cmp-config
  label: Holdout protocol as code
  one_breath: >
    Which years may be looked at, expressed as a function rather than as a promise in prose.
  layer: data
  state: working
  module: config.py
  does: >
    Splits the history into design, validation and sealed tiers and exposes `tier_of(date)`, so
    an accidental look at held-out years is a code change visible in a diff rather than a
    lapse of memory. The rule was still evaded once, by a power certification that ran on all
    128 month-ends because certifying is not testing and no guard watched it.
  inputs: []
  outputs: [cmp-french, cmp-severity]
  last_changed: 2026-08-26
  claims: []

- id: cmp-guard
  label: Resource guards
  one_breath: >
    Makes a long local job die instead of the machine.
  layer: data
  state: working
  module: guard.py
  does: >
    Watches swap, disk and memory during long extractions and kills the job before the host
    is in trouble. Written after a section extraction held every filing's text in one list,
    grew swap to 10 GB against a 9.2 GB store, and panicked the kernel.
  inputs: []
  outputs: [cmp-filings]
  last_changed: 2026-08-25
  claims: []

- id: cmp-filings
  label: Filing section corpus
  one_breath: >
    Forty-three thousand filings with their sections split out, each stamped to the second the
    regulator received it.
  layer: data
  state: working
  module: data/filings.py
  does: >
    Downloads company annual and quarterly reports and splits them into the numbered sections
    a reader would cite, keeping the full text so a new section is a change of pattern rather
    than a new download. Exists as a module because four earlier one-off pulls each repeated a
    mistake the previous one had already found: a section that is really a pointer elsewhere,
    a heading split across formatting tags, a cached field trusted over the document.
  inputs: [cmp-pit, cmp-guard]
  outputs: [cmp-harvest, cmp-retrieve, cmp-taxonomy]
  last_changed: 2026-08-26
  claims: []

- id: cmp-eightk
  label: Current-report bodies
  one_breath: >
    The text companies publish between quarters, which is the only issuer text that moves
    weekly.
  layer: data
  state: working
  module: data/eightk.py
  does: >
    Fetches the bodies of current reports, not just their timestamps. The timestamps had
    driven the earnings calendar since early in the project while the text itself was never
    downloaded, which left a gap in anything asking when language moves rather than when a
    filing arrived.
  inputs: [cmp-pit]
  outputs: []
  last_changed: 2026-08-25
  claims: []

- id: cmp-thirteenf
  label: Institutional holdings
  one_breath: >
    Who owns what each quarter, rebuilt from the regulator's own filings rather than bought.
  layer: data
  state: working
  module: data/thirteenf.py
  does: >
    Reconstructs quarterly institutional equity positions and reproduces a known closing value
    to the cent on every quarter as its own check. Crowding was treated as unobservable for
    most of this project; it was unobservable in the data then to hand, not in principle.
  inputs: [cmp-pit, cmp-crosswalk]
  outputs: [cmp-overlap]
  last_changed: 2026-08-24
  claims: [clm-13f-legs-no-asymmetry]

- id: cmp-crosswalk
  label: Identifier crosswalk
  one_breath: >
    Matches the regulator's security numbers to index tickers, and proves each match with a
    price.
  layer: data
  state: working
  module: data/crosswalk.py
  does: >
    Institutional filings identify securities one way and index holdings another, and no free
    published mapping covers the years that matter. This builds the mapping and then verifies
    every pairing against an independent price, so a wrong match fails loudly instead of
    quietly renaming a company.
  inputs: []
  outputs: [cmp-thirteenf]
  last_changed: 2026-08-24
  claims: []

- id: cmp-shortinterest
  label: Short interest
  one_breath: >
    The size of the short position, twice a month, stamped with when it became public.
  layer: data
  state: working
  module: data/shortinterest.py
  does: >
    Loads consolidated short interest per stock with both its settlement date and its
