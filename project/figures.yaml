  claim: clm-definition
  title: Every reversal on record, and which mechanism it belongs to
  one_breath: The 15 episodes the detector is checked against, by date and mechanism.
  caption: Crowded rotations are what a text or positioning layer is supposed to speak to. There are six,
    only four sit inside any free news archive, and three of those four are in the held-out sample and
    remain unopened. That is the real constraint on the text work, and it is arithmetic rather than effort.
