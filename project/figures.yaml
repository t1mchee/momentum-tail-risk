- id: fig-horse-race
  kind: bars
  claim: clm-severity-forecastable
  title: Trailing volatility wins, and adding information makes it worse
  one_breath: Forecast error by model. Lower is better. The simplest model wins.
  caption: Pinball loss at the fifth percentile, ten-day horizon, across 318 expanding-window refits on
    data each model had not seen. Every richer model scores worse than conditioning on trailing volatility
    alone.
  x_label: pinball loss (lower is better)
  baseline_key: unconditional
  bars:
  - label: Trailing volatility only
    value: 0.00379
    note: +23.4% vs no information
    highlight: true
  - label: Full model
    value: 0.00393
    note: +20.6% vs no information
    highlight: false
  - label: Bear-market state
    value: 0.004
    note: +19.1% vs no information
    highlight: false
  - label: No information
    value: 0.00495
    note: the baseline to beat
    highlight: false
- id: fig-skill-through-time
  kind: series
  claim: clm-vol-skill-concentrated
  title: 'The edge is real but concentrated: two crisis years carry 43% of it'
  one_breath: Cumulative forecast error saved by using trailing volatility, over time.
  caption: Running total of the error saved by conditioning on trailing volatility rather than nothing.
    It rises, but not evenly. 43 percent of the total accrues in 2008 and 2009 alone, the three largest
    month-steps account for 37 percent, and only 66 percent of steps are positive at all. This figure
    was first written up as showing a steady edge. Plotting it disproved the caption, which is the argument
    for plotting things.
