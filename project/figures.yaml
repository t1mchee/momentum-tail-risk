    book. Near the number of holdings, every company has its own story; near one, coverage is saying one
    thing. The episode window is higher than the calm mean, where the prediction was lower. Three calm
    windows put the smallest attainable p-value at 0.25, so this could not have reached significance however
    it fell: underpowered, not inconclusive. The measure also tracks the number of covered companies at
    +0.983 across these four points, so the raw figure is substantially a coverage count.'
