    group: Panic rebound
    note: Prior 2y -22.8%, market +14.1% during. Canonical panic-rebound signature.
  - date: '2002-11-25'
    label: 2002 11 rebound
    group: Panic rebound
    note: Prior 2y -40.9%, market +4.5% during.
  - date: '2007-08-09'
    label: 2007 08 quant quake
    group: Joint unwind
    note: 'NOT a momentum event in daily factor data: 5.97th pctile momentum-only, clearing no 1%/2.5%
      threshold in any of 12 constructions. Joint channel puts i'
  - date: '2008-12-08'
    label: 2008 12 crisis
    group: Panic rebound
    note: Prior 2y -44.7%, market +21.4% during.
  - date: '2009-03-23'
    label: 2009 03 canonical
    group: Panic rebound
    note: 'The canonical momentum crash: prior 2y -51.6%, market +20.4% during, trailing vol 44.7%. Loser-decile
      beta above 3 on the Daniel-Moskowitz decompositi'
  - date: '2016-03-07'
    label: 2016 03 low quality
    group: Mixed
    note: Prior 2y +5.9%. Tests the taxonomy's edge; does not classify cleanly.
  - date: '2019-09-11'
    label: 2019 09 momentum unwind
    group: Crowded rotation
