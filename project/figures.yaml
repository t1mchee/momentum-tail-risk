- id: fig-2019-decomposition
  kind: bars
  claim: clm-2019-complacency
  title: The model was calmer than knowing nothing, and here is which term did it
  one_breath: Estimated worst case before the 2019 reversal, by model component, against what happened.
  caption: Each bar is the ten-day loss the model considered a reasonable worst case on 2019-09-06. The
    full model sits inside the no-information baseline, which is the wrong direction. Decomposing shows
    volatility was roughly neutral and the bear-market term produced the complacency.
  x_label: estimated worst case over ten days
  negative: true
  bars:
  - label: Full model
    value: -3.94
    note: calmer than knowing nothing
    highlight: true
  - label: Bear-market term only
    value: -3.48
    note: the source of the complacency
    highlight: true
  - label: Volatility term only
    value: -4.7
    note: roughly neutral
  - label: No information
    value: -4.86
    note: the baseline
  - label: What actually happened, 5 days
    value: -6.98
    note: worse than every estimate
    highlight: true
- id: fig-aggregation
  kind: dots
  claim: clm-aggregation
  title: Every portfolio-level average said ordinary; the holdings did not
  one_breath: Where each measure sat in its own history the day before the 2019 reversal.
  caption: Percentile of each measure against its own history on 2019-09-06. The portfolio-level summaries
    cluster in the middle of their ranges and read as unremarkable. Looking through to the individual
    holdings shows a concentrated one-way bet on falling interest rates. The failure was aggregation,
    not measurement.
  x_label: percentile of its own history
  groups:
  - name: Portfolio-level summaries
    tone: idle
    points:
    - label: Sector concentration
      value: 50
    - label: Portfolio rate sensitivity
      value: 32
    - label: Market-wide implied correlation
      value: 26
  - name: Looking through to the holdings
    tone: neg
    points:
    - label: Rate sensitivity, median of top 12
      value: 26
    - label: Winner-leg crowding
      value: 87
    - label: Trailing volatility
