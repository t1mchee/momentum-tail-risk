  - date: '1999-04-21'
    label: 1999 04 value rotation
    group: Crowded rotation
    note: Prior 2y market +55.7%; benign state, market roughly flat through the drawdown.
  - date: '2000-03-21'
    label: 2000 03 dotcom peak
    group: Mixed
    note: Prior 2y +30.1%. Straddles regimes; kept as mixed rather than forced.
  - date: '2001-01-17'
    label: 2001 01 fed intermeeting
    group: Crowded rotation
    note: 'Strongest measured Type B in the modern sample: -11.65 sigma vol-standardized, visible in ALL
      twelve momentum constructions, market +0.9% through the '
