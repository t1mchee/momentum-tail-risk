    around reversal episodes than elsewhere: +0.035 against +0.055, with a permutation
    probability of 0.948 and the point estimate in the wrong direction. And an estimator
    built from sector labels alone reproduces its entire economic value in a covariance
    exercise. Real, small, stable, and spanned by information already available.
