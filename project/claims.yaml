- id: clm-episode-ceiling-binds
  statement: >
    Conditional skewness of momentum looks like it separates tail risk exactly where the
    severity model is documented to fail. In the calm state, no bear market and below-median
    volatility, the most negative skew tercile carries 22 tail days against 4, a 5.5-fold
    difference. Those 22 days are 2 distinct episodes and the 4 are 3, because forward
    windows overlap. A circular-block permutation of the skew series gives a probability of
    0.069. The lead is 2 episodes wearing the clothes of 1,332 observations, and this is the
    general shape of the problem: any conditional split of two dozen independent regimes
    lands on a handful of episodes, whatever the day count says.
  one_breath: >
    A 5.5-fold tail lift from conditional skewness turned out to rest on two independent
    episodes, which is what every conditional split here does.
  confidence: measured_once
  from_experiment: exp-001
  evidence:
    - {label: tail days by skew tercile in the calm state, value: "22 versus 4", comparison: "a 5.5-fold difference across 1,332 days per tercile"}
    - {label: distinct episodes behind those days, value: "2 versus 3", comparison: "after collapsing overlapping forward windows separated by less than 21 days"}
    - {label: circular-block permutation probability, value: 0.069, comparison: "z of +1.60; the autocorrelation of the skew series is preserved by the shift"}
    - {label: skew increment inside volatility buckets, value: "+0.004, +0.015, +0.020", comparison: "low, mid and high volatility; monotone and in the predicted direction"}
  reproduce: "uv run python -m unstructured_momentum.model.severity --skew-diagnostic"
  supersedes: []
  history:
    - {date: 2026-08-23, note: "Recorded because the direction is right and the sample is not. Skew is more negative before tails, monotonically across volatility buckets, and none of it survives counting episodes rather than days."}
    - {date: 2026-08-23, note: "Generalises the power ceiling from a statement about timing tests to a statement about every conditional analysis attempted here."}

- id: clm-mechanism-map
  statement: >
    Momentum reversals have five distinct market mechanisms, and separating them requires
    different data for each. A shared factor exposure being revalued shows up in what
    companies say they depend on. A catalyst that inverts the basis of the sort shows up as a
    drawdown concentrated into a single dated day. Loser-leg optionality after a bear market
    shows up in trailing market state. Crowded deleveraging shows up in nobody's company
    filings, because companies do not write about who owns them, but it is directly visible
    in investor-side records: 13F holdings from 2001, short interest on the loser leg,
    momentum-ETF creations, and within-leg residual correlation from prices. The earlier
    version of this claim said crowding was structurally unobservable. That was wrong, and
    the error came from checking only company-filed text and generalising from it.
  one_breath: >
    Company text cannot see who owns a book, but investor filings can, and those go back to
    2001.
  confidence: unverified
  from_experiment: null
  evidence:
    - {label: "conferred tilt at the November 2020 reversal", value: "55th percentile of its own placebo null", comparison: "|spread| 0.0185 against a placebo 95th of 0.0386, in a month where the sort clears 81 percent of the time. CONSISTENT WITH catalyst inversion rather than a conferred-concentration unwind, and explicitly one observation rather than a test of the separation"}
    - {label: mechanisms enumerated, value: 5, comparison: "shared exposure, crowded deleveraging, loser-leg optionality, catalyst inversion, valuation spread"}
    - {label: 13F-HR filings on EDGAR, 2007 Q2, value: 3180, comparison: "1666 accepted 2007-05-1x, holding Q1 positions, available three months before the quant quake"}
    - {label: 13F holdings table parses, value: "113 of 113 lines", comparison: "CUSIP, market value and share count on a 2007 fixed-width filing; the format is usable, not merely present"}
    - {label: episode coverage of 13F, value: "13 of 15 episodes", comparison: "all but 1999-04 and 2000-03, which predate electronic 13F"}
    - {label: comomentum panel coverage, value: "2014-01 to 2026-07, monthly", comparison: "covers no panic-rebound episode and not 2007; the price-derived crowding measure has the shorter history"}
    - {label: what 13F cannot see, value: "short positions and leverage", comparison: "long US equity only, above a 100M dollar threshold, so the loser leg needs FINRA short interest instead"}
    - {label: distress language, loser leg versus winner leg, value: "0.412 vs 0.421 per 1k words", comparison: "Mann-Whitney p 0.68; keyword distress measures capital structure, not financial condition"}
    - {label: mechanism labels in the episode registry, value: definitional, comparison: "A and B are defined by prior market state and market return during, so separating them with those variables is circular and is not evidence"}
    - {label: non-definitional split inside B, value: "2 of 6 episodes", comparison: "2020-11 vaccine and 2022-11 CPI are the only episodes whose worst day exceeds the whole drawdown; catalyst separates from grind, on two observations"}
  reproduce: null
  supersedes: []
  history:
    - {date: 2026-08-23, note: "Written after testing loser-leg distress language on 2019 data and finding no separation. Two faults: the keyword measure tracks leverage rather than distress, since tower and mall REITs top the list, and the date has no bear market so the mechanism was not live."}
    - {date: 2026-08-23, note: "Recorded as unverified. It is a framework for choosing what to test next, not a finding, and it is written down so the next test is chosen by mechanism rather than by data availability."}
    - {date: 2026-08-24, note: "Corrected. The claim that crowding leaves no observable trace was wrong. It leaves none in COMPANY-filed text, which is what had been searched, but investor-side records are free and long: 13F from 2001, FINRA short interest, ETF creations, price-derived comomentum. Generalising from one corpus to all data was the error, and it is the same shape as the trap where a null on one specification was read as a null on the question."}
    - {date: 2026-08-24, note: "Also recorded that the registry's own A/B mechanism labels are definitional. Trailing two-year market return separates them perfectly, which is circular, since that variable is part of the label definition at registry.py lines 29 and 32. Any mechanism discrimination has to be demonstrated on statistics the labelling rule does not use."}

- id: clm-13f-legs-no-asymmetry
  statement: >
    Institutional co-ownership does not distinguish the momentum legs. Across seven tests on
    two independent leg constructions, the LOSER leg is more commonly co-owned than the
    winner leg every time, which reverses the direction a crowded-unwind account predicts;
    and a permutation holding the size distribution fixed then declines to call that a
    crowding asymmetry in either direction. The quantity that is large is common to both
    legs: momentum-leg constituents are co-owned seven to eighteen times more than
    independent holder selection implies. The result is bounded by what the form reports.
    Form 13F covers long US equity only, so the loser leg it describes is the set of fallen
    stocks institutions are LONG rather than the set momentum investors are short, and the
    leverage that converts crowding into forced selling does not appear on the form at all.
  one_breath: >
    Both momentum legs are heavily co-owned and the legs do not differ once size is held
    fixed.
  confidence: measured_once
  from_experiment: exp-036
  despite_refutation: >
    The experiment refutes its own hypothesis, which was that the winner leg would show
    greater co-ownership. What the claim records is the measurement that produced the
    refutation, and that measurement is well determined: seven of seven tests agree on sign,
    two leg constructions agree, and the permutation is unambiguous about size.
  evidence:
    - {label: tests where the loser leg is more co-owned, value: "7 of 7", comparison: "four dates on 13F-implied-price legs, three on IWV legs"}
    - {label: absolute co-ownership lift, value: "7 to 18 times", comparison: "against 1.0 under independent selection, in both legs alike"}
    - {label: permutation probabilities, value: "0.111 to 0.983", comparison: "scattered across the range on both constructions, which is a size effect rather than a crowding one"}
    - {label: what the form cannot see, value: "shorts and leverage", comparison: "the two things the crowded-unwind mechanism runs on"}
  reproduce: uv run python scripts/run_exp036.py
  supersedes: []
  history:
    - {date: 2026-08-24, note: "Recorded from exp-036 on eight quarters of 13F holdings spanning 2005-12-31 to 2007-09-30, 8.33 million rows from 84.7 percent of indexed filings, every quarter reproducing a known close to the cent."}
    - {date: 2026-08-24, note: "The limit was written into the source record before the test ran rather than after it failed, so the negative result is consistent with a stated constraint rather than an excuse constructed for it."}

- id: clm-model-partition
  statement: >
    A model given only tickers, weights and sectors partitions a momentum book into groups
    that co-move more than groups matched on count, size and sector composition, on 44 of 44
    quarters. Most of that is a finer industry classification: the median group is 87 percent
    one sector and only 29 of 433 span sectors genuinely. The part that is not industry is
    real but thin — the cross-sector groups carry a lift of 0.054 over nulls matched on their
    own sector mix, indistinguishable from what single-sector groups achieve, on 17 groups at
    a probability of 0.036. The model is finding exposures as well as sub-industries, and the
    evidence for the former is a fraction of the evidence for the latter.
  one_breath: >
    A model can group a book into things that fall together, mostly by finding finer
    industries and partly by finding real cross-sector exposures.
  confidence: measured_once
  from_experiment: exp-038
  evidence:
    - {label: quarters beating a size-and-sector matched null, value: "44 of 44", comparison: "median lift +0.0305, median z about 10, permutation below 0.05 throughout"}
    - {label: median top-sector share of a group, value: "87.1 percent", comparison: "so the bulk of the effect is sub-industry, which this project has now replicated four times"}
    - {label: cross-sector groups and their lift, value: "29 of 433 groups, +0.0540", comparison: "against +0.0580 for single-sector groups, a difference undetectable at 0.851; the new part of the result and the thinnest"}
    - {label: post-2023 subsample, value: "12 of 12, median lift +0.0466", comparison: "stronger where contamination is weakest, the opposite of what outcome recall would produce"}
  reproduce: uv run python scripts/run_exp038.py
  supersedes: []
  history:
    - {date: 2026-08-24, note: "Recorded from exp-038 over 44 quarters between 2014 and 2026, with 4 dropped on the registered coverage gate and 28 skipped by upstream filters."}
