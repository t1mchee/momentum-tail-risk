    flaw that later made the experiment uninterpretable in three of eight cases, and raises
    a genuine unexamined flaw in two more. In the covariance experiment it named the precise
    control that was added mid-run and overturned the result. In the filing-change
    experiment it identified that the panel and the momentum book would not intersect, a
    fault that cost a completed run to discover. This is the one AI application in the
    project that operates where foreknowledge cannot help, since the question is about a
    design rather than an outcome.
