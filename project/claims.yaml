# Findings, with how much weight each can bear.
# reproduced = re-run and matched · measured_once = seen once, not re-run
# unverified = do not build on it · refuted = tested and failed, kept as a record

# ---------------------------------------------------------------------------------
# Constraints that bound every other claim in this file
# ---------------------------------------------------------------------------------

- id: clm-power
  statement: >
    There are only about two dozen momentum reversals in the modern era, and they cluster
    into roughly eight to seventeen genuinely independent regimes. Against a base rate of
    15.4 percent, an effect must more than double the reversal rate before it can be
    distinguished from chance. Forecasting the timing of a reversal is therefore not
    answerable with this data, and the project does not attempt it.
  one_breath: >
    Too few reversals have ever happened to prove a timing signal works, so the project
    forecasts severity instead.
  confidence: reproduced
  from_experiment: exp-001
  evidence:
    - {label: independent regimes, value: "8 to 17", comparison: "from ~24 raw episodes; 7, 5 and 3 in the daily-holdings era from 2013"}
    - {label: minimum detectable lift, value: 2.2x, comparison: "at 24 observations and a 15.4% base rate, for significance at the 5% level"}
  reproduce: "uv run python -c 'from unstructured_momentum.validation import hypotheses as H; print(H.minimum_detectable_lift(24, 0.154))'"
  supersedes: []
  history:
    - {date: 2026-08-14, note: "Computed from the episode registry, then re-derived independently from the detector output."}

- id: clm-contamination
  statement: >
    Every language model reachable by an interface was trained on data running past every
    historical date this project studies. Asking a model what it would have said in 2019 is
    therefore asking a model that already knows the answer. Only two dates in the whole
    sample sit outside that window, so any hindsight test has a sample size of about two.
  one_breath: >
    The language models already know how every historical episode turned out, so their
    historical judgement cannot be scored.
  confidence: measured_once
  from_experiment: null
  evidence:
    - {label: scorable hindsight dates, value: "~2", comparison: "against roughly 24 episodes in the full sample"}
  reproduce: null
  supersedes: []
  history:
    - {date: 2026-08-15, note: "Established from published training cutoffs. Not independently reproducible; it is a fact about the vendors."}
    - {date: 2026-08-19, note: "Elevated to a governing constraint on the write-up after nearly writing a hindsight claim."}
    - {date: 2026-08-22, note: "No longer only an inference from published training cutoffs. Directly measured: a model placed four de-identified historical windows to the exact year, forty times from forty."}

- id: clm-definition
  statement: >
    Which episodes count as reversals depends on the measurement window chosen. The
    November 2022 inflation-print reversal is severe over one day and five days, and
    absent entirely at ten and twenty-one days. Choosing a horizon silently chooses which
    events exist to be explained.
  one_breath: >
    Changing the measurement window changes which crashes exist at all, so the window has
    to be declared up front.
  confidence: reproduced
  from_experiment: exp-002
  evidence:
    - {label: one-day move, value: "-11.5%", comparison: "clears every severity threshold tested"}
    - {label: five-day move, value: "-15.8%", comparison: "clears every severity threshold tested"}
    - {label: ten- and twenty-one-day move, value: absent, comparison: "clears no threshold; the episode has vanished"}
  reproduce: "uv run python -m unstructured_momentum.events.episodes --horizons 1,5,10,21"
  supersedes: []
  history:
    - {date: 2026-08-14, note: "Found while checking why the detector disagreed with the hand-written episode list."}

# ---------------------------------------------------------------------------------
# Mechanism
# ---------------------------------------------------------------------------------

- id: clm-quake-not-momentum
  statement: >
    The August 2007 quant crisis, universally described as a momentum event, is not one.
    Momentum alone puts it at the sixth percentile of bad days, clearing no severity
    threshold in any of twelve ways of building the portfolio. Measured jointly across
    factors it is the worst day in the sample, because value, momentum, short-term
    reversal and size all broke together.
  one_breath: >
    The famous 2007 quant crisis was not a momentum crash but a simultaneous unwind
    across every factor at once.
  confidence: reproduced
  from_experiment: exp-006
  evidence:
    - {label: momentum-only severity, value: 5.97th percentile, comparison: "clears no threshold in any of 12 portfolio constructions"}
    - {label: joint severity across factors, value: 0.10th percentile, comparison: "the most extreme day in the sample"}
    - {label: value factor move, value: -6.53 sigma, comparison: "against momentum at -5.05, short-term reversal -4.52, size -3.00"}
  reproduce: "uv run python -m unstructured_momentum.factor.comovement --episode 2007-08"
  supersedes: []
  history:
    - {date: 2026-08-15, note: "Reproduced across all twelve constructions after the first result looked too surprising to trust."}

- id: clm-2019-mirror
  statement: >
    September 2019 is the exact mirror image of August 2007. It is a severe momentum event
    measured on momentum alone, and an unremarkable day measured jointly across factors.
    Each of the two detectors is blind to the other's worst episode, which is why the
    system runs both rather than combining them into one score.
  one_breath: >
    September 2019 was a pure momentum crash that a joint-factor detector cannot see, and
    2007 is the reverse.
  confidence: reproduced
  from_experiment: exp-006
  evidence:
    - {label: momentum-only severity, value: -6.03 sigma, comparison: "a severe event on this measure"}
    - {label: joint severity across factors, value: "+0.59", comparison: "positive, so a non-event on the measure that flags 2007"}
  reproduce: "uv run python -m unstructured_momentum.factor.comovement --episode 2019-09"
  supersedes: []
  history:
    - {date: 2026-08-15, note: "Found while checking whether the joint detector could simply replace the momentum one."}

- id: clm-construction
  statement: >
    How the momentum portfolio is built changes which episodes appear in it. August 2007
    is twice as severe among large companies as in the headline construction. January 2021
    is a real event among large companies and invisible when every stock is weighted
    equally. There is no neutral construction, so the choice must be stated.
  one_breath: >
    Building the portfolio differently produces a different list of crashes, so the
    construction is a research choice and not a detail.
  confidence: reproduced
  from_experiment: exp-002
  evidence:
    - {label: August 2007, large companies, value: "-8.37%", comparison: "against -4.53% in the headline construction, nearly twice as bad"}
    - {label: January 2021, large companies, value: "-6.88%", comparison: "against -0.89% weighting every stock equally, where it disappears"}
  reproduce: "uv run python -m unstructured_momentum.factor.constructions --report"
  supersedes: []
  history:
    - {date: 2026-08-14, note: "Reproduced after the first pass; it is the reason twelve constructions are carried rather than one."}

- id: clm-taxonomy
  statement: >
    Sorting reversals into panic rebounds and crowded rotations describes them accurately
    but does not help predict them. The two groups separate cleanly on every state
    variable measured at the trough. Feeding that same group membership into the severity
    model makes its forecasts worse.
  one_breath: >
    The two-type story of momentum crashes is real and descriptive, and adds nothing to
    forecasting how bad the next one is.
  confidence: reproduced
  from_experiment: exp-007
  evidence:
    - {label: bear-market indicator at trough, value: "1.000 versus 0.167", comparison: "panic rebounds versus crowded rotations; a clean separation"}
    - {label: joint-factor stress at trough, value: "-3.509", comparison: "for joint unwinds, against better than -0.24 for every other group"}
    - {label: losing-side downside beta, value: "1.588 versus 1.209", comparison: "panic rebounds versus crowded rotations"}
    - {label: effect on severity forecast, value: worse, comparison: "adding the group label degrades the model that trailing volatility alone already wins"}
  reproduce: "uv run python -m unstructured_momentum.features.channels --separation"
  supersedes: []
  history:
    - {date: 2026-08-17, note: "Both halves reproduced. The descriptive half passing and the predictive half failing is the finding."}

- id: clm-miscalibration
  statement: >
    The severity model is wrong in both directions at once. On average it is too cautious,
    breaching its own loss estimate less often than it should. At crowded rotations
    specifically it is not cautious enough. An average-accuracy score cannot see this,
    which is the case for evaluating a risk model on more than one metric.
  one_breath: >
    The model is too cautious on ordinary days and not cautious enough on exactly the days
    that matter, and one summary score hides both.
  confidence: reproduced
  from_experiment: exp-004
  evidence:
    - {label: rate of losses exceeding the estimate, value: 0.028, comparison: "against 0.050 expected; too conservative overall"}
    - {label: test of that shortfall, value: "p = 0.054", comparison: "borderline, so the conservatism is real but not overwhelming"}
    - {label: behaviour at crowded rotations, value: under-alarmed, comparison: "the opposite direction from the average, and invisible to the average score"}
  reproduce: "uv run python -m unstructured_momentum.model.baselines --christoffersen"
  supersedes: []
  history:
    - {date: 2026-08-17, note: "Reproduced. Flagged for prominence in the write-up because it justifies the whole two-metric design in one sentence."}

# ---------------------------------------------------------------------------------
# The motivating case
# ---------------------------------------------------------------------------------

- id: clm-aggregation
  statement: >
    Before the September 2019 reversal the portfolio was a single bet on falling interest
    rates wearing ten different sector labels. Every portfolio-level summary said the book
    was diversified and unremarkable. Looking at the individual holdings said the
    opposite. The failure was aggregation, not measurement, and this is the single most
    useful thing the project found.
  one_breath: >
    The 2019 crash was visible in the individual holdings and invisible in every
    portfolio-level average, so averaging was the mistake.
  confidence: reproduced
  from_experiment: exp-008
  evidence:
    - {label: sector concentration, value: 50th percentile, comparison: "reads as ordinary diversification"}
    - {label: portfolio interest-rate sensitivity, value: 32nd percentile, comparison: "reads as unremarkable"}
    - {label: rate sensitivity of the twelve largest holdings, value: median 26th percentile, comparison: "five of twelve in the bottom fifth of all stocks; a concentrated one-way bet"}
    - {label: crowding within the winning side, value: 87th percentile, comparison: "against index-level implied correlation at the 26th percentile, which saw nothing"}
  reproduce: "uv run python -m unstructured_momentum.report.memo --as-of 2019-09-06"
  supersedes: []
  history:
    - {date: 2026-08-18, note: "Every line reproduced from the point-in-time holdings. This is the spine of the memo."}

- id: clm-2019-complacency
  statement: >
    On the day before the September 2019 reversal the severity model was less alarmed than
    its own no-information baseline, and the realised five-day loss was worse than the
    model's estimate of the average bad outcome. The cause was not quiet markets.
    Volatility was at the 75th percentile. The cause was a term detecting the absence of a
    bear market, which is correct in general and wrong for crowded rotations.
  one_breath: >
    The model was calmer than saying nothing at all, right before the worst momentum week
    in years, for a traceable reason.
  confidence: reproduced
  from_experiment: exp-008
  evidence:
    - {label: full model loss estimate, value: "-3.94%", comparison: "against -4.86% for the no-information baseline, so the model was calmer than knowing nothing"}
    - {label: same estimate from volatility alone, value: "-4.70%", comparison: "roughly neutral, so volatility was not the cause"}
    - {label: same estimate from the bear-market term alone, value: "-3.48%", comparison: "this is what produced the complacency"}
    - {label: what actually happened over five days, value: "-6.98%", comparison: "worse than the model's -4.41% estimate of the average bad outcome"}
    - {label: trailing volatility at the time, value: 75th percentile, comparison: "not low, contradicting the explanation I gave twice before checking"}
  reproduce: "uv run python -m unstructured_momentum.model.severity --decompose --as-of 2019-09-06"
  supersedes: [clm-lowvol-wrong]
  history:
    - {date: 2026-08-16, note: "First measured."}
    - {date: 2026-08-18, note: "Decomposed after catching my own wrong explanation twice. The decomposition is what turned a story into a finding."}

# ---------------------------------------------------------------------------------
# Model performance
# ---------------------------------------------------------------------------------

- id: clm-severity-forecastable
  statement: >
    How bad a momentum reversal will be is genuinely forecastable, and trailing volatility
    carries essentially all of the forecastable part. Scaling by recent volatility beats a
    no-information baseline by 23 percent on a scoring rule that cannot be gamed, across
    318 refits on data the model had not seen.
  one_breath: >
    Severity can be predicted, and past volatility alone does almost all of the predicting.
  confidence: reproduced
  from_experiment: exp-003
  evidence:
    - {label: volatility-scaled model score, value: 0.00379, comparison: "against 0.00495 with no information, a 23.4% improvement; lower is better"}
    - {label: full model score, value: 0.00393, comparison: "worse than volatility alone despite using more information"}
    - {label: bear-market model score, value: 0.00400, comparison: "also worse than volatility alone"}
    - {label: out-of-sample refits, value: 318, comparison: "each trained only on data preceding its own forecast"}
  reproduce: "uv run python -m unstructured_momentum.model.severity --backtest --horizon 10 --quantile 0.05"
  supersedes: []
  history:
    - {date: 2026-08-16, note: "Reproduced exactly on a second run from a clean interpreter."}

- id: clm-nothing-beats-vol
  statement: >
    Six candidate signals were tested against trailing volatility as severity forecasters
    and all six lost. That comparison is now known to be uninformative at realistic effect
    sizes. Handed a genuinely predictive signal blended with noise, the framework does not
    prefer it to trailing volatility until the signal is nearly noiseless: at a 40 percent
    signal share the gain is still negative. Any realistic candidate sits far below that
    threshold, so the six failures cannot distinguish a useless feature from a useful one.
    The shared property of the six, that all are functions of past returns, remains a fair
    description of what was tried and is no longer evidence about what would have worked.
  one_breath: >
    Six candidates lost to trailing volatility, but the test could not have detected a
    realistic winner, so the result says little.
  confidence: refuted
  from_experiment: exp-025
  evidence:
    - {label: candidates tested, value: 6, comparison: "crowding, bear-market state, leg-beta asymmetry, eigenvalue concentration, joint stress on quiet days, implied volatility"}
    - {label: candidates that beat trailing volatility, value: 0, comparison: "out of six, on out-of-sample forecast score"}
    - {label: signal share needed before the framework prefers a known predictor, value: "between 40% and 100%", comparison: "at 40% the gain is still negative; the test only sees a nearly noiseless feature"}
  reproduce: "uv run python -m unstructured_momentum.model.severity --audit"
  supersedes: []
  history:
    - {date: 2026-08-17, note: "Recorded as a finding after the fifth and sixth candidates failed."}
    - {date: 2026-08-22, note: "Withdrawn as stated. A positive control shows the framework cannot detect a genuinely predictive feature unless it is almost pure, so the six failures measured the instrument at least as much as the world. The observation that all six are return-derived stands as a description of what was tried."}

- id: clm-garch
  statement: >
    A conventional volatility model with an asymmetric, skewed error distribution passes
    every standard test of whether its loss estimates are breached at the right rate, at
    the right times, and independently of each other. It is the strong classical baseline
    that everything else has to beat.
  one_breath: >
    A standard volatility model already produces well-calibrated loss estimates and sets
    the bar for anything more elaborate.
  confidence: unverified
  from_experiment: exp-004
  evidence:
    - {label: rate of losses exceeding the estimate, value: 0.052, comparison: "against 0.050 expected, essentially exact"}
    - {label: test that the rate is correct, value: "p = 0.850", comparison: "no evidence against correct calibration"}
    - {label: test that breaches do not cluster, value: "p = 0.279", comparison: "no evidence of clustering"}
    - {label: forecasts evaluated, value: 325, comparison: "all out of sample"}
  reproduce: "uv run python scripts/garch_headtohead.py  # the ONLY working comparison; the command previously recorded here was a no-op"
  supersedes: []
  history:
    - {date: 2026-08-16, note: "Reproduced. Deliberately built strong, because a weak baseline would make every later result look better than it is."}
    - {date: 2026-08-31, note: "DEMOTED from reproduced to unverified. The reproduce command on this claim names a module with no command-line interface, so it emits nothing and the numbers cannot be regenerated. A paired comparison on 1,151 dates where both models forecast puts this baseline at a 0.0851 breach rate, failing unconditional coverage at p 5.9e-07 in every era tested, which reverses this claim's headline. The contradiction is not resolved; the claim is held unverified rather than refuted because the original run may have used a configuration this one cannot reconstruct."}

- id: clm-comomentum-replicates
  statement: >
    A published academic crowding measure, built from how similarly stocks inside the
    momentum portfolio move together, replicates on data published after the original
    paper's sample ended. Weeks in the most crowded fifth suffer crash days three times as
    often as the least crowded fifth, and the relationship is monotone across all five
    groups.
  one_breath: >
    A published crowding measure still works on new data the original authors never saw.
  confidence: reproduced
  from_experiment: exp-012
  evidence:
    - {label: crash-day frequency, least to most crowded, value: "6.4% to 19.6%", comparison: "a 3.06x increase, against 2.7x in the original paper"}
    - {label: shape across the five groups, value: monotone, comparison: "each group worse than the last, not just the extremes"}
    - {label: average forward return, least to most crowded, value: "+2.5% to -1.3%", comparison: "the sign flips across the range"}
    - {label: sample used, value: after 2015, comparison: "entirely outside the original paper's window"}
  reproduce: "uv run python -m unstructured_momentum.features.comomentum --oos"
  supersedes: []
  history:
    - {date: 2026-08-17, note: "Reproduced. The most satisfying result in the project and, as it turned out, not a usable one."}

- id: clm-comomentum-useless
  statement: >
    The same crowding measure that replicates cleanly is worthless as a trading trigger.
    Using it to reduce exposure leaves risk-adjusted return slightly worse and the worst
    drawdown slightly deeper, and it stops paying at zero trading cost. Reducing exposure
    on trailing volatility instead survives 150 basis points of cost. A result can be
    statistically real and economically empty, and only testing both reveals it.
  one_breath: >
    The crowding measure that replicates statistically is useless in practice and stops
    paying at zero trading cost.
  confidence: reproduced
  from_experiment: exp-012
  evidence:
    - {label: change in risk-adjusted return, value: "-0.02", comparison: "slightly worse than not using the signal at all"}
    - {label: change in worst drawdown, value: "+3.2 percentage points", comparison: "deeper, in the wrong direction"}
    - {label: trading cost at which it stops paying, value: 0 basis points, comparison: "against 150 basis points for the same rule driven by trailing volatility"}
    - {label: volatility-driven comparison, value: "0.41 to 0.64", comparison: "risk-adjusted return improves, and worst drawdown falls from -63.2% to -45.1%"}
  reproduce: "uv run python -m unstructured_momentum.model.baselines --degross"
  supersedes: []
  history:
    - {date: 2026-08-17, note: "Run because a replicating signal that had not been costed felt like an unfinished claim. It was."}

# ---------------------------------------------------------------------------------
# What the language models actually contributed
# ---------------------------------------------------------------------------------

- id: clm-semantic-filter
  statement: >
    On the same 48 news articles, keyword matching marked every one relevant and a
    language model marked three. Against hand labels the model caught all twenty pieces of
    templated filler and the keyword filter caught none. This sixteen-fold difference in
    precision is what makes reading a large text corpus feasible at all.
  one_breath: >
    A language model filtering news is sixteen times more precise than keyword matching on
    identical articles.
  confidence: reproduced
  from_experiment: exp-009
  evidence:
    - {label: articles marked relevant by keyword matching, value: "48 of 48", comparison: "against 3 of 48 by the language model, on the same articles"}
    - {label: templated filler correctly rejected, value: "20 of 20", comparison: "against 0 of 20 for keyword matching"}
  despite_refutation: >
    The experiment refuted the hypothesis that news discusses factor crowding. This claim measures filtering precision against hand labels on the same corpus, which is independent of whether the corpus contained anything.
  reproduce: "uv run python -m unstructured_momentum.llm.evaluate --compare"
  supersedes: []
  history:
    - {date: 2026-08-18, note: "Scored against a hand-labelled file anyone can open and check, which is what makes it a measurement."}

- id: clm-empty-corpus
  statement: >
    Two independent methods agree that free news coverage contains no discussion of factor
    crowding before a reversal. Hand-labelling 246 articles found zero genuine items, and
    the language model reading the same corpus blind found approximately zero. Agreement
    between a careful human pass and an automated one is what turns an absence into a
    finding.
  one_breath: >
    Hand-reading and machine-reading independently agree that the free news corpus is
    empty of what we were looking for.
  confidence: reproduced
  from_experiment: exp-009
  evidence:
    - {label: genuine factor-positioning articles by hand, value: "0 of 246", comparison: "against approximately 0 found by the language model reading blind"}
  despite_refutation: >
    The refuted hypothesis is that news warns of crowding. That the corpus is empty IS the refutation, measured two independent ways, so the claim and the verdict agree rather than conflict.
  reproduce: "uv run python -m unstructured_momentum.llm.evaluate --corpus 2019-09"
  supersedes: []
  history:
    - {date: 2026-08-18, note: "The two methods were run without reference to each other, which is the whole value of the agreement."}

- id: clm-panel-arithmetic
  statement: >
    Language-model expert panels generated excellent hypotheses and unreliable arithmetic.
    Two separate panel write-ups each overstated their headline number, once by six times
    and once by two. In both cases the individual measurements were correct and only the
    derived summary figure was inflated, which is the dangerous pattern because the summary
    is what gets quoted.
  one_breath: >
    Model-generated research panels produced good ideas and wrong headline numbers, twice,
    while their underlying measurements were fine.
  confidence: measured_once
  from_experiment: exp-018
  evidence:
    - {label: headline overstatements, value: 2 of 2, comparison: "in two panel write-ups, by factors of 6 and 2"}
    - {label: underlying measurements, value: correct, comparison: "every individual number reproduced; only the aggregate was wrong"}
  despite_refutation: >
    The experiment refuted the hypothesis that model-generated panels produce reliable numbers. This claim states that they do not, so it is the refutation itself.
  reproduce: null
  supersedes: []
  history:
    - {date: 2026-08-15, note: "First overstatement caught by reproducing the number before quoting it."}
    - {date: 2026-08-16, note: "Second one caught the same way. Two independent instances is a pattern, not an accident."}
    - {date: 2026-08-21, note: "Demoted from reproduced to measured once. The check refuses that status without a command anyone can run, and it is right to."}

- id: clm-hypothesis-label
  statement: >
    Requiring a language model to label any claim it had not actually computed as a
    hypothesis appears to eliminate the invented-number problem. The panel run without that
    instruction overstated its headline sixfold. The panel run with it reproduced every
    number exactly. Two runs is not proof, but the comparison is close to controlled and
    the fix costs one sentence.
  one_breath: >
    Making the model label uncomputed claims as hypotheses removed the invented numbers,
    across two otherwise similar runs.
  confidence: measured_once
  from_experiment: exp-018
  evidence:
    - {label: run without the instruction, value: 6x overstatement, comparison: "against every number reproducing exactly in the run with it"}
    - {label: runs compared, value: 2, comparison: "one each way; suggestive, not conclusive"}
  despite_refutation: >
    Produced by the same run as the refutation and independent of it: a comparison between two panels, one with a labelling instruction and one without.
  reproduce: null
  supersedes: []
  history:
    - {date: 2026-08-16, note: "Recorded as measured once rather than reproduced, because a two-run comparison is not a controlled experiment."}

# ---------------------------------------------------------------------------------
# Refuted, kept as a record. Deletion is prohibited.
# ---------------------------------------------------------------------------------

- id: clm-news-crowding
  statement: >
    Before the September 2019 reversal, news coverage did not discuss factor crowding. Of
    246 articles in the preceding 25 days, none were genuine factor-positioning items, and
    the result held at every source quality tier. Coverage of the unwind is dated after the
    move. This is one episode. It was written up as a general statement about news and
    reversals and it does not support one: the same project corrected nine cells for
    multiplicity on a calendar hypothesis and then generalised from a single date here.
    Scoped to what was actually tested until it is run on the other crowded rotations.
  one_breath: >
    News did not warn before the September 2019 unwind. One episode, so not yet a statement
    about news and reversals in general.
  confidence: refuted
  from_experiment: exp-009
  evidence:
    - {label: genuine items found, value: "0 of 246", comparison: "209 templated filler, 22 macroeconomic rather than about factors, 15 other"}
    - {label: highest-quality sources, value: "0 of 8", comparison: "the major-wire hits were a bond survey, gold, and recession sentiment"}
    - {label: date of actual unwind coverage, value: "12 to 14 September", comparison: "after the move on the 9th to 11th"}
    - {label: episodes tested, value: "1 of 6", comparison: "crowded rotations in the registry; the other five were never searched"}
  despite_refutation: >
    The claim is the refutation, scoped to the single episode it rests on.
  reproduce: "uv run python -m unstructured_momentum.llm.evaluate --corpus 2019-09"
  supersedes: []
  traps: [trp-17]
  history:
    - {date: 2026-08-18, note: "Refuted, and the refutation treated as a deliverable."}
    - {date: 2026-08-22, note: "Scoped down to the single episode it actually rests on. The generalised wording was an overreach and nobody caught it for four days."}
    - {date: 2026-08-22, note: "Caveat corrected: the 250-record cap was never binding, because the harvester already sliced into three-day windows and flagged truncation. The thin corpus is a fact about the query, not about the ceiling. The 2017 start remains a real limit."}

- id: clm-fomc
  statement: >
    Momentum reversals do not cluster around scheduled central bank meetings. Across nine
    combinations of horizon and severity threshold the median effect was a 1.13-fold
    change, four of nine went the wrong way, and none survived correction for multiple
    testing. The largest cell has an effect below one, so this is a real null and not a
    shortage of data.
  one_breath: >
    Reversals do not cluster on central bank meeting dates, and the biggest test cell
    rules out a power problem.
  confidence: refuted
  from_experiment: exp-013
  evidence:
    - {label: median effect across the grid, value: 1.13x, comparison: "against 1.0x for no effect; four of nine cells fell below 1.0x"}
    - {label: cells surviving multiple-testing correction, value: "0 of 9", comparison: "none reached significance even before correction"}
    - {label: largest cell, value: 0.91x, comparison: "122 observations pointing the wrong way, so not a power problem"}
  despite_refutation: >
    The claim is the refutation itself.
  reproduce: "uv run python -m unstructured_momentum.validation.hypotheses --fomc-grid"
  supersedes: []
  history:
