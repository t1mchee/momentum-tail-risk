- id: clm-knowledge-boundary
  statement: >
    A model's willingness to classify a portfolio falls off at the edge of what it knows.
    Partition coverage holds between 84 and 100 percent of book weight for every year from
    2013 to 2024 and drops to 77 percent in 2025, because the model cannot say what a company
    is exposed to when it does not know the company. This matters more than it first appears:
    a live monitor always operates at that boundary, since the book anyone cares about is
    today's book, so a method of this shape degrades precisely where it would be used.
  one_breath: >
    The model classifies less of the book as it approaches its knowledge cutoff, which is
    exactly where a live monitor runs.
  confidence: measured_once
  from_experiment: exp-038
  evidence:
    - {label: median coverage 2013 to 2024, value: "84 to 100 percent", comparison: "every year in that span"}
    - {label: median coverage 2025, value: "76.6 percent", comparison: "three quarters, minimum 71 percent, and one further quarter dropped at 58 percent"}
    - {label: quarters behind the 2025 figure, value: 3, comparison: "thin, and 2026 quarters are consistent with recovery rather than continued decline, so this is a flag rather than a finding"}
  reproduce: uv run python scripts/run_exp038.py
  supersedes: []
  history:
    - {date: 2026-08-24, note: "Noticed while the run was still going, from the coverage-by-year diagnostic rather than from the headline statistic."}
    - {date: 2026-08-24, note: "Recorded as measured_once and explicitly thin. The remedy if it holds is a retrieval layer over recent filings for unknown names, and reporting the unclassifiable share to the user as a confidence signal rather than hiding it."}

- id: clm-audit-needs-output
  statement: >
    A model shown source code finds faults that live in the code and misses faults that live
    in the code's encounter with data. Across six real commit states of one parser, five
    containing a fault found later by hand, it named a fault actually present once in fifteen
    chances and matched already-fixed faults four times. It reported the maximum permitted
    five faults in every state including the one where all were fixed, having been told an
    empty list was valid. The single genuine hit was the only fault of the five deducible from
    the source alone, a metric computed and never consumed, and the model named it four
    commits before it was found by hand. The other four required seeing output: a CUSIP that
    was a fragment of the words DIVERSIFIED REIT, a price bound admitting both Berkshire
    Hathaway and a misparsed Conoco. The design consequence is that an auditing layer should
    be shown distributions and outputs, not source.
  one_breath: >
    The model audits code it can read and cannot audit an encounter with data it has not
    seen.
  confidence: measured_once
  from_experiment: exp-039
  despite_refutation: >
    The experiment refutes its hypothesis, which was that the model would find the fault. The
    claim records what the refutation measured rather than asserting the hypothesis survived,
    and that measurement is the useful part: the model missed four faults of one kind and
    caught the one fault of the other kind, before a human did. The rate is a null; the
    pattern in which fault it caught is the finding, and it rests on one hit and so is
    recorded as measured once rather than reproduced.
  evidence:
    - {label: faults present and named, value: "1 of 15", comparison: "against a registered target of at least three of five on the narrower question of the fault fixed next, which scored zero"}
    - {label: matches to faults already fixed, value: 4, comparison: "more than the single match to a present fault, so the matching is loose"}
    - {label: faults reported per state, value: "5 of a permitted 5, in all six states", comparison: "including the control with everything fixed; the count carries no information"}
    - {label: the one hit, value: "a validation gate computed but never enforced", comparison: "named four commits before it was found by hand, and the only one of the five visible without running the code"}
  reproduce: uv run python scripts/run_exp039.py
  supersedes: []
  history:
    - {date: 2026-08-24, note: "Recorded from exp-039. The ground truth is unusual: five faults in one module found and fixed in sequence in a single day, each fix landing in a later commit than the state containing it, so the answers were invisible to the model and too recent to recall."}
    - {date: 2026-08-24, note: "This does not contradict the earlier finding that a model can referee a registration and name its flaw. It sharpens it. A registration is reasoning written down and therefore readable; a parsing fault is a property of an encounter the model did not witness."}

- id: clm-embeddings-are-sector
  statement: >
    WITHDRAWN. This claimed that leak-free embeddings of risk-factor text find industry and
    nothing beyond it, and that the September 2019 rates exposure is therefore absent from
    the text rather than hidden by hindsight. An adversarial audit showed the second half is
    unsupported: the text carrying the exposure was never embedded. Item 7A, where a company
    states its interest-rate exposure directly, sits on disk for 99 percent of the sample at
    a median 1,125 tokens — short enough to read whole inside the window that was used — and
    carries 42 times the density of rate language that Item 1A does. The experiment truncated
    the wrong section to seven percent of its length while the right one went untouched.
    Three further defects are recorded separately. The claim is withdrawn rather than amended
    because its central assertion, that the exposure is absent from disclosure, was never
    tested.
  one_breath: >
    Withdrawn: the section that states interest-rate exposure was never embedded, so the
    claim that text lacks it was never tested.
  confidence: refuted
  from_experiment: exp-040
  falsification_attempted: >
    Withdrawn BY a falsification attempt rather than surviving one. Three consultants were
    commissioned to audit the approach; one reproduced the headline exactly from the stored
    vectors and then broke it, showing the sign flips under two independent corrections.
  evidence:
    - {label: Item 7A availability and length, value: "99 percent of the pool, median 1,125 tokens", comparison: "against Item 1A at 24,646 tokens; the right section fits whole in the 2,048-token window that truncated the wrong one to seven percent"}
    - {label: rate-language density, value: "42x", comparison: "19.1 rate terms per 10,000 characters in Item 7A against 0.5 in Item 1A, measured independently on a 220-filing sample"}
    - {label: what the withdrawal does NOT establish, value: "nothing about whether text carries the exposure", comparison: "the question is reopened, not answered in the other direction"}
  reproduce: null
  supersedes: []
  history:
    - {date: 2026-08-25, note: "Recorded from exp-040 gate 1 as a measured_once finding."}
    - {date: 2026-08-25, note: "Withdrawn the same day after an adversarial audit. The sentence that mattered — that the exposure is absent from the text rather than hidden by hindsight — asserted something the experiment had not tested, and the chronologically consistent checkpoint made it sound better evidenced than it was."}

- id: clm-selection-confers-exposure
  statement: >
    The momentum sort manufactures factor exposure rather than discovering it. On the
    2019-08-30 book the 12-1 ranking produced a beta spread of 1.46 points between the legs
    after formation, winners at 0.554 and losers at 2.016, from a universe whose median beta
    is 1.09. Through the formation window itself the winner leg's beta FELL from 1.103 to
    0.887 while the loser leg's ROSE from 1.431 to 1.635. That is the opposite of Chen,
    Singal and Whitelaw, who report winner-decile betas rising 0.167 across the formation
    year and read apparent excess comovement among winners as a manifestation of momentum.
    The direction differs; the mechanism is the same and larger here. A selection rule
    applied to past returns confers a factor loading on the names it selects, and in 2019 it
    conferred a defensive tilt, which is what the rate bet was.
    This is why the text programme failed five times. The exposure did not exist in any
    document because it did not exist until the ranking was computed.
  one_breath: >
    The momentum sort manufactures the exposure it is later blamed for; in 2019 it built a
    1.46-point beta spread.
  confidence: reproduced
  from_experiment: null
  falsification_attempted: >
    The prediction going in was a RISE in winner-leg beta, following the published result. It
    fell. That is recorded rather than reframed: the specific published number does not
    reproduce here. Corporate actions were removed before ranking, 113 names carrying
    single-day moves above 45 percent in an unadjusted price series, because two of them had
    previously ranked as the strongest winners in the book. Beta is measured in two separate
    halves of the formation window so that "rose through formation" is a comparison rather
    than an assertion, and the universe median is reported alongside so the spread is read
    against a baseline.
  evidence:
    - {label: post-formation beta spread between the legs, value: "1.46 points", comparison: "winners 0.554 against losers 2.016, on a universe median of 1.09"}
    - {label: winner-leg beta through formation, value: "1.103 to 0.887", comparison: "a fall of 0.215, against the published +0.167 for the winner decile; the direction does not reproduce"}
    - {label: loser-leg beta through formation, value: "1.431 to 1.635", comparison: "a rise of 0.204, which is the Daniel and Moskowitz shape rather than the Chen, Singal and Whitelaw one"}
    - {label: corporate actions removed before ranking, value: 113, comparison: "names with a single-day move above 45 percent in the unadjusted series; two had previously ranked as the strongest winners"}
    - {label: dates tested, value: "1 for the mechanism exhibit, 128 for the placebo test", comparison: "the original demonstration was one book on one date; the placebo bundle put the mechanism against a matched null on every month-end the panel supports"}
    - {label: "PLACEBO, 2019 cell", value: "100th percentile", comparison: "the real book's conferred spread of 0.3585 against 200 cap-matched placebo books whose MAXIMUM is 0.1592; the claim had no null until 2026-08-25"}
    - {label: "PLACEBO, regenerated panel", value: "105 of 137 months clear", comparison: "76.6 percent, median month at the 100th percentile; n_eff 36 after a variance inflation of 3.78, block CI [0.635, 0.876] excluding the 5 percent chance rate at every block length tried. Supersedes 104 of 128 (81.2 percent, n_eff 23) after the panel was regenerated under point-in-time index membership."}
    - {label: "what does NOT confer it", value: "selection on market cap, 0.0579", comparison: "below the random null's median of 0.0855; the negative half the claim never had"}
    - {label: "what DOES confer it", value: "every return window tested", comparison: "1, 3, 6, 9 and 12-month look-backs all clear their own cap-matched nulls at the 100th percentile, so the 12-1 sort is one point on a continuum rather than a special case"}
  reproduce: uv run python scripts/verify_beta_rise.py
  supersedes: []
  history:
    - {date: 2026-08-25, note: "Measured after five text experiments failed to recover the 2019 exposure and a literature review suggested the exposure might be conferred by the selection rule rather than disclosed by issuers."}
    - {date: 2026-08-25, note: "One date. The claim is about a mechanism being visible, not about its generality, and the published direction it was meant to confirm was not reproduced."}
    - {date: 2026-09-02, note: "REGENERATED under point-in-time index membership and the number moved, from 104 of 128 (81.2 percent) to 105 of 137 (76.6 percent). The claim survives and its effective sample nearly doubles: variance inflation falls 5.66 to 3.78 and n_eff rises 23 to 36, with the block CI [0.635, 0.876] still excluding 0.05 at every length. The move is NOT mainly the membership change. Of nine month-ends whose verdict flipped, only one is a June reconstitution date; the committed panel had gone stale against its own generator, which now resolves sectors for 7,433 of 7,456 tickers where the stored version resolved 5,808. The clean membership-only effect is the conferred-tilt comparison: all 144 months move, mean absolute change in beta spread 0.0074, concentrated in June at 0.032 against roughly 0.004 elsewhere."}
- id: clm-defensive-is-modal
  statement: >
    A defensive tilt is the momentum sort's normal output, not a 2019 anomaly. Across 134
    month-ends from September 2013 to December 2025, the 12-1 ranking confers a NEGATIVE
    market-beta spread between its legs in 63 percent of months, mean -0.119 against a
    standard deviation of 0.467. The tilt is partly, not wholly, set by what the market did
    during formation: the correlation between formation-window market return and conferred
    spread is +0.455, so about a fifth of the variation is the mechanical consequence of
    which names a past-return sort selects after a given market path. The August 2019 book
    sits at the 20th percentile of defensiveness on a formation window whose market return
    was flat at -0.002, so it was more defensive than its own formation path accounts for.
    This is computable from an index holdings file and a factor series, both available the
    same day, with every loading estimated on a window that closes before the book forms.
  one_breath: >
    The sort's defensive tilt looked modal at 63 percent of months; at its effective sample
    size that is not distinguishable from a coin flip.
  confidence: unverified
  from_experiment: null
  falsification_attempted: >
    Two ways it could have been trivial were tested. If the conferred spread were merely the
    formation market path restated, the correlation would approach one; it is +0.455, leaving
    most of the variation unexplained. And the spread is negative in both market states,
    averaging -0.302 after down formation windows and -0.091 after up ones, so the sign is
    not an artefact of the sample being mostly bull markets. A units error inflating every
    loading a hundredfold was caught and fixed before these numbers were taken.
  evidence:
    - {label: months where the sort confers a negative beta spread, value: "63 percent", comparison: "134 month-ends, mean spread -0.119, standard deviation 0.467"}
    - {label: correlation with the formation-window market return, value: "+0.455", comparison: "about a fifth of the variation; the tilt is not simply the market path restated"}
    - {label: conferred spread by market state, value: "-0.302 down, -0.091 up", comparison: "negative in both, on 18 and 116 windows respectively"}
    - {label: the August 2019 book, value: "20th percentile", comparison: "more defensive than its flat formation market return of -0.002 would account for"}
    - {label: coverage gap, value: "2013-09 onward, with 2017 and 2018 thin at 6 and 4 month-ends", comparison: "the holdings panel is incomplete in those years; no claim is made before September 2013"}
  reproduce: uv run python scripts/effective_sample.py
  supersedes: []
  history:
    - {date: 2026-08-25, note: "Built as the regime readout that survives regardless of how the naming question resolves, since it needs no model and no text."}
    - {date: 2026-08-25, note: "Distinct from the single-date beta measurement recorded earlier. That one measured what the legs BECAME after formation, at a spread of 1.46; this measures what the sort CONFERRED during formation. Different estimands and they should not be quoted interchangeably."}
    - {date: 2026-08-31, note: "CORRECTED AND DEMOTED. An adversarial review of the submission memo asked what effective sample the 63 percent rests on. The conferred-tilt series has lag-1 autocorrelation 0.606 and variance inflation 10.36, giving n_eff of about 13 against a raw 134. The naive t of -2.95 becomes -0.92, and a circular block bootstrap puts the share-negative at [0.418, 0.836] at a 12-month block, including a coin flip at every block length tried. The direction claim is NOT distinguishable from chance and is demoted from measured_once to unverified -- unverified rather than refuted, because a confidence interval containing 0.5 means the measurement cannot support the inference, not that the tilt is absent. What survives is the separate MECHANISM claim, a within-date rather than a time-series comparison: the real book lies outside its own cap-matched placebo null in 104 of 128 months against a 5 percent chance rate, n_eff about 23, block CI [0.664, 0.930] excluding 0.05 at every length. The two had been quoted together as though they stood or fell together. They do not."}

- id: clm-naming-beats-composition
  statement: >
    Given a book's holdings and sector labels, a model names groups that co-move more than
    groups it names from companies of the same sectors and sizes. On the 2019 winner leg the
    lift is 0.032 at a t of 5.00; on the 2021 leg it is 0.070 at a t of 9.17, measured as mean
    within-group correlation of market-residualised returns over the quarter FOLLOWING the
    partition. The partition is stable rather than a sampling artefact, at ensemble agreement
    of 0.722 and 0.784 across ten runs, and it is not a relabelling of sectors, at 0.617
    against GICS. The largest group runs to a median of 48 names across four sectors and is
    named a long-duration growth variant with discount-rate sensitivity in ten of the
    surviving runs, which is the exposure the 2019 book is independently documented to carry.
    Three limits are part of the claim. Roughly three fifths of the partition's structure IS
    sector, so what survives the control is a real minority component rather than the bulk of
    what the model produces. Two books are not a sample of regimes. And the design cannot
    separate naming what these companies are from naming what the sort selected, because a
    null matched on momentum rank is unbuildable when the leg is the top momentum decile.
  one_breath: >
    A model reading holdings names groups that co-move beyond what the book's own sector and
    size composition implies.
  confidence: reproduced
  from_experiment: exp-043
  falsification_attempted: >
    The predecessor measured this same contrast at a t of 6.79 and could not use it, because
    it also declared an unmatched random arm and lost to it, with nothing said in advance about
    which comparison carried the claim. This design names the control before the run and keeps
    the unmatched arm as a labelled difficulty reference that cannot refute the primary,
    because dropping the arm that embarrassed the predecessor would be choosing a null after
    seeing a result.
    The explanation for the unmatched arm's advantage was registered as a checkable prediction
    on a model-free within-sector correlation rather than offered afterwards. It confirms on
    2019 and fails on 2021, where the unmatched arm has no advantage to explain; the sign
    correspondence between block structure and performance holds on both books but rests on
    two points and was noticed after the run.
    A coverage gate written before the predecessor ran, and unchanged here, dropped 7 of 60
    runs.
  evidence:
    - {label: "PLACEBO, peer-network cell", value: "40 of 40 placebo books clear", comparison: "cap-matched legs no sort constructed clear their own sector floor at p<=0.05, and 38 of 40 out-lift the momentum leg; the network structure is a property of large-cap filings, not something momentum selection assembled"}
    - {label: "where the momentum leg IS extreme", value: "100th percentile on absolute cohesion", comparison: "0.1432 against a placebo median of 0.0761, while its LIFT sits at the 5th; a raised baseline leaves any grouping less to add, which is a second reading of why text experiments on momentum books find little"}
    - {label: lift over a sector-and-cap-matched control, 2019 book, value: "+0.0316", comparison: "t of +5.00 on eight or more surviving runs per arm"}
    - {label: lift over the same control, 2021 book, value: "+0.0695", comparison: "t of +9.17; a different regime and a different leg composition"}
    - {label: ensemble agreement across ten runs, value: "0.722 and 0.784", comparison: "adjusted Rand; a single partition can be quoted because the ten agree"}
    - {label: share of the partition that is sector, value: "0.617 adjusted Rand against GICS", comparison: "below the 0.9 that would make it a relabelling, but the majority of the structure is still sector"}
    - {label: what the design cannot separate, value: "companies from selection", comparison: "no null can hold momentum rank fixed when the leg IS the top momentum decile, so the naming seat is validated as useful and not as reading the conferred tilt"}
    - {label: independent reproduction of the 2019 contrast, value: "+0.0406 then +0.0316", comparison: "t of 6.79 in the inconclusive predecessor and 5.00 here, on different basket draws and different model runs; the predecessor could not use its number because it had declared no priority between two nulls"}
  reproduce: uv run python scripts/run_exp043.py
  supersedes: []
  history:
    - {date: 2026-08-26, note: "Recorded from exp-043, the successor to an inconclusive predecessor whose fault was declaring two nulls and no priority between them."}
    - {date: 2026-08-26, note: "This validates the naming seat on the composition question only. It says nothing about whether the model reads the tilt the sort confers, which is a separate channel measured statistically and without a model."}

- id: clm-certificates-bind
  statement: >
    A certification layer materially changed a stated detectable effect within a week of
    existing, which is the evidence that it does work rather than decorate. When the corpus
    doubled from 1,323 tickers to 2,622, every power certificate on file went stale silently:
    each still read as valid and still named a plausible effect size. Re-issued on a pool matched
    to the old one in size and basket, so that ONLY the universe changed, every minimum
    detectable effect moved. Mean pairwise cosine went from resolving a forty-percent sub-bet at
    cosine 0.10 to 0.05; a densest-subset scan from 0.40 to 0.25; and the leading eigenvalue from
    detecting NOTHING anywhere on the tested grid to resolving 0.40. A verdict run on the new
    corpus under an old certificate would have carried the wrong power statement and no reader
    could have seen it.
    The instrument ranking is therefore pool-dependent, not a property of the statistics. On this
    centred 900-vector pool with a 168 basket, mean pairwise cosine is MORE sensitive than the
    leading eigenvalue, inverting the earlier ordering. The mechanism is legible: the
    eigenvalue's null sits at 0.183 with a relative spread of 0.06, so a planted direction must
    out-compete structure already in the pool, while mean pairwise cosine sits near zero with a
    relative spread of 2.1.
  one_breath: >
    Every detectable effect moved when only the universe changed, so certificates bind rather
    than decorate.
  confidence: measured_once
  from_experiment: null
  falsification_attempted: >
    The comparison was built to isolate the universe: same instruments, same basket of 168, same
    pool size of 900, same grid, same alpha, so nothing varied but the population. The inversion
    in instrument ranking was checked rather than reported -- null distributions were inspected
    directly and the eigenvalue's small relative spread against a large baseline explains it
    mechanistically. It is consistent with trp-47 rather than contradicting it: mean pairwise
    cosine is pinned only when the centred set IS the measured set, and here a 168 basket is
    measured inside a centred 900 pool.
  evidence:
    - {label: "mean pairwise cosine, MDE at a forty-percent sub-bet", value: "0.10 to 0.05", comparison: "old pool against new; same instrument, same basket, universe doubled"}
    - {label: "densest-subset scan, same target", value: "0.40 to 0.25", comparison: "same"}
    - {label: "leading eigenvalue, same target", value: "nothing detectable to 0.40", comparison: "the starkest move: an instrument that certified as blind on one pool resolves on another"}
    - {label: why the ranking inverts, value: "null baseline 0.183, relative spread 0.06", comparison: "against mean pairwise cosine near zero at relative spread 2.1; a plant must out-compete structure already present"}
    - {label: what the certificates do NOT cover, value: "vector layer, one vintage, one basket, one section, one measurement layer", comparison: "the 2019 measurement-date pool of Item 7A sections under the 2019 checkpoint at basket 168; non-embedding representations need their own, any claim starting at text needs a text-layer plant, and a verdict statistic measured on RETURNS needs a returns-layer plant -- exp-044 was registered citing these certificates and the citation was wrong, which is the scope line earning its keep on the first experiment to test it"}
  reproduce: uv run python scripts/reissue_certificates.py
  supersedes: []
  history:
    - {date: 2026-08-25, note: "Recorded on the certification layer's first real use. The universe-hash rule was added on the same day and is justified empirically by this result rather than by argument."}
    - {date: 2026-08-25, note: "Consequence for design: a registration must not hard-code a statistic by reputation. The verdict-bearing statistic for each arm is the one with the best certified MDE at the registered target on THAT arm's pool, chosen before results exist."}


- id: clm-harvest-schema-honesty
  statement: >
    The dual-harvest reader is mechanically sound, and two rounds of schema repair moved it from
    agreeing on a default to agreeing on the text. Across 120 records per round, every record
    returned a valid schema with all eight anchored themes, and the mechanical quote gate passed on
    99.3 percent of opus's stated exposures and 98.2 percent of sonnet's.
    The first schema had four direction levels and no way to say `exposed, direction not stated`.
    On sixty passages read by both tiers, 28 of 73 disagreements cited the IDENTICAL quote, and on
    fx_dollar -- where disclosure is almost always two-sided -- nine of twelve did. The schema was
    guessing, not the reader. It also collapsed an explicit denial into silence, which the
    firm-by-quarter panel's three-state missingness cannot tolerate.
    The repair exposed a second defect underneath it. `hurt_by_rising` was serving as a generic
    `this is bad for us` label, so passages describing harm from a FALL -- `a substantial or
    extended decline in metals prices would have a material adverse effect` -- were signed
    backwards. Filings describe risk as harm from a fall far more often than harm from a rise, so
    this inverted a whole class of disclosure, concentrated in energy_commodities. The
    direction-unstated label could not fix it: it halved the hurt_by_rising denominator while the
    flagged count barely moved, removing the unsupported signs and leaving the inverted ones.
    The third schema states that direction is about which way the DRIVER moves, and beats the first
    on overall agreement across a strictly finer partition -- six labels give more ways to disagree,
    and agreement still rose.
    What the repair bought is visible in one comparison. Under the first schema, when both tiers saw
    an exposure, opus signed it 94.2 percent of the time and sonnet 83.9 percent: two readers
    agreeing because the schema left them no escape. Under the third, direction agreement is
    essentially restored at 0.810 while the signed share is 0.393 and 0.310. Most of the original
    signed exposure was manufactured by the instrument, and what survives is the part a feature can
    honestly use.
  one_breath: >
    The reader now says `direction not stated` when that is true, and signs less than half as
    often as it did.
  confidence: reproduced
  from_experiment: null
  evidence:
    - {label: records returning a valid schema, value: "120 of 120 per round", comparison: "all eight anchored themes present, both tiers, all three schema versions"}
    - {label: stated exposures carrying a verbatim source quote, value: "99.3% opus, 98.2% sonnet", comparison: "checked mechanically against the filing text on every claim"}
    - {label: overall direction agreement, value: "0.840 -> 0.772 -> 0.846", comparison: "v3 beats v1 on a six-label partition against v1's four"}
    - {label: agreement that an exposure exists at all, value: "0.897 -> 0.890 -> 0.917", comparison: "the question both schemas can express; detection was never the problem"}
    - {label: share signed where both tiers saw an exposure, value: "0.942/0.839 -> 0.393/0.310", comparison: "opus/sonnet; the collapse is the finding, not the agreement number"}
    - {label: disagreements citing the identical quote, value: "28 (38%) -> 25 (24%) -> 11 (16%)", comparison: "same evidence, different label -- the schema guessing rather than the reader"}
    - {label: sign-inversion screen, upper bound, value: "0.089 -> 0.146 -> 0.103", comparison: "opus; absolute flags 17 -> 14 -> 6, and about three in five flags are true on inspection"}
    - {label: weakest remaining theme, value: "credit_refinancing at 0.684", comparison: "only 3 of its 18 disagreements are same-quote, so this is one label spanning three exposures rather than a schema fault"}
    - {label: ai_compute coverage on DESIGN tier, value: "near zero", comparison: "one of eight anchored themes is close to inert on pre-2023 text"}
    - {label: cost of the 47,000-passage run via Batch, value: "$4,944 opus, $1,592 sonnet", comparison: "sonnet 3.1x cheaper and 1.9x slower, at 2,941 output tokens against 1,231"}
  reproduce: uv run python scripts/analyse_d5_agreement.py harvest-v3
  supersedes: []
  history:
    - {date: 2026-08-26, note: "First pilot reported 22 of 60 sonnet passages failing. That was a 4,000-token ceiling binding on the more verbose tier, not a capability gap -- {{trp-64}} -- and would have entered the tier decision as a 37 percent failure rate. Fixed before any number left the run."}
    - {date: 2026-08-26, note: "Three schema versions, three rounds of sixty passages on two tiers. Each round found a defect that would otherwise have propagated to 47,000 passages, which is what a pilot is for. Reproduced rather than measured_once because the same passages were re-read under each schema and the arc is monotone on every axis except the one the second round was expected to disturb."}

- id: clm-checks-cut-both-ways
  statement: >
    The project's own validation machinery blocked an overclaimed NEGATIVE, not only
    overclaimed positives. The text-retrieval write-up was first committed with a verdict of
    refuted, on the strength of a re-ranking demonstration where text moved the right
    precedent down in three of three queries. The validator rejected it, because a refuted
    verdict in this repo requires a power statement and a planted-effect recovery, and three
    paired queries with a sign-test floor of p=0.125 support neither. The registration had
    said in its own words that this part was a demonstration and explicitly not a verdict;
    the rule caught the author disregarding a constraint the author had written. The verdict
    became supported for the powered half and the use question was recorded as open.
    This matters beyond the entry. Every earlier application of the same machinery deflated a
    result the project wanted: seven instrument bugs, a withdrawn subset claim, a retracted
    encoder finding. A reader entitled to ask whether the discipline is real rather than
    decorative can now be answered with a case where it cost a clean, publishable-sounding
    negative.
  one_breath: >
    The validator refused a refuted verdict that three queries could not support, so the
    checks demonstrably run in both directions.
  confidence: measured_once
  from_experiment: exp-066
  falsification_attempted: >
    The alternative reading is that the rejection was pedantic and the negative was sound.
    It was not: the sign-test floor at three paired observations is 0.125, so the design
    could not have reached significance in the unfavourable direction even at a clean sweep,
    which is the definition of a claim the data cannot carry.
  evidence:
    - {label: verdict first committed, value: refuted, comparison: "on 3 of 3 queries moving in the unfavourable direction"}
    - {label: what the validator demanded, value: "power statement and planted effect", comparison: "neither exists for a three-query re-ranking test"}
    - {label: arithmetic floor at that sample, value: "p=0.125", comparison: "one-sided sign test on 3 paired observations; 0.05 is unreachable"}
    - {label: verdict after correction, value: supported, comparison: "for the powered half; the use question recorded as open"}
  reproduce: "uv run python build/validate.py"
  supersedes: []
  history:
    - {date: 2026-08-30, note: "Recorded because the audience for this work has stated that unexamined model output is the risk they are hiring against. A case where the checks stopped the agent from over-claiming in the pessimistic direction is the evidence that they are symmetric."}

- id: clm-text-boundary
  statement: >
    Text's information about this book is real, orthogonal to the numeric state, and useless
    at every seat tested. Real: a month leaves a recoverable signature in what its
    constituents filed, recognisable at 0.283 top-1 across 60 months against a chance rate of
    0.017, holding at 0.100 under a calendar control whose own placebo has been run.
    Orthogonal: text and numeric pair distances share 5.8 percent of their variance across
    1,770 month pairs, so it is not a restatement of the price state. Useless so far: across
    seven measurements the text layer has been weaker than prices, additive of nothing, or
    actively unhelpful at every seat it has been offered. The seventh is the only one on a
    task text had never been tested at -- resemblance rather than measurement -- and it is the
    one that established the precondition and the enabling condition before testing the use,
    which is why its remaining gap is a data gap and not an instrument excuse.
    The two arms differ in mechanism, and the evidence for that subtracts nothing: item-type
    errors land on the same calendar month in another year 47.7 percent of the time against
    6.8 by chance, while narrative errors do so 9.3 percent of the time, which is chance. The
    item MIX repeats annually; the narrative CONTENT of each earnings season does not.
  one_breath: >
    Text carries a real, orthogonal signature of a month and has helped at none of the seven
    seats tested.
  confidence: measured_once
  from_experiment: exp-066
  falsification_attempted: >
    The obvious rescue was refused rather than tried. The re-ranking blend weight was fixed
    at half and half before the run; sweeping it after seeing that text hurt would very
    likely have produced a weight at which text appeared to help, and a weight found that way
    is the failure mode the protocol exists to prevent. No additional queries were added
    either: only three episode queries have a same-mechanism precedent inside the 8-K era,
    and all three share 2019-09 among their targets. One favourable cell -- text alone ranked
    the right precedent first for 2021-03 -- is left unremarked, because one query proves
    nothing and mining it would spend the credibility the refusal just earned.
  evidence:
    - {label: month recognition, narrative arm, value: "0.283 top-1 on 60 months", comparison: "chance 0.017; 0.100 under the calendar control, permuted p95 0.050"}
    - {label: month recognition, item arm, value: "0.249 top-1", comparison: "0.072 under the calendar control; no model, leak-free by construction"}
    - {label: orthogonality to the numeric key, value: "5.8 percent shared variance", comparison: "r=+0.241 over 1,770 pairs from 60 months; below the 0.50 pre-committed redundancy gate"}
    - {label: mechanism split, subtraction-free, value: "47.7 vs 9.3 percent", comparison: "share of errors landing on the same calendar month in another year, against 6.8 percent chance"}
    - {label: the use test, value: "0 up, 3 down", comparison: "target ranks 5, 2, 2 became 8, 6, 6 at a pre-fixed 50/50 blend; sign-test floor p=0.125, so a direction and not an answer"}
    - {label: seats tested, value: 7, comparison: "six measurement families refuted earlier; the seventh is retrieval, and the only one where the precondition was established first"}
  reproduce: "uv run python scripts/text_fingerprint.py --gate"
  supersedes: []
  history:
    - {date: 2026-08-30, note: "The closing sentence of the text programme. It ends on a constructive result and an honestly open question rather than on a rescue or a funeral, and the open question is bounded by corpus depth: the current-events corpus begins in 2018."}

- id: clm-positioning-describes
  statement: >
    The conferred-exposure measurement describes what the momentum book is betting on and does
    not predict what happens to it. Across 98 design-tier months, trailing volatility alone
    explains 0.058 of an indicator for the worst quintile of next-month outcomes; adding the
    conferred beta spread takes that to 0.072. The partial correlation between the tilt and
    that indicator, controlling for volatility, is -0.119 with p=0.244, and the tilt series has
    an effective sample of about 13 against a raw 98, so the true standard error is larger
    still. The same pattern has already been measured on a different positioning statistic: the
    published crowding measure that replicates cleanly out of sample stops paying at zero basis
    points, while the identical rule driven by trailing volatility survives 150.
    Two positioning measures, two independent routes, one answer: positioning describes the
    bet, volatility predicts the damage. That is not a failure of the measurement, it is a
    statement about what kind of object it is, and it means the system is two products rather
    than one -- a description of the exposure a reader may or may not have a view on, and a
    conditional loss distribution that comes from somewhere else.
  one_breath: >
    The positioning measure says what the book is betting on; it adds nothing to trailing
    volatility for predicting the loss.
  confidence: measured_once
  from_experiment: null
  falsification_attempted: >
    The test was run in the direction that would have been favourable: if the tilt carried
    tail information beyond volatility, the incremental R-squared and the partial correlation
    would both have shown it, and the partial correlation would have been positive because a
    more defensive book should be more exposed to a rebound. The point estimate is negative
    and insignificant. The check was also run against an alternative already in the record
    rather than in isolation: the crowding measure's zero-basis-point breakeven is an
    independent route to the same conclusion on a different statistic.
  evidence:
    - {label: variance explained by trailing volatility alone, value: "0.058", comparison: "indicator for the worst quintile of next-month outcomes, 98 design-tier months"}
    - {label: variance explained by volatility plus the conferred tilt, value: "0.072", comparison: "an increment of 0.013 on 98 months, with the tilt's effective sample about 13"}
    - {label: partial correlation of the tilt given volatility, value: "-0.119", comparison: "p=0.244; the sign is opposite to the one a tail story predicts"}
    - {label: the independent route, value: "0 basis points against 150", comparison: "breakeven trading cost for the published crowding measure against the same rule driven by trailing volatility"}
  reproduce: uv run python scripts/effective_sample.py
  supersedes: []
  history:
    - {date: 2026-08-31, note: "Run because an adversarial review of the submission memo asked why a memo whose finding is a positioning measure has an actionable number conditioned on realised volatility, and observed that nothing in the document reconciled the two. The answer is that they do not need reconciling because they are different products, and the memo now says so rather than leaving the seam for a reader to find."}
