- id: clm-text-no-exposure
  statement: >
    News about a company does not appear to encode the factor exposure that company
    contributes to a portfolio, at the resolution this corpus can measure. On the eve of the
    September 2019 reversal the book was a concentrated bet on falling interest rates,
    established from cross-sectional rate betas of the holdings. Coverage of those same
    companies is 0.32 percent rate-themed, below its own losing side at 0.60 percent. The
    claim is bounded rather than absolute: the theme vocabulary is coarse, a single
    hand-picked theme family was the probe, and the data-driven alternative to that probe
    turned out to rest on an invalid independence assumption. What can be said is that no
    rate signal is visible at this resolution, not that none exists.
  one_breath: >
    Company news shows no trace of the factor exposure that made the book fragile, at the
    resolution this corpus can resolve.
  confidence: measured_once
  from_experiment: exp-023
  evidence:
