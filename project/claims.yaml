- id: clm-date-blinding-fails
  statement: >
    Stripping dates from text does not blind a language model to when the text was written.
    Given headlines about company news with every year, month and explicit date removed, and
    company identities replaced by letters, a current model named the exact calendar year of
    all four windows in all forty draws, at a self-rated confidence of 8.4 out of 10 that
    proved correct every time. Period fingerprints survive in company names, products,
    events and vocabulary. Any retrospective judgement a current model makes about
    historical text may therefore rest on knowing what happened next, and the standard
    mitigation of removing dates is not a mitigation.
