- id: clm-overlap-inference
  statement: >
    The severity backtest evaluates ten-day forward returns at monthly refits, so
    consecutive observations share most of their evaluation window and are not independent.
    Correcting for that autocorrelation cuts the t-statistic on the volatility edge from
    3.29 to 2.56 and the effective sample from 318 refits to 193. The result survives and
    is weaker than reported. The same correction applies to every forecast comparison in
    this project, none of which carried it, and it is the time-series form of the same
    error that invalidated the news theme test.
  one_breath: >
    Overlapping forecast windows were treated as independent, overstating the precision of
    every severity comparison here.
  confidence: measured_once
  from_experiment: exp-003
  evidence:
    - {label: t-statistic assuming independence, value: 3.29, comparison: "against 2.56 after a Newey-West correction at lag 5"}
    - {label: effective sample, value: "193 of 318", comparison: "61 percent of the refits actually carry independent information"}
    - {label: autocorrelation of the loss differential at lag 1, value: "+0.34", comparison: "against 0 if refits were independent"}
  reproduce: "uv run python -m unstructured_momentum.model.severity --overlap-diagnostic"
  supersedes: []
  traps: [trp-19]
  history:
    - {date: 2026-08-22, note: "Found by applying the independence critique from the text audit to the claim the project rests on, rather than treating that critique as being about text."}

- id: clm-framework-insensitive
  statement: >
    The severity comparison cannot resolve realistic differences between predictors. A
    signal blended with noise is not preferred to trailing volatility alone until its
    signal share approaches 100 percent; at 40 percent the forecast is still worse. The
    cause is mechanical: adding a regressor to a quantile regression at the fifth
    percentile costs estimation variance, and the observations genuinely in the tail are a
    small fraction of the training window, so the parameter penalty outweighs what a noisy
    feature carries. A larger effective sample or a more sensitive estimator would move
    this; more candidate features would not.
  one_breath: >
    The horse race can only see a near-perfect predictor, so its verdicts on realistic
    features carry little information.
  confidence: measured_once
  from_experiment: exp-025
  evidence:
    - {label: signal share at which the framework still prefers volatility alone, value: "40%", comparison: "the blended predictor is worse, with a Newey-West t of -0.07"}
    - {label: signal share at which it is finally detected, value: "100%", comparison: "a noiseless predictor, with a Newey-West t of +4.50"}
    - {label: effective sample after overlap correction, value: "188 of 318 refits", comparison: "median across 54 specifications"}
  reproduce: "uv run python -m unstructured_momentum.model.severity --audit"
  supersedes: [clm-nothing-beats-vol]
  history:
    - {date: 2026-08-22, note: "The positive control that should have accompanied the original horse race. It was not run because nobody asks whether a null result came from a blind instrument."}

- id: clm-vol-robust
  statement: >
    Trailing volatility beating a no-information baseline is robust to specification. Across
    54 combinations of horizon, quantile, volatility transform and training-window length,
    it wins in every one, with skill from 14.1 to 26.3 percent. Overlap-corrected
    t-statistics run from 1.84 to 2.69 and 51 of 54 clear the conventional threshold. This
    is the claim the system should rest on, and it is materially weaker than the 3.29
    implied by treating overlapping evaluation windows as independent.
  one_breath: >
    Trailing volatility beats knowing nothing in every specification tried, though less
    decisively than naive standard errors suggested.
  confidence: reproduced
