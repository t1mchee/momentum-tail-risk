    - {label: rate themes, calm 2016 winning side, value: "0.88%", comparison: "higher than the episode window, so wrong in direction twice"}
    - {label: articles behind the estimate, value: "2,424", comparison: "model-filtered to those genuinely about the holdings, across 140 companies"}
    - {label: theme families probed, value: 1, comparison: "hand-picked in advance; the data-driven alternative proved invalid on independence grounds"}
  despite_refutation: >
    The refuted prediction was that coverage would be rate-dominated. This claim states the opposite finding, which is what the refutation established.
  reproduce: "uv run python -m unstructured_momentum.features.narrative --rebuild-corpus"
  supersedes: []
  history:
