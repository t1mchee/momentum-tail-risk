- id: clm-contamination-inert
  statement: >
    A model's knowledge of when text was written is present but does not move its factual
    classifications. Told the true year, a year five years wrong, or nothing at all, it
    labelled 152 headlines identically in every case, with the positive rate matching to
    three decimal places. Contamination being detectable is therefore not the same as
    contamination being used, and the two require separate tests. The caveat is that only
    six headlines were positive in any condition, so the informative sample is six and a
    stratified rerun is required before this bears weight.
