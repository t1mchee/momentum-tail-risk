- id: src-13f
  label: SEC Form 13F institutional holdings
  one_breath: >
    Quarterly long US equity positions of institutional managers, the only free record of
    who owns what that reaches the 2007 unwind.
  access: free-file
  module: data/thirteenf.py
  coverage:
    - {from: 2001-01-01, to: 2026-06-30, grain: quarterly holdings per filer}
  gaps: []
  vintage: 2026-08-24
  note: >
    LOCAL STORAGE, 2026-08-28: the 170,818-file per-accession crawl archive
    (data/raw/thirteenf/raw, 2.3GB) was deleted from disk after a verified upload to
    gs://unstructured-momentum-data/repo_raw_backup/thirteenf/raw/ -- counts matched exactly
    at 170,818 both sides before anything was removed. It is superseded by the bulk-dataset
    parquets in data/raw/thirteenf/holdings (54 quarters), which no longer derive from it and
    which every consumer reads; no code path referenced the crawl archive. Restore from the
    bucket if a per-accession original is ever needed. The deletion was made under disk
    pressure (the volume reached 83MB free and was failing tests and git operations).

    Long US equity only, above a 100 million dollar threshold, so the momentum loser leg is
    invisible and needs FINRA short interest instead. No leverage and no shorts. Roughly
    3,200 filers a quarter in 2007 and 9,600 now, covering thirteen of the fifteen
    registered episodes and missing only 1999-04 and 2000-03. period_of_report is the
    position date and available_at is the acceptance timestamp about 45 days later; the two
    are separate columns because the index quarter is the filing quarter, not the holdings
    quarter. Values are in thousands until an SEC amendment moved them to whole dollars and
    filers switched raggedly, so units are detected per filing rather than by date. Selected
    because crowded deleveraging leaves no trace in company-filed text, companies not being
    in the business of writing about who owns them, while this is the record that carries it.
  used_by: [exp-036]
  traps: [trp-28, trp-29]
  wishlist: false

- id: src-short-interest
  label: FINRA consolidated short interest
  one_breath: >
    Shares short for every US equity security, twice a month, with FINRA's own days-to-cover
    figure alongside.
  access: free-api
  module: data/shortinterest.py
  coverage:
    - {from: 2018-01-12, to: 2026-08-15, grain: twice monthly per security}
  gaps: []
  vintage: 2026-08-24
  note: >
    Roughly 16,200 securities per settlement date, of which about 11,700 are usable. The feed
    carries settlementDate and NO publication date, which is the trap: settlement is when the
    position was measured and FINRA disseminates about eight business days later, so building
    on settlement dates would hold positions a week before anyone could see them. Availability
    is therefore computed as settlement plus ten business days, deliberately later than the
    real lag, because a stamp that is too late costs signal while one that is too early
    invents it. daysToCoverQuantity saturates at 999.99 for securities reporting no volume;
    those rows are 2,863 of 16,203 on a sample date and carry 15 percent of all short
    interest, so they are dropped rather than averaged. This is a POSITION, unlike the daily
    short-volume feed, which is flow contaminated by market-maker hedging. Selected because
    13F established that long holdings cannot see the leg momentum is short, and this is that
    leg.
  used_by: [exp-037]
  traps: []
  wishlist: false

- id: src-calls-curated
  label: Earnings-call transcripts, hand-curated episode sample
  one_breath: >
    Management speaking quarterly with a question period, rather than lawyers writing annually
    on a compliance calendar.
  access: free-scrape
  coverage:
    - {from: 2019-10-01, to: 2022-12-31, grain: call-level, rows: 0}
  gaps: []
  wishlist: false
  note: >
    Registered as a data rung, NOT acquired. It is the acquisition step for the emergence
    experiment's second rung and is taken only if that experiment's primary lands and its
    diagnosis is corpus tempo.
    The gap it fills is specific. Every text source in this project is filings: lawyer-mediated,
    annually recycled, and released on a schedule that has nothing to do with when a risk became
    real. Calls are quarterly, management speaks in its own register, and the question period
    reveals what the market is probing rather than what counsel would volunteer. The emergence
    claim is strongest exactly where language moves fastest, and novel risk vocabulary very
    likely reaches a call one to two quarters before it reaches a risk-factor section. So if the
    filing-based lead time comes back marginal, the first diagnosis to check is wrong corpus
    tempo rather than no signal, and this is the rung that checks it.
    Scope is deliberately small: the two emergence episodes only, top book names by weight,
    hand-curated. Free coverage is patchy and licensing is murky, which is why the full archive
    is a separate wishlist entry rather than this one.
  used_by: []
  traps: []

