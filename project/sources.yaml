    Registered because it is the only free source carrying short positions and borrowings, the
    quantity the positioning ceiling in the data section says is unobservable. Its limit is the
    one that matters: it covers registered investment companies only, so it sees mutual funds
    and ETFs and never the levered multi-strategy books whose deleveraging is the mechanism it
    would be used to test. It narrows the gap and cannot close it. The structured datasets begin
    2019q4, so only five of the fifteen registered episodes fall inside it.
    ACQUIRED AND INSPECTED 2026-09-02, one quarter, and the construction is proven. Each
    quarterly file is about 340MB and carries FUND_REPORTED_INFO with total assets, net assets
    and borrowings payable, SECURITIES_LENDING with a per-holding loan value, BORROW_AGGREGATE,
    and monthly sales, reinvestment and redemption flows. On 2020q1 that gives 11,259 usable
    funds, an asset-weighted gross leverage of 1.0438, 510 funds reporting explicit borrowings
    totalling $150.7bn, and $1,079bn of quarterly redemptions. This is real fund-level gross
    leverage and a real forced-selling driver, which is more than any other free source offers.
    THE TIME-SERIES TEST WAS DELIBERATELY NOT RUN. Thirteen quarters inside the design tier is
    roughly 39 monthly observations, where the smallest partial correlation detectable at 80
    percent power is about r = 0.44. Two better-powered tests of the same question have just
    returned nulls at r = 0.17 and r = 0.27 with observed values near 0.03, so a test at 0.44
    could not resolve anything they did not, and running it would produce a null that says only
    that the sample was small. The 4.4GB acquisition is not justified for that. The design that
    WOULD justify it is cross-sectional rather than time-series: with 11,259 funds per quarter,
    identify which funds hold the momentum book and measure their leverage and redemption
    pressure across funds at a point in time, where the sample is thousands rather than tens.
