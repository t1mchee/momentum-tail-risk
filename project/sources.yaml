- id: src-implied-moments
  label: Model-free implied moments (Vilkov/Rehman OSF panel)
  one_breath: >
    Published BKM risk-neutral skewness and variance for thousands of US names daily,
    free and already integrated, so no option chain has to be touched.
  access: free-file
  module: null
  coverage:
    - {from: 2017-03-22, to: 2023-12-29, grain: ticker-day, rows: 1705}
  gaps: []
  vintage: 2026-08-28
  wishlist: false
  note: >
    COVERAGE BOUNDS, stated here because they are boundaries rather than internal gaps:
    MTUM listed in 2013 but enters this panel only in 2017-03, so its first four option
    years are absent; and the panel ends 2023-12-29 while this project's own option capture
    begins 2026-08-20, with NO overlapping day between them. Because the peer-reviewed
    record is explicit that risk-neutral skewness is far more sensitive to surface
    construction than variance is, and no overlap exists on which to calibrate one
    construction against the other, stitching the two segments is REFUSED -- they are
    separate series and must be reported as such.
    Acquired 2026-08-28 after an options-sourcing audit. Rehman and Vilkov publish the
    Bakshi-Kapadia-Madan model-free implied moment panel on OSF (DOI 10.17605/OSF.IO/BTVDH,
    CC-BY 4.0), keyed on CRSP permno, daily 1996-2023, across roughly four to five thousand
    names per day -- which covers any book this project constructs. MTUM is permno 13851
    and is complete: 1,705 days, 100 percent non-null at the 30, 60 and 91-day horizons,
    mean 30-day skew -1.05.
    WHY THIS MATTERS: it is a direct risk-neutral skewness series for the momentum factor
    itself, not a market-wide proxy, and it is the price null the monotone-quantile
    registration needs -- the question becomes whether text adds tail information over what
    the option market was already pricing ABOUT MOMENTUM, rather than about the S&P.
    The full panel (mfis, mfiv, Martin simple variance, IV slopes; 989MB) also covers the
    book's constituents, so a book-level implied skew weighted by leg membership is
    buildable and is the natural next step. Paid alternatives were priced and are not
    needed for the free path: a one-time 599 dollar vendor archive would remove the seam
    and recover 2013-2017, and is worth revisiting only if the signal proves out.
  used_by: []
  traps: []

- id: src-epu
  label: Newspaper-based uncertainty and risk indices
  one_breath: >
    Century-deep counts of what the press wrote about policy uncertainty and geopolitical
    risk, the first text source here as deep as the return archive.
  access: free-file
  module: null
  coverage:
    - {from: 1900-01-31, to: 2026-07-31, grain: monthly}
  gaps: []
  vintage: 2026-08-31
  note: >
    Two series. Baker, Bloom and Davis build the US Economic Policy Uncertainty index from
    scaled article counts across ten newspapers; Caldara and Iacoviello build the historical
    Geopolitical Risk index the same way. Both are free with attribution and both cover 100
    percent of the 1,150-month state-vector archive, against 5 percent for the company-filing
    corpus. Selected after the page replay showed no analogue in 372 pages could be described
    from company filings, which begin 2018 while the median retrieved analogue is 19.9 years
    old. Two limits bind. They are AGGREGATE monthly indices, so they carry nothing about
    which names are in the book and cannot speak to crowding, leverage or securities lending
    -- the positioning where momentum's danger lives, which is not public at any depth. And
    the pre-1985 portion was constructed retrospectively, so the term list used to count 1950
    articles was chosen by researchers who knew what followed; no future information about
    1950 enters the 1950 value, but the feature definition carries hindsight a
    contemporaneous index would not.
  used_by: [exp-071]
  traps: [trp-73]
  wishlist: false

- id: src-finra-margin
  label: FINRA aggregate customer margin debt
  one_breath: >
    Monthly debit balances in customer securities margin accounts, the only free leverage
    series long enough to reach the 2007 unwind.
  access: free-file
  module: data/margindebt.py
  coverage:
    - {from: 1997-01-31, to: 2026-07-31, grain: month-end, rows: 355}
  gaps: []
  vintage: 2026-08-31
  note: >
    Acquired because the existing positioning stack observes 6 of 15 registered episodes and
    roughly 2 independent clusters, which is the weakest number in the data section. This
    series covers every episode in the register. Three limits are structural and were known
    before acquiring. It is MARKET-level, not factor-level, so it cannot say the momentum book
    specifically was levered. It measures customer margin at brokers, which excludes the
    prime-brokerage leverage that actually unwound in August 2007. And FINRA disseminates
    roughly three to four weeks after month end with no publication date in the file, so
    available_at is computed as month-end plus 25 days and any test must build on that rather
    than on the measurement date.
  used_by: []
  traps: []
  wishlist: False

- id: src-ftd
  label: SEC fails-to-deliver
  one_breath: >
    Twice-monthly counts of shares that failed to settle, per security, the only free measure
