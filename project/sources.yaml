- id: src-gdelt
  label: GDELT global news index
  one_breath: >
    A free index of worldwide news coverage, searchable by topic and stamped with when
    the crawler saw each article.
  access: free-api
  module: data/gdelt.py
  coverage:
    - {from: 2015-02-17, to: 2026-08-26, grain: article-level, rows: 122266705}
  gaps: []
  vintage: 2026-08-21
  note: >
    THE BULK IS NOT ON DISK. The authoritative store is the BigQuery table momentum.gkg_matched:
    122,266,705 rows over 139 monthly partitions, 2015-02 through 2026-08, with 4,191 distinct
    days and no missing month -- continuous, not sparse. The local directory holds only four
    cached Aug-13-to-Sep-06 windows from 2016 to 2019 that were pulled down as seasonal controls
    for the September 2019 episode, and a Gate 0 audit that inspected the disk alone mistook that
    cache for the source and briefly rewrote this coverage as four narrow windows. The registry's
    real and only error was its start date: it claimed 2017-01-01 where the table begins
    2015-02-17, understating the corpus by two years. The derived attention panel confirms the
    table rather than the cache: 139 of 139 months, 4,191 distinct days, same span.

    Capped at 250 records per query and rate-limited to roughly one request every twelve
    seconds in practice, so results are cached to disk. The crawl time lags true
    publication, which makes it a conservative availability stamp that cannot leak.
  used_by: [exp-009, exp-010, exp-020]
  traps: [trp-10, trp-17, trp-18, trp-19]
  wishlist: false

