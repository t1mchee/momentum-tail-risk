  access: free-file
  module: data/ftd.py
  coverage:
    - {from: 2009-07-01, to: 2022-12-30, grain: settlement-date per security, rows: 0}
  gaps: []
  vintage: 2026-08-31
  note: >
    Pipe-delimited inside per-half-month zips. Two traps found while acquiring. The archive is
    served under three different path prefixes across eras, so links must be scraped from the
    index rather than constructed; a constructed URL returned 53KB of HTML with a 404 status,
    which is the HTML-served-as-data failure this project has logged before. And the file
    identifies securities by CUSIP and SYMBOL where the symbol is point-in-time, so joining to
    a current-vintage ticker map would silently mis-assign renamed and delisted names.
  used_by: []
  traps: []
  wishlist: False

