# Where the data comes from, what it covers, and where the holes are.
# Coverage figures are read off the files on disk, not off memory.

- id: src-iwv
  label: iShares Russell 3000 holdings
  one_breath: >
    Daily list of what the broad US index held, which is how the book gets rebuilt
    historically without survivorship bias.
  access: free-api
  module: data/ishares.py
  coverage:
    - {from: 2006-09-29, to: 2013-03-31, grain: month-end, rows: 3341}
    - {from: 2013-04-01, to: 2026-08-19, grain: daily}
  gaps:
    - {from: 2010-05-01, to: 2010-05-31, cause: 'upstream archive is missing this month; found by scripts/reconcile_sources.py, not by inspection. Month-end era, so one absent file is a whole month.'}
    - {from: 2017-01-01, to: 2017-07-31, cause: 'upstream archive is missing these files; 0 raw files present. Leg membership carries the 2016-12-31 sort across all seven months byte-identically, Jaccard 1.000 against a 0.5-0.6 month-to-month norm, so those month-ends are a frozen book presented as if re-struck. The conferred placebo panel drops 2017 entirely, so two consumers of the same gap disagree. Gate 0 audit item 3.'}
  vintage: 2026-08-19
  note: >
    Carries price, weight and sector per holding, including companies that later delisted.
    Several market-data surveys assert a free stock-level panel of this kind does not
    exist. It does, and it is the foundation the whole book reconstruction sits on.
  used_by: [exp-001, exp-002, exp-008, exp-013, exp-014, exp-020]
  traps: [trp-01, trp-02, trp-03, trp-04, trp-05, trp-06, trp-09]
  wishlist: false

