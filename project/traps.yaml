    Both numbers are correct measurements of something. The log is an accurate record of the
    instrument under the old null and the artefact is an accurate record under the new one, so
    neither reads as wrong on its own and nothing downstream can tell which null a quoted rate
    belongs to. A certificate carries a universe hash, which caught a stale POPULATION the day
    before; it carries no fingerprint of the null CONSTRUCTION, which is what changed here.
  affected_sources: []
  defence: >
    Re-issuing a certificate after a null repair is not the end of the repair. Every sentence
    quoting it is stale until it is rewritten from the artefact, and the artefact -- not a
