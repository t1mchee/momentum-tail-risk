- id: trp-62
  one_breath: >
    An artefact whose display order differs from its ranking order is eventually read as its
    ranking, and a good result looks like noise.
  found_on: 2026-08-26
  symptom: >
    A freshly built driver taxonomy was inspected by printing the first terms of each list. The
    compute driver returned agamatrix, alarms, animas, artificial, assemblers, audible, byram --
    medical-device company names and filler. The conclusion drawn, and stated, was that the
    expansion had produced noise and would poison the screen downstream.
    It had not. The storage layer sorted terms alphabetically, discarding the lift ranking the
    expansion had computed. The first terms alphabetically are the TAIL of the ranking. The
    actual top terms for that driver were semiconductor, wafer, wafers, memory, lithography,
    foundry and chips -- a good expansion, read from the wrong end.
    This runs OPPOSITE to every other trap in this file. The recurring species here is something
    that parses cleanly and is wrong toward a false positive: a believable number that should not
    be believed. This one nearly recorded a false NEGATIVE on a working artefact, because the
    inspection surface destroyed the very information being inspected.
  why_it_parsed: >
    An alphabetically sorted list is a valid list, and nothing about reading its first entries
    announces that the order carries no meaning. Sorting for stable identity is also a reasonable
    thing for a storage layer to do -- the content hash SHOULD be order-independent -- so the
    sort had a good reason and destroyed something anyway.
  affected_sources: []
  defence: >
    Store and render in the order that carries the meaning, or label the order explicitly on the
    surface where it will be read. Here the terms are stored in lift order while the content hash
    still sorts before hashing, so identity stays order-independent and inspection stays truthful.
    The conduct rule matters as much as the code one. The suspicion was diagnosed before it was
    acted on -- the expansion was re-run at three document-frequency floors and the ranking
    inspected directly -- rather than being carried into a decision to rebuild or discard. A
    false negative acted on quietly is as expensive as a false positive, and harder to notice,
    because nothing downstream ever contradicts a thing that was thrown away.


