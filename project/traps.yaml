  why_it_parsed: >
    A transcribed number and a computed number render identically, and the page is the one
    artifact nobody diffs against its own generator because reading it IS the check people
    perform. The claim in the memo made it worse rather than better: a stated principle reads as
    a description of the code, so the sentence about the tokeniser was itself the reason nobody
    looked for the tokeniser. This is the same fault as the hand-typed percentiles logged
