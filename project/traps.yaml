- id: trp-81
  found_on: 2026-09-02
  one_breath: The conditional expected shortfall was not conditional, so it read milder than the VaR beside it.
  affected_sources: []
  symptom: >
    On the page for 2020-10-31 every expected-shortfall figure was less severe than the
    value-at-risk printed next to it -- a 10-day 5 percent VaR of -0.0947 against an ES of
    -0.0586 -- contradicting the sentence printed directly beneath, that ES is the average loss
    given the VaR is breached and is therefore always the worse number. The same block was
    correct at 2019-09-06, so it presented as date-specific rather than as a formula error.
  why_it_parsed: >
    The two quantities were different objects wearing one label. VaR was evaluated at today's
    state; ES was the mean realised return below the in-sample fitted quantile across the whole
    training set, which does not depend on today at all. Whenever the current state is more
    extreme than the sample average the VaR moves and the ES does not, and the inequality
    inverts. The field was named es_conditional and the docstring described what the code did
    rather than what the name claimed, so reading either one in isolation looked consistent.
  defence: >
    Estimate the tail's MULTIPLICATIVE severity in-sample -- how much worse an exceedance is
    than the quantile it breached -- and apply that ratio to today's VaR. The ratio is at least
    one on the rows it averages, so the ES can no longer come out milder than the VaR. More
    generally: when two numbers are printed side by side under a stated inequality, that
    inequality is an assertion about the code and belongs in a test.

- id: trp-82
  found_on: 2026-09-02
  one_breath: A result cache keyed on its inputs but not its estimator served stale numbers after the model was fixed.
  affected_sources: []
  symptom: >
    After the conditional expected shortfall was repaired, the page reprinted the inverted
    values byte-for-byte at both test dates. The severity stage caches to disk under a key
    built from the as-of date, the input series and the horizon and quantile grid. The
    estimator itself is not in the key, so changing the model produced no cache miss and the
    old numbers were served indefinitely.
  why_it_parsed: >
    The fix appeared to have failed rather than to have been ignored, which sent the first
    diagnosis toward the arithmetic rather than the cache. A cache hit is silent by design and
    there is no output distinguishing a fresh computation from a replayed one; the stage does
    set a from_cache flag on the record, but nothing prints it.
  defence: >
    Hash the estimator's source into the cache key, so any change to the model invalidates the
    entry automatically. A cache that cannot notice a code change is a mechanism for publishing
    a result the code no longer produces, which is the same failure as a stale committed
    artifact and is harder to see because nothing on disk looks wrong.

- id: trp-83
  found_on: 2026-09-02
  one_breath: A family-wise correction raised the pass rate to 100 percent, because the null was saturated.
  affected_sources: []
  symptom: >
    The eight-series version of the concentration test cleared 108 of 108 month-ends. The first
    implementation used the maximum PERCENTILE across series, which saturates: against 200 draws
    a percentile has half-a-point resolution and the real book exceeds every placebo on at least
    one of eight series essentially always, so the real book pinned at 100.0 on 107 of 108 dates
    while each placebo capped at 99.5 by being included in its own comparison. Replacing it with
    a continuous statistic, the maximum standardised distance with leave-one-out moments, fixed
    the arithmetic and did not change the verdict: still 108 of 108, with a median maximum z of
    22.8 against a threshold of 2.74.
  why_it_parsed: >
    A multiple-testing correction is expected to make a test HARDER, so a correction that raised
    the pass rate from 76.6 percent on one series to 100 on eight should have been implausible
    on sight. It was not caught by any check; it was caught by the round number. The deeper
    cause is that the null is too weak for the statistic: the median date has SEVEN of eight
    series above the family threshold and on 44 percent of dates all eight are, because a
    momentum-sorted book differs from a random size-matched book on every macro axis at once.
    A maximum over eight saturated quantities cannot discriminate.
  defence: >
    Read the direction of a correction before reading its result: a family-wise adjustment that
    increases a pass rate is either a coding error or evidence the null is saturated, and both
    need finding before the number is quoted. The single-series test discriminates at 76.6
    percent partly by accident of which series was registered -- market beta carries the LOWEST
    median z of the eight at 7.8 against 18.7 for the first principal component, so a different
    registered series would have cleared near 100 percent as well. The informative null for a
    concentration claim is not a random book but a book built by the same kind of rule: sorts on
    other trailing-return windows, which this design already names as its live control and had
    not run.

- id: trp-84
  found_on: 2026-09-03
  one_breath: A sealed test deviated from its own registered sampling and produced a spurious failure.
  affected_sources: []
  symptom: >
    The holdout's severity arm was registered with a power statement naming a 21-day forecast
    step, roughly 40 forecasts and about 2 expected breaches. The script that read the seal used
    DAILY forecasts instead, 865 of them, each a 10-day window overlapping the next by nine
    days. On that sample the conditional model breached 16 times, a rate of 1.85 percent against
    5 expected, and the coverage test rejected at p below 0.001 -- reported as FAIL. On the
    registered 21-day step the same model breaches 2 times in 42, a rate of 4.76 percent at
    p 0.943, which passes. The registered design passes and the deviation fails.
  why_it_parsed: >
    The deviation looked like more data rather than less: 865 forecasts reads as a larger and
    therefore better sample than 42, and nothing in the code referenced the sampling the
    registration had fixed. It is the same overlapping-windows error this project criticises
    elsewhere, committed inside the one test whose entire value depends on being run exactly as
    written. Had the direction of the artifact been flattering rather than damning it would
    have been far harder to catch, because the instinct that saved it was disbelief at a
    failure, not a rule.
  defence: >
    A pre-registration that fixes a sampling scheme has to be executed by the code, not
    remembered by the person running it: the registered step belongs in the script as a constant
    read from the registration, so a deviation is a diff rather than an oversight. And a sealed
    test is exactly where post-hoc flexibility is least acceptable -- the defence for reporting
    the 21-day result is that the step appears in a registration committed before the read, and
    that defence would be worthless if the number had been chosen after seeing both.


- id: trp-85
  found_on: 2026-09-03
