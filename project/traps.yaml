    Every guard in this repo watches EXPERIMENTS. The tier rule is phrased as a rule about tests,
    the validator checks tiers on registrations, and a certification is not a registration -- it
    is scaffolding that runs before one. It also does not feel like reading the answer, because it
    genuinely is not: no verdict was extracted from the sealed years and no hypothesis was
    evaluated against them.
    It contaminates anyway. A certificate describes a procedure ON A POPULATION, and the MDE and
    false-alarm rate both come from the null's spread, which comes from the data. Certifying on
    2013-2025 and then testing on 2013-2022 quotes an MDE for a population the test never touches.
    The two numbers differ materially: the full-panel certificate put the MDE region between 0.6
    and 0.9 sigma, the DESIGN-tier certificate puts it at 1.3. Carrying the first would have
    understated the instrument's blindness by roughly half.
  affected_sources: []
  defence: >
    The tier cut belongs in the CERTIFICATION, not only in the experiment, and it is cut twice --
    formation dates before the boundary and forward observations dropped at it -- so a late-2022
    conditioner cannot pull sealed returns through its forward window.
    The general rule is the one worth keeping: anything that produces a number a verdict will
    quote is inside the tier discipline, whether or not it is called an experiment. Certificates,
    thresholds, calibration sets and vocabularies all qualify. The contaminated certificate was
    discarded rather than adjusted, on the same principle as the null-repair rule -- a published
    number is never carried across a change in the population that produced it.

- id: trp-64
  one_breath: >
    A ceiling that binds on one model and not another turns a configuration limit into a
    capability comparison.
  found_on: 2026-08-26
  symptom: >
    A dual-harvest pilot ran sixty passages through two model tiers. Opus returned sixty clean
    records. Sonnet returned thirty-eight and raised twenty-two errors, all of them on the cheaper
    tier: thirteen `NoneType object has no attribute stated` and nine `Invalid JSON: EOF while
    parsing`. Read at face value that is a 37 percent failure rate for one model on a task the
    other completed perfectly, and it is the kind of number that would have gone straight into a
    tier decision.
    It was a ceiling. `max_tokens` was 4,000. Sonnet's largest CLEAN response was 3,933 tokens and
    its p90 was 3,677, so the cheaper tier was running flush against the wall; opus, more concise
    at a mean of 1,231 output tokens against sonnet's 2,323, never came close. The errors were
    truncated JSON, several frames away from the ceiling that caused them.
  why_it_parsed: >
    Both error messages are about parsing, and neither mentions tokens, limits, or truncation. The
    exception surfaces where the malformed output is CONSUMED rather than where it was cut, so the
    stack trace points at the schema layer and the schema layer is innocent.
    The comparison also looked like exactly the thing the pilot was built to measure. A tier
    bake-off expects the cheaper model to do worse, so a cheaper model doing worse is the
    hypothesis confirming itself, and a confirmed hypothesis is not something anyone instruments.
    The tell was in the artefact rather than the errors: a maximum clean output of 3,933 against a
    ceiling of 4,000 is not a coincidence, and it is only visible if the token counts are recorded
    per record and then actually looked at.
  affected_sources: []
  defence: >
    Truncation announces itself. The harvester now checks `stop_reason` and raises an error naming
    the ceiling and the passage, so the limit is reported where it happens rather than inferred
    from a parse failure downstream. The ceiling is 12,000.
    The general rule is that a shared limit is not a shared condition. Any parameter held constant
    across the arms of a comparison can still BIND on one arm and not the other, at which point the
    comparison measures the parameter. Verbosity differs by model, context length by encoder,
    rate limits by tier -- each is a constant that is not a control.
    One thing that did NOT need fixing is worth recording, because it looks like the same species
    and is not. `max_tokens` is absent from the harvest cache key, which resembles {{trp-59}}, where
    an embedding cache omitted `max_length` and silently served vectors built at the wrong context.
    There the parameter changed the output for every input; here the ceiling can only truncate, and
    a truncated response raises before the cache write, so nothing truncated is ever stored. Every
    cached record is untruncated and therefore identical under a higher ceiling. Adding the
    parameter to the key would have re-billed one hundred harvests to fix nothing.

- id: trp-65
  one_breath: A panel advertised reach to 2007 by estimating market betas from twelve monthly returns.
  symptom: >
    The conferred-tilt block of the state vector carried a spread of +2.05 at March 2009,
    when the momentum sort's defining property in that month is a strongly NEGATIVE
    conferred beta spread -- winners defensive, losers the high-beta financials that ripped.
    Neighbouring months read +2.63, -4.41 and -7.29, flipping sign monthly. The valuation
    column of the same panel reached an HML loading of 18.4, which is not a loading.
  why_it_parsed: >
    `conferred_monthly.parquet` was built to reach back to 2007-10, where the daily panel
    starts 2013. The iShares holdings panel is MONTHLY before mid-2013 and daily after, so
    the pre-2013 rows regress a leg's returns on the factors using twelve to thirteen
    monthly observations. That produces well-formed floats in every column, a complete
    index, and no warning. The project had already written the gate that catches it --
    `features.conferred.MIN_DATES_PER_YEAR = 120`, with the docstring "a loading cannot be
    estimated from twelve points, so dates are what the gate counts" -- and the monthly
    builder simply never applied it. Below the threshold beta_spread carries sd 3.664 and a
    range of [-7.41, +10.45]; above it, sd 0.340 and [-0.74, +1.48]. A tenfold difference in
    dispersion between two halves of one column, presented as one series.
  defence: >
    Carry the estimation sample size as a COLUMN beside every estimate, not as a property of
    the builder, and gate on it at the point of consumption. `n_obs` was already in the file;
    nothing read it. The general rule: when a panel's underlying source changes frequency
    part-way through its span, the frequency change is a coverage boundary and must be
    materialised as a mask, because the reach it appears to buy is the thing that is wrong.
  found_on: 2026-08-30
  affected_sources: [src-iwv]

- id: trp-66
  one_breath: A gate required a monthly panel to separate an episode that lasted four days.
  symptom: >
    The Stage 3 regime gate required the jump model to assign September 2019 and August 2007
    to different states. It assigned both to the calm state and failed. So did the incumbent
    two-channel indicator, which separates those two episodes by construction and is the
    reason the gate was written that way.
  why_it_parsed: >
    The joint channel reads -3.03 on 9 August 2007, the 2.5th percentile of a century of
    daily history. The state vector samples month-ends, and by 31 August the same series
    reads +0.93, the 86th percentile. The quant quake round-tripped by 10 August -- the
    project's own episode registry says so in the entry's note -- so the month-end
    observation is taken twenty-one days after the event, on the opposite side of zero. The
    criterion was inherited from daily-frequency work and carried onto a monthly panel
    without anyone asking whether the episode survives the resampling.
  defence: >
    Before a gate names an episode, check that the episode is VISIBLE at the frequency the
    gate will run at. One line -- compare the event-window extreme against the sampled value
    on the same series -- and it distinguishes a model that failed from a criterion that
    could not have been met. The general form: resampling is a filter, and an event shorter
    than the sampling interval is removed by it rather than attenuated.
  found_on: 2026-08-30
  affected_sources: [src-french]

- id: trp-67
  one_breath: A fingerprint statistic recognised the calendar and it looked like recognising the environment.
  symptom: >
    The 8-K item-type fingerprint identified which of 60 months a held-out half of the filings
    came from at 24.9 percent top-1 against a chance rate of 1.7 percent, a fifteenfold lift,
    clearing a permutation null at p95 = 0.050. It would have been the project's first strong
    text result.
  why_it_parsed: >
    The permutation null was correct and passing it meant less than it appeared. The two item
    codes carrying most of the cross-month variance are 2.02, results of operations, and 5.07,
    shareholder vote -- earnings season and proxy season. The statistic was recognising
    January because January is earnings season. Removing each calendar month's own mean across
    years cut top-1 from 0.249 to 0.072 and the median rank from 4.1 to 15.8, so roughly
    seventy percent of the apparent signal was the calendar. The tell that names the mechanism:
    of 44 errors, 21 picked the SAME CALENDAR MONTH IN A DIFFERENT YEAR, 47.7 percent against
    6.8 percent by chance.
  defence: >
    Any recognition, fingerprint or identification statistic must face a CALENDAR-STRUCTURE
    null in addition to a permutation null. Seasonality is a date-recogniser, so in every task
    whose target is "which period is this", it is signal-shaped and passes the permutation test
    honestly. Two cheap checks: recompute after subtracting each calendar month's mean, and
    tabulate whether errors concentrate on the same calendar month in other years. The second
    is diagnostic rather than merely corrective -- it names the confound instead of only
    removing it, and a later placebo showed it is also the more trustworthy of the two.
    SECOND-ORDER FINDING, and it changes how the first control may be quoted: subtracting a
    group mean over five observations removes shared structure whether or not the grouping
    means anything. Applying the identical subtraction to twelve RANDOM groups of five moves
    recognition UP rather than down -- 0.314 against a raw 0.249 on the item arm, 0.368
    against 0.283 on the narrative arm. So the drop under de-seasonalisation is NOT a
    decomposition and must never be quoted as "seventy percent of the signal was the
    calendar". It is a conservative FLOOR. The error-confusion tabulation subtracts nothing
    and is what speaks to mechanism: on those terms the two arms differ sharply, with item
    errors landing on the same calendar month seven times above chance and narrative errors
    barely above it, which says the item MIX repeats every year while the narrative CONTENT
    of each season does not.
  found_on: 2026-08-30
  affected_sources: [src-edgar-8k]

- id: trp-68
  one_breath: A permutation null was algebraically the identity and returned the observed statistic on every draw.
  symptom: >
    The null for month recognition reported a 95th percentile exactly equal to the observed
    statistic, 0.249 against 0.249, on 1,000 draws. Any pass or fail decided by it would have
    been meaningless in either direction.
  why_it_parsed: >
    The code permuted the COLUMNS of the similarity matrix and then looked the true month up
    through the same permutation. Composing a permutation with its own inverse index lookup is
    the identity, so the statistic was recomputed unchanged 1,000 times. It runs without error,
    consumes the right amount of time, produces a distribution-shaped array, and the only
    visible symptom is a suspiciously round agreement that a reader can rationalise. The
    correct operation was to shuffle the second-half VECTORS, breaking the correspondence
    rather than relabelling the axis.
  defence: >
    Before a null bears a gate, assert two things about it. First, that its distribution has
    positive variance -- a null that cannot vary cannot adjudicate. Second, and this is the
    load-bearing one, that it is CALIBRATED: where an analytic chance rate exists, the null
    must centre on it. Equality of the null's p95 and the observed value is the wrong check,
    because a discrete statistic ties its own null by coincidence often enough to make that
    test brittle; the identity bug is caught decisively by the null centring on the
    observation instead of on chance. Two lines, and this species becomes unshippable.
  found_on: 2026-08-30
  affected_sources: []

- id: trp-69
  one_breath: A control was quoted as a decomposition without anyone checking what it does when it corrects nothing.
  symptom: >
    Removing each calendar month's mean across years cut the item arm's month-recognition
    from 0.249 top-1 to 0.072 and the narrative arm's from 0.283 to 0.100. That was reported,
    twice and in a commit message, as "roughly seventy percent of the apparent signal is the
    calendar". The number is real and the sentence is wrong.
  why_it_parsed: >
    The control is correct as a control. What was invalid was reading its EFFECT as a share.
    Subtracting a group mean over five observations removes structure shared inside the
    group whether or not the grouping means anything, and it also declines to remove
    structure the grouping happens to cut across. Applying the identical subtraction to
    twelve RANDOM groups of five moved recognition UP, to 0.314 and 0.368 against raw 0.249
    and 0.283. So the operation's own effect is not zero and is not even the same sign as the
    quantity it was being used to measure. Nothing in the output looks wrong: the adjusted
    number is smaller, the direction matches the hypothesis, and the arithmetic is right.
  defence: >
    Any adjustment whose effect will be READ AS "the share explained by X" must first be run
    on meaningless groupings of the same shape, and must be shown to do nothing there. A
    control that moves the statistic under a random regrouping cannot have its own movement
    attributed to the thing it corrects for. Controls need their own placebos, exactly as
    estimators need their own nulls.
    The corollary is worth as much: prefer a diagnostic that SUBTRACTS NOTHING when one
    exists. Tabulating where the errors land -- same calendar month in another year, 47.7
    percent for the item mix against 6.8 by chance, 9.3 percent for the narrative content --
    needed no adjustment, survived this whole problem, and is the evidence that actually
    distinguishes the two arms.
  found_on: 2026-08-30
  affected_sources: [src-edgar-8k]

- id: trp-70
  one_breath: A truncation guard sat downstream of the parse that raises, so it never ran for the case it existed to catch.
  symptom: >
    The narrative-comparison batch died after six records with "ValidationError ... Invalid
    JSON: EOF while parsing a string at line 1 column 4258". The guard written specifically to
    turn that failure into a clear message about the token ceiling was in the same function,
    eight lines below, and did not fire.
  why_it_parsed: >
    The guard tested the response's `stop_reason` AFTER `messages.parse` returned. The
    structured-output helper validates the model's JSON before returning, so a response cut
    off at `max_tokens` raises inside the SDK and the guard is never reached. The code reads
    correctly -- call, check for truncation, proceed -- and is unreachable on exactly the path
    it was written for. This repo had already recorded the parent species: a 4,000-token
    ceiling whose failures surfaced as `EOF while parsing` and read as a 37 percent model
    failure rate until the token counts were inspected. The lesson was banked as "raise the
    ceiling"; the new instance is that the WARNING ABOUT THE CEILING was itself placed where
    it could not run.
  defence: >
    A guard must sit where the failure actually surfaces, not where the author pictures the
    failure occurring. When a library validates before returning, the only reachable place for
    a truncation check is inside an exception handler around the call. The general test, worth
    applying to any defensive branch: construct the condition the guard exists for and confirm
    the guard is what reports it. A guard that has never been seen to fire is a guard whose
    reachability is an assumption.
  found_on: 2026-08-30
  affected_sources: []

- id: trp-71
  one_breath: An ablation drew all ten test cases from one year, so a constant answer would have scored perfectly.
  symptom: >
    Two hypotheses about what leaked the period from masked filings were tested by ablation
    and both appeared refuted: masking every monetary figure left recovery at 10 of 10, and
    stripping exhibit filenames left it at 10 of 10. Reported as "two hypotheses refuted by
    ablation".
  why_it_parsed: >
    The ten blocks were taken as `months[:10]` from a sorted list, which is 2018-01 through
    2018-10 -- every one of them in the same year. The statistic was recovery within plus or
    minus three months, so an attacker answering "mid-2018" every time scores 10 of 10 on no
    information at all. The ablation could not have registered a REDUCTION, because the
    unablated condition was already at a ceiling that required nothing. Both numbers were
    real, identical and meaningless. Repeating the ablation on ten months evenly spaced
    across the 59-month corpus gave 9 of 10 in both conditions, which refutes the same two
    hypotheses for the first time.
  defence: >
    An ablation is a comparison, so the sampling has to leave room for the comparison to
    move. State the null answer explicitly before running one -- here, "what would a constant
    guess score on these cases?" -- and if the answer is "the same as the observed result",
    the design is measuring nothing. The general rule: when test cases are drawn by position
    from an ordered list rather than spread across it, check whether the ordering is
    correlated with the thing being measured. It usually is; that is why the list was ordered.
    What surfaced this was the validator refusing a `refuted` verdict without a power
    statement. Writing the power statement forces the question the ablation had skipped.
  found_on: 2026-08-30
  affected_sources: [src-edgar-8k]

- id: trp-72
  one_breath: An attribution was printed under a label that inverted its meaning, on every page of the replay.
  symptom: >
    Each retrieved analogue printed "matched on: mechanism 52%, dispersion 46%, volregime 2%".
    A faithfulness test then found that removing the block the page NAMED cost the analogue
    LESS rank than removing a block it did not name -- median 4 against 6, paired difference
    -3.47. The explanation was anti-correlated with the thing it claimed to explain.
  why_it_parsed: >
    The number was the share of squared distance each block contributed. That is a real
    quantity, correctly computed, and it answers "where does the remaining DISSIMILARITY come
    from". The page labelled it "matched on", which asserts the opposite. Both readings
    produce a plausible-looking percentage breakdown summing to 100, so nothing about the
    output distinguishes them, and the label had been carried unexamined from the output
    contract into 372 replay pages.
    The first diagnosis of it was also wrong and is recorded because the correction matters:
    the obvious explanation is that a high share means large raw differences, and the data
    refuted that -- the highest-share block had the SMALLEST mean absolute z difference, 0.12
    against 0.49. The real mechanism is the unit normalisation the cosine metric requires,
    which rescales both vectors before differencing, so the per-block share describes where
    two months' normalised PROFILES still differ, not where their levels do.
  defence: >
    A quantity and its label are separate artefacts and both need checking. The mechanical
    test is the one that caught this: ablate what the explanation names and confirm the
    outcome degrades MORE than ablating something it does not name. An explanation that
    survives its own removal is decoration; one that improves on removal is inverted.
    Where an explanation is meant to answer "why are these alike", it must be computed against
    a reference for what alike means -- here, per-block distance as a multiple of the median
    for two arbitrary months. That version passes the same test at +5.17 [+1.67, +8.87].
  found_on: 2026-08-31
  affected_sources: []

- id: trp-73
  one_breath: Adding any fourth block improved the retrieval statistic, so "adding X helps" was never a claim about X.
  symptom: >
    Appending a century-deep newspaper-narrative block to a three-block retrieval key raised
    the forward-dispersion statistic from 0.594 to 0.634 on 547 queries and closed part of the
    gap to every reader baseline, with consistent deltas of +0.0013 to +0.0025. The registered
    pass condition was met.
  why_it_parsed: >
    The key is unit-normalised before distances are taken, so appending a block re-weights the
    other three and renormalises every vector. That operation changes the retrieval geometry
    whether or not the new block carries information. Replacing the two text columns with
    NOISE of matched marginals -- same dimensionality, same weights, same normalisation, only
    the temporal information destroyed -- moves the statistic from 0.594 to 0.616 on its own,
    and 13.3 percent of noise draws reach or exceed the real block's 0.634. The paired
    per-query difference between the two arms is +0.0017 with an interval of [-0.0005,
    +0.0040], and the augmented arm is tighter on 52 percent of queries, which is a coin flip.
    Nothing in the gate output showed this. The arms were compared to the BASELINES and never
    to each other with an interval, and the augmentation had no placebo of its own.
  defence: >
    An augmentation needs its own placebo, exactly as a correction does. Before reporting that
    adding a feature block helped, add a NOISE block of the same shape and weights and show
    the gain does not survive it. And put an interval on the arm-versus-arm difference, not
    only on each arm against the shared baseline: two arms can each shift against a common
    reference while being indistinguishable from one another.
    The general form, which this project has now met twice from opposite directions: a control
    and an augmentation are the same kind of intervention, and both need to be run in a
    condition where they should do nothing.
  found_on: 2026-08-31
  affected_sources: [src-epu]

- id: trp-74
  one_breath: Hand-typed percentiles in the episode registry cannot be reproduced from the committed panels.
  symptom: >
    The episode registry annotates the November 2020 vaccine reversal with "tilt rate beta was
    at the 5th pctile (bond-proxy-like) going in" and the March 2021 rotation with "tilt rate
    beta at the 4.7th pctile". Recomputing from conferred_tilt.csv, the conferred 10-year rate
    beta SPREAD sits at the 83.6th and 79.1st percentiles at the preceding month-ends -- the
    opposite end of the distribution. The loser leg's rate beta is at 5.2 percent for
    2020-10-31, which is probably what the first note meant, and nothing reproduces the 4.7
    figure for 2021-02.
  why_it_parsed: >
    These are `note` fields on a hand-curated registry, not gated claims, so no validator
    checks them and no reproduce command exists. They read exactly like measurements: a
    quantity, a percentile, a direction, an interpretation. They were about to be quoted in a
    submission memo as evidence for the system's most PM-relevant story -- that the momentum
    sort builds a duration bet -- and the number would have been wrong or unattributable while
    sounding precise.
  defence: >
    A number in prose is a claim and needs the same provenance as a number in a table. Either
    it carries a reproduce command and a panel reference, or it is written as a qualitative
    statement without a figure. Concretely, for any memo or report: quote only numbers that
    come from a gated claim or an experiment result field, never from a hand-written note,
    and re-derive every quoted figure from the committed artifact before it ships.
    The general rule this instance teaches: prose fields are the part of a record that no
    tooling checks, so they are where stale numbers survive longest. Audit them the way code
    audits its inputs, at the point of use.
  found_on: 2026-08-31
  affected_sources: [src-iwv]

- id: trp-75
  found_on: 2026-08-31
  one_breath: A gated experiment record carried a count its own committed artifact does not reproduce.
  affected_sources: []
  symptom: >
    Two faults on the same replay, found together. The page-composition experiment's result
    field records the manufactured-bet could-not-measure entry as firing on 345 of 372 pages.
    Re-running the replay script, which is deterministic and reproduces the rest of the
    artifact byte-identically, gives 337 of 372. Nothing in the repo produces 345. Separately,
    the artifact's summary key `pages_carrying_a_rendered_narrative` was computed from the
    restricted-block count -- retrieval deliberately confined to the corpus era, which fires
    on 5 of the 19 text-era pages -- while the quantity that name plainly denotes, whether a
    page's own analogues carry a narrative, is 0 of 372 and sits three lines above under a
    different name.
  why_it_parsed: >
    Both survived because they are internally plausible and sit beside correct numbers. The
    345 is the right order of magnitude and the right shape for its comparison sentence. The
    mislabelled key was truthful in the console line that prints it, where a "5 of 19"
    denominator supplies the missing context; the name misleads only when read alone, which
    is exactly how a number gets lifted into prose. Both were quoted into a draft memo, the 5
    in place of the 0, in the direction that flattered the system: it converted the project's
    central negative finding -- that the text layer appears on no page of the replay -- into a
    modest positive.
  defence: >
    Recompute rather than choose. When a registry and its artifact disagree, neither is
    authoritative until the generator is re-run; here the artifact was right and the gated
    experiment record was wrong. That inverts the usual presumption, so the earlier rule that
    prose may quote a gated claim or an experiment result field is not sufficient on its own:
    a number bound for a memo needs its generator re-run, not merely a citation. A summary key
    must be named for the quantity it computes, not the quantity it sits near; where two
    counts differ only by a restriction, both names must carry that restriction explicitly.


- id: trp-76
  found_on: 2026-08-31
  one_breath: A claim's reproduce command names a module with no command-line interface, so it silently does nothing.
  affected_sources: []
  symptom: >
    The strong classical baseline claim carries the reproduce command
    `python -m unstructured_momentum.model.baselines --garch`. That module defines functions
    and no entry point, so running it imports, defines, and exits 0 with no output and no
    error. The claim's numbers -- a 0.052 breach rate, coverage p 0.850, independence p 0.279
    on 325 forecasts -- cannot be regenerated by the command on file. A paired comparison
    written afterwards, on a grid where both models forecast, puts the same baseline at a
    0.0851 breach rate failing coverage at p 5.9e-07 in every era. The two do not reconcile.
  why_it_parsed: >
    Exit code 0 and no output reads as success to anything that checks a return code, and the
    command is well formed, names a real module and a plausible flag. The claim was cited into
    a draft memo as the conventional bar the whole system had to beat, which made it the most
    load-bearing unreproducible number in the document: it was doing the work of proving the
    project honest about conventional methods winning.
  defence: >
    A reproduce command must be executed, not merely written, and a run that produces no output
    is a failure rather than a pass. Checking a return code is not checking a result. Any claim
    whose command emits nothing should be treated as unsupported until the command is repaired
    and the numbers regenerated, and where a later reproducible run contradicts an earlier
    unreproducible one, the contradiction is reported rather than silently resolved in favour
    of either.

- id: trp-77
  found_on: 2026-08-31
  one_breath: The event tripwire's placebo calibration used windows dated years after the date it was armed on.
  affected_sources: []
  symptom: >
    The 8-K tripwire is armed at a historical as-of date and calibrated against 200 placebo
    baskets before arming, targeting a clearance of roughly one in four. For the cohort armed
    at 2020-10-31 the calibration windows run from 2018-03 to 2024-04 and include 2021-02,
    2021-07, 2022-03, 2023-10, 2024-01 and 2024-04. The clearance figure that decided whether
    to accept the declared item set and horizon, and whether to run a revision round, was
    therefore computed partly from filings that did not exist on the arming date. Two recipe
    versions were run on that cohort, moving clearance from 0.16 to 0.19 as the item set was
    narrowed and the horizon lengthened from 45 to 60 days, and the shipped version is the
    looser of the two.
  why_it_parsed: >
    Every other part of this component is scrupulous about the as-of date: the members, the
    filings scanned, the horizon and the quote gate are all bounded by it, and the arming
    record carries the as-of in its first field. The calibration is a different kind of
    quantity -- a property of the RULE rather than of the date -- so it did not look like a
    thing that needed a cutoff, and the phrase used to describe it, "calibrated before arming",
    is true and conceals the issue: before arming is not before the as-of. It was cited as the
    demonstration that a model can be given a narrow job under measured controls, which made it
    the one place a leak would do most damage to the argument it supported.
  defence: >
    Anything that informs a decision recorded against an as-of date is itself point-in-time,
    including the calibration of the rule and the choice of how many revision rounds to run.
    The fix is to restrict placebo windows to those closing on or before the as-of, recompute
    clearance, and report how many recipe versions were tried on each cohort rather than
    describing a revision as singular. Until that is done the tripwire is a demonstration of
    the architecture and not a point-in-time result, and must be described as one.

- id: trp-78
  found_on: 2026-08-31
  one_breath: Most registered reproduce commands name modules with no entry point and so verify nothing.
  affected_sources: []
  symptom: >
    An earlier trap recorded a single claim whose reproduce command imported a module,
    printed nothing and exited 0. A static audit of every registered command shows that this
    was not one case but the majority: of 104 commands across claims and experiments, 61 named
