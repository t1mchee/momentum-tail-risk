- id: trp-87
  found_on: 2026-09-03
  one_breath: "A market series divided by a hundred twice made a conditional model equal its own baseline."
  affected_sources: [src-french]
  symptom: >
    The French loader already converts percentages to decimals, so a caller that divides the
    market series by a hundred again scales it by a further hundred. Two callers did: the sealed
    holdout script and the severity command line. A linear quantile fit is equivariant to
    rescaling a regressor, so the fitted values are untouched and the bug is invisible in every
    output that depends only on them. The bear-state indicator is not: it is a sign test on a
    compounded trailing return, and it flips on 3.1 percent of days between the two scalings.
    The consequence lands on a headline. On the sealed holdout at the registered forecast step
    the conditional model breached 2 of 42 at a rate of 4.76 percent with an unconditional
    coverage p of 0.943 -- numbers identical, to four decimal places and in both interval bounds,
    to the UNCONDITIONAL baseline computed on the same dates. Under the corrected scaling the
    conditional model breaches 1 of 42 at 2.38 percent with p 0.388, and the baseline still
    breaches 2. The registered verdict is unchanged and the holdout still passes, because the
    interval contains 0.05 either way. What changes is that the model is now distinguishable from
    the baseline it is supposed to beat, where under the bug it was numerically identical to it.
  why_it_parsed: >
    Every consequence of the bug was either invisible or flattering. Scale-equivariance hid it
    from the fitted values, which is most of what anyone inspects; the bear flag it did corrupt is
    a binary column nobody reads directly; and the corrupted result was CLOSER to the nominal
    rate than the correct one, so the pass looked stronger rather than weaker. The one signal that
    something was wrong -- a conditional model reproducing its own baseline to four decimal places
    -- is the kind of coincidence that reads as reassuring agreement rather than as a defect,
    and it sat in a committed artifact through a full write-up.
  defence: >
    A loader that has already converted units should say so in a way a caller cannot miss, and
    the conversion should happen once, at the boundary, rather than being reapplied on trust.
    Beyond that: when a conditioned model and its unconditional baseline agree to four decimal
    places on the same sample, that is a finding to chase and not a result to report. The
    comparison is cheap, it is the whole point of printing a baseline, and nothing in the process
    forced anyone to look at the two numbers side by side until a separate check made it
    unavoidable.

- id: trp-88
