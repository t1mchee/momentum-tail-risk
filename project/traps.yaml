- id: trp-54
  one_breath: >
    A collapsed clusterer reports as a clean null, because a partition of one group is
    invariant under every relabelling its own null can perform.
  found_on: 2026-08-25
  symptom: >
    Two text arms of the comparator returned a lift of 2.8e-17 at p = 1.000, on different
    representations, with identical observed values to six figures. That reads as a decisive
    null: the representation carries nothing the returns did not already have. It was a broken
    clusterer. A helper that had been widened to CENTRE vectors on the cross-section -- correct
    for representations -- was still being called to normalise single centroid rows, and
    centring one row by its own mean returns the zero vector. Every centroid became zero, every
    similarity became zero, argmax sent all 132 names to group 0. A one-group partition cannot
    be changed by a permutation that relabels within cells, so the null distribution collapsed
    onto the observation and the p-value was exactly 1.
    The general shape is worse than this instance. A permutation test compares an observation
    to relabellings of itself, so any degeneracy that makes the observation invariant under
    relabelling produces a perfect, confident, meaningless null -- and it produces it silently,
    with a small p-value's opposite rather than with an error.
  why_it_parsed: >
    A p-value of exactly 1.000 and a lift at machine epsilon are valid outputs of a
    correctly implemented permutation test. Nothing in the arithmetic is wrong: the statistic
    was computed, the null was drawn, the comparison was made. The degeneracy sits one level
    below, in a partition that the null cannot perturb, and it surfaces as the strongest
    possible evidence for the null rather than as an error.
  affected_sources: []
  defence: >
    Two changes, one specific and one general. Centring and normalisation are now separate
    functions with the reason written between them, because their arguments are different
    shapes and only one of them may be centred. And the clusterer refuses to return a partition
    whose largest group holds more than four fifths of the sample, so a collapse raises where it
    previously reported.
    The general defence is to distrust a null whose p-value is EXACTLY one or whose lift is at
    machine epsilon. Those are not weak evidence of no effect; they are the signature of a
    statistic that could not have moved.

- id: trp-55
  one_breath: >
    A floor is only a floor on its own scale, and this one was compared against a statistic it
    had never been measured with.
  found_on: 2026-08-25
  symptom: >
    The comparator's network arm uses peer cohesion, since a peer set is not a partition and
    cannot share the partition arms' statistic. The sector floor was computed once, as a sector
    PARTITION, and every arm was tested against it. The network arm was therefore recorded as
    clearing a floor built from a different statistic on a different scale -- and it cleared it
    comfortably, at p = 0.0066, which is exactly the kind of number that gets believed.
  why_it_parsed: >
    Both quantities are correlations, both live in roughly the same numeric range, and
    both are called `lift` in the same table. Nothing about a lift of 0.017 against a floor of
    0.003 looks wrong until you ask which statistic produced each, and the table did not say.
  affected_sources: []
  defence: >
    A floor must be the same KIND of object as the arm it bounds. There are now two floors, one
    per statistic in use: a sector partition scored with the partition statistic, and a sector
    NETWORK -- every firm's peers are its sector-mates -- scored with peer cohesion. The
    network threshold is calibrated to sector density, so both networks carry the same edge
    count and the contrast is which pairs are joined rather than how many.

