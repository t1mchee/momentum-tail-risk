    reproduced to three decimals on demand. Between the two writes a characteristic-cell
    construction was repaired so that no cell could span a sector boundary, and the certificate
    was correctly re-issued afterwards. What was not re-issued was the SENTENCE. The experiment's
    power statement had been written from the earlier console output and still quoted the
    false-alarm rates measured under the broken null.
