- id: trp-79
  found_on: 2026-09-02
  one_breath: A parser skipped a third of an archive on encoding errors, and a link filter removed the crash months.
  affected_sources: [src-ftd]
  symptom: >
    Two independent faults in one acquisition, both of which produce silence rather than an
    error. The parser caught decode failures and printed a skip line per file, which looked
    harmless because only the last few were visible on screen; it had in fact dropped about two
    thirds of the archive, 6.7 million rows against the 18.2 million actually present, and
    1,145 settlement dates against 3,305. Separately, the SEC index serves these files under
    four path prefixes, one of which reads like a content-management artefact rather than a
    data path. That prefix was filtered out of the download list as junk. It is the real
    location of six half-month files covering February, March and April 2020, so the archive
    was missing exactly the COVID crash, which contains a registered episode.
  why_it_parsed: >
    Both faults present as an absence. A dropped half-month does not raise, does not appear as
    a null, and downstream reads as a period with no settlement stress -- that is, as a calm
    market. The coverage check that caught the second fault only worked because it compared
    against a continuous month range rather than against the file list, which was itself
    wrong. Checking the downloaded files against the download list would have passed, since the
    list was the thing that was incomplete.
  defence: >
    A parser must raise on a file it cannot read rather than continue, because a missing period
    and a quiet period are indistinguishable once the data is in memory; decode is now attempted
    across several codecs and only an unreadable file stops the build. A link filter must never
    drop a candidate on the grounds that its path looks wrong -- if a prefix appears in the
    index it is a location, and the only safe test is whether the fetched bytes are the expected
    format. Coverage is verified against a continuous calendar built from the data's own span,
    never against the list used to fetch it.

