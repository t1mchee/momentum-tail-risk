    statistic under BOTH constructions and see which one each number matches. It distinguishes
    nondeterminism from a parameter change without a triple run, and here it matched all three
    statistics under both constructions exactly.
    THE STRUCTURAL FIX WAS MADE ON 2026-08-26, after a ruling. A certificate now fingerprints
    its null construction the way it already fingerprints its universe -- the cell assignment
