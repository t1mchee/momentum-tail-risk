  why_it_parsed: >
    Running a module that defines only functions succeeds. There is no error, no output and a
    zero exit code, so any check based on return codes passes, and a reader who does not
    execute the command sees a well-formed invocation naming a real module and a plausible
    flag. The earlier trap treated its single instance as an isolated defect and its defence
    told prose to cite a reproduce command; that defence quietly assumed the commands ran. The
