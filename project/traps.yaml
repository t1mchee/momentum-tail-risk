# Things that returned a success code, parsed without error, looked plausible, and were wrong.
# Every entry here cost real time. The defence column is the reusable part.

- id: trp-01
  one_breath: A data endpoint served a web page while claiming it was a spreadsheet.
  symptom: >
    The holdings download returned 1.4 megabytes of web page markup under a header
    declaring it comma-separated data, with a success code.
  why_it_parsed: >
    The reader was trusting the declared content type. Markup parsed into a single
    enormous column without complaint.
  defence: >
    Validate the body, never the headers. Assert that the first line looks like the
    columns expected and that the row count is plausible.
  found_on: 2026-08-12
  affected_sources: [src-iwv]

- id: trp-02
  one_breath: Non-trading days returned a tiny placeholder file instead of an error.
  symptom: >
    Requesting holdings for a weekend or holiday returned a 303-byte file containing a
    single dash, with a success code.
  why_it_parsed: >
    It is valid comma-separated data. It simply describes nothing, and appended silently
    as an empty day.
  defence: >
    Raise a specific not-a-trading-date error on undersized bodies rather than letting a
    zero-row day enter the panel.
  found_on: 2026-08-12
  affected_sources: [src-iwv]

- id: trp-03
  one_breath: A field's own vocabulary changed across eras, so filtering on it emptied a year.
  symptom: >
    The asset-class field reads Equity in 2013, Other in 2016, and Equity again in 2019
    for the same kind of holding.
  why_it_parsed: >
    Keeping only rows labelled Equity is the obvious filter and is correct in two of the
    three eras. The middle era silently emptied.
  defence: >
    Never keep by label. Exclude the things that are definitely not wanted and let
    everything else through, because label vocabularies drift and exclusion fails safe.
  found_on: 2026-08-13
  affected_sources: [src-iwv]

- id: trp-04
  one_breath: A field was blank for every row in the earliest files, and the filter deleted them all.
  symptom: >
    The sector field is a single dash for all 2,956 holdings in the 2006 files. Excluding
    dashes dropped the entire year.
  why_it_parsed: >
    Excluding a placeholder value is normally right. Here the placeholder was universal,
    so the filter was total.
  defence: >
    After every filter, compare the surviving row count against the input count and fail
    when a filter removes essentially everything.
  found_on: 2026-08-13
  affected_sources: [src-iwv]

- id: trp-05
  one_breath: A reverse stock split read as a 1,900 percent gain and put a failing company among the winners.
  symptom: >
    A one-for-twenty reverse split made a pharmacy chain's raw price ratio look like a
    nineteen-fold return, promoting it into the top-performing group.
  why_it_parsed: >
    Price on day two divided by price on day one is arithmetically fine. The share count
    changed underneath it.
  defence: >
    Compound the return series the data provider already adjusts, never a raw price ratio,
    and cap plausible single-day moves as a tripwire.
  found_on: 2026-08-14
  affected_sources: [src-iwv]

- id: trp-06
  one_breath: A placeholder row was ranked as if it were a company.
  symptom: >
    A row whose ticker was a single dash was sorted alongside real stocks and landed in
    the worst-performing group.
  why_it_parsed: It is a valid row with a valid, if meaningless, identifier.
  defence: Require tickers to match the shape of a real ticker before a row can be ranked.
  found_on: 2026-08-14
  affected_sources: [src-iwv]

- id: trp-07
  one_breath: A published series was abandoned upstream years ago but still downloads cleanly.
  symptom: >
    The equity put-and-call ratio file stops being updated on 2019-10-04, yet the download
    succeeds and parses every time.
  why_it_parsed: >
    A stale file is a valid file. Nothing in the response says the series is dead, and a
    flat tail reads as calm markets.
  defence: >
    Assert that the last date in any downloaded series is close to today, and keep an
    explicit list of series known to have been discontinued.
  found_on: 2026-08-15
  affected_sources: [src-cboe-index]

- id: trp-08
  one_breath: A daily file dated today also contains yesterday's entries, injecting hidden lookahead.
  symptom: >
    The short-sale restriction file for a given day contains triggers from both the
    previous day and that day.
  why_it_parsed: >
    Joining the file to its own filename date is the natural thing to do and is wrong for
    half the rows, precisely on the days that matter.
  defence: >
    Use the timestamp inside each row rather than the date on the container, and test the
    join on a day where the two disagree.
  found_on: 2026-08-16
  affected_sources: [src-finra]

- id: trp-09
  one_breath: Two backfills running at once corrupted a stored panel through interleaved writes.
  symptom: >
    Two processes read the same panel, each appended its own days, and each wrote back,
    so the second silently erased the first.
  why_it_parsed: >
    The resulting file was structurally valid and had a plausible row count. Only a date
    audit revealed the missing block.
  defence: >
    Lock before appending, write to a temporary file and rename, and keep raw responses so
    any derived panel can be rebuilt from scratch. That last habit is what made this
    recoverable.
  found_on: 2026-08-16
  affected_sources: [src-iwv]

- id: trp-10
  one_breath: A news search returned its error message as plain text under a success code.
  symptom: >
    An unparenthesised either-or query returned a human-readable complaint about syntax,
    served with a success code where results were expected.
  why_it_parsed: >
    The reader treated any successful response as results, and an error sentence became
    zero matches rather than a failure.
  defence: >
    Parse the body and confirm it has the shape of a result set before treating an
    absence of matches as evidence of absence.
  found_on: 2026-08-17
  affected_sources: [src-gdelt]

- id: trp-11
  one_breath: I asserted twice that volatility was low without checking, and it was high.
  symptom: >
    The severity model was calm before the September 2019 reversal and I attributed that
    to quiet markets. Trailing volatility was in fact at the 75th percentile.
  why_it_parsed: >
    Quiet markets is the intuitive story for a calm model and nobody challenged it. The
    real cause was a separate term detecting the absence of a bear market.
  defence: >
    Decompose the model into its parts and read each one before explaining what the model
    did. An explanation of a number is itself a claim requiring evidence.
  found_on: 2026-08-18
  affected_sources: []

- id: trp-12
  one_breath: I repeated a survey's claim that free option history does not exist, without probing.
  symptom: >
    I stated no free historical implied volatility was available. Free correlation indices
    run from 2006 and single-name volatility indices from 2011.
  why_it_parsed: >
    It came from a plausible market-data survey and matched the general reputation of
    options data as expensive.
  defence: >
    Probe the endpoint before repeating a claim about what data exists. It took one
    command to disprove.
  found_on: 2026-08-19
  affected_sources: [src-cboe-index]

- id: trp-13
  one_breath: >
    One missing option chain aborted an entire day of capture that can never be recovered,
    because a retry wrapper hid the error from its handler.
  symptom: >
    A company with no listed options returned a not-found response, which the retry
    library wrapped in its own error type, escaping the handler and killing the whole run.
  why_it_parsed: >
    The handler caught network errors, and a wrapped not-found is technically a different
    exception class. One absent ticker cost a full day.
  defence: >
    Isolate every item in any batch job whose output cannot be regenerated. One element
    must never be able to fail the batch. Concretely: never retry a not-found, catch
    broadly per item rather than per batch, and record which items failed instead of
    aborting. This is the most transferable entry in this log, because the shape recurs
    wherever a retry wrapper re-raises through a handler that was written for the
    underlying exception rather than the wrapper's own.
  found_on: 2026-08-21
  affected_sources: [src-cboe-chains]

- id: trp-14
  one_breath: Requesting too fast got the whole session blocked, including the requests that mattered.
  symptom: >
    Fetching 128 option chains a fifth of a second apart tripped the provider's bot
    defence, after which every subsequent request failed regardless of target.
  why_it_parsed: >
    The block arrives as an ordinary page with an error code inside it, so requests appear
    to succeed while returning nothing usable.
  defence: >
    Throttle to a pace the provider tolerates and back off on refusal. Three minutes for a
    complete daily capture is a good trade against a permanent hole in the record.
  found_on: 2026-08-21
  affected_sources: [src-cboe-chains]

- id: trp-15
  one_breath: >
    A capture ran perfectly and collected the wrong half of the portfolio, surfacing only
    when the test needing it was designed.
  symptom: >
    The first option capture walked only the winning side of the book. It succeeded, stored
    valid data, and made the one test that needs no history impossible to run.
  why_it_parsed: >
    Nothing was malformed. The universe was built from a single leg because that is what
    the first caller happened to pass, and a capture cannot tell that it is collecting the
    wrong thing. Forward-only capture means the day cannot be re-collected.
  defence: >
    For any irreversible capture, assert the shape of the universe before the run rather
    than the shape of the response after it: expected count, expected composition, and a
    stored manifest of what was asked for. A capture that silently collects the wrong
    population is worse than one that fails, because it looks like progress.
  found_on: 2026-08-21
  affected_sources: [src-cboe-chains]

- id: trp-16
  one_breath: >
    A capture folder named for the day it ran holds the previous day's session, and I
    believed the folder name.
  symptom: >
    Option chains stored under 21 August were captured at 01:36 that morning and contain
    the 20 August closing session. Pairing them with short-selling data for the 21st would
    have joined two different trading days. The same mistake had a second consequence
    nobody was looking for: a folder named for the 20th holds the same session as the
    folder named for the 21st, because both runs fired minutes apart after midnight, so
    counting folders reported two sessions of a forward-only series that has one.
  why_it_parsed: >
    Both files exist, both parse, and both are named for the same date. The mismatch is
    only visible in a field inside the file recording when the underlying last traded.
  defence: >
    Derive the session date from inside the file and store it as a column, never from the
    filename or folder. Count distinct sessions, never files or folders, when reporting how
    much of a series exists. This is the second time this shape has appeared here, in a
    different source, and the second time it was invisible until something was joined to
    it. Treat any date on a container as a label, not a fact.
  found_on: 2026-08-21
  affected_sources: [src-cboe-chains]

- id: trp-17
  one_breath: >
    I corrected for multiplicity across nine cells on one hypothesis, then generalised from
    a single episode on another, in the same project.
  symptom: >
    The calendar hypotheses were tested across every reasonable definition with a
    multiple-testing correction. The news hypothesis was tested on one date and written up
    as a general statement about news and reversals.
  why_it_parsed: >
    Each result was individually careful. A null from one episode reads as a conservative
    finding, so it attracts less scrutiny than a positive one would. The inconsistency
    between the two tests is visible only when they are laid side by side, and neither
    experiment is read that way while it is being run.
  defence: >
    Record the number of episodes a claim rests on as a structured field. A single-episode
    claim then cannot be phrased generally without the count contradicting it on the same
    page. Uneven standards across a project are invisible per-experiment and visible in a
    view that shows every experiment at once.
  found_on: 2026-08-22
  affected_sources: [src-gdelt]

- id: trp-18
  one_breath: >
    A media company in the portfolio absorbed three-quarters of the news corpus, because it
    is named in every article that cites it.
  symptom: >
    Attributing articles to holdings by organisation name gave 46,024 of 61,095
    winning-side articles to a single newspaper publisher that happened to be a holding.
    The top three companies took 91 percent of the corpus. The themes most
    over-represented on the winning side were prisons, trafficking and suicide.
  why_it_parsed: >
    Every match was correct on its own terms: the organisation field really does contain
    that name. The name is present because the outlet is the source or is being cited, not
    because the article is about the company. A mention is not evidence of aboutness, and
    nothing in the data distinguishes the two.
  defence: >
    Cap any single entity's share of a corpus and inspect the top contributors before
    computing anything over it. Exclude entities whose names occur as publishers or
    sources. Where budget allows, filter for aboutness with a model, which was measured on
    this project at sixteen times the precision of matching and was then left out of the
    one test that needed it.
  found_on: 2026-08-22
  affected_sources: [src-gdelt]

- id: trp-19
  one_breath: >
    One press release syndicated to fifty outlets counted as fifty independent
    observations, making two thirds of all themes significant.
  symptom: >
    A test of which themes separate one window from another returned 286 significant
    results out of 421 after correction for multiple testing. The strongest was carried by
    50 articles that were all one company's mental-health benefits announcement.
  why_it_parsed: >
    Every article is a distinct row with a distinct address and a distinct timestamp, so
    the data looks like 1,030 observations. Correction for multiple testing was applied and
    passed, which reads as rigour and hid the fact that the unit of observation was wrong
    before any correction was reached.
  defence: >
    Read the proportion of tests that clear correction as a diagnostic. Two thirds is not a
    finding, it is a broken error model. Cluster at the level the world generates
    independently, which for news is the story rather than the article, and check the
    article count behind the strongest result before believing it.
  found_on: 2026-08-22
  affected_sources: [src-gdelt]

- id: trp-20
  one_breath: >
    A prompt with no way to answer "nothing here" produced a confident, plausible, wrong
    label for a portfolio with no shared exposure.
  symptom: >
    Asked to name the shared economic exposure of a momentum book's largest holdings, the
    model returned "long-duration secular growth with global expansion" and explained that
    the valuations were sensitive to duration. It read as the interest-rate story the
    holdings data independently supports. Given the same companies and an explicit option to
    answer "no coherent shared exposure", it chose that instead, at confidence 8 out of 10.
  why_it_parsed: >
    The label was economically literate, hedged at confidence 5, and shipped with a dissent
    field naming a competing explanation. Everything about it looked like careful analysis.
    The prompt simply never offered a way to decline, so a compliant model produced the best
    available answer to a question that had none.
  defence: >
    Every classification or labelling prompt must contain an explicit null option, and the
    null must be exercised on placebo inputs before the real ones are trusted. Randomly
    drawn companies and one-per-sector sets are cheap and decisive. A model that never
    answers "nothing" is not measuring the input.
  found_on: 2026-08-22
  affected_sources: []

- id: trp-21
  one_breath: >
    I refuted an entire data source after reading the one section of it that could not have
    worked.
  symptom: >
    Annual filings were dismissed as a text source because business descriptions are
    recycled year to year. The objection was correct for that section and was applied to the
    document. Item 7A, a mandatory disclosure where companies quantify their interest-rate
    exposure, was never opened. It is precisely the exposure the project then spent days
    failing to recover from news.
  why_it_parsed: >
    The reasoning was sound and the conclusion followed from it. Nothing was wrong except
    the scope of the premise, and a refutation that is internally valid attracts no further
    checking. The claim was even filed with the correct narrow wording, then cited as though
    it were the general one.
  defence: >
    A refutation must name the exact slice it rests on, and any generalisation beyond that
    slice needs its own evidence. Before dismissing a structured document, enumerate its
    sections and state which were examined. The cost of opening one more section is minutes;
    the cost of not doing so here was several days of work on a corpus that could not carry
    the question.
  found_on: 2026-08-22
  affected_sources: [src-edgar]

- id: trp-22
  one_breath: >
    A filing section that says "these disclosures appear elsewhere" parses as a section, and
    the extractor read the pointer.
  symptom: >
    Half the financial companies in the book were extracted as disclosing no interest-rate
    exposure, including a bank with the highest rate-language density in the corpus and a
    rate beta of +0.28. Their Item 7A opens with a cross-reference into the management
    discussion, and the slicer then ran to its character cap on whatever followed.
  why_it_parsed: >
    The heading is present, the section is non-empty, and the extracted text is real prose
    from the same filing. Nothing is malformed. The aggregate positive control passed,
    because the failure is concentrated in one sector and eight companies could not move a
    mean computed over 120.
  defence: >
    Resolve cross-references before extracting: a section shorter than a threshold, or one
    whose opening sentence points elsewhere, is a pointer and not content. Inspect positive
    controls per stratum and never only in aggregate, because a systematic failure inside
    one stratum is exactly what an average is designed to hide.
  found_on: 2026-08-22
  affected_sources: [src-edgar]

- id: trp-23
  one_breath: >
    I compared a measure against the wrong null and got a saturated statistic that could not
    answer the question.
  symptom: >
    A momentum leg was tested for sector concentration against random draws from the same
    universe and came out at the 100th percentile, making the comparison useless. The
    finding it was meant to probe had measured the same quantity against the book's own
    history and got the 50th percentile.
  why_it_parsed: >
    Both percentiles are correctly computed and both describe something true. Nothing is
    malformed. A percentile carries no record of what it was taken against, so two numbers
    that mean different things look interchangeable, and the caveat written before the run
    identified the risk without preventing it.
  defence: >
    State the null in the same breath as the percentile, always, so a reader cannot mistake
    one for the other. Before running, ask whether the proposed null can saturate; if a
    measure is elevated by construction under it, the test has no power in that direction
    and needs a different comparison rather than a caveat.
  found_on: 2026-08-23
  affected_sources: []

- id: trp-24
  one_breath: >
    New data appeared to beat a standard benchmark by 13 percent, and the same pipeline
    without the data beat it equally.
  symptom: >
    Shrinking a covariance matrix toward a target fitted on risk-disclosure similarity gave
    13 percent lower realised portfolio volatility than Ledoit-Wolf, in every window tested.
    An estimator built the same way from sector membership alone produced portfolios
    identical to within one part in a thousand.
  why_it_parsed: >
    The comparison against the benchmark was correct, the improvement was real, and the
    registration required a sector control inside the regression that built the target.
    That control is not the right one: including a variable in a regression does not test
    whether another variable adds anything. The gain came from the estimator's structure,
    fitting a target rather than assuming a constant one, and any input would have produced
    it.
  defence: >
    To show that new data helps, build the identical pipeline WITHOUT the data and compare
    against that, not only against the external benchmark. The relevant baseline is never
    the published state of the art; it is your own machinery running on what you already
    had.
  found_on: 2026-08-23
  affected_sources: [src-edgar]

- id: trp-25
  one_breath: >
    A filing index returns only the most recent block, so a decade-long pull came back
    concentrated in its last five years.
  symptom: >
    A pull of annual filings across 2012 to 2023 returned 5 documents for 2012 and 227 for
    2023. The submissions endpoint exposes roughly the last thousand filings under a recent
    block and puts older ones in separate files that were never requested.
  why_it_parsed: >
    Every filing retrieved was correct and the counts rose smoothly, which reads like a
    growing panel rather than a truncated one. The limitation is documented in this
    project's own earnings module, in a docstring stating that truncation would show up as
    missing early history. I reused the access pattern without carrying the caveat.
  defence: >
    When a source paginates, fetch the index of additional pages before assuming the first
    is complete, and plot coverage against time before using a panel. A monotone rise in
    counts toward the present is the signature of truncation, not of growth. A limitation
    written down once must travel with the pattern that causes it, not sit in the module
    where it was first found.
  found_on: 2026-08-23
  affected_sources: [src-edgar]

- id: trp-26
  one_breath: >
    A section slicer failed on single filings, and each failure produced two corrupt
    year-on-year comparisons rather than one.
  symptom: >
    Comparing consecutive risk-factor sections gave length ratios from 0.015 to 65. One
    insurer appeared twice, once at 0.015 and the next year at 65, because a single bad
    slice corrupts both the pair that ends on it and the pair that starts from it.
  why_it_parsed: >
    Each extracted section is real text from the right filing, and a similarity of 0.07 is a
    perfectly well-formed number. Nothing signals that one side of the comparison is a
    fragment. In a change measure a single bad observation does double damage, which is not
    true of a level measure and is easy to miss when moving from one to the other.
  defence: >
    Sanity-check the ratio of lengths between consecutive extractions before computing any
    change, and drop both pairs touching a failure rather than one. A ratio outside roughly
    a third to three times is a parsing failure, not a company rewriting its disclosure.
  found_on: 2026-08-23
  affected_sources: [src-edgar]

- id: trp-27
  one_breath: >
    Model labels measured at 97 percent precision were then used as if they were perfect,
    which biases every statistic computed on them.
  symptom: >
    An aboutness filter was validated at 96.6 percent precision against blind hand labels,
    used to build a corpus of roughly twenty thousand articles, and every downstream
    statistic was computed on that corpus as though the labels were gold. No correction for
    label error was applied anywhere.
  why_it_parsed: >
    The filter was carefully validated, which felt like the work was done. Validation
    establishes the error rate; it does not remove the error from what follows. The
    literature is explicit that even highly accurate annotations produce biased estimates
    and invalid intervals when simply averaged, and there is an established correction that
    was not applied.
  defence: >
    Keep a probability sample with gold labels and rectify full-population estimates by the
    measured bias, using prediction-powered inference or design-based supervised learning.
    Note the direction: label noise attenuates associations toward zero, so uncorrected
    estimates favour a null, and every text null in this project was computed that way.
  found_on: 2026-08-23
  affected_sources: [src-gdelt]

- id: trp-28
  one_breath: >
    EDGAR's index quarter is when a 13F was filed, not the date its holdings describe, so
    conflating them dates positions before anyone disclosed them.
  symptom: >
    A first pass read the full-index by quarter and treated that quarter as the position
    date. Validation implied Apple at 536 dollars a share for a quarter in which the stock
    ended at 93, a 5.8x gap that looked like a units error.
  why_it_parsed: >
    Every field was present and well-formed, and the quarter label on the index file reads
    naturally as the quarter being described. A 13F accepted in May 2014 reports holdings as
    of 31 March 2014, and nothing in the index says so. The discrepancy resolved instantly
    once checked against the previous quarter end: Apple closed at 536.74 on 2014-03-31,
    matching the implied price to the cent and naming the fault exactly.
  defence: >
    Read period_of_report from the filing header and available_at from the acceptance
    timestamp, keep them as separate columns, and never derive either from the index path.
    This is a leakage control, not a tidiness one: crowding dated the wrong way would look
    predictive because it was reading the future.
  found_on: 2026-08-24
  affected_sources: []

- id: trp-29
  one_breath: >
    A minimum-holdings gate sent a six-line filer to the quarter's default units and
    multiplied its positions by a thousand, while the headline validation still passed.
  symptom: >
    Aegis Financial reported six holdings in whole dollars during an era when the rule said
    thousands. The unit detector required eight lines before ruling, so the filing was typed
    unknown, inherited the modal thousands, and its positions became twenty-four billion
    dollars each. Two such filings held 62 percent of the panel's total value.
  why_it_parsed: >
    The quarter still reproduced Apple's closing price to the cent, because that check takes
    a median across filings and two corrupted filers cannot move a median. The validation
    was real, it was passing, and it was blind to the failure by construction. A check that
    passes while most of the value is wrong is worse than no check, because it reassures.
  defence: >
    Drop the count gate; the two unit regimes sit three orders of magnitude apart, so a few
    consistent value-per-share ratios settle the question and a threshold only discards
    evidence. Report untyped value share and implausible-price value share as first-class
    outputs, because a median-based validation cannot see a concentrated fault and only a
    share-of-value statistic can.
  found_on: 2026-08-24
  affected_sources: []

- id: trp-30
  one_breath: >
    Dropping every ambiguous name before the price check removed the index's largest
    companies while the confirmation rate read 99.5 percent.
  symptom: >
    A CUSIP-to-ticker crosswalk dropped any issuer name appearing more than once on either
    side, on the reasoning that a duplicate cannot be resolved. It reported a 99.5 percent
    price-confirmation rate on 1,649 matches and covered 47 percent of index weight. The
    missing 53 percent was Exxon, AT&T, Microsoft, Pfizer, Altria, JPMorgan and Cisco: the
    top of the index almost exactly in order.
  why_it_parsed: >
    Large issuers carry several CUSIPs across filers, being the common stock plus a warrant,
    an ADR line, a share class or a transcription error, so the very names that matter most
    were the ones flagged ambiguous. The headline statistic was confirmation rate, which is
    computed on survivors and therefore rose as more of the index was discarded. Every
    additional deletion made the quality metric look better.
  defence: >
    Apply the price check first and settle ambiguity afterwards, since a value divided by a
    share count is a price and that is exactly the instrument that separates a common stock
    from its warrant. Ambiguity on the index side stays unresolvable and is still dropped,
    but that is five names rather than 225. Report coverage weighted by index weight beside
    any rate computed on survivors, because a survivor-conditioned rate improves as coverage
    collapses.
  found_on: 2026-08-24
  affected_sources: [src-13f, src-iwv]

- id: trp-31
  one_breath: >
    Pairwise Jaccard rises with how widely a basket is held, so it scored popularity as
    crowding, and the size permutation guarding it never shuffled anything.
  symptom: >
    An ownership-overlap measure written to separate crowding from popularity did neither.
    A negative control that merely raised winner-leg breadth from 60 filers to 220, drawing
    every holder independently so that no common constituency existed, produced a leg
    difference of +0.0280, against +0.0342 for genuinely concentrating 60 percent of the leg
    into one clique. The permutation returned a probability of exactly 1.000 for every input
    tested, including the null case and the strongest signal.
  why_it_parsed: >
    Two sets drawn independently from N filers already share about their product over N, so
    Jaccard climbs with breadth alone and a widely held basket outscores a narrow one with
    no shared owners whatever. Separately, the strata were built with ranks whose ties broke
    by position, and the pool was assembled winners then losers, so every stratum came out
    entirely one leg and shuffling labels inside it changed nothing. Both faults produce
    smooth, monotone, entirely plausible output.
  defence: >
    Score each pair as observed co-ownership over its independence expectation, which is 1.0
    when holders are unrelated regardless of breadth. Break rank ties at random rather than
    by position. And run both controls, not just the positive one: the positive control
    passed throughout and would have licensed the measure on its own, while it was the
    negative control that showed the measure could not tell the two hypotheses apart.
  found_on: 2026-08-24
  affected_sources: [src-13f]

- id: trp-32
  one_breath: >
    A quarter of 2006 filings use a reversed column order, and the wrong reading scores
    perfectly because an inverted price is still a plausible price.
  symptom: >
    785 of 2,902 filings in one quarter parsed to nothing. They were not empty: they use a
    layout with the CUSIP first and no share-or-principal token, and their two numeric
    columns run in the OPPOSITE order to the layout already handled. A first attempt to
    arbitrate between the orderings by price plausibility chose wrong and scored it 100
    percent, putting Iomega at 401 dollars a share in a quarter it closed near 2.50.
  why_it_parsed: >
    Transposing value and share count inverts the implied price, and an inverted price is
    usually still an entirely plausible price, so no fixed range can separate the readings:
    401 dollars and 2.49 dollars are both prices stocks have. Worse, the wrong reading was
    uniformly wrong, so the share of rows inside the plausible band was 100 percent and the
    quality score rose to its maximum on the incorrect answer. Relaxing the pattern to admit
    both layouts without arbitrating would have silently inverted a quarter of the panel.
  defence: >
    Arbitrate against an external referent rather than an internal range. Filings whose
    layout is unambiguous, being the XML era and the text tables that carry an explicit SH
    or PRN token, establish a consensus price per CUSIP; the ambiguous ones are then read
    whichever way agrees with it. Iomega resolves to 2.48994. This runs as a second pass over
    cached documents, so the arbitration costs no network. More generally: when two readings
    of the same bytes are both internally plausible, no internal statistic can choose between
    them, and the check has to come from outside the file.
  found_on: 2026-08-24
  affected_sources: [src-13f]

- id: trp-33
  one_breath: >
    Eighty percent of a quarter's value sat in two filings whose CUSIP was a name fragment,
    and the price check still passed.
  symptom: >
    The 2007-09-30 panel reported 79.7 percent of its total value at an impossible implied
    price, carried by 653 rows out of 930,621. Two filings held it: a token read as the CUSIP
    "IFIEDREIT", a fragment of DIVERSIFIED REIT, attached to a position of 2.5e13 dollars.
    The quarter's anchor check reproduced Apple's close to the cent throughout.
  why_it_parsed: >
    The pattern for a CUSIP was nine alphanumeric characters, which matches a great many
    things that are not identifiers, including runs of letters inside issuer names. The
    filings were fixed-width with no separator between columns, so the CUSIP ran straight
    into the market value and there was no whitespace to anchor on. Two further layers of the
    same fault appeared underneath: a nine-character window starting inside a truncated class
    name passes the CUSIP check digit about one time in ten, which put a Suez ADR at 21
    million dollars a share; and the plausibility guard that should have caught all of it
    rejected Berkshire Hathaway A at 118,510 dollars, which is simply what Berkshire A cost.
  defence: >
    Validate the check digit, which the identifier carries for exactly this purpose. Where
    columns abut, treat every offset yielding a valid CUSIP with an all-digit remainder as a
    candidate and let implied price choose between them, preferring the smaller value since
    a split too far left absorbs digits from the name and can only inflate. Set the
    plausibility ceiling above the most expensive real security rather than below it. And
    keep reporting implausible value as a share of value: 653 rows in 930,621 is 0.07 percent
    by count and 79.7 percent by value, and only one of those two numbers is alarming.
  found_on: 2026-08-24
  affected_sources: [src-13f]

- id: trp-34
  one_breath: >
    A correct parse was nearly rejected as over-matching because it was compared against a
    different filing's declared totals.
  symptom: >
    A newly added layout returned 386 rows and 603.5 million dollars for a filing whose
    stated totals appeared to be 285 entries and 216.5 million. The obvious reading was that
    the pattern matched a third more rows than existed and inflated the value by nearly
    three times, and the next step would have been to tighten it.
  why_it_parsed: >
    The filing was selected with a name prefix, and the prefix matched two different filers.
    1ST SOURCE BANK sorted first; 1ST SOURCE CORP INVESTMENT ADVISORS was the one whose
    totals had been read a moment earlier. The parse reproduced its own filing's declared
    figures exactly, 386 entries and 603,536 thousand dollars, and tightening the pattern
    would have broken a component that was already right.
  defence: >
    Compare a parse against the totals of the document it parsed, carried through in the
    same object rather than looked up separately. More usefully, this is where the
    stated-totals check came from: Form 13F asks filers to declare entry count and value
    total, which is a checksum each document carries about itself, and it settles layout,
    column order and units in one comparison. It is also the only check here that can see
    over-matching, because a spurious row with a plausible price is invisible to every
    price-based test and obvious in an entry count.
  found_on: 2026-08-24
  affected_sources: [src-13f]

- id: trp-35
  one_breath: >
    A single bond row read as shares carried 99.99 percent of a quarter's value, and
    reporting the problem was not the same as removing it.
  symptom: >
    After a permissive layout was added to recover unread filings, one quarter came back
    with 99.992 percent of its total value at an impossible implied price. One row did it:
    a Duke Energy bond held by a Canadian bank, its principal amount read as a share count
    and its value glued from adjacent digits, priced at six billion dollars a share. The
    quarter's anchor check passed, as it had every previous time.
  why_it_parsed: >
    The layout with no share-or-principal token has nothing to read the instrument type
    from, so it labelled every row as shares, and a principal amount divided by nothing
    meaningful is not a price. The deeper fault is that implausible value had been added as
    a REPORTED statistic three traps earlier and never as an action. It correctly showed
    79.7 percent once and 99.99 percent again, and both times the pipeline carried on,
    because nothing consumed the number.
  defence: >
    Drop share-denominated rows whose value and share count imply an impossible price under
    either unit scaling, and count what was dropped. Principal rows are exempt, since a
    principal amount is not a price. A metric that only reports is a metric that has to be
    read by someone, and the point of the enforcement layer in this project is that nothing
    important should depend on being read.
  found_on: 2026-08-24
  affected_sources: [src-13f]

- id: trp-36
  one_breath: >
    No absolute price bound can work, because any ceiling admitting Berkshire Hathaway also
    admits a misparsed Conoco at 370,000 dollars.
  symptom: >
    One quarter reported 35.3 percent of its value at an impossible price while a diagnostic
    on the same file reported 0.009 percent. Two constants had drifted apart: the ceiling was
    raised to clear Berkshire Hathaway A in the parser's copy and left at the old value in
    the reporting copy. Underneath that, the row-level guard was running BEFORE unit scaling,
    so a ConocoPhillips row whose raw value over shares came to 370 passed as a dollar price
    and then became 370,770 dollars a share when the filing was typed as thousands.
  why_it_parsed: >
    Both faults are about where a check sits rather than what it tests. Units are a property
    of a whole table, so a per-row check that runs first cannot know which scaling will
    apply and has to admit either, which admits everything. And once the check was moved
    after scaling it still could not work, because the bound has to clear Berkshire A at
    118,510 dollars and any bound that does also clears a misparse at 370,770. Absolute
    plausibility cannot separate a rare real price from a common wrong one.
  defence: >
    Judge a row against the other filers holding the same security on the same date. Fifty
    managers reporting ConocoPhillips at 88 dollars settle what no constant could, and the
    redundancy is free because widely held names are reported by hundreds of filers. Rows
    deviating from the cross-filer median by more than five times are dropped, names with
    fewer than three reporters are left to the absolute bound, and one constant is now shared
    rather than two that can drift. It is the same instrument as the layout arbitration
    elsewhere in this source -- a referent from outside the document being checked --
    applied across filings instead of within one.
  found_on: 2026-08-24
  affected_sources: [src-13f]

- id: trp-37
  one_breath: >
    A pass-or-fail threshold was invented in the script after registration, so the gate's
    verdict rested on a number nobody had committed to.
  symptom: >
    The registered prediction said loser-leg days-to-cover would exceed size-matched
    winner-leg days-to-cover at every settlement date. The script that ran it declared PASS
    if the direction held on more than 90 percent of dates and the permutation cleared 0.05
    on more than half. Neither figure appears in the registration. The result came back at
    85.1 percent and printed FAIL, which is a verdict against a bar invented after the
    hypothesis and before the data, in code that nobody reviewed as a design decision.
  why_it_parsed: >
    Writing a threshold into a script feels like implementation rather than design, and it
    reads as tidy engineering: the alternative is printing numbers and deciding by eye, which
    feels worse. But a decision rule is part of the specification whatever file it lives in,
    and inventing one afterwards leaves exactly the freedom the registration exists to
    remove. Had the result come in at 91 percent it would have printed PASS and nobody,
    including me, would have gone looking for where the 90 came from.
  defence: >
    Decision rules belong in the registration with the hypothesis, or the experiment reports
    a quantity and no verdict at all. Where a rule has to be added later, it is written down
    as an amendment before the run, which this project already does for data and method and
    should have been doing for thresholds. The honest report here is the quantity: direction
    correct on 166 of 195 dates, median difference 1.175 days to cover, median permutation
    probability 0.047.
  found_on: 2026-08-24
  affected_sources: [src-short-interest]

- id: trp-38
  one_breath: >
    Raw sentence embeddings put every company at cosine 0.96 to every other, so a
    concentration measure built on them would have moved and meant nothing.
  symptom: >
    A semiconductor designer and a regulated electric utility embedded at cosine 0.973. Across
    eight deliberately unrelated business descriptions every pair fell between 0.943 and
    0.982, and same-industry pairs exceeded different-industry pairs by 0.013. The embedding
    tier's four measures -- within-leg dispersion, centroid drift, leg distance, cluster
    structure -- are all cosine geometry, so all four would have been computed on a space with
    almost no discrimination in it.
  why_it_parsed: >
    Nothing errors. The vectors have the right shape, the cosines are numbers between minus
    one and one, and a dispersion series computed from them varies from month to month and
    looks like a signal. Anisotropy in mean-pooled encoder output is well known in the NLP
    literature and completely invisible from the finance side, where the natural assumption
    is that a similarity of 0.97 means two things are similar rather than that the model puts
    everything at 0.97.
  defence: >
    Subtract the cross-sectional mean before any cosine. Separation goes from 0.013 to 0.412,
    thirty times, from one subtraction. Do not whiten on top: estimating a 768-dimensional
    covariance from a small cross-section destroyed the separation completely. And take the
    mean over the cross-section AS OF THE SAME DATE rather than over pooled history, because
    a mean computed across all dates carries future documents into a past measure, which is
    the same fault as dating a holdings panel by its period instead of its filing.
  found_on: 2026-08-24
  affected_sources: [src-edgar]

- id: trp-39
  one_breath: >
    The extractor takes the LAST heading match, so a quarter of the corpus is a
    cross-reference or contents page, not the section.
  symptom: >
    An audit found 24.7 percent of embedded filings, and 29.2 percent of the momentum leg,
    did not begin at Item 1A at all. Roughly 19 percent start at a late cross-reference
    reading "Item 1A - Risk Factors of this Form 10-K. Except to the extent required by
    applicable law", and 5 percent start at the table of contents and then run through the
    whole of Item 1 Business. Risk-word density in those windows is 6.4 and 8.1 per thousand
    words against 24.7 for clean extractions. The 49 table-of-contents documents sit at an
    internal mean cosine of 0.477 against 0.012 for the pool, a synthetic near-duplicate
    clique of boilerplate with twelve members inside the leg, contaminating both sides of the
    comparison.
  why_it_parsed: >
    Taking the last match was a deliberate choice, documented as skipping the table of
    contents, and it does that correctly for filings whose only other mention is the
    contents page. It fails for the far more common case of a later cross-reference, and the
    guard that skips a terminator within the first two thousand characters lets a
    contents-page extraction run on past its own end. Every failure produces a long
    plausible-looking string, and length checks pass because the wrong slice is long.
  defence: >
    Take the second heading match rather than the last, and require risk-factor prose density
    in the opening two thousand characters before accepting a slice. Refuse to store anything
    that hits the section cap rather than truncating to it. And consume the flags: 228 of the
    900 embedded filings already carried an implausible-length flag that the export never
    read, which is the same fault as computing an implausible-value share and never acting on
    it.
  found_on: 2026-08-25
  affected_sources: [src-edgar]

- id: trp-40
  one_breath: >
    Mean pairwise cosine is the squared centroid norm, so a shared sub-bet enters squared
    and the test had no power against its own hypothesis.
  symptom: >
    A gate asked whether a momentum leg shares a latent exposure and measured mean pairwise
    cosine within the leg against sector-matched baskets. The statistic is algebraically
    (k times the squared centroid norm, minus one, over k minus one), verified to five
    places. A sub-bet of forty percent of the leg would need internal cosine of 0.138 to move
    the statistic two standard deviations, and a whole GICS sector inside that leg achieves
    between 0.00 and 0.13. The gate could not have passed even if the hypothesis were true.
  why_it_parsed: >
    A positive control was run and passed convincingly, at z between 6.8 and 14.6 on
    single-sector groups, which felt like a demonstration that the measure had power. It
    demonstrated power against a hundred-percent-loading single-block alternative, which is
    not the alternative on trial. A control that passes against the wrong alternative is
    worse than no control, because it converts an underpowered design into a confident null.
  defence: >
    Derive what effect size the statistic can resolve at the observed null spread BEFORE
    running, and state it in the registration next to the power arithmetic. Where the
    hypothesis is that a SUBSET shares a direction, use a statistic built for that: the
    leading eigenvalue of the similarity matrix, or a densest-subset scan. On the same data
    both are positive where the mean is negative. And when a positive control is chosen,
    check that its alternative resembles the one being tested.
  found_on: 2026-08-25
  affected_sources: []

- id: trp-41
  one_breath: >
    Momentum was computed from unadjusted holdings-file prices, so reverse splits became the
    two strongest winners and dividends handicapped the bond proxies.
  symptom: >
    The winner leg used for the embedding gate was formed from raw iShares price fields,
    which are point-in-time snapshots with no split or dividend adjustment. Spirit Realty,
    after a one-for-five reverse split, ranks as the strongest winner in the book; Rite Aid,
    after one-for-twenty, ranks second. A filter rejecting moves above five times removed two
    names universe-wide and every reverse split up to one-for-five passed through. Separately,
    price-only returns understate a REIT by about five points and a utility by three against
    one for technology, at a decile cut of 28.7 percent.
  why_it_parsed: >
    This project already recorded a reverse split reading as nineteen hundred percent
    momentum, and added a filter in response. The filter was set at a threshold that catches
    the extreme case and misses the common one, so the defence existed and was calibrated too
    loosely to work. The dividend half was never considered at all.
  defence: >
    Use split and dividend adjusted returns to form any leg. The dividend bias is the part
    that matters here rather than the splits: it systematically handicaps high-yield
    rate-sensitive names, and the leg under test came out 27 percent technology and 2.4
    percent utilities where the project's own rate-beta work describes a bond-proxy book. The
    leg being tested may not have been the leg that was documented, which invalidates the
    comparison before any embedding is computed.
  found_on: 2026-08-25
  affected_sources: [src-iwv]

- id: trp-42
  one_breath: >
    An adversarial audit was right about four defects and wrong about a fifth, and the fifth
    was repeated to the user as fact.
  symptom: >
    A commissioned audit reported that the 2019 winner leg "came out 27 percent technology and
    2.4 percent utilities where the project's own rate-beta work describes a bond-proxy book",
    and concluded the leg being tested might not be the leg documented. That framing was
    relayed onward and used to argue that the project's strongest AI experiment had been fed a
    defective input. It had not. The project's own headline claim says the September 2019 book
    was a bet on falling rates WEARING TEN DIFFERENT SECTOR LABELS, at sector concentration in
    the 50th percentile, and that the failure was aggregation rather than measurement. A
    technology-heavy leg is what that claim predicts, because long-duration growth is
    rate-sensitive. Correcting 142 corporate actions and adding sector dividend yields back
    moved technology from 28.9 to 28.2 percent and the bond-proxy share from 13.5 to 15.0.
    The composition was never the defect.
  why_it_parsed: >
    The audit's other four findings were verified and severe, which bought the fifth an
    unearned presumption. It also arrived phrased as a contradiction with the project's own
    record, which is exactly the shape a real finding takes, and it confirmed a diagnosis
    already forming. An adversarial reviewer is optimised to produce contradictions, so its
    output needs the same verification as any other result rather than more trust because it
    was critical.
  defence: >
    Check an audit's claims about the record AGAINST the record before repeating them, in the
    same way a positive result would be checked. The cheap test here was one grep of the
    ledger, which takes seconds and would have caught it before it reached the user. Where an
    audit asserts a conflict with an existing claim, quote the existing claim and verify the
    conflict is real. Findings about code can be reproduced by running the code; findings
    about interpretation cannot, and are the ones to slow down on.
  found_on: 2026-08-25
  affected_sources: []

- id: trp-43
  one_breath: >
    A factor series already in decimals was divided by a hundred, and every beta came out a
    hundred times too large.
  symptom: >
    The first run of the conferred-tilt panel reported a mean market-beta spread of -11.9,
    a minimum of -382 and a maximum of +61. Market betas live near one. The cause was a
    division by a hundred applied to a factor series that was already decimal rather than
    percent: the market factor's daily standard deviation became 0.00009 instead of 0.0108,
    and since beta is a ratio, shrinking the denominator by a hundred multiplied every
    loading by a hundred. A beta of 112 was really 1.12.
  why_it_parsed: >
    Nothing failed. The regression solved, the panel wrote, and 134 rows of well-formed
    output appeared with plausible-looking column names. Percent-versus-decimal is the most
    common unit convention clash in return data and the two conventions are visually
    identical in a dataframe. The error was caught only because a market beta of -382 is
    absurd on its face; a hundredfold error in a less familiar quantity would have passed.
  defence: >
    Assert the magnitude of any factor series before it enters a regression, not after. A
    daily market factor has a standard deviation near one percent, so a band from 0.003 to
    0.03 separates decimals from percent and from anything corrupted, and the assertion now
    sits in the panel builder. The general rule is that units should be checked by their
    known scale rather than inferred from a column name or from a library's documentation,
    because the number is available and the documentation may not be.
  found_on: 2026-08-25
  affected_sources: [src-french]

- id: trp-44
  one_breath: >
    A falsifier landed exactly on its threshold and binary floating point scored a refuted
    call as standing.
  symptom: >
    The first translation this system generated for the September 2019 book predicted that a
    rise of 0.40 in the ten-year yield within 42 trading days would refute its defensive read.
    The yield went from 1.50 to 1.90 — exactly 0.40 — and the scorer returned "stood". In
    binary floating point 1.9 minus 1.5 evaluates to 0.3999999999999999, which is below the
    threshold by 1.1e-16, and the printed value rounded to +0.400 so the output looked correct.
  why_it_parsed: >
    Everything about the result was plausible. The move displayed as exactly the threshold, the
    status field held a legal value, and nothing raised. A boundary case is also the one place
    a reader is least likely to check, because the number matching the threshold reads as
    confirmation that the machinery is working rather than as a warning. The series carry two
    decimals, so the comparison had precision the data never had.
  defence: >
    Compare at the precision the data actually carries, with an explicit tolerance and a
    comment saying which case forced it. More generally, any scored track record needs a test
    that lands exactly on its own boundary, because that is where the verdict flips and where
    a silent error is indistinguishable from a correct answer. The test is now in the suite
    with the real 2019 numbers rather than synthetic ones, so it fails if the tolerance is
    ever removed.
  found_on: 2026-08-26
  affected_sources: [src-fred]

- id: trp-45
  one_breath: >
    Centring the basket instead of the pool inverts the sign of a planted effect, so the
    statistic falls as the effect grows.
  symptom: >
    Building the planted-effect harness, injecting a shared direction into 40 percent of a
    basket made mean pairwise cosine go DOWN as cohesion rose: +0.0048 at a target of 0.15,
    +0.0030 at 0.25, +0.0010 at 0.40, against a null mean of +0.0068. Detection was zero
    everywhere. The cause was centring on the 168-name basket rather than on the 900-name pool.
    Centring forces the vectors to sum to zero, so a shared direction in a minority of rows
    pushes the majority the other way, and the cross-pairs -- 48 percent of all pairs at a 40
    percent split -- more than cancel the within-group gain.
  why_it_parsed: >
    Both orders are one line and both produce a centred, unit-normalised matrix that every
    downstream function accepts. The failed embedding gate centred on its pool and indexed the
    leg out; the harness written to certify that gate centred on the basket, and nothing in
    either signature records which. Three other harness bugs were caught the same session by the
    same self-test, and this was the only one that silently reversed a direction rather than
    changing a magnitude.
  defence: >
    Centre once on the population the comparison is drawn from, then index subsets out of the
    centred matrix, and say so at the call site. A test asserts that planting RAISES the
    statistic; a sign inversion is not a subtle numerical issue and a direction check catches it
    in one assertion. More generally, when an instrument is rebuilt to certify an older result,
    the rebuild has to reproduce the older result's order of operations before its power
    statement means anything.
  found_on: 2026-08-26
  affected_sources: []

- id: trp-46
  one_breath: >
    A bootstrap null duplicated a quarter of the rows, and duplicate pairs have cosine one, so
    no planted effect could clear it.
  symptom: >
    The first text-layer certificate reported zero percent detection in all six cells, including
    forty percent of documents carrying six injected sentences of real rate vocabulary. The
    instrument looked completely blind. The cause was the null: it resampled the unplanted
    vectors WITH REPLACEMENT, which duplicates about thirty-three of a hundred and twenty rows
    per draw, and a duplicated pair has cosine 1.0 after normalisation. The null's ninety-fifth
    percentile sat at +0.00718 against a statistic of +0.00161 on the real data, four and a half
    times higher, so the threshold was unreachable by construction.
  why_it_parsed: >
    Bootstrapping is the reflex for "what would this statistic look like by chance", and for a
    mean of independent observations it is correct. It is wrong for a pairwise similarity
    statistic, because resampling with replacement manufactures identical pairs, which is
    exactly the structure the statistic measures. The failure mode is also silent in the
    friendliest possible way: a uniform zero reads as a clean negative result about the
    instrument rather than as a broken comparison.
  defence: >
    For a plant, the null is the SAME procedure with a neutral treatment, not a resample. Here
    that means inserting the same number of sentences using ordinary filing vocabulary rather
    than driver vocabulary, which also controls for the act of insertion itself: adding text
    changes length, token mix and pooling regardless of what it says. As a general rule, never
    build a null for a similarity statistic by resampling with replacement, and treat a
    uniformly zero detection grid as a suspect null until the null has been checked against the
    statistic's value on untouched data.
  found_on: 2026-08-26
  affected_sources: []

- id: trp-47
  one_breath: >
    Mean pairwise cosine is pinned to minus one over k minus one when you centre on the set you
    then measure.
  symptom: >
    Six apparently separate harness bugs were one fact. Centring forces the vectors to sum to
    zero, which forces the sum of all off-diagonal cosines to minus k, which forces their mean
    to exactly -1/(k-1). Measured against theory the agreement is 2.7e-06 at k equal to 168. A
    forty percent planted bet at cosine 0.30 moves the statistic from -0.00599 to -0.00355,
    while the leading eigenvalue on the identical data moves from 0.0127 to 0.1743, fourteen
    times further. The statistic has almost no room to move, so every null built around it was
    degenerate in a different disguise: a scramble null with zero variance, a bootstrap null
    reachable only by duplicate rows whose cosine is one, a basket-centred plant that inverted
    its own sign, and a twenty-document check sitting exactly on the floor at -0.0526.
  why_it_parsed: >
    Nothing errors. The statistic returns a plausible small number, nulls return distributions,
    permutation probabilities compute. And the failed embedding gate DID see movement, which
    made the statistic look serviceable -- but only because it centred on a 900-name pool and
    measured a 168-name leg, so the leg's own sum was not zero and the pinning did not apply.
    That escape was accidental rather than designed, and it disguised the defect for a month.
    The deeper error was procedural: each symptom was patched as it appeared, six times, where
    ten minutes of algebra would have settled all of them at once.
  defence: >
    Derive a statistic's behaviour under the transformation that precedes it BEFORE building a
    certificate for it. Centring is not a neutral preprocessing step; for a similarity statistic
    it is a constraint on the answer. Concretely: mean pairwise cosine is admissible only when
    the centring population is strictly larger than the evaluated subset, and that requirement
    belongs in the docstring rather than in a caller's memory. Prefer statistics with genuine
    range under centring -- the leading eigenvalue and a densest-subset scan -- and keep mean
    pairwise cosine only to reproduce older results for comparison.
  found_on: 2026-08-26
  affected_sources: []

- id: trp-48
  one_breath: >
    Three modules were written, run, cited as evidence, and never committed; only their cached
    outputs survive.
  symptom: >
    A build rule added to catch ONE known case -- a method cited as a defence with no
    implementation -- found five more on its first run, and following the thread found eleven
    reproduce commands pointing at code absent from the working tree AND from all git history.
    Two of the affected claims carry the strongest confidence tier, including the risk-factor
    similarity result that replicated at +0.094 and +0.095 and had been cited that same day as
    load-bearing evidence that text and models work. Its reproduce command does not run. Three
