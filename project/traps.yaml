    like a pattern that did not match. The pattern was registered and correct. The slicer read
    SECTIONS.get((form, name), SECTIONS[("10-K", name)]), and Python evaluates a default argument
    BEFORE the call, so every 10-Q Item 2 lookup computed SECTIONS[("10-K", "item_2")] first and
    raised KeyError -- there is no Item 2 in a 10-K. The caller caught bare Exception and wrote
    an empty string. Corrected, the same pattern extracts 80 percent.
  why_it_parsed: >
