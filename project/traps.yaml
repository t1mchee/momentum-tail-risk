  affected_sources: [src-french]
  symptom: >
    The example page and the memo body both state that on 9 November 2020 the market moved
    +0.01 percent while the factor lost 14.39 percent in the session, and use the pairing to
    argue that the loss was not the market term. The factor return is right. The market return
    is the 6th of November's. On the 9th the total market return was +0.83 percent, and the day
