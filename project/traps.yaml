- id: trp-79
  found_on: 2026-09-02
  one_breath: A parser skipped a third of an archive on encoding errors, and a link filter removed the
    crash months.
  affected_sources:
  - src-ftd
  symptom: 'Two independent faults in one acquisition, both of which produce silence rather than an error.
    The parser caught decode failures and printed a skip line per file, which looked harmless because
    only the last few were visible on screen; it had in fact dropped about two thirds of the archive,
    6.7 million rows against the 18.2 million actually present, and 1,145 settlement dates against 3,305.
    Separately, the SEC index serves these files under four path prefixes, one of which reads like a content-management
    artefact rather than a data path. That prefix was filtered out of the download list as junk. It is
    the real location of six half-month files covering February, March and April 2020, so the archive
    was missing exactly the COVID crash, which contains a registered episode.

    '
  why_it_parsed: 'Both faults present as an absence. A dropped half-month does not raise, does not appear
    as a null, and downstream reads as a period with no settlement stress -- that is, as a calm market.
    The coverage check that caught the second fault only worked because it compared against a continuous
    month range rather than against the file list, which was itself wrong. Checking the downloaded files
    against the download list would have passed, since the list was the thing that was incomplete.

    '
  defence: 'A parser must raise on a file it cannot read rather than continue, because a missing period
    and a quiet period are indistinguishable once the data is in memory; decode is now attempted across
    several codecs and only an unreadable file stops the build. A link filter must never drop a candidate
    on the grounds that its path looks wrong -- if a prefix appears in the index it is a location, and
    the only safe test is whether the fetched bytes are the expected format. Coverage is verified against
    a continuous calendar built from the data''s own span, never against the list used to fetch it.

    '
- id: trp-80
  found_on: 2026-09-02
  one_breath: A committed result panel no longer reproduced from its own generator and nobody had re-run
    it.
  affected_sources: []
  symptom: 'Regenerating the placebo panel behind the mechanism claim moved it from 104 of 128 months
    clearing to 105 of 137. The change had been authorised to test one specific revision, point- in-time
    index membership, and the expectation was that June reconstitution dates would drive any movement.
    Of the nine month-ends whose verdict flipped, only one is a June date. The stored panel had simply
    gone stale against code that had already been committed: the current generator resolves sectors for
    7,433 of 7,456 tickers where the stored panel was built when the first-occurrence rule resolved 5,808,
    and its span begins 2014-01 rather than 2013-09.

    '
  why_it_parsed: 'A committed CSV reads as a result. Nothing in the record distinguishes an artifact that
    reproduces today from one that reproduced eleven days ago against code since changed, and re-running
    is expensive enough that it is only done when something forces it. The claim''s numbers were quoted
    repeatedly in the intervening period, including into a submission memo, with no indication that they
    were no longer what the pipeline produced.

    '
  defence: 'An artifact that carries a headline number needs a reproduction stamp -- the commit its generator
    was at when it was written -- and a check that the stamp still matches. Where that is too expensive
    to run continuously, the staleness risk belongs beside the number rather than discovered when someone
    finally re-runs it. Attribution also has to be designed in: this regeneration bundled a membership
    revision, a loading-window fix and an unrelated sector improvement, so the before-and-after cannot
    attribute the move to any one of them. The clean measurement is the one taken on the intermediate
    artifact with a single variable changed.

    '
- id: trp-81
  found_on: 2026-09-02
  one_breath: The conditional expected shortfall was not conditional, so it read milder than the VaR beside
    it.
  affected_sources: []
  symptom: 'On the page for 2020-10-31 every expected-shortfall figure was less severe than the value-at-risk
    printed next to it -- a 10-day 5 percent VaR of -0.0947 against an ES of -0.0586 -- contradicting
    the sentence printed directly beneath, that ES is the average loss given the VaR is breached and is
    therefore always the worse number. The same block was correct at 2019-09-06, so it presented as date-specific
    rather than as a formula error.

    '
  why_it_parsed: 'The two quantities were different objects wearing one label. VaR was evaluated at today''s
    state; ES was the mean realised return below the in-sample fitted quantile across the whole training
    set, which does not depend on today at all. Whenever the current state is more extreme than the sample
    average the VaR moves and the ES does not, and the inequality inverts. The field was named es_conditional
    and the docstring described what the code did rather than what the name claimed, so reading either
    one in isolation looked consistent.

    '
  defence: 'Estimate the tail''s MULTIPLICATIVE severity in-sample -- how much worse an exceedance is
    than the quantile it breached -- and apply that ratio to today''s VaR. The ratio is at least one on
    the rows it averages, so the ES can no longer come out milder than the VaR. More generally: when two
    numbers are printed side by side under a stated inequality, that inequality is an assertion about
    the code and belongs in a test.

    '
- id: trp-82
  found_on: 2026-09-02
  one_breath: A result cache keyed on its inputs but not its estimator served stale numbers after the
    model was fixed.
  affected_sources: []
  symptom: 'After the conditional expected shortfall was repaired, the page reprinted the inverted values
    byte-for-byte at both test dates. The severity stage caches to disk under a key built from the as-of
    date, the input series and the horizon and quantile grid. The estimator itself is not in the key,
    so changing the model produced no cache miss and the old numbers were served indefinitely.

    '
  why_it_parsed: 'The fix appeared to have failed rather than to have been ignored, which sent the first
    diagnosis toward the arithmetic rather than the cache. A cache hit is silent by design and there is
    no output distinguishing a fresh computation from a replayed one; the stage does set a from_cache
    flag on the record, but nothing prints it.

    '
  defence: 'Hash the estimator''s source into the cache key, so any change to the model invalidates the
    entry automatically. A cache that cannot notice a code change is a mechanism for publishing a result
    the code no longer produces, which is the same failure as a stale committed artifact and is harder
    to see because nothing on disk looks wrong.

    '
- id: trp-83
  found_on: 2026-09-02
  one_breath: A family-wise correction raised the pass rate to 100 percent, because the null was saturated.
  affected_sources: []
  symptom: 'The eight-series version of the concentration test cleared 108 of 108 month-ends. The first
    implementation used the maximum PERCENTILE across series, which saturates: against 200 draws a percentile
    has half-a-point resolution and the real book exceeds every placebo on at least one of eight series
    essentially always, so the real book pinned at 100.0 on 107 of 108 dates while each placebo capped
    at 99.5 by being included in its own comparison. Replacing it with a continuous statistic, the maximum
    standardised distance with leave-one-out moments, fixed the arithmetic and did not change the verdict:
    still 108 of 108, with a median maximum z of 22.8 against a threshold of 2.74.

    '
  why_it_parsed: 'A multiple-testing correction is expected to make a test HARDER, so a correction that
    raised the pass rate from 76.6 percent on one series to 100 on eight should have been implausible
    on sight. It was not caught by any check; it was caught by the round number. The deeper cause is that
    the null is too weak for the statistic: the median date has SEVEN of eight series above the family
    threshold and on 44 percent of dates all eight are, because a momentum-sorted book differs from a
    random size-matched book on every macro axis at once. A maximum over eight saturated quantities cannot
    discriminate.

    '
  defence: 'Read the direction of a correction before reading its result: a family-wise adjustment that
    increases a pass rate is either a coding error or evidence the null is saturated, and both need finding
    before the number is quoted. The single-series test discriminates at 76.6 percent partly by accident
    of which series was registered -- market beta carries the LOWEST median z of the eight at 7.8 against
    18.7 for the first principal component, so a different registered series would have cleared near 100
    percent as well. The informative null for a concentration claim is not a random book but a book built
    by the same kind of rule: sorts on other trailing-return windows, which this design already names
    as its live control and had not run.

    '
- id: trp-84
  found_on: 2026-09-03
  one_breath: A sealed test deviated from its own registered sampling and produced a spurious failure.
  affected_sources: []
  symptom: 'The holdout''s severity arm was registered with a power statement naming a 21-day forecast
    step, roughly 40 forecasts and about 2 expected breaches. The script that read the seal used DAILY
    forecasts instead, 865 of them, each a 10-day window overlapping the next by nine days. On that sample
    the conditional model breached 16 times, a rate of 1.85 percent against 5 expected, and the coverage
    test rejected at p below 0.001 -- reported as FAIL. On the registered 21-day step the same model breaches
    2 times in 42, a rate of 4.76 percent at p 0.943, which passes. The registered design passes and the
    deviation fails.

    '
  why_it_parsed: 'The deviation looked like more data rather than less: 865 forecasts reads as a larger
    and therefore better sample than 42, and nothing in the code referenced the sampling the registration
    had fixed. It is the same overlapping-windows error this project criticises elsewhere, committed inside
    the one test whose entire value depends on being run exactly as written. Had the direction of the
    artifact been flattering rather than damning it would have been far harder to catch, because the instinct
    that saved it was disbelief at a failure, not a rule.

    '
  defence: 'A pre-registration that fixes a sampling scheme has to be executed by the code, not remembered
    by the person running it: the registered step belongs in the script as a constant read from the registration,
    so a deviation is a diff rather than an oversight. And a sealed test is exactly where post-hoc flexibility
    is least acceptable -- the defence for reporting the 21-day result is that the step appears in a registration
    committed before the read, and that defence would be worthless if the number had been chosen after
    seeing both.

    '
- id: trp-85
  found_on: 2026-09-03
  one_breath: A registered secondary statistic compared a label against the variable that defines it.
  affected_sources: []
  symptom: 'The crash inventory''s registration asked, as a secondary, whether the leg share separates
    Route 1 from Route 2 episodes better than the market return does, on the reasoning that the leg share
    is the discriminator this framework adds and the market return is the one it inherits. The run returned
    an AUC of 1.000 for the leg share against 0.9986 for the market return, which looks like a clean win
    and is arithmetic. Route 1 is DEFINED as loser share at or above 0.60 and Route 2 as winner share
    at or above 0.60, which is loser share at or below 0.40, so the labels are a deterministic function
    of the variable being scored and the AUC could not have been anything but 1.000. The market return''s
    0.9986 is nearly as circular, since Route 1 requires the market to have risen.

    '
  why_it_parsed: 'The circularity is in the registration, not in the code, so every check that guards
    the code passed: the statistic was pre-stated, the direction was fixed in advance, the computation
    is correct. A pre-registered statistic carries an implicit warrant that someone checked it could fail,
    and that check had not happened. The number is also the flattering kind, a perfect score for the project''s
    own contribution against the literature''s, and a flattering number gets read past.

    '
  defence: 'A statistic whose value can be derived from the definitions of the labels it scores is not
    a test, and the registration review needs a step that asks, of every proposed comparison, what input
    would make it fail. The number is reported with the void note attached rather than deleted, because
    a registration that produced a meaningless statistic is part of the record of how the registration
    was written.

    '
- id: trp-86
  found_on: 2026-09-03
  one_breath: The page the memo says is machine-composed and numeral-checked is hand-typed.
  affected_sources: []
  symptom: 'Section 2.1 states as a principle that deterministic code produces every statistic on the
    page and that a tokeniser rejects any page where a numeral in the prose fails to match a computed
    field, and Appendix D gives the composer role a numeral canary whose one mismatch fails the build.
    Neither exists in code. The example risk output carries 130 numerals in its body, 84 of them distinct,
    and the composer computes about a dozen: the sector screen, two volatility aggregates, four counts
    and the analogue table. Every headline number is a string literal typed into the source -- the conditional
    and unconditional VaR, the expected shortfall, both control rates, the comomentum reading and its
    percentile, the short-volume and ETF-flow readings, the corpus and universe sizes, and the leg counts
    the percentages are computed from. The numbers are correct, in that each was computed somewhere and
    transcribed; what does not exist is the mechanism that would catch it when one of them stops being
    correct.

    '
  why_it_parsed: 'A transcribed number and a computed number render identically, and the page is the one
    artifact nobody diffs against its own generator because reading it IS the check people perform. The
    claim in the memo made it worse rather than better: a stated principle reads as a description of the
    code, so the sentence about the tokeniser was itself the reason nobody looked for the tokeniser. This
    is the same fault as the hand-typed percentiles logged earlier in this register, committed in the
    deliverable rather than in a working note, and it is the fault the register exists to catch: the claim
    was checkable at any point by grepping the composer for a literal.

    '
  defence: 'Compose the page over a field registry where every number carries its value, the file that
    produced it, the command that reproduces it and, where it came from a document, the verbatim span
    and the accession. Then run the tokeniser the memo describes: scan the rendered page, match every
    numeral against a registered field or a declared definitional constant, and fail the build on the
    first that matches neither. The registry then does a second job for free, since a page whose every
    number knows its own provenance can be rendered so a reader clicks a number and sees the field behind
    it.

    '
- id: trp-87
  found_on: 2026-09-03
  one_breath: A market series divided by a hundred twice made a conditional model equal its own baseline.
  affected_sources:
  - src-french
  symptom: 'The French loader already converts percentages to decimals, so a caller that divides the market
    series by a hundred again scales it by a further hundred. Two callers did: the sealed holdout script
    and the severity command line. A linear quantile fit is equivariant to rescaling a regressor, so the
    fitted values are untouched and the bug is invisible in every output that depends only on them. The
    bear-state indicator is not: it is a sign test on a compounded trailing return, and it flips on 3.1
    percent of days between the two scalings. The consequence lands on a headline. On the sealed holdout
    at the registered forecast step the conditional model breached 2 of 42 at a rate of 4.76 percent with
    an unconditional coverage p of 0.943 -- numbers identical, to four decimal places and in both interval
    bounds, to the UNCONDITIONAL baseline computed on the same dates. Under the corrected scaling the
    conditional model breaches 1 of 42 at 2.38 percent with p 0.388, and the baseline still breaches 2.
    The registered verdict is unchanged and the holdout still passes, because the interval contains 0.05
    either way. What changes is that the model is now distinguishable from the baseline it is supposed
    to beat, where under the bug it was numerically identical to it.

    '
  why_it_parsed: 'Every consequence of the bug was either invisible or flattering. Scale-equivariance
    hid it from the fitted values, which is most of what anyone inspects; the bear flag it did corrupt
    is a binary column nobody reads directly; and the corrupted result was CLOSER to the nominal rate
    than the correct one, so the pass looked stronger rather than weaker. The one signal that something
    was wrong -- a conditional model reproducing its own baseline to four decimal places -- is the kind
    of coincidence that reads as reassuring agreement rather than as a defect, and it sat in a committed
    artifact through a full write-up.

    '
  defence: 'A loader that has already converted units should say so in a way a caller cannot miss, and
    the conversion should happen once, at the boundary, rather than being reapplied on trust. Beyond that:
    when a conditioned model and its unconditional baseline agree to four decimal places on the same sample,
    that is a finding to chase and not a result to report. The comparison is cheap, it is the whole point
    of printing a baseline, and nothing in the process forced anyone to look at the two numbers side by
    side until a separate check made it unavoidable.

    '
- id: trp-88
  found_on: 2026-09-03
  one_breath: A headline market return was taken from the previous session, and it read as zero.
  affected_sources:
  - src-french
  symptom: 'The example page and the memo body both state that on 9 November 2020 the market moved +0.01
    percent while the factor lost 14.39 percent in the session, and use the pairing to argue that the
    loss was not the market term. The factor return is right. The market return is the 6th of November''s.
    On the 9th the total market return was +0.83 percent, and the day was also a 6.73 percent value move,
    the largest in the sample. The claim survives and is stronger once computed rather than asserted:
    the book''s conferred market-beta spread at the formation date was -0.300 winner minus loser, so the
    market term contributes -0.25 percent of the -14.39 percent session, which is 1.7 percent of the loss.
    Ninety-eight percent of it sat elsewhere, and that is a measurement where "the market did not move"
    was a flourish.

    '
  why_it_parsed: 'An adjacent trading day''s value is the hardest kind of wrong number to see, because
    it is the right order of magnitude, the right sign convention and the right series -- only the row
    is wrong. It was also the number the argument wanted: +0.01 percent reads as "nothing happened in
    the index", which is a cleaner story than +0.83 percent, so the figure that flattered the point was
    the one that went unchecked. It survived into the memo body and onto the deliverable page, and it
    was only found when the page was rebuilt to compute every number it prints instead of carrying typed
    ones.

    '
  defence: 'The general defence is the one being built here: a page that computes its own numbers cannot
    hold a value from an adjacent row, because the row is selected by the same code that prints it. The
    specific lesson is that a decomposition claim should print the decomposition. Stating a market return
    beside a factor return invites the reader to do the arithmetic in their head; doing it on the page
    -- beta spread times market move, as a share of the loss -- would have surfaced the error immediately,
    because -0.300 times +0.01 percent is not a quantity anyone would bother to write down.

    '
- id: trp-89
  found_on: 2026-09-03
  one_breath: A numeral highlighter rewrote the page it was meant to annotate, and the check said PASS.
  affected_sources: []
  symptom: 'The example output is composed over a field registry and gated by a tokeniser that fails the
    build on any numeral matching no computed field. It reported PASS. The page a reader saw in the browser
    opened with "MOMENTUM REVERSAL RISK - formation 2020--9.47%63-5.80%-31". The viewer highlighted numerals
    by replacing each matched string throughout the document, so the registered field for ten GICS sectors
    matched the 10 inside the date 2020-10-31, the field for 263 names matched inside other numbers, and
    the placeholder tokens used to stage the replacements themselves contained digits that later keys
    matched in turn. Clicking the resulting span returned a real provenance card for a number that was
    not there. Every headline figure on the deliverable was corrupted, deterministically, in any browser.

    '
  why_it_parsed: 'The canary and the renderer read different things. The canary scanned the source text
    the composer produced, which was correct; the reader looked at a DOM the renderer produced from it,
    which was not, and nothing compared the two. The verification that was performed made it worse: the
    span COUNT was checked and one span was clicked, and both passed, because the corruption creates more
    spans rather than fewer and the distinctive keys resolve correctly. Counting the output of a transform
    and inspecting one element of it is not the same as checking the transform, and here the difference
    was the entire deliverable.

    '
  defence: 'Do not annotate text by string replacement. The server emits the page already split into consecutive
    segments, each plain or carrying one traced field, and the renderer only wraps them -- so offsets,
    not matches, decide what is highlighted. A test then asserts that reassembling the segments reproduces
    the page character for character, which makes the fault unrepresentable rather than fixed. And the
    general rule: a check that guards a rendering must assert against the rendered artifact, not against
    the input to the renderer.

    '
- id: trp-90
  found_on: 2026-09-03
  one_breath: A ratio was reported wherever it computed, including where its denominator was noise.
  affected_sources:
  - src-french
  symptom: 'The crash inventory decomposes each episode''s loss into a winner-leg and a loser-leg share.
    Episodes are detected on the 2x3 momentum factor; the shares are computed from the ten-portfolio decile
    file, which is a different construction. On two episodes the two disagree sharply -- at 2011-08-08
    the factor fell 4.68 percent while the decile spread fell 0.65, and at 2009-02-09 it fell 5.75 against
    0.47 -- so the shares divide by a denominator near zero and take values of -34.7 and +5.7. Both were
    assigned a route by the rule, on a decomposition that carried no information. They sat unflagged in
    a 195-row table until an independent reviewer reading the dashboard asked whether a loser share of
    -34.69 was real.

    '
  why_it_parsed: 'The quantity is a share, so a reader''s prior is that it lies in [0, 1], and the two
    rows that did not were two rows out of 195 in a table nobody was expected to read line by line. The
    construction difference between the two French files is documented elsewhere in this project and was
    treated as a caveat on agreement rather than as a live hazard to a ratio built across them. And the
    guard that would have caught it is not a statistical test but arithmetic hygiene: a ratio is interpretable
    only where its denominator is, and nothing in the pipeline asked that question of this one.

    '
  defence: 'A computed ratio needs a stated validity condition on its denominator, and the condition should
    be expressed relative to the quantity itself rather than as a new absolute constant. Here the decile-based
    loss must be at least half the episode''s own depth, which excludes two of 195 and leaves the headline
    unchanged: the fits-none share moves from 44.1 to 44.6 percent and the verdict stands. The excluded
    rows are labelled NO-DECOMPOSITION rather than dropped, and the condition has its own planted control
    alongside the four route cases, so it is checked rather than trusted. It is a post-hoc addition and
    is recorded as one.

    '
- id: trp-91
  found_on: 2026-09-04
  one_breath: A published weight column rounds to zero, and dropping the zeros deletes the leg's whole
    point.
  affected_sources:
  - src-iwv
  symptom: 'iShares reports each holding''s weight to two decimal places, so every position under 0.005
    percent of the fund is published as exactly 0.00. On a typical date that is 1,184 of 2,683 names.
    Building the reconstructed book''s daily return series by cap-weighting within each leg and dropping
    names with no weight therefore silently dropped sixty percent of the loser leg and forty percent of
    the winner leg: the book was marked on 55 loser names out of 235 rather than on all of them. The names
    removed were exactly the smallest and most distressed, which is the half the short leg exists to hold,
    and the direction of the bias is the one this project already documents and complains about elsewhere.
    Weighting by quantity times price instead, which is unrounded and positive for every one of those
    names, restores all 254 names per leg per day and raises the series'' correlation with the published
    factor from 0.860 to 0.877 daily and 0.792 to 0.828 monthly.

    '
  why_it_parsed: 'A weight of zero is a legitimate value, not a missing one, so nothing raised. The resulting
    series had a plausible volatility and a high correlation with the published factor, and the per-day
    coverage statistic that would have caught it -- the share of leg WEIGHT priced -- read a reassuring
    0.000 percent missing, because the dropped names carried no weight by construction. The statistic
    was measuring the consequence of the bug rather than the bug. What exposed it was a different number
    entirely: a mean of 55 loser names per day against a membership of 235, printed beside the volatility
    for unrelated reasons.

    '
  defence: 'Prefer an unrounded quantity to a published percentage whenever both are available, and treat
    a rounded field as censored rather than as measured. More generally, a coverage statistic weighted
    by the same quantity that is broken cannot detect the break: coverage should be reported by COUNT
    beside by weight, because the two disagree exactly when something is wrong.

    '
- id: trp-92
  found_on: 2026-09-04
  one_breath: Every conferred-exposure result measures an equal-weighted book the design specifies as
    value-weighted.
  affected_sources:
  - src-iwv
  symptom: 'The design states the book is "value-weighted within each leg, dollar-neutral, rebuilt monthly",
    the memo describes it that way, and the daily book return series built this session implements it
    that way. Every measurement path that produces a conferred-exposure number does not: `current_book.py`,
    `gap01_family.py`, `build_reference_panel.py`, `same_rule_null.py` and `factor/placebo.py` all aggregate
    a leg with `.mean(axis=1)`, which is equal weighting. The results resting on that path include the
    live reading that the book is long index concentration at z 15.4, the eight-series family test that
    cleared 108 of 108, the single-series test at 105 of 137, and the same-rule null''s 42.6 percent.
    The choice is load-bearing rather than cosmetic. Re-scoring the identical names value-weighted over
    24 month-ends moves the concentration z from a median of 16.0 to 2.9 and its rank among the eight
    series from first on 22 of 24 dates to first on 11. The real loading actually RISES under value weighting,
    from 0.306 to 0.532; what changes is the placebo, whose mean rises tenfold, because cap-matched random
    books value-weighted reproduce the concentration the real book has. Equal-weighted, the real book
    sits at the 100th percentile of a placebo band of [0.004, 0.058]; value-weighted it sits at the 84th
    of [0.022, 0.698].

    '
  why_it_parsed: 'The code is internally consistent and reproduces its own artifact to machine precision,
    so nothing was broken in a way any test could see. The weighting appears nowhere in the output: a
    z-score does not carry the aggregation that produced it, and the one place a reader would look for
    it, the printed top-ten holdings, is labelled "by index weight" and so implies value weighting while
    the returns behind the number are equally weighted. Both descriptions live in prose -- the spec, the
    memo -- and the prose was never diffed against the aggregation.

    '
  defence: 'A construction that appears in a design document must be asserted in code at the point of
    measurement, not restated in prose beside it. The aggregation belongs in the artifact: every conferred-exposure
    record should carry the weighting it used and the weight norm of the leg, so a reader can see which
    book produced the number. Until each of the four results above is either re-run value-weighted or
    relabelled as equal-weighted, none of them should be quoted as a property of "the book" without the
    weighting named in the same sentence.

    '
- id: trp-93
  found_on: 2026-09-04
  one_breath: The placebo's capitalisation match was made on a column that is zero for half the universe.
  affected_sources:
  - src-iwv
  symptom: '`current_book.py` and `gap01_family.py` pass `weight_pct` as the capitalisation series to
    `placebo.random_matched`, which buckets it with `pd.qcut(c.rank(method="first"), 10)`. The column
    is exactly 0.00 for a median 52.7 percent of the universe and 48.2 percent of the winner leg, because
    iShares publishes weights to two decimal places. Ranking with `method="first"` breaks the resulting
    mass of ties by index order, so the bottom five capitalisation buckets are an arbitrary alphabetical
    partition rather than a capitalisation match. The null the headline z is measured against is therefore
    not matched on the dimension it claims to be matched on, for half the universe. Re-running the whole
    grid with capitalisation as market value from quantity times price does not change the conclusion
    of the experiment it was found in, and the trap is recorded anyway because the null is quoted elsewhere
    as cap-matched.

    '
  why_it_parsed: 'This is the same censored-column fault already logged for the book''s weights, at a
    second site nobody had looked at, and it is invisible for the same reason: zero is a legitimate weight,
    so nothing raised, and the matching still produced ten buckets of the right size. A tie-breaking rule
    that silently orders half the data alphabetically leaves no trace in any summary statistic of the
    match.

    '
  defence: 'When a matching variable has ties, the count of tied values belongs in the match''s own diagnostics,
    and a match on a variable that is constant across half the sample should fail loudly rather than partition
    on index order. More generally, once a censored column has been found in one place, the fix is to
    grep every consumer of that column rather than to repair the site where it was noticed.

    '
- id: trp-94
  found_on: 2026-09-04
  one_breath: The page cited a calibration computed on its own future, then described it wrongly.
  affected_sources: []
  symptom: 'The example page for the 2020-10-30 formation printed the scaled line''s coverage as 6 breaches
    of 81 at a Kupiec p of 0.352 and the unconditional line''s as 11.11 percent at 0.028, and concluded
    in prose that the unconditional quantile is the miscalibrated one. Both figures are computed over
    the whole design tier, which runs to December 2022. A page dated October 2020 cannot cite a statistic
    that uses two more years of its own future. Recomputed on formations strictly before the page date
    the two lines are IDENTICAL: 5 breaches of 54, 9.26 percent, Kupiec p 0.197, for both. They breach
    on the same formations. So the sentence saying the unconditional line was miscalibrated was not merely
    unsupported at that date, it was false; the divergence appears later in the tier and a reader standing
    on the page date could not have known it. The words "passes" and "fails" were also typed into the
    prose beside the numbers rather than derived from them, which is how the contradiction survived being
    read.

    '
  why_it_parsed: 'The numeral canary passed the page, because every numeral on it did resolve to a registered
    computed field -- the fields were simply computed over the wrong window. The canary checks NUMBERS
    and not CLAIMS, and a verdict word is a claim: "fails" beside a p of 0.197 is a hand-typed conclusion
    that no numeral check can see. The point-in-time discipline the project applies rigorously to model
    inputs had not been applied to a statistic quoted on an output.

    '
  defence: 'Anything a page asserts about its own reliability must be computed on data available at the
    page''s date, exactly as its inputs are, and the register''s later figure is a different claim that
    has to be labelled as later. Verdict words must be derived from the statistic in code and never written
    into prose, so a sentence cannot drift from the number beside it. And the canary should be understood
    for what it is: a guarantee about provenance of numerals, not about the truth of the sentences containing
    them.

    '
- id: trp-95
  found_on: 2026-09-04
  one_breath: Market value was computed from split-adjusted prices times unadjusted share counts.
  affected_sources:
  - src-iwv
  symptom: 'Position weights were built as price times quantity using the SPLIT-ADJUSTED price series.
    Split adjustment rescales prices backwards through the history, so multiplying an adjusted price by
    the unadjusted share count on the holdings file is not a market value and is not anything: it is the
    market value scaled by the cumulative split factor since that date. On a name that later reverse-split,
    the error is large and one way -- a single position took a twentyfold weight. The weight norm at 2017-12-31
    moves from 0.6748 to 0.3785 once caps and weights are taken from raw prices while returns keep the
    adjusted series. This is the same figure a reviewer had flagged as suspicious thin-panel concentration.
    It was neither thin panels nor concentration; it was a units error inside the weight.

    '
  why_it_parsed: 'Both series are prices, both are positive, and the product has the right shape and roughly
    the right order of magnitude for most names, because most names never split. The error is invisible
    except on the minority that did, and there it looks like a genuinely concentrated position rather
    than a mistake -- which is exactly how it was first diagnosed. Adjusted prices are the correct input
    for RETURNS, so the series was right for the calculation next to it.

    '
  defence: 'Adjusted and raw price series are different quantities and should not share a variable name.
    Returns take the adjusted series; capitalisations, weights and anything ranked by size take the raw
    one. A weight whose norm moves by a factor approaching two when the price convention changes is the
    diagnostic, and comparing the two conventions on the same date should be a standing check wherever
    a weight is built.

    '
- id: trp-96
  found_on: 2026-09-04
  one_breath: The news windows for each episode were mostly dated after the formation they informed.
  affected_sources:
  - src-gdelt
  symptom: 'The stored GDELT episode files span roughly two months before the event to two weeks after
    it, because they were assembled to describe episodes rather than to inform formation dates. Between
    60 and 94 percent of the titles in each file postdate the formation date the theme pipeline was reading
    them for. Used unfiltered, the theme on a formation date would have been built substantially from
    news published after it -- the cleanest possible look-ahead, inside the one input whose whole justification
    is that it is timestamped. Titles after the formation date are now dropped, which is what leaves several
    dates with too few news statements for any cluster to reach the design''s minimum membership.

    '
  why_it_parsed: 'The corpus was built for a different purpose and was correct for that purpose, so nothing
    about the files was wrong. The point-in-time discipline this project applies rigorously to prices,
    holdings and filings had not been applied to the news corpus, because the corpus was inherited as
    an episode description rather than as a feature input. A window named after an episode invites the
    assumption that it precedes the episode.

    '
  defence: 'Any corpus promoted from description to feature has to be re-dated against the date it will
    inform, not against the event it was collected for, and the share of records that survive that filter
    belongs in the record. The general rule this project already applies elsewhere is that availability
    is a property of the use, not of the file.

    '
- id: trp-97
  found_on: 2026-09-07
  one_breath: The page's provenance labelled every repeated numeral with one field, so a reader clicking
    a number could be told the wrong thing about it.
  affected_sources: []
  symptom: '`Registry.by_text()` returned one field per rendered string, so when several registered fields
    render the same text the last one registered silently won. On the 2020-10-30 page that put a single
    label on 30 of 67 numeral occurrences: both lines'' 9.26% breach rate carried the unconditional line''s
    label, both Kupiec p values of 0.197 carried the unconditional line''s, and the two 263s -- names
    in the long leg and names in the short leg -- carried the loser leg''s. The printed values were all
    correct and the canary reported PASS, because the canary asks whether a numeral matches a computed
    field and every one of them did. What was wrong was the answer given to a reader who asked which field.

    '
  why_it_parsed: 'A dict keyed by rendered text always builds, and a collision is a silent overwrite rather
    than an error. The page reads correctly, the check passes, and the defect is visible only by clicking
    a number and reading a label that belongs to a different number. It is worse than an unlabelled figure
    precisely because the provenance file is the artifact that makes the page traceable: a wrong label
    there reads as traced.

    '
  defence: 'Nothing in the page''s own text distinguishes one occurrence of `9.26%` from another, so the
    matcher cannot resolve them and must not pretend to. `by_text()` now returns every candidate field
    and `_resolve()` marks the occurrence AMBIGUOUS, listing each candidate with its label and its reproduce
    command. Nine occurrences on the current page say so. The general rule: where an index can collide,
    the collision is reported, not resolved by registration order. A provenance layer may say "I cannot
    tell"; it may not guess.

    '
- id: trp-98
  found_on: 2026-09-07
  one_breath: A shipped deliverable quoted an extraction result from a scratch log, and the numbers belonged
    to no run that exists.
  affected_sources: []
  symptom: 'The package''s AI-use log printed the model-versus-rule comparison as recall 21.7% against
    60.0% and specificity 100.0% against 60.0%. Neither pair is in any committed file. The registered
    arm, reports/poc/e4_summary.json, gives recall 19.2% against 54.2% and specificity 97.5% against 62.5%;
    the superseded incongruous-plant design gives 16.7% against 63.3% and 100% against 60%. So the specificity
    pair was the SUPERSEDED run exactly and the recall pair was neither run -- the table had been copied
    from a scratch log of an intermediate execution whose outputs were never committed. The direction
    of the finding survived, which is why it read as plausible: the rule beats the model on recall and
    loses on specificity in every version. A reader reconciling the deliverable against the artifacts
    found it, not any check here.

    '
  why_it_parsed: 'Every other number in the package is rendered from a committed artifact at build time.
    This document was written by hand as prose, so nothing rendered it and nothing checked it, and a markdown
    table of plausible percentages looks identical whether or not the file it came from still exists.
    The fault is worse for its location: it was committed INSIDE the document whose subject is how each
    output was checked, in a package that has a section explaining that an earlier README went stale for
    exactly this reason.

    '
  defence: 'A number in a shipped document is either rendered from an artifact at build time or it is
    a hand-typed number waiting to go stale, and prose is not an exemption -- the numeral canary covers
    the page and the README template covers the README, while this file had neither. The AI-use log is
    now a template rendered from reports/poc/e4_summary.json like the README, so a renamed or missing
    field stops the build. The second rule: where two runs of one experiment exist, the artifact naming
    says which is registered and which is superseded, and the rendered text names the file it came from
    so a reader can reconcile it in one step rather than by pattern-matching percentages across two files.

    '
- id: trp-99
  found_on: 2026-09-07
  one_breath: A control arm read different documents from the treatment arms while the code and the register
    both said it re-read the same ones.
  affected_sources: []
  symptom: 'In the constructed-ground-truth extraction test the host index `hi` was initialised once above
    the arm loop rather than inside it, so the three arms -- unplanted re-read, planted condition, planted
    boilerplate -- consumed disjoint slices of the shuffled host list. Measured overlap between the control
    and the two treatment arms is 3, 3 and 0 of 120. The script printed "CONTROL, same hosts re-read with
    nothing added" and the registration said "the same 120 documents". The recall lift was therefore a
    difference between independent samples rather than a paired one, and the paired reading it was given
    does not hold: +10.0 points with a 95 percent interval of [-4.6, +24.6], p = 0.18.

    '
  why_it_parsed: 'The loop ran, the arms filled, every count came out at exactly the 120 requested, and
    the resulting rates were all plausible and in the expected direction. Nothing about the output distinguishes
    three arms over one document set from three arms over three. The comment beside the bug asserted the
    property the bug removed, so reading the code around it confirmed the wrong belief rather than exposing
    it.

    '
  defence: 'A control arm''s defining property is that it differs from treatment in exactly one respect,
    and that property has to be ASSERTED rather than assumed from the shape of the loop that builds it.
    The fix is one line -- reset the index per arm -- but the check that would have caught it is a test
    that the arms'' document sets are identical, which costs nothing and was never written. Where a comment
    states an invariant, either the code enforces it or a test does; a comment alone is a claim, and this
    one was false for the whole life of the result.

    '
