    missing", and the eager evaluation of defaults is a well-known Python behaviour that is
    nonetheless invisible at the call site. The except existed for a real reason -- a malformed
    filing should not stop a 55,000-document pass -- and it is exactly that reasonableness which
    let it hide a programming error among the genuine data failures. A zero is also the most
    plausible-looking wrong answer available: sections DO fail to extract, so 0 percent invited a
    regex explanation rather than a stack trace.
  defence: >
    Never put a subscript in a get default; resolve the key first. And separate the two kinds of
    failure in the handler: a missing pattern is a bug and must re-raise, while a malformed
