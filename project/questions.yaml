# Open questions, in priority order. Each names what would close it.

- id: q-01
  question: Does anything beat trailing volatility at forecasting how bad a reversal will be?
  one_breath: >
    Six candidate signals have lost to plain trailing volatility. Is that a fact about the
    world or about this sample?
  priority: 1
  state: answered
  why_it_matters: >
    This is the load-bearing claim of the whole project. If nothing beats trailing
    volatility, then the honest system is a simple one plus an explanation layer, and
    saying so is worth more than a complicated system that quietly does not work.
  would_close_it: >
    It cannot be closed by another test at this sample size. It is closed by stating the
    boundary precisely: no return-derived feature beats it here, and here is the measured
    status of every family that is not return-derived.
  experiments: [exp-003, exp-005, exp-012, exp-013, exp-014]

- id: q-02
  question: Does the price of crash protection on the book's own holdings move before a reversal?
  one_breath: >
    Option prices on the actual holdings could reveal crowding that market-wide indices
    cannot see. No free history exists to test it.
  priority: 4
  state: parked
  why_it_matters: >
    The market-wide version of this measure failed precisely because it averages over the
    whole market. Measuring it on the book's own holdings is the natural repair, and it is
    the one candidate family that is neither return-derived nor testable today.
  would_close_it: >
    Years of daily option surfaces on individual stocks. The capture running now will
    reach a testable length in about three years, or the history can be bought.
  experiments: [exp-017, exp-021]

- id: q-03
  question: Does text about the companies the book holds carry information the market-level text did not?
  one_breath: >
    Commentary about factors was empty. Text about the individual holdings is a different
    corpus and has never been tested.
  priority: 1
  state: answered
  why_it_matters: >
    The assignment requires a timestamped text source, and right now the text story is a
    refutation plus an unused capability. This is the space that refutation explicitly left
    open, and the measured precision of language-model filtering is what makes reading a
    corpus this size feasible at all.
  would_close_it: >
    First a working attribution rule: cap any entity's share of the corpus, exclude
    publisher names, and filter for aboutness with the model measured at sixteen times
    keyword precision. Then the case-control against matched calm windows. The corpus is
    already on disk, so the remaining cost is the filter and not the download.
  experiments: [exp-020, exp-022, exp-023]

- id: q-04
  question: Do catalysts specific to this book's own holdings carry timing information?
  one_breath: >
    A market-wide calendar cannot tell two portfolios apart. Does the calendar of the
    actual holdings do better?
  priority: 3
  state: answered
  why_it_matters: >
    The central bank calendar was already refuted, and the diagnosis was that such dates
    are identical for every portfolio. Earnings dates of the actual holdings vary between
    portfolios, so this tests the same idea on a variable that can genuinely discriminate.
  would_close_it: >
    The same grid of horizons and thresholds used for the calendar test, with the same
    correction for multiple testing, applied to earnings clustering instead.
  experiments: [exp-014]

- id: q-05
  question: Does the momentum fund's contractual rebalancing schedule predict its own stress?
  one_breath: >
    The largest momentum fund must trade on published dates, with an emergency trigger in
    volatile markets. That is unusually knowable in advance.
  priority: 3
  state: open
  why_it_matters: >
    Contractual, dated and specific to momentum is a rare combination, and it is not
    derived from past returns, which is the property every failed candidate shared. The
    holdings are already on disk and turnover spikes date the rebalances.
  would_close_it: >
    Overlaying dated rebalances on the drawdown record using the same grid machinery. A
    null is an acceptable and reportable outcome.
  experiments: []

- id: q-06
  question: Should the remaining layers be judged on prediction or on explanation?
  one_breath: >
    Trailing volatility already won the forecasting contest. Judging later layers on
    forecasting would guarantee they fail.
  priority: 1
  state: answered
  why_it_matters: >
    Applying a forecasting test to a layer whose value is explanatory would kill useful
    work for the wrong reason, and would waste the one genuinely instructive case the
    project has.
  would_close_it: >
    A decision, taken and recorded. The gate is now whether a layer would have changed the
    September 2019 briefing, which is a falsifiable question with a known answer.
  experiments: [exp-007]

- id: q-07
  question: Does option skew on the losing side track short interest, or just the cost of borrowing?
  one_breath: >
    Expensive downside protection on hard-to-borrow stocks may anticipate a squeeze, or may
    simply price the borrow. The two look identical.
  priority: 2
  state: answered
  why_it_matters: >
    This is the one option test that needs no history, because it compares stocks against
    each other on a single day rather than tracking one measure over time. It is also the
    place where a plausible signal has a mechanical explanation that must be ruled out first.
  would_close_it: >
    A rank correlation across the losing side on one snapshot against short volume, with
    company size and volatility level held constant, and the borrow-cost explanation
    stated as the competing reading rather than discovered afterwards.
  experiments: [exp-016, exp-019]

- id: q-08
  question: Should the held-out episode windows be opened to give the text measure more power?
  one_breath: >
    Three of four crowded rotations are held out. Opening them would add power to a measure
    already flat on the open tier.
  priority: 1
  state: answered
  why_it_matters: >
    The tier protocol is only worth anything if it binds when a look would be convenient.
    This is the first time opening the held-out sample would have been genuinely useful,
    which makes it the first real test of whether the protocol is a credential or a
    decoration.
  would_close_it: >
    A decision, taken and recorded. Taken: they stay sealed. Spending an irreplaceable look
    to add power to a measure that is flat on the open tier, was built through the wrong
    basket, and is underpowered by an order of magnitude is the worst trade available. Three
    unopened windows with the reason on the record are a stronger artefact than any result
    the look could have produced.
  experiments: [exp-020, exp-022, exp-023]

- id: q-09
  question: Does the finding that nothing beats trailing volatility survive the same audit the text work just failed?
  one_breath: >
    Six candidates were each tested in one functional form on one metric. That is the
    specification problem that just invalidated a text null.
  priority: 1
  state: open
  why_it_matters: >
    This is the spine of the project and of the memo. Every candidate was compared in a
    single additive form at one horizon and one quantile, with no positive control
    establishing that the framework could detect a signal if one existed, and with
    overlapping evaluation windows treated as independent. The first of those three is now
    measured and costs the result a third of its effective sample. If the other two move it
    as much, the central claim needs restating before anything is written around it.
  would_close_it: >
    The audit already applied to the text work: a positive control injecting a known
    predictable component to establish the detection floor, a specification curve across
    horizons, quantiles and functional forms, and overlap-corrected inference throughout.
  experiments: [exp-003, exp-005]

- id: q-10
  question: Can the estimand move from rare events to distributional calibration?
  one_breath: >
    Every conditional test here collapses to a handful of episodes. Calibration uses every
    day, so it is not bounded the same way.
  priority: 1
  state: open
  why_it_matters: >
    The binding constraint is not data volume, it is independent episodes, and no amount of
    text or options changes it. But the constraint applies to RARE EVENT prediction, not to
    distributional fit. The volatility model already passes coverage tests with a constant
    skewness parameter across 325 forecasts. Whether letting skewness vary with state
    improves calibration is a question answered by every day in the sample rather than by
    two dozen episodes, and it targets the one failure the model is documented to have:
    under-alarm at crowded rotations.
  would_close_it: >
    Fit the volatility model with skewness driven by state rather than held constant, and
    compare coverage and pinball loss against the constant-skew version on the same 325
    out-of-sample forecasts. The comparison is paired and daily, so the episode count does
    not bound it.
  experiments: [exp-004]

- id: q-11
  question: >
    Can crowding be measured directly from institutional holdings, rather than inferred from
    the return correlations it is supposed to cause?
  one_breath: >
    Comomentum infers crowding from prices; 13F reports the positions themselves, and the
    two should be checkable against each other.
  priority: 1
  state: open
  why_it_matters: >
    Every crowding measure in this project so far is derived from returns, which means it
    can only see crowding through the same prices whose behaviour it is meant to explain.
    Holdings are the underlying quantity. If a holdings measure and a price-derived measure
    agree, the price-derived one earns its longer availability and lower lag; if they
    disagree, the disagreement locates which one is picking up something else.
  would_close_it: >
    A holdings-derived crowding measure computed on both momentum legs across the quarters
    spanning a known crowded unwind, with size matching, together with its correlation
    against the price-derived comomentum series over the years where both exist. Agreement
    licenses the cheaper measure; disagreement locates what one of them is really tracking.
  bearing_on: [clm-mechanism-map]

- id: q-12
  question: >
    Does the sign of the leg-versus-short-interest relationship identify a distinct momentum
    regime?
  one_breath: >
    The leg-versus-short-interest relationship inverts whenever the momentum formation window
    spans a large drawdown.
  priority: 1
  state: open
  why_it_matters: >
    Across 195 settlement dates the momentum loser leg carries more days-to-cover than
    size-matched winners on 166 of them, which is the ordinary state and close to definitional.
    The exceptions are not scattered: seventeen of twenty-nine fall between April and October
    2020, where the direction reverses outright, and on 2020-08-31 the winner leg holds
    Camping World, Overstock, Sorrento and Teladoc at a median 6.29 days to cover against the
    losers' 4.89.
    The first reading of that was too strong and is recorded here because it was nearly
    published as a regime marker. Varying the formation window shows the inversion tracks the
    window rather than the calendar. At 2020-10-30 the difference runs -1.32 on a twelve-month
    formation that spans the March crash, +0.35 on six months, and +1.42 on four months, which
    is the ordinary direction restored. Control dates in 2019 and 2022 sit between +1.3 and
    +1.8 at every window. So this is mostly the known post-crash momentum pathology -- a sort
    formed across a crash selects rebound names, and the rebound names were the heavily shorted
    high-beta ones -- rather than a distinct squeeze state.
    A second pass sharpened this into something general. Running every date under both a
    twelve-month and a six-month formation leaves the overall rate almost unchanged, 85.9
    percent against 85.4, but MOVES which years fail. Under twelve months 2022 is perfect and
    2021 is 75 percent; under six months 2021 rises to 96 and 2022 falls to 58, because a
    six-month window ending in mid-2022 spans that bear market where a twelve-month one ending
    there does not. The failures follow the drawdown through the window rather than sitting in
    any particular year.
    So the statement worth keeping is neither of the first two. It is that the leg-versus-short-
    interest relationship weakens or inverts whenever the momentum formation window spans a
    large drawdown, confirmed now in two separate periods under different windows, which is the
    post-crash momentum pathology showing up in ownership rather than in returns.
  would_close_it: >
    A test holding the formation window fixed in months and asking whether any inversion
    survives, across every episode where the sort spans a drawdown. If the sign is fully
    explained by whether the formation window contains a crash, the question closes as a
    restatement of the post-crash momentum pathology and nothing more.
  bearing_on: [clm-mechanism-map]


- id: q-key-overengineered
  question: >
    Is the three-block retrieval key worse than a single block, and if so was the whole
    multi-block state vector over-engineered for retrieval?
  one_breath: >
    Cross-sectional dispersion alone outscored the engineered three-block key in an
    exploratory sweep, and that cannot be claimed without its own registered test.
  priority: 2
  state: open
  why_it_matters: >
    The state vector is the foundation every later stage consumes, and it was gated on
    correctness and non-redundancy rather than on whether each block earns its place in a
    retrieval key. An exploratory sweep over the seven non-empty subsets of the deep arm,
    run on the registered forward-dispersion test at one month, gives: dispersion alone
    0.6527, dispersion+volregime 0.6393, volregime alone 0.6044, the full three-block key
    0.5941, mechanism alone 0.5740, dispersion+mechanism 0.5558. The best key is a SINGLE
    block and the engineered key is worse than it, by roughly two standard deviations of the
    block null.
    Two readings and this sweep cannot separate them. Either the multi-block key is
    over-engineered and dilutes a signal that lives in cross-sectional dispersion, or 0.6527
    is the maximum of seven correlated draws and regresses on a fresh test. Selecting the best
    of seven after seeing the results is the selection this project refuses elsewhere, so the
    number is recorded as exploratory and is not claimed.
    It also partly answers a standing criticism: the key is NOT simply a volatility proxy,
    because the volatility block alone scores below dispersion alone.
  would_close_it: >
    A registered comparison with the subset fixed in advance, scored against the corrected
    circular-block null at L=36 and L=120, and against recency -- which the full key already
    loses to. If dispersion alone also loses to recency, the finding changes nothing about
    what ships and simply simplifies the key.
