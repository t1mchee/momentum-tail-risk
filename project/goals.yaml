# ---- explicitly out of scope -----------------------------------------------------

- id: goal-timing
  requirement: Forecast when a reversal will occur
  one_breath: Predict the date, not just the damage.
  required: false
  state: null_result
  evidence: [clm-power, clm-fomc, clm-earnings-density]
  plain_status: >
    Deliberately not attempted, and the reason is measured rather than asserted. There have
    been too few reversals for any timing signal to clear statistical significance, and two
    separate calendar hypotheses were tested and refuted at that ceiling.
