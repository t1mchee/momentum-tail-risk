- id: goal-example
  requirement: One example risk output
  one_breath: A real briefing for a real date.
  required: true
  state: covered
  evidence: [exp-008]
  plain_status: >
    Covered by the briefing for the eve of the September 2019 reversal, which is the
    stronger exhibit precisely because the model was wrong that day and the briefing shows
