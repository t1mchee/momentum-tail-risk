# Where the work stands. This is the file that goes stale fastest and matters most to an agent
# landing cold, because everything else here describes what was LEARNED and this describes what
# is HAPPENING. Update it in the same commit as the work it describes.

- id: pha-0
  label: Phase 0 — instrument repair
  state: complete
  as_of: 2026-08-26
  covers: >
    Everything that had to be true before a large text run could be bought. Six items, all closed.
  items:
    - {state: done, note: "Screen re-run carrying section identity in every record, so a selection can be traced to the section it came from."}
    - {state: done, note: "Driver vocabularies rebuilt as taxonomy-v4. inflation_pricing reseeded on PHRASES rather than single words, because single-word seeds pulled polysemous matches across three drivers. Not dropped, because the 2022 inflation episode is a registered target."}
    - {state: done, note: "Screen-count table re-run under v4. Selectivity moved from 94 percent of the corpus to 56, a 3.8x reduction in what a full run would cost."}
    - {state: done, note: "Extraction prompt rewritten as a DUAL harvest -- open first, in the company's own words, then eight anchored themes -- and piloted three times on sixty passages across two tiers. Three schema versions; see clm-harvest-schema-honesty."}
    - {state: done, note: "Miss-rate batch submitted across two strata, never-selected and dropped-by-threshold."}
    - {state: done, note: "Severity-conditioning procedure CERTIFIED before either decisive test ran, then both tests run through it and BH-corrected. See pha-0-verdicts."}

- id: pha-0-verdicts
  label: The two decisive severity verdicts
  state: complete
  as_of: 2026-08-26
  covers: >
    Both were run through a procedure whose detection curve, false-alarm rate and null
    construction were measured first, on the same population. Both returned underpowered.
  items:
    - {state: done, note: "CERTIFICATE: on 1,877 forward observations from 92 DESIGN-tier month-ends, false alarm 0.033 against a nominal 0.05, and a smallest detectable effect at 80 percent power of 1.30 sigma -- a 0.0558 gap between the two halves' 5 percent quantiles, against an unconditional 5 percent quantile of -0.0430. The conditioning would have to roughly DOUBLE the crash before this procedure could see it."}
    - {state: done, note: "exp-051, conferred direction: statistic +0.0157, p_BH 0.983, underpowered. Opposite in sign to the registered direction and 28 percent of what the instrument can detect."}
    - {state: done, note: "exp-049, short crowding: statistic -0.0433, p_BH 0.983, underpowered. Also opposite-signed. Its estimate is 78 percent of the MDE and would be nominally significant TWO-sided at 0.033 -- against a procedure whose false-alarm rate is 0.033. Recorded as an observation, carried to Phase 4 as its own registration, and deliberately NOT promoted."}
    - {state: done, note: "Second inverted crowding intuition of the project, after the loser leg turning out more commonly co-owned than the winner. That pattern is worth one registration rather than two footnotes."}

- id: pha-1
  label: Phase 1 — the corpus run
  state: superseded
  as_of: 2026-08-27
  covers: >
    A roughly 47,000-passage dual harvest over the filing corpus, planned to power a
    transmission test from what firms disclose to what the book does. SUPERSEDED on
    2026-08-27: the adversarial-nulls result voided that rationale. Correlation-derived
    clusters explain more than twice the cross-sectional variance that news themes do,
    so no text corpus is going to earn its keep as a MEASUREMENT basis, at any size.
    What survives is the legibility role, and that needs a bounded slice rather than a
    full run. The user authorized a two-thousand-passage version at the sonnet tier on
    2026-08-27; it is registered, submitted and awaiting results, and it measures
    attribution coverage rather than transmission. The full run is not scheduled and
    should not be revived without a rationale that survives the kill rule.
  items:
    - {state: done, note: "Schema fixed and re-measured twice. harvest-v3 beats v1 on agreement across a strictly finer partition."}
    - {state: done, note: "Both tiers costed via Batch: opus $4,944 at ~22h, sonnet $1,592 at ~42h. The tiers converged under v3 -- detection agreement 0.917, direction 0.810, inversion screens 0.103 and 0.105 -- so the choice matters less than it did under v1."}
    - {state: done, note: "SUPERSEDED, not authorized. The bounded two-thousand-passage slice at the sonnet tier was authorized instead on 2026-08-27 and submitted the same day at an estimated 37.84 dollars against a 40 dollar cap. The opus recommendation for the full run stands unused; the full run's own rationale is void."}
    - {state: open, note: "During the run: commit every planned registration before its data exists."}
    - {state: open, note: "NOT fixed, recorded instead: credit_refinancing is the one theme still below 0.825 agreement, at 0.684, because one label spans the company's own refinancing cost, its customers' ability to pay, and its investment portfolio's credit risk. A taxonomy question, not a schema one. A fourth pilot round would buy less than it costs."}

