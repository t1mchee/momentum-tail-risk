- id: pha-rules
  label: Standing rules
  state: standing
  as_of: 2026-08-26
  covers: >
    In force across every phase. These are constraints on conduct, not on code, which is why
    they live here rather than in the validator -- though four of them are also enforced there.
  items:
    - {state: done, note: "One verdict-bearing test running at a time."}
    - {state: done, note: "Any implausible number is presumed an INSTRUMENT BUG until verified. This has been right 64 times."}
    - {state: done, note: "Nothing reads the held-out years before Phase 4. Violated once on 2026-08-26 by a power certification, because certifying is not testing and no guard watched it -- see trp-63."}
    - {state: done, note: "Registrations precede runs, with hypothesis, prediction and method frozen at that point."}
    - {state: done, note: "Every refutation carries its detectable-effect statement. Enforced by the validator."}
    - {state: done, note: "The console's completeness is the standing progress metric."}
    - {state: done, note: "Registration timestamps are version-control-derived, never hand-typed, and a registration carries an externally verifiable freeze-to-run gap. Adopted 2026-08-27 after the failure it names."}
    - {state: done, note: "PANEL EXHAUSTION. The ninety-three-day crash panel has been read by the exit-door cells, two reactive certificate repairs and the adversarial re-intervalling. It generated the squeeze-cohort hypothesis and can therefore never confirm it. Future cells on that panel are adjudication only, join the spent cells in one correction family, and confirmation is reserved to forward accrual and the sealed years."}
    - {state: done, note: "No text-specific measurement claim registers without a price-derived null arm. The price of admission set by the adversarial nulls."}

