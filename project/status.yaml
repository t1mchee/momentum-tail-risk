  label: Packaging — the live phase
  state: in_progress
  as_of: 2026-08-27
  covers: >
    The empirical program is closed. What remains is assembly, plus the integration work
    that turns a system that works into one that answers the brief.
  items:
    - {state: done, note: "Option capture hardened after a silent scheduler outage lost three sessions: staleness alarm into could-not-measure, manifest self-checks, permanent gap ledger, derived per-session surface table."}
    - {state: done, note: "The 8-K falsifier loop shipped: a model declares kill conditions once with a mandatory decline, deterministic code watches 52,527 filings and does all counting, every accepted item quote-gated. Two replays stood, including a vaccine control that correctly found issuer text carried nothing."}
    - {state: open, note: "Element-6 unification: the nightly brief carries severity and probability with no named bet; the X-ray carries the named bet with no severity. Either alone is half the required output."}
    - {state: open, note: "One canonical book and one declared horizon stated in every PM-facing artifact; three different answers are currently live."}
    - {state: open, note: "Put the daily X-ray inside the nightly job so monitoring completes on calendar record rather than assertion."}
    - {state: open, note: "Odds-conditioning panel from the three surviving published indicators; top-three named holders in the crowding panel."}
    - {state: open, note: "The memo, the example output and the presentation. Parked by the user until the system was worth writing up; the system now is."}

