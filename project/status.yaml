    - {state: open, note: "The transmission test. A user decision point if it lands as a headline."}
    - {state: open, note: "Distress reading."}
    - {state: open, note: "Both benchmark pages complete."}
    - {state: open, note: "Composing layer, carrying a machine-checkable falsification condition."}
    - {state: open, note: "Frame audit."}

