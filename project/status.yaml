- id: pha-text
  label: The text program that actually shipped
  state: complete
  as_of: 2026-08-27
  covers: >
    Not in the original phase plan, and it is what produced the deliverables. A news
    co-mention instrument over a decade of entity-matched GDELT, a fragility triple per
    story, seven pre-registered episodes, and a construction study -- then six independent
    refutations of every timing channel, and finally an adversarial test of its own
    headline that it lost.
  items:
    - {state: done, note: "Identification validated: the momentum sort manufactures concentrated story bets, conferred story-beta near the 93rd percentile against within-book pseudo-themes."}
    - {state: done, note: "Six timing refutations across independent designs: the seven-episode anatomy, tail-shape calibration, day-of classification, the construction study, mechanism-family analog retrieval, and cross-sectional exit-cost severity. Specificity was perfect throughout; sensitivity was zero."}
    - {state: done, note: "The placebo factory turned the project's own attack discipline on the literature: comomentum, the momentum gap and the bear-state-by-vol indicator all SURVIVE autocorrelation-matched surrogate attack on a century of factor data. Our own saturation series does not."}
    - {state: done, note: "ADVERSARIAL NULLS, the decisive one. Ward correlation clusters matched to the real themes' count and sizes explain 2.73 percent of cross-sectional variance against the news themes' 1.29 -- Newey-West t of -6.5 against the text, which wins 2 months of 120. The kill rule fired in the same commit: the covariance headline is void as a text claim, and every production-path claim premised on a text-specific measurement basis is withdrawn."}
    - {state: done, note: "What survives is stated once and everywhere: prices measure the structure, text NAMES it, vol-scaling sizes the book, positioning contextualises it, and nothing times it."}

- id: pha-review
  label: Adversarial review and record repair
  state: complete
  as_of: 2026-08-27
  covers: >
    Four harsh evaluators against the brief, then a prosecutor over nine proposals for the
    unused data. Their findings were executed rather than filed.
  items:
    - {state: done, note: "Registration timestamps corrected to version-control times after two hand-typed stamps were found postdating their own completion commits; standing rule adopted, then broken the same day by forty note dates written one day ahead, corrected with the failure disclosed rather than laundered."}
    - {state: done, note: "One verdict amended from instrument_limited to refuted, because the observed outcome was verbatim its own registration's informative-failure branch and a fourth category was not the author's to invent."}
    - {state: done, note: "Defect notes appended to five entries: a post-hoc interpretability floor, a near-vacuous pass gate, an entangled pair, a mis-computed registered readout, and an uncorrected t-statistic."}
    - {state: done, note: "Holdout tiers reconciled in a dated document: the sealed-2023 split governs the severity line; the text program's discipline is the episode-registration protocol, and its 2024-2026 numbers are characterisation-tier, never presentable as sealed out-of-sample."}
    - {state: done, note: "Three of nine unused-data proposals killed by the judge: a re-proposed market-wide correlation conditioner, a cross-book confirmation that would have been pseudo-replication on the same crash days, and a text-as-measurement severity design that walked back into the kill zone."}

